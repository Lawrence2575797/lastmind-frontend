<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LastMind – Learn</title>
<style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
        --bg: #1A1A1C;
        --panel: #201F21;
        --text: #E6D7B0;
        --accent: #E6D7B0;
    }

    button, input, textarea, select {
        font-family: inherit;
        color: var(--text);
        background: transparent;
    }

    html, body {
        height: 100%;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Georgia', serif;
        overflow: hidden;
    }

    #gate-message {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Arial', sans-serif;
        color: var(--text);
        opacity: 0.6;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
    }

    #app {
        display: none;
        height: 100vh;
    }

    .layout {
        display: flex;
        height: 100vh;
    }

    /* ─── SIDEBAR ─── */
    .sidebar {
        width: 280px;
        flex-shrink: 0;
        background: var(--panel);
        border-right: 1px solid rgba(230, 215, 176, 0.12);
        display: flex;
        flex-direction: column;
        transition: width 0.25s ease, opacity 0.2s ease;
        overflow: hidden;
    }

    .sidebar.collapsed {
        width: 0;
        opacity: 0;
    }

    .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 18px;
        border-bottom: 1px solid rgba(230, 215, 176, 0.1);
    }

    .sidebar-logo {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--accent);
        text-transform: uppercase;
        white-space: nowrap;
    }

    .new-dropdown {
        position: relative;
    }

    .new-btn {
        font-family: 'Arial', sans-serif;
        font-size: 0.78rem;
        letter-spacing: 0.05em;
        color: var(--bg);
        background: var(--accent);
        border: none;
        padding: 8px 14px;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
    }

    .new-menu {
        display: none;
        position: absolute;
        top: 110%;
        right: 0;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 4px;
        min-width: 170px;
        z-index: 20;
        overflow: hidden;
    }

    .new-menu.open { display: block; }

    .new-menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 11px 16px;
        background: none;
        border: none;
        color: var(--text);
        font-family: 'Arial', sans-serif;
        font-size: 0.82rem;
        cursor: pointer;
        opacity: 0.85;
    }

    .new-menu button:hover:not(:disabled) {
        background: rgba(230, 215, 176, 0.08);
        opacity: 1;
    }

    .new-menu button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    .folder-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px 10px 20px;
    }

    .sidebar-footer {
        padding: 12px 10px;
        border-top: 1px solid rgba(230, 215, 176, 0.1);
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .review-schedule {
        border-top: 1px solid rgba(230, 215, 176, 0.1);
        padding: 12px 14px;
        max-height: 220px;
        display: flex;
        flex-direction: column;
    }

    .review-schedule-header {
        font-family: 'Arial', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        opacity: 0.55;
        margin-bottom: 8px;
        flex-shrink: 0;
    }

    .review-schedule-list {
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .review-schedule-empty {
        font-family: 'Arial', sans-serif;
        font-size: 0.72rem;
        opacity: 0.4;
    }

    .review-schedule-item {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        font-family: 'Arial', sans-serif;
        font-size: 0.74rem;
        padding: 5px 0;
    }

    .review-schedule-item-label {
        opacity: 0.85;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
    }

    .review-schedule-item-time {
        flex-shrink: 0;
        opacity: 0.55;
        font-size: 0.68rem;
    }

    .review-schedule-item.due-now .review-schedule-item-time {
        color: var(--accent);
        opacity: 1;
        font-weight: 600;
    }

    .manage-subscription-btn {
        width: 100%;
        background: none;
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 4px;
        padding: 9px;
        color: var(--text);
        opacity: 0.65;
        font-family: 'Arial', sans-serif;
        font-size: 0.75rem;
        cursor: pointer;
    }

    .manage-subscription-btn:hover {
        opacity: 1;
        background: rgba(230, 215, 176, 0.06);
    }

    .folder-item {
        border-radius: 4px;
        margin-bottom: 4px;
    }

    .folder-item-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 11px 12px;
        cursor: pointer;
        font-size: 0.85rem;
        line-height: 1.4;
        opacity: 0.85;
        border-radius: 4px;
    }

    .folder-item-label {
        flex: 1;
        min-width: 0;
    }

    .new-page-item {
        color: var(--accent) !important;
        opacity: 0.75 !important;
        font-weight: 600;
    }

    .new-page-item:hover {
        opacity: 1 !important;
    }

    .folder-item-header:hover {
        background: rgba(230, 215, 176, 0.06);
    }

    .folder-item.active > .folder-item-header {
        background: rgba(230, 215, 176, 0.12);
        opacity: 1;
        color: var(--accent);
    }

    .folder-meta-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
    }

    .folder-meta {
        font-family: 'Arial', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.04em;
        opacity: 0.55;
    }

    .new-subfolder-link {
        font-family: 'Arial', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.02em;
        color: var(--accent);
        opacity: 0.65;
        cursor: pointer;
        text-decoration: underline;
    }

    .new-subfolder-link:hover {
        opacity: 1;
    }

    .item-menu-wrap {
        position: relative;
        flex-shrink: 0;
    }

    .item-menu-btn {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        border: none;
        background: none;
        color: var(--text);
        opacity: 0.5;
        font-size: 0.9rem;
        line-height: 1;
        cursor: pointer;
    }

    .item-menu-btn:hover {
        opacity: 1;
        background: rgba(230, 215, 176, 0.1);
    }

    .item-dropdown-menu {
        display: none;
        position: fixed;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 4px;
        min-width: 130px;
        z-index: 1000;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .item-dropdown-menu.open {
        display: block;
    }

    .item-dropdown-menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 9px 12px;
        background: none;
        border: none;
        color: var(--text);
        font-family: 'Arial', sans-serif;
        font-size: 0.76rem;
        cursor: pointer;
    }

    .item-dropdown-menu button:hover {
        background: rgba(230, 215, 176, 0.08);
    }

    .item-dropdown-menu button.danger {
        color: #e6b0a8;
    }

    .page-list {
        display: none;
        padding-left: 14px;
        margin-top: 2px;
    }

    .folder-item.expanded .page-list {
        display: block;
    }

    .subfolder-item { margin-bottom: 2px; }

    .subfolder-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 7px 8px;
        cursor: pointer;
        font-size: 0.78rem;
        opacity: 0.8;
        border-radius: 4px;
    }

    .subfolder-header:hover {
        background: rgba(230, 215, 176, 0.06);
    }

    .subfolder-item.expanded > .subfolder-header {
        opacity: 1;
        color: var(--accent);
    }

    .subfolder-page-list {
        display: none;
        padding-left: 14px;
    }

    .subfolder-item.expanded .subfolder-page-list {
        display: block;
    }

    [draggable="true"] {
        cursor: grab;
    }

    .drag-over {
        outline: 2px dashed var(--accent);
        outline-offset: -2px;
        background: rgba(230, 215, 176, 0.1) !important;
    }

    .page-item {
        padding: 8px 10px;
        font-size: 0.8rem;
        font-family: 'Arial', sans-serif;
        opacity: 0.7;
        cursor: pointer;
        border-radius: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .page-item:hover, .page-item.active {
        background: rgba(230, 215, 176, 0.08);
        opacity: 1;
        color: var(--accent);
    }

    .empty-hint {
        padding: 16px 12px;
        font-family: 'Arial', sans-serif;
        font-size: 0.78rem;
        opacity: 0.4;
        line-height: 1.6;
    }

    /* ─── MAIN ─── */
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 26px;
        border-bottom: 1px solid rgba(230, 215, 176, 0.1);
    }

    .sidebar-toggle {
        background: none;
        border: 1px solid rgba(230, 215, 176, 0.3);
        color: var(--accent);
        width: 34px;
        height: 34px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.95rem;
        line-height: 1;
        flex-shrink: 0;
    }

    .topbar-title {
        font-family: 'Arial', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.03em;
        opacity: 0.7;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
    }

    .upgrade-btn {
        flex-shrink: 0;
        font-family: 'Arial', sans-serif;
        font-size: 0.78rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--bg);
        background: var(--accent);
        border: none;
        padding: 9px 20px;
        border-radius: 4px;
        cursor: pointer;
    }

    .upgrade-btn:hover {
        opacity: 0.9;
    }

    .content {
        flex: 1;
        overflow-y: auto;
        padding: 40px;
        display: flex;
        justify-content: center;
    }

    .content-inner {
        width: 100%;
        max-width: 780px;
    }

    .welcome {
        opacity: 0.5;
        font-size: 0.95rem;
        line-height: 1.8;
        margin-top: 60px;
        text-align: center;
    }

    /* ─── UNIFIED LESSON PANEL ─── */
    .unified-lesson-fields {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
    }

    .unified-lesson-fields .diagnose-fields {
        max-width: 640px;
        width: 100%;
    }

    .bottom-action-row {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 16px;
    }

    /* ─── DIAGNOSE PANEL ─── */
    .diagnose-fields {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: flex-end;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.15);
        border-radius: 6px;
        padding: 24px;
    }

    .diagnose-field {
        flex: 1;
        min-width: 140px;
    }

    .diagnose-field label {
        display: block;
        font-family: 'Arial', sans-serif;
        font-size: 0.7rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        opacity: 0.6;
        margin-bottom: 6px;
    }

    .diagnose-field input {
        width: 100%;
        background: var(--bg);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 4px;
        padding: 10px 12px;
        color: var(--text);
        font-family: 'Arial', sans-serif;
        font-size: 0.9rem;
    }

    .diagnose-field input:focus {
        outline: none;
        border-color: rgba(230, 215, 176, 0.5);
    }

    .generate-questions-btn {
        flex-shrink: 0;
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: 4px;
        padding: 11px 22px;
        font-family: 'Arial', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.03em;
        cursor: pointer;
        white-space: nowrap;
    }

    .generate-questions-btn:hover {
        opacity: 0.9;
    }

    /* ─── DIAGNOSTIC QUESTION FLOW ─── */
    .question-card {
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.15);
        border-radius: 8px;
        padding: 24px;
        margin-top: 20px;
        transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .question-card.fading-out {
        opacity: 0;
        transform: translateY(-6px);
    }

    .question-card-text {
        font-family: 'Georgia', serif;
        font-size: 1.05rem;
        line-height: 1.7;
        margin-bottom: 16px;
    }

    .question-answer-input {
        width: 100%;
        min-height: 100px;
        background: var(--accent);
        border: 1px solid rgba(26, 26, 28, 0.15);
        border-radius: 6px;
        color: var(--bg);
        font-family: 'Georgia', serif;
        font-size: 0.95rem;
        line-height: 1.6;
        padding: 14px 16px;
        resize: vertical;
        margin-bottom: 12px;
    }

    .question-answer-input:focus {
        outline: none;
    }

    .question-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .dont-know-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Arial', sans-serif;
        font-size: 0.8rem;
        opacity: 0.7;
        cursor: pointer;
    }

    .question-submit-btn {
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: 4px;
        padding: 9px 20px;
        font-family: 'Arial', sans-serif;
        font-size: 0.82rem;
        cursor: pointer;
    }

    .question-submit-btn:hover {
        opacity: 0.9;
    }

    .question-submit-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .pass-tick {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--accent);
        font-family: 'Arial', sans-serif;
        font-size: 0.9rem;
        padding: 20px 0;
    }

    .correction-card {
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 8px;
        padding: 22px 24px;
        margin-top: 20px;
        font-family: 'Georgia', serif;
        font-size: 0.95rem;
        line-height: 1.7;
    }

    .correction-label {
        font-family: 'Arial', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent);
        opacity: 0.8;
        margin-bottom: 10px;
    }

    /* ─── PAGE EDITOR ─── */
    .editor-wrap {
        position: relative;
    }

    .page-title-input {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(230, 215, 176, 0.25);
        color: var(--text);
        font-family: 'Georgia', serif;
        font-size: 1.4rem;
        font-weight: 700;
        padding: 4px 2px 12px;
        margin-bottom: 18px;
    }

    .page-title-input:focus {
        outline: none;
        border-bottom-color: var(--accent);
    }

    .compile-btn {
        font-family: 'Arial', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        background: var(--bg);
        border: none;
        padding: 10px 22px;
        border-radius: 3px;
        cursor: pointer;
    }

    .compile-btn:hover {
        opacity: 0.9;
    }

    .compile-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .play-btn {
        position: absolute;
        bottom: 16px;
        right: 120px;
        font-family: 'Arial', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--bg);
        background: var(--accent);
        border: none;
        padding: 10px 18px;
        border-radius: 3px;
        cursor: pointer;
    }

    .play-btn:hover {
        opacity: 0.9;
    }

    .play-btn.playing {
        background: var(--bg);
        color: var(--accent);
        border: 1px solid rgba(230, 215, 176, 0.3);
    }

    .compile-status {
        margin-top: 14px;
        font-family: 'Arial', sans-serif;
        font-size: 0.78rem;
        color: var(--text);
        opacity: 0.65;
        min-height: 1em;
    }

    .compile-status.error {
        color: #e6b0a8;
        opacity: 1;
    }

    .compiled-output {
        margin-top: 14px;
        padding: 20px 22px;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.18);
        border-radius: 6px;
        color: var(--text);
        font-family: 'Georgia', serif;
        font-size: 0.95rem;
        line-height: 1.8;
        white-space: pre-wrap;
    }

    /* ─── RICH EDITOR ─── */
    .rich-toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
    }

    .toolbar-btn {
        background: none;
        border: 1px solid rgba(230, 215, 176, 0.25);
        border-radius: 4px;
        color: var(--text);
        opacity: 0.75;
        font-family: 'Arial', sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.02em;
        padding: 7px 14px;
        cursor: pointer;
    }

    .toolbar-btn:hover {
        opacity: 1;
        border-color: var(--accent);
        color: var(--accent);
    }

    .note-editable {
        width: 100%;
        min-height: 60vh;
        background: var(--accent);
        border: 1px solid rgba(26, 26, 28, 0.15);
        border-radius: 6px;
        color: var(--bg);
        font-family: 'Georgia', serif;
        font-size: 1rem;
        line-height: 1.8;
        padding: 22px 24px 64px;
        overflow-y: auto;
    }

    .note-editable:focus {
        outline: none;
        border-color: rgba(26, 26, 28, 0.3);
    }

    .note-editable:empty::before {
        content: attr(data-placeholder);
        color: rgba(26, 26, 28, 0.5);
    }

    /* Inline MathQuill fields, sitting mid-sentence in the notes */
    .math-field-inline {
        display: inline-block;
        vertical-align: middle;
        margin: 0 3px;
        padding: 2px 5px;
        background: rgba(26, 26, 28, 0.06);
        border: 1px solid rgba(26, 26, 28, 0.15);
        border-radius: 4px;
        min-width: 20px;
        min-height: 1.2em;
    }

    .math-field-inline .mq-editable-field {
        font-size: 1.05rem;
    }

    /* Read-only KaTeX-rendered matrices, displayed as their own block */
    .matrix-block {
        display: block;
        margin: 12px 0;
        padding: 10px;
        background: rgba(26, 26, 28, 0.05);
        border-radius: 4px;
        text-align: center;
    }

    /* ─── MATRIX MODAL ─── */
    .matrix-size-fields {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        margin-bottom: 20px;
    }

    .matrix-size-fields .field {
        flex: 1;
    }

    .matrix-size-fields input[type="number"] {
        width: 100%;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 4px;
        padding: 9px 10px;
        color: var(--text);
        font-family: 'Arial', sans-serif;
    }

    .matrix-grid {
        display: grid;
        gap: 8px;
        margin-bottom: 20px;
    }

    .matrix-grid input {
        width: 100%;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 4px;
        padding: 10px;
        color: var(--text);
        font-family: 'Georgia', serif;
        font-size: 0.95rem;
        text-align: center;
    }

    .matrix-grid input:focus {
        outline: none;
        border-color: rgba(230, 215, 176, 0.5);
    }

    /* ─── SCRATCH NOTES ─── */
    .scratch-notes-widget {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 240px;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.25);
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        z-index: 50;
        overflow: hidden;
    }

    .scratch-notes-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        cursor: pointer;
        font-family: 'Arial', sans-serif;
        font-size: 0.8rem;
        color: var(--accent);
        user-select: none;
    }

    .scratch-notes-toggle {
        background: none;
        border: none;
        color: var(--accent);
        font-size: 0.9rem;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .scratch-notes-widget.collapsed .scratch-notes-toggle {
        transform: rotate(-90deg);
    }

    .scratch-notes-widget.collapsed .scratch-notes-textarea {
        display: none;
    }

    .scratch-notes-textarea {
        display: block;
        width: 100%;

    /* ───────────────────────── IndexedDB ───────────────────────── */

    // IndexedDB already survives closing the tab, closing the browser, and
    // restarting the computer — that's just how it works, by default, with

    if (navigator.storage && navigator.storage.persist) {

    const DB_NAME = 'LastMindDB';
    const DB_VERSION = 2;
    const AUTH_STORE = 'auth';
    const FOLDER_STORE = 'folders';

    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(AUTH_STORE)) {
                    db.createObjectStore(AUTH_STORE, { keyPath: 'id' });
                }
                if (!db.objectStoreNames.contains(FOLDER_STORE)) {
                    db.createObjectStore(FOLDER_STORE, { keyPath: 'id', autoIncrement: true });
                }
            };
            req.onsuccess = (e) => resolve(e.target.result);
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async function putAuthRecord(id, value) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(AUTH_STORE, 'readwrite');
            tx.objectStore(AUTH_STORE).put({ id, value, savedAt: Date.now() });
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e.target.error);
        });
    }

    async function getAuthRecord(id) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(AUTH_STORE, 'readonly');
            const r = tx.objectStore(AUTH_STORE).get(id);
            r.onsuccess = () => resolve(r.result ? r.result.value : null);
            r.onerror = (e) => reject(e.target.error);
        });
    }

    // written here always matches what index.html writes after checkout —
    // previously these used a different field name (.token instead of
    // .value), which meant a token saved by index.html right after payment
    // was never actually seen by this check, silently forcing an extra
    // backend round-trip on every single visit instead of using the cached
    // token directly.
    async function getStoredToken() {
        return getAuthRecord('jwt');
    }

    async function saveToken(token) {
        return putAuthRecord('jwt', token);
    }


    async function getAllFolders() {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FOLDER_STORE, 'readonly');
            const r = tx.objectStore(FOLDER_STORE).getAll();
            r.onsuccess = () => resolve(r.result || []);
            r.onerror = (e) => reject(e.target.error);
        });
    }

    async function putFolder(folder) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FOLDER_STORE, 'readwrite');
            const r = tx.objectStore(FOLDER_STORE).put(folder);
            r.onsuccess = () => resolve(r.result); // returns the key (id)
            r.onerror = (e) => reject(e.target.error);
        });
    }

    async function deleteFolderRecord(folderId) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FOLDER_STORE, 'readwrite');
            const r = tx.objectStore(FOLDER_STORE).delete(folderId);
            r.onsuccess = () => resolve();
            r.onerror = (e) => reject(e.target.error);
        });

    /* ───────────────────────── JWT verification ───────────────────────── */

    function base64UrlToBytes(b64url) {
        const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
        const pad = b64.length % 4 === 0 ? '' : '='.repeat(4 - (b64.length % 4));
        const binary = atob(b64 + pad);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    async function importPublicKey(pem) {
        const b64 = pem.replace(/-----BEGIN PUBLIC KEY-----/, '')
                        .replace(/-----END PUBLIC KEY-----/, '')
                        .replace(/\s+/g, '');
        const bytes = base64UrlToBytes(b64.replace(/-/g, '+').replace(/_/g, '/')); // pem is standard base64, reuse decode path
        return crypto.subtle.importKey(
            'spki',
            bytes.buffer,
            { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
            false,
            ['verify']
        );
    }

    async function verifyJWT(token, publicKey) {
        try {
            const parts = token.split('.');
            if (parts.length !== 3) return null;
            const [headerB64, payloadB64, sigB64] = parts;

            const data = new TextEncoder().encode(`${headerB64}.${payloadB64}`);
            const signature = base64UrlToBytes(sigB64);

            const valid = await crypto.subtle.verify(
                'RSASSA-PKCS1-v1_5', publicKey, signature, data
            );
            if (!valid) return null;

            const payload = JSON.parse(new TextDecoder().decode(base64UrlToBytes(payloadB64)));

            if (payload.exp && Math.floor(Date.now() / 1000) >= payload.exp) return null;
            if (payload.status !== 'active') return null;

            return payload;
        } catch (err) {
            console.error('LastMind: JWT verification failed.', err);
            return null;
        }
    }

    /* ───────────────────────── Fuzzy matching ───────────────────────── */

    function normalize(str) {
        return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function levenshtein(a, b) {
        const m = a.length, n = b.length;
        const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
        for (let i = 0; i <= m; i++) dp[i][0] = i;
        for (let j = 0; j <= n; j++) dp[0][j] = j;
        for (let i = 1; i <= m; i++) {
            for (let j = 1; j <= n; j++) {
                dp[i][j] = a[i - 1] === b[j - 1]
                    ? dp[i - 1][j - 1]
                    : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
            }
        }
        return dp[m][n];
    }

    function similarity(a, b) {
        const na = normalize(a), nb = normalize(b);
        const maxLen = Math.max(na.length, nb.length, 1);
        if (na === nb) return 1;
        return 1 - levenshtein(na, nb) / maxLen;
    }

    const MATCH_THRESHOLD = 0.72;

    function findSimilarFolder(subject, qualification, board, folders) {
        let best = null;
        let bestScore = 0;
        for (const f of folders) {
            const score = (
                similarity(subject, f.subject) +
                similarity(qualification, f.qualification) +
                similarity(board, f.examBoard)
            ) / 3;
            if (score > bestScore) {
                bestScore = score;
                best = f;
            }
        }
        return bestScore >= MATCH_THRESHOLD ? best : null;
    }

    let folders = [];

    // Finds where a page currently lives (direct in a folder, or inside one
    // of that folder's subfolders) — used by move/delete operations so they
    // don't need to know in advance where the page is.
    function findPageLocation(pageId) {
        for (const f of folders) {
            const directIdx = (f.pages || []).findIndex((p) => p.id === pageId);
            if (directIdx !== -1) return { folder: f, subfolder: null, pageIndex: directIdx, pagesArray: f.pages };
            for (const sf of (f.subfolders || [])) {
                const subIdx = (sf.pages || []).findIndex((p) => p.id === pageId);
                if (subIdx !== -1) return { folder: f, subfolder: sf, pageIndex: subIdx, pagesArray: sf.pages };
            }
        }
        return null;
    }

    async function movePage(pageId, targetFolderId, targetSubfolderId) {
        const loc = findPageLocation(pageId);
        if (!loc) return;

        const targetFolder = folders.find((f) => f.id === targetFolderId);
        if (!targetFolder) return;

        // No-op if dropped back where it already is.
        const alreadyThere = loc.folder.id === targetFolderId &&
            ((!loc.subfolder && !targetSubfolderId) || (loc.subfolder && loc.subfolder.id === targetSubfolderId));
        if (alreadyThere) return;

        const [page] = loc.pagesArray.splice(loc.pageIndex, 1);

        let targetArray;
        if (targetSubfolderId) {
            const targetSubfolder = (targetFolder.subfolders || []).find((sf) => sf.id === targetSubfolderId);
            if (!targetSubfolder) return;
            targetSubfolder.pages = targetSubfolder.pages || [];
            targetArray = targetSubfolder.pages;
        } else {
            targetFolder.pages = targetFolder.pages || [];
            targetArray = targetFolder.pages;
        }
        targetArray.push(page);

        await putFolder(loc.folder);
        if (targetFolder.id !== loc.folder.id) await putFolder(targetFolder);
        await refreshFolderList();
    }

    // Drops a page directly onto another page — used for actual reordering
    // within a list (or a precise insert position when moving between
    // lists), rather than movePage's "just append to the end" behaviour.
    // Finding the target AFTER removing the dragged page (rather than
    // computing a numeric index up front) sidesteps all off-by-one issues
    // when both pages happen to be in the same array.
    async function movePageRelativeTo(draggedPageId, targetPageId) {
        if (draggedPageId === targetPageId) return;

        const dragLoc = findPageLocation(draggedPageId);
        if (!dragLoc) return;

        const [page] = dragLoc.pagesArray.splice(dragLoc.pageIndex, 1);

        const targetLoc = findPageLocation(targetPageId);
        if (!targetLoc) {
            // Target vanished mid-drag somehow — put the page back rather
            // than silently losing it.
            dragLoc.pagesArray.splice(dragLoc.pageIndex, 0, page);
            return;
        }

        targetLoc.pagesArray.splice(targetLoc.pageIndex, 0, page);

        await putFolder(dragLoc.folder);
        if (targetLoc.folder.id !== dragLoc.folder.id) await putFolder(targetLoc.folder);
        await refreshFolderList();
    }

    async function moveSubfolder(subfolderId, sourceFolderId, targetFolderId) {
        if (sourceFolderId === targetFolderId) return;
        const sourceFolder = folders.find((f) => f.id === sourceFolderId);
        const targetFolder = folders.find((f) => f.id === targetFolderId);
        if (!sourceFolder || !targetFolder) return;

        const idx = (sourceFolder.subfolders || []).findIndex((sf) => sf.id === subfolderId);
        if (idx === -1) return;

        const [subfolder] = sourceFolder.subfolders.splice(idx, 1);
        targetFolder.subfolders = targetFolder.subfolders || [];
        targetFolder.subfolders.push(subfolder);

        await putFolder(sourceFolder);
        await putFolder(targetFolder);
        await refreshFolderList();
    }

    async function reorderFolders(draggedFolderId, targetFolderId) {
        if (draggedFolderId === targetFolderId) return;
        const draggedIdx = folders.findIndex((f) => f.id === draggedFolderId);
        const targetIdx = folders.findIndex((f) => f.id === targetFolderId);
        if (draggedIdx === -1 || targetIdx === -1) return;

        const [draggedFolder] = folders.splice(draggedIdx, 1);
        const newTargetIdx = folders.findIndex((f) => f.id === targetFolderId);
        folders.splice(newTargetIdx, 0, draggedFolder);

        // Persist the new order on every folder so it survives a reload —
        // IndexedDB doesn't preserve array order on its own.
        for (let i = 0; i < folders.length; i++) {
            folders[i].order = i;
            await putFolder(folders[i]);
        }
        await refreshFolderList();
    }

    async function createSubfolder(folderId) {
        const name = prompt('Subfolder name:');
        if (!name || !name.trim()) return;
        const folder = folders.find((f) => f.id === folderId);
        if (!folder) return;

        folder.subfolders = folder.subfolders || [];
        folder.subfolders.push({
            id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
            name: name.trim(),
            pages: []
        });
        await putFolder(folder);
        await refreshFolderList();
    }

    async function deleteFolder(folderId) {
        if (!confirm('Delete this folder and everything inside it? This cannot be undone.')) return;
        await deleteFolderRecord(folderId);
        if (selectedFolderId === folderId) {
            selectedFolderId = null;
            selectedSubfolderId = null;
            selectedPageId = null;
            renderWelcome();
        }
        await refreshFolderList();
    }

    async function deleteSubfolderById(folderId, subfolderId) {
        if (!confirm('Delete this subfolder and its pages? This cannot be undone.')) return;
        const folder = folders.find((f) => f.id === folderId);
        if (!folder) return;
        folder.subfolders = (folder.subfolders || []).filter((sf) => sf.id !== subfolderId);
        await putFolder(folder);
        if (selectedSubfolderId === subfolderId) {
            selectedSubfolderId = null;
            selectedPageId = null;
            renderWelcome();
        }
        await refreshFolderList();
    }

    async function deletePageById(pageId) {
        if (!confirm('Delete this page? This cannot be undone.')) return;
        const loc = findPageLocation(pageId);
        if (!loc) return;
        loc.pagesArray.splice(loc.pageIndex, 1);
        await putFolder(loc.folder);
        if (selectedPageId === pageId) {
            selectedPageId = null;
            renderWelcome();
        }
        await refreshFolderList();
    }

    // Reusable page-row builder — used both for a folder's direct pages and
    // for a subfolder's pages, so the drag/menu behaviour stays consistent.
    function buildPageItem(page, folderId, subfolderId) {
        const pageEl = document.createElement('div');
        pageEl.className = 'page-item' + (page.id === selectedPageId ? ' active' : '');
        pageEl.draggable = true;

        const label = document.createElement('span');
        label.textContent = page.title || 'Untitled page';
        label.style.flex = '1';
        label.style.overflow = 'hidden';
        label.style.textOverflow = 'ellipsis';

        const menuWrap = buildItemMenu([
            { label: 'Delete Page', danger: true, onClick: () => deletePageById(page.id) }
        ]);

        pageEl.style.display = 'flex';
        pageEl.style.alignItems = 'center';
        pageEl.style.gap = '4px';
        pageEl.appendChild(label);
        pageEl.appendChild(menuWrap);

        pageEl.addEventListener('click', (e) => {
            e.stopPropagation();
            openPage(folderId, page.id, subfolderId || null);
        });

        pageEl.addEventListener('dragstart', (e) => {
            e.stopPropagation();
            draggedItem = { type: 'page', folderId, subfolderId: subfolderId || null, pageId: page.id };
            e.dataTransfer.effectAllowed = 'move';
        });

        // Dropping another page directly onto this one reorders it to sit
        // right before this page — works for a pure within-list reorder,
        // and also gives a precise insert position when moving a page in
        // from a different folder/subfolder, rather than always landing
        // at the end of the target list.
        pageEl.addEventListener('dragover', (e) => {
            if (!draggedItem || draggedItem.type !== 'page' || draggedItem.pageId === page.id) return;
            e.preventDefault();
            e.stopPropagation();
            pageEl.classList.add('drag-over');
        });
        pageEl.addEventListener('dragleave', () => pageEl.classList.remove('drag-over'));
        pageEl.addEventListener('drop', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            pageEl.classList.remove('drag-over');
            if (draggedItem && draggedItem.type === 'page' && draggedItem.pageId !== page.id) {
                await movePageRelativeTo(draggedItem.pageId, page.id);
            }
            draggedItem = null;
        });

        return pageEl;
    }

    // Small reusable three-dot dropdown — options is an array of
    // { label, danger, onClick }.
    function buildItemMenu(options) {
        const wrap = document.createElement('div');
        wrap.className = 'item-menu-wrap';

        const btn = document.createElement('button');
        btn.className = 'item-menu-btn';
        btn.type = 'button';
        btn.textContent = '⋯';
        btn.title = 'Options';

        const menu = document.createElement('div');
        menu.className = 'item-dropdown-menu';
        // Deliberately NOT appended into wrap — it only ever lives in the
        // DOM (as a direct child of <body>) while actually open. Any
        // position:absolute dropdown nested inside a scrolling sidebar can
        // get clipped depending on where the item happens to sit in the
        // list — this sidesteps that permanently by positioning against
        // the viewport instead of any ancestor.

        options.forEach((opt) => {
            const optBtn = document.createElement('button');
            optBtn.textContent = opt.label;
            if (opt.danger) optBtn.classList.add('danger');
            optBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closeAllItemMenus();
                opt.onClick();
            });
            menu.appendChild(optBtn);
        });

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const wasOpen = menu.classList.contains('open');
            closeAllItemMenus();
            if (wasOpen) return; // this click just closed it — don't reopen

            document.body.appendChild(menu);
            menu.classList.add('open');

            const btnRect = btn.getBoundingClientRect();
            const menuRect = menu.getBoundingClientRect(); // real size, now that it's visible

            let top = btnRect.top - menuRect.height - 4; // prefer opening upward
            if (top < 8) top = btnRect.bottom + 4;        // not enough room above — open downward instead

            let left = btnRect.right - menuRect.width;
            if (left < 8) left = btnRect.left;

            menu.style.top = `${top}px`;
            menu.style.left = `${left}px`;

            openMenuEl = menu;
            openMenuTriggerBtn = btn;
        });

        wrap.appendChild(btn);
        wrap.appendChild(menu);
        return wrap;
    }

    async function refreshFolderList() {
        folders = await getAllFolders();
        folders.sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));

        const listEl = document.getElementById('folderList');
        listEl.innerHTML = '';

        if (!folders.length) {
            listEl.innerHTML = '<div class="empty-hint">No folders yet — click "+ New" to create one.</div>';
            return;
        }

        folders.forEach((f) => {
            const item = document.createElement('div');
            item.className = 'folder-item' + (f.id === selectedFolderId ? ' active expanded' : '');
            item.draggable = true;

            const header = document.createElement('div');
            header.className = 'folder-item-header';

            const labelWrap = document.createElement('div');
            labelWrap.className = 'folder-item-label';
            labelWrap.style.flex = '1';
            labelWrap.style.minWidth = '0';
            labelWrap.innerHTML = `
                ${folderLabel(f)}
                <div class="folder-meta-row">
                    <span class="folder-meta">${(f.pages || []).length} page(s)</span>
                    <span class="new-subfolder-link">+ Subfolder</span>
                </div>
            `;
            labelWrap.querySelector('.new-subfolder-link').addEventListener('click', (e) => {
                e.stopPropagation();
                createSubfolder(f.id);
            });

            const menuWrap = buildItemMenu([
                { label: 'Delete Folder', danger: true, onClick: () => deleteFolder(f.id) }
            ]);

            header.appendChild(labelWrap);
            header.appendChild(menuWrap);
            header.addEventListener('click', () => selectFolder(f.id));

            // Folder drag (reordering among top-level folders)
            item.addEventListener('dragstart', (e) => {
                if (e.target !== item && e.target.closest('.page-item, .subfolder-item')) return;
                draggedItem = { type: 'folder', folderId: f.id };
                e.dataTransfer.effectAllowed = 'move';
                e.stopPropagation();
            });

            // Drop target: folder header accepts a dragged folder (reorder),
            // a dragged subfolder (reparent), or a dragged page (move to
            // this folder's direct pages).
            header.addEventListener('dragover', (e) => {
                if (!draggedItem) return;
                e.preventDefault();
                header.classList.add('drag-over');
            });
            header.addEventListener('dragleave', () => header.classList.remove('drag-over'));
            header.addEventListener('drop', async (e) => {
                e.preventDefault();
                e.stopPropagation();
                header.classList.remove('drag-over');
                if (!draggedItem) return;

                if (draggedItem.type === 'folder') {
                    await reorderFolders(draggedItem.folderId, f.id);
                } else if (draggedItem.type === 'subfolder') {
                    await moveSubfolder(draggedItem.subfolderId, draggedItem.folderId, f.id);
                } else if (draggedItem.type === 'page') {
                    await movePage(draggedItem.pageId, f.id, null);
                }
                draggedItem = null;
            });

            const pageList = document.createElement('div');
            pageList.className = 'page-list';

            // Subfolders first
            (f.subfolders || []).forEach((sf) => {
                const sfItem = document.createElement('div');
                sfItem.className = 'subfolder-item' + (sf.id === selectedSubfolderId ? ' expanded' : '');
                sfItem.draggable = true;

                const sfHeader = document.createElement('div');
                sfHeader.className = 'subfolder-header';

                const sfLabel = document.createElement('span');
                sfLabel.textContent = `📁 ${sf.name} (${(sf.pages || []).length})`;
                sfLabel.style.flex = '1';
                sfLabel.style.overflow = 'hidden';
                sfLabel.style.textOverflow = 'ellipsis';

                const sfMenu = buildItemMenu([
                    { label: 'Delete Subfolder', danger: true, onClick: () => deleteSubfolderById(f.id, sf.id) }
                ]);

                sfHeader.appendChild(sfLabel);
                sfHeader.appendChild(sfMenu);
                sfHeader.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedFolderId = f.id;
                    selectedSubfolderId = (selectedSubfolderId === sf.id) ? null : sf.id;
                    refreshFolderList();
                });

                sfItem.addEventListener('dragstart', (e) => {
                    e.stopPropagation();
                    draggedItem = { type: 'subfolder', folderId: f.id, subfolderId: sf.id };
                    e.dataTransfer.effectAllowed = 'move';
                });

                // A subfolder can also receive a dragged page directly.
                sfHeader.addEventListener('dragover', (e) => {
                    if (!draggedItem || draggedItem.type !== 'page') return;
                    e.preventDefault();
                    e.stopPropagation();
                    sfHeader.classList.add('drag-over');
                });
                sfHeader.addEventListener('dragleave', () => sfHeader.classList.remove('drag-over'));
                sfHeader.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    sfHeader.classList.remove('drag-over');
                    if (draggedItem && draggedItem.type === 'page') {
                        await movePage(draggedItem.pageId, f.id, sf.id);
                    }
                    draggedItem = null;
                });

                const sfPageList = document.createElement('div');
                sfPageList.className = 'subfolder-page-list';
                (sf.pages || []).forEach((p) => {
                    sfPageList.appendChild(buildPageItem(p, f.id, sf.id));
                });

                const sfNewPageBtn = document.createElement('div');
                sfNewPageBtn.className = 'page-item new-page-item';
                sfNewPageBtn.textContent = '+ New Page';
                sfNewPageBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    createPageInFolder(f.id, sf.id);
                });
                sfPageList.appendChild(sfNewPageBtn);

                sfItem.appendChild(sfHeader);
                sfItem.appendChild(sfPageList);
                pageList.appendChild(sfItem);
            });

            // Then this folder's own direct pages
            (f.pages || []).forEach((p) => {
                pageList.appendChild(buildPageItem(p, f.id, null));
            });

            const newPageBtn = document.createElement('div');
            newPageBtn.className = 'page-item new-page-item';
            newPageBtn.textContent = '+ New Page';
            newPageBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                createPageInFolder(f.id, null);
            });
            pageList.appendChild(newPageBtn);

            item.appendChild(header);
            item.appendChild(pageList);
            listEl.appendChild(item);
        });
    }

    function selectFolder(folderId) {
        selectedFolderId = folderId;
        selectedSubfolderId = null;
        selectedPageId = null;
        const f = folders.find((x) => x.id === folderId);
        document.getElementById('topbarTitle').textContent = f ? folderLabel(f) : 'Select or create a folder to get started';
        renderWelcome();
        refreshFolderList();
    }

    function renderWelcome() {
        stopActiveDictation();
        stopSpeaking();
        document.getElementById('contentInner').innerHTML =
            '<p class="welcome">Click the + next to this folder to add a page.</p>';
    }

    let saveDebounce = null;

    // Tracks whatever recognition session is currently running, if any, so
    // switching pages/folders can't leave a mic session orphaned in the background.
    let activeRecognition = null;

    function stopActiveDictation() {
        if (activeRecognition) {
            try { activeRecognition.stop(); } catch (err) { /* already stopped */ }
            activeRecognition = null;
        }
    }

    /**
     * On-device text-to-speech via the Web Speech API (SpeechSynthesis) —
     * no external TTS service involved, nothing leaves the browser. This is
     * the web equivalent of AVSpeechSynthesizer (iOS) / TextToSpeech
     * (Android); those are native-platform APIs and don't apply here since
     * this is a web page, not a native app.
     *
     * Note: browsers require a user gesture (like a click) before audio can
     * play at all — that's a platform security rule speechSynthesis can't
     * bypass. Speech only starts from the explicit Play click below.
     */
    function stopSpeaking() {
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }
    }

    // getVoices() often returns an empty list on the very first call, until
    // the browser finishes loading them asynchronously — this waits for
    // that instead of silently falling back to the default voice.
    function loadVoices() {
        return new Promise((resolve) => {
            const existing = window.speechSynthesis.getVoices();
            if (existing.length) {
                resolve(existing);
                return;
            }
            window.speechSynthesis.onvoiceschanged = () => {
                resolve(window.speechSynthesis.getVoices());
            };
        });
    }

    // Chrome ships several "Google ..." voices (e.g. "Google UK English
    // Male", "Google US English") that sound noticeably more natural than
    // the platform's bare default voice. Prefer one of those, matched to
    // the browser's language where possible; fall back to any English
    // voice, then to whatever's available, rather than forcing a voice
    // that doesn't exist on this device.
    function pickBestVoice(voices) {
        if (!voices || !voices.length) return null;

        const langPrefix = (navigator.language || 'en-US').slice(0, 2).toLowerCase();
        const googleVoices = voices.filter((v) => v.name.includes('Google'));

        if (googleVoices.length) {
            const langMatch = googleVoices.find((v) => v.lang.toLowerCase().startsWith(langPrefix));
            return langMatch || googleVoices[0];
        }

        const enVoice = voices.find((v) => v.lang.toLowerCase().startsWith('en'));
        return enVoice || voices[0];
    }

    async function speakText(text) {
        if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
            console.warn('LastMind: on-device text-to-speech is not supported in this browser.');
            return null;
        }

        stopSpeaking(); // cancel anything already playing before starting new speech

        const trimmed = (text || '').trim();
        if (!trimmed) return null;

        const utterance = new SpeechSynthesisUtterance(trimmed);
        utterance.lang = navigator.language || 'en-US';

        const voices = await loadVoices();
        const bestVoice = pickBestVoice(voices);
        if (bestVoice) {
            utterance.voice = bestVoice;
            utterance.lang = bestVoice.lang;
        }

        window.speechSynthesis.speak(utterance);
        return utterance;
    }

        const titleInput = document.getElementById('pageTitleInput');

        const noteBox = document.getElementById('noteBox');
        mathFieldInstances = new Map(); // fresh map for this page

        // Scratch notes: a small "jot this down for later" pad, kept
        // completely separate from the real notes on purpose — it's
        // never read by Compile or Play, both of which only ever look at
        // noteBox. Its own field on the page, its own debounce, its own
        // save call.
        const scratchNotesBox = document.getElementById('scratchNotesBox');
        const scratchNotesWidget = document.getElementById('scratchNotesWidget');
        scratchNotesBox.value = page.scratchNotes || '';

        let scratchSaveDebounce = null;
        scratchNotesBox.addEventListener('input', () => {
            clearTimeout(scratchSaveDebounce);
            scratchSaveDebounce = setTimeout(async () => {

        document.getElementById('scratchNotesHeader').addEventListener('click', () => {
            scratchNotesWidget.classList.toggle('collapsed');

        // Builds a clean, storage-safe copy of the note's HTML: inline math
        // fields are reduced to <span class="math-field-inline"
        // data-latex="..."></span> — MathQuill's own live rendering DOM is
        // NOT saved (it isn't meant to be treated as static markup), only
        // the LaTeX source, which is enough to fully rebuild the field next
        // time the page opens.
        function serializeNoteContent() {
            const container = document.createElement('div');

            function walk(source, target) {
                source.childNodes.forEach((child) => {
                    if (child.nodeType === Node.TEXT_NODE) {
                        target.appendChild(document.createTextNode(child.textContent));
                        return;
                    }
                    if (child.nodeType !== Node.ELEMENT_NODE) return;

                    if (child.classList.contains('math-field-inline')) {
                        const clean = document.createElement('span');
                        clean.className = 'math-field-inline';
                        const instance = mathFieldInstances.get(child);
                        clean.setAttribute('data-latex', instance ? instance.latex() : (child.dataset.latex || ''));
                        target.appendChild(clean);
                        return;
                    }
                    if (child.classList.contains('matrix-block')) {
                        const clean = document.createElement('span');
                        clean.className = 'matrix-block';
                        clean.setAttribute('data-latex', child.dataset.latex || '');
                        target.appendChild(clean);
                        return;
                    }

                    const clone = document.createElement(child.tagName);
                    walk(child, clone);
                    target.appendChild(clone);
                });
            }

            walk(noteBox, container);
            return container.innerHTML;
        }

        // The plain-text version sent to Compile and read aloud by Play —
        // math fields/matrices contribute their LaTeX source as text (which
        // Claude reads fine; TTS will read it literally rather than
        // "speaking" the math, a known, honest limitation for now).
        function extractPlainText(node) {
            let result = '';
            node.childNodes.forEach((child) => {
                if (child.nodeType === Node.TEXT_NODE) {
                    result += child.textContent;
                    return;
                }
                if (child.nodeType !== Node.ELEMENT_NODE) return;

                if (child.classList.contains('math-field-inline')) {
                    const instance = mathFieldInstances.get(child);
                    result += ` ${instance ? instance.latex() : (child.dataset.latex || '')} `;
                } else if (child.classList.contains('matrix-block')) {
                    result += ` ${child.dataset.latex || ''} `;
                } else if (child.tagName === 'BR') {
                    result += '\n';
                } else if (child.tagName === 'DIV' || child.tagName === 'P') {
                    result += extractPlainText(child) + '\n';
                } else {
                    result += extractPlainText(child);
                }
            });
            return result;
        }

        function saveNoteContent() {
            clearTimeout(saveDebounce);
            saveDebounce = setTimeout(async () => {
                page.content = serializeNoteContent();
                await putFolder(folder);
            }, 400);
        }

        function renderMatrixBlock(el) {
            const latex = el.getAttribute('data-latex') || '';
            try {
                katex.render(latex, el, { throwOnError: false, displayMode: true });
            } catch (err) {
                el.textContent = latex; // fallback: show raw LaTeX if rendering fails
            }
        }

        function attachMathField(el, initialLatex) {
            const mq = MQ.MathField(el, {
                handlers: { edit: saveNoteContent }
            });
            if (initialLatex) mq.latex(initialLatex);
            mathFieldInstances.set(el, mq);
            return mq;
        }

        // Load saved content, then bring any math-field-inline / matrix-block
        // spans in it back to life (they're saved as inert markup with just
        // a data-latex attribute — see serializeNoteContent above).
        noteBox.innerHTML = page.content || '';
        noteBox.querySelectorAll('.math-field-inline').forEach((el) => {
            const savedLatex = el.getAttribute('data-latex') || '';
            el.innerHTML = '';

        noteBox.querySelectorAll('.matrix-block').forEach(renderMatrixBlock);

        // "Insert Math" — drops a live MathQuill field at the current
        // cursor position within the notes.
        document.getElementById('insertMathBtn').addEventListener('click', () => {

                range.selectNodeContents(noteBox);

        // "Insert Matrix" — a custom grid tool, not MathQuill (whose own

        const matrixModalOverlay = document.getElementById('matrixModalOverlay');
        const matrixGrid = document.getElementById('matrixGrid');
        const matrixRowsInput = document.getElementById('matrixRowsInput');
        const matrixColsInput = document.getElementById('matrixColsInput');
        let matrixInsertRange = null; // where to insert once "Insert" is clicked

        function buildMatrixGrid() {
            const rows = Math.max(1, Math.min(6, parseInt(matrixRowsInput.value, 10) || 1));
            const cols = Math.max(1, Math.min(6, parseInt(matrixColsInput.value, 10) || 1));
            matrixGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            matrixGrid.innerHTML = '';
            for (let i = 0; i < rows * cols; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = '0';
                matrixGrid.appendChild(input);
            }
        }

        document.getElementById('insertMatrixBtn').addEventListener('click', () => {
            const sel = window.getSelection();
            if (sel.rangeCount && noteBox.contains(sel.getRangeAt(0).commonAncestorContainer)) {
                matrixInsertRange = sel.getRangeAt(0).cloneRange();
            } else {
                noteBox.focus();
                const r = document.createRange();
                r.selectNodeContents(noteBox);
                r.collapse(false);
                matrixInsertRange = r;
            }
            matrixRowsInput.value = 2;
            matrixColsInput.value = 2;
            buildMatrixGrid();
            matrixModalOverlay.classList.add('open');
        });

        document.getElementById('matrixResizeBtn').addEventListener('click', buildMatrixGrid);
        document.getElementById('matrixCancelBtn').addEventListener('click', () => {
            matrixModalOverlay.classList.remove('open');

        document.getElementById('matrixInsertBtn').addEventListener('click', () => {
            const cols = Math.max(1, Math.min(6, parseInt(matrixColsInput.value, 10) || 1));
            const cellInputs = Array.from(matrixGrid.querySelectorAll('input'));
            const rows = [];
            for (let i = 0; i < cellInputs.length; i += cols) {
                rows.push(cellInputs.slice(i, i + cols).map((inp) => inp.value.trim() || '0').join(' & '));
            }
            const latex = `\\begin{pmatrix} ${rows.join(' \\\\ ')} \\end{pmatrix}`;

            const span = document.createElement('span');
            span.className = 'matrix-block';
            span.setAttribute('data-latex', latex);

            if (matrixInsertRange) {
                matrixInsertRange.deleteContents();
                matrixInsertRange.insertNode(span);
            } else {
                noteBox.appendChild(span);

            renderMatrixBlock(span);
            matrixModalOverlay.classList.remove('open');

        // Renders one question card — either free-text (default) or
        // multiple-choice (when `options` is provided, used by the
        // recognition/encoding-check stage). `onSubmit` is called with
        // { answer, dontKnow } once the student responds.
        function renderQuestionCard(questionText, options, onSubmit) {
            const card = document.createElement('div');
            card.className = 'question-card';

            const qText = document.createElement('div');
            qText.className = 'question-card-text';

                    optBtn.style.color = 'var(--text)';
                    optBtn.style.border = '1px solid rgba(230, 215, 176, 0.2)';
                    optBtn.textContent = optionText;
                    optBtn.addEventListener('click', () => onSubmit({ answer: optionText, dontKnow: false }));
                    card.appendChild(optBtn);
                });
                questionFlowEl.appendChild(card);
                card.scrollIntoView({ behavior: 'smooth', block: 'end' });
                return card;
            }

            const answerInput = document.createElement('textarea');
            answerInput.className = 'question-answer-input';
            answerInput.placeholder = 'Type your answer…';

            const footer = document.createElement('div');
            footer.className = 'question-card-footer';

            const dontKnowLabel = document.createElement('label');
            dontKnowLabel.className = 'dont-know-label';
            const dontKnowCheckbox = document.createElement('input');
            dontKnowCheckbox.type = 'checkbox';
            dontKnowLabel.appendChild(dontKnowCheckbox);
            dontKnowLabel.appendChild(document.createTextNode("I don't know"));

            const submitBtn = document.createElement('button');
            submitBtn.className = 'question-submit-btn';
            submitBtn.textContent = 'Submit';

            dontKnowCheckbox.addEventListener('change', () => {
                answerInput.disabled = dontKnowCheckbox.checked;
                if (dontKnowCheckbox.checked) answerInput.value = '';
            });

            submitBtn.addEventListener('click', () => {
                onSubmit({ answer: answerInput.value, dontKnow: dontKnowCheckbox.checked });
            });

            footer.appendChild(dontKnowLabel);
            footer.appendChild(submitBtn);
            card.appendChild(answerInput);
            card.appendChild(footer);
            questionFlowEl.appendChild(card);
            card.scrollIntoView({ behavior: 'smooth', block: 'end' });

            return card;
        }

        // Freezes an already-answered card in place — the question stays
        // visible with the answer given, a correct/incorrect indicator,
        // and any correction — rather than disappearing, so the whole
        // lesson builds up as a real vertical record as it progresses.
        function lockAnsweredCard(card, answerGiven, correct, correction) {
            const resultLine = document.createElement('div');
            resultLine.style.marginTop = '10px';
            resultLine.style.paddingTop = '10px';
            resultLine.style.borderTop = '1px solid rgba(230, 215, 176, 0.12)';
            resultLine.style.fontSize = '0.85em';
            resultLine.innerHTML = `
                <div style="opacity:0.7; margin-bottom:4px;">Your answer: ${answerGiven || '(no answer given)'}</div>
                <div style="color:${correct ? 'var(--accent)' : '#e6b0a8'};">${correct ? '✓ Correct' : '✗ Corrected'}</div>
                ${correction ? `<div style="margin-top:6px; opacity:0.9;">${correction}</div>` : ''}
            `;

            // Remove the editable controls, keep the question text, add the result.
            card.querySelectorAll('textarea, .question-card-footer, .question-submit-btn').forEach((el) => el.remove());
            card.appendChild(resultLine);
        }

        // Runs a full chain-lesson session for one concept — the opening
        // prediction question, then the forward scaffold walk, with each
        // answered question locking in place (answer + correct/incorrect +
        // any correction) before the next one appears below it, building
        // the whole lesson as a real vertical record you work downward
        // through, ending in a summary at the bottom.
        async function runChainLesson(accessToken, subject, topic, concept) {
            questionFlowEl.innerHTML = '<div class="correction-card">Generating lesson…</div>';

            let resp;
            try {
                resp = await fetch(`${COMPILE_BACKEND_URL}/chain-lesson/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({ subject, topic, concept })
                });
            } catch (err) {
                questionFlowEl.innerHTML = '<div class="correction-card">Could not reach the server. Please try again.</div>';
                return;
            }

            if (!resp.ok) {
                const body = await resp.json().catch(() => ({}));
                questionFlowEl.innerHTML = `<div class="correction-card">${body.error || 'Could not start the lesson.'}</div>`;
                return;
            }

            const startResult = await resp.json();
            questionFlowEl.innerHTML = ''; // clear the "Generating…" placeholder — the real vertical list starts now

            async function askNext(questionText, state) {
                const card = renderQuestionCard(questionText, null, async (submission) => {
                    let nextResp;
                    try {
                        nextResp = await fetch(`${COMPILE_BACKEND_URL}/chain-lesson/submit`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                Authorization: `Bearer ${accessToken}`
                            },
                            body: JSON.stringify({ state, answer: submission.answer })
                        });
                    } catch (err) {
                        lockAnsweredCard(card, submission.answer, false, 'Could not reach the server. Please try again.');
                        return;
                    }

                    if (!nextResp.ok) {
                        const body = await nextResp.json().catch(() => ({}));
                        lockAnsweredCard(card, submission.answer, false, body.error || 'Something went wrong.');
                        return;
                    }

                    const nextResult = await nextResp.json();

                    if (nextResult.done) {
                        const finalEntries = nextResult.summary || [];
                        const finalEntry = finalEntries[finalEntries.length - 1];
                        lockAnsweredCard(card, submission.answer, finalEntry ? finalEntry.correct : true, finalEntry ? finalEntry.correction : undefined);

                        const summaryCard = document.createElement('div');
                        summaryCard.className = 'correction-card';
                        const rows = finalEntries.map((r) => {
                            const status = r.correct ? '✓ Correct' : 'Corrected';
                            return `<div style="margin-bottom:6px;">${r.chunkLabel}: ${status}</div>`;
                        }).join('');
                        summaryCard.innerHTML = `<div class="correction-label">Lesson complete</div>${rows}`;
                        questionFlowEl.appendChild(summaryCard);
                        summaryCard.scrollIntoView({ behavior: 'smooth', block: 'end' });

                        await refreshReviewSchedule();
                        return;
                    }

                    lockAnsweredCard(card, submission.answer, !nextResult.inlineCorrection, nextResult.inlineCorrection);
                    await askNext(nextResult.nextQuestion, nextResult.state);
                });
            }

            await askNext(startResult.nextQuestion, startResult.state);
        }

        document.getElementById('generateQuestionsBtn').addEventListener('click', async () => {
            const subject = document.getElementById('diagnoseSubjectInput').value.trim();
            const topic = document.getElementById('diagnoseTopicInput').value.trim();
            const lesson = document.getElementById('diagnoseLessonInput').value.trim();

            if (!lesson) {

                return;

            generateBtn.disabled = true;

            try {
                const { data: { session: diagSession } } = await supabaseClient.auth.getSession();
                if (!diagSession) throw new Error('Not logged in.');
                await runChainLesson(diagSession.access_token, subject, topic, lesson);
            } catch (err) {
                console.error('LastMind: chain lesson failed.', err);
                questionFlowEl.innerHTML = '<div class="correction-card">Could not start the lesson. Please try again.</div>';
            } finally {
                generateBtn.disabled = false;
            }
        });

        setupDictation(noteBox);

        refreshFolderList();
    }

    /**
     * Wires the mic button next to #noteBox to the browser's built-in Web
     * Speech API (SpeechRecognition). No external dictation service is used —
     * this only works in browsers that ship their own recognizer (Chrome/Edge
     * today; Safari/Firefox support is inconsistent), and only over HTTPS or
     * localhost, since getting microphone access requires a secure context.
     */
    function setupDictation(textarea) {
        const micBtn = document.getElementById('micBtn');
        const statusEl = document.getElementById('dictationStatus');

        const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognitionCtor) {
            micBtn.disabled = true;
            micBtn.title = 'Dictation is not supported in this browser';
            statusEl.textContent = 'Dictation is not supported in this browser.';
            return;
        }

        let isListening = false;

        function setStatus(text) {
            statusEl.textContent = text || '';
        }

        function setListeningUI(listening) {
            isListening = listening;
            micBtn.classList.toggle('listening', listening);
            micBtn.textContent = listening ? '■' : '🎤';
            micBtn.title = listening ? 'Stop dictation' : 'Start dictation';
        }

        function insertTranscript(transcript) {
            const trimmed = transcript.trim();
            if (!trimmed) return;

            textarea.focus();

            const sel = window.getSelection();
            let range;
            if (sel.rangeCount && textarea.contains(sel.getRangeAt(0).commonAncestorContainer)) {
                range = sel.getRangeAt(0);
            } else {
                range = document.createRange();
                range.selectNodeContents(textarea);
                range.collapse(false);
            }

            // Match the textarea's old "add a leading space unless the text
            // already ends in whitespace" behaviour, checked against the
            // text node immediately before the cursor.
            let needsLeadingSpace = true;
            const prevNode = range.startContainer.nodeType === Node.TEXT_NODE
                ? range.startContainer
                : range.startContainer.childNodes[range.startOffset - 1];
            if (prevNode && prevNode.nodeType === Node.TEXT_NODE) {
                needsLeadingSpace = prevNode.textContent.length > 0 && !/\s$/.test(prevNode.textContent);
            } else if (!prevNode) {
                needsLeadingSpace = false; // nothing before the cursor at all
            }

            const textNode = document.createTextNode((needsLeadingSpace ? ' ' : '') + trimmed + ' ');
            range.deleteContents();
            range.insertNode(textNode);

            // Move the cursor to just after the inserted text.
            const newRange = document.createRange();
            newRange.setStartAfter(textNode);
            newRange.collapse(true);
            sel.removeAllRanges();
            sel.addRange(newRange);

            textarea.dispatchEvent(new Event('input')); // reuses the existing autosave listener
            textarea.scrollTop = textarea.scrollHeight;
        }

        function startRecognition() {
            stopSpeaking();
            const recognition = new SpeechRecognitionCtor();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = navigator.language || 'en-US';

            recognition.onstart = () => {
                setListeningUI(true);
                setStatus('Listening…');
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }
                if (finalTranscript) insertTranscript(finalTranscript);
            };

            recognition.onerror = (event) => {
                let message;
                switch (event.error) {
                    case 'not-allowed':
                    case 'service-not-allowed':
                        message = 'Microphone access was blocked — check your browser/site permissions.';
                        break;
                    case 'no-speech':
                        message = 'No speech detected.';
                        break;
                    case 'audio-capture':
                        message = 'No microphone was found.';
                        break;
                    case 'network':
                        message = 'A network error interrupted dictation.';
                        break;
                    default:
                        message = `Dictation error: ${event.error}`;
                }
                setStatus(message);
            };

            recognition.onend = () => {
                setListeningUI(false);
                if (activeRecognition === recognition) activeRecognition = null;
                if (statusEl.textContent === 'Listening…') setStatus('');
            };

            activeRecognition = recognition;
            recognition.start();
        }

        micBtn.addEventListener('click', () => {
            if (isListening) {
                stopActiveDictation(); // triggers onend, which resets the UI
            } else {
                startRecognition();
            }
        });
    }

    async function createPageInFolder(folderId, subfolderId) {
        const folder = folders.find((f) => f.id === folderId);

        let targetArray;
        if (subfolderId) {
            const subfolder = (folder.subfolders || []).find((sf) => sf.id === subfolderId);
            if (!subfolder) return;
            subfolder.pages = subfolder.pages || [];
            targetArray = subfolder.pages;
        } else {
            folder.pages = folder.pages || [];
            targetArray = folder.pages;
        }

        const newPage = {
            id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
            title: `Untitled page ${targetArray.length + 1}`,
            content: '',
            createdAt: Date.now()
        };
        targetArray.push(newPage);
        await putFolder(folder);
        selectedFolderId = folder.id;

        await refreshFolderList();
        openPage(folder.id, newPage.id, subfolderId || null);

    document.getElementById('saveAccountSettingsBtn').addEventListener('click', async () => {
        const newPassword = document.getElementById('newAccountPasswordInput').value;
        const statusEl = document.getElementById('accountSettingsStatus');

        if (!newPassword || newPassword.length < 6) {
