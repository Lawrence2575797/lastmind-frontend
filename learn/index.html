                <span class="folder-meta">${(f.subfolders || []).length} subfolder(s) · ${(f.pages || []).length} page(s)</span>
            </div>
        `;

        const menuWrap = buildItemMenu([
            { label: 'Rename Folder', onClick: () => openRenameFolderModal(f.id) },
            { label: 'Delete Folder', danger: true, onClick: () => deleteFolder(f.id) }
        ]);

        header.appendChild(labelWrap);
        header.appendChild(menuWrap);
        header.addEventListener('click', () => selectFolder(f.id));

        // Reordering among top-level folders.
        item.addEventListener('dragstart', (e) => {
            draggedItem = { type: 'folder', folderId: f.id };
            e.dataTransfer.effectAllowed = 'move';
        });
        header.addEventListener('dragover', (e) => {
            if (!draggedItem || draggedItem.type !== 'folder') return;
            e.preventDefault();
            header.classList.add('drag-over');
        });
        header.addEventListener('dragleave', () => header.classList.remove('drag-over'));
        header.addEventListener('drop', async (e) => {
            e.preventDefault();
            header.classList.remove('drag-over');
            if (draggedItem && draggedItem.type === 'folder' && draggedItem.folderId !== f.id) {
                await reorderFolders(draggedItem.folderId, f.id);
            }
            draggedItem = null;
        });

        item.appendChild(header);
        return item;
    }

    function buildSubfolderRow(folder, sf) {
        const sfItem = document.createElement('div');
        sfItem.className = 'subfolder-item';

        const sfHeader = document.createElement('div');
        sfHeader.className = 'subfolder-header';

        const sfLabel = document.createElement('span');
        sfLabel.textContent = `📁 ${sf.name} (${(sf.pages || []).length})`;
        sfLabel.style.flex = '1';
        sfLabel.style.overflow = 'hidden';
        sfLabel.style.textOverflow = 'ellipsis';

        const sfMenu = buildItemMenu([
            { label: 'Rename Subfolder', onClick: () => openRenameModal('subfolder', { folderId: folder.id, subfolderId: sf.id }, sf.name || '', 'Rename Subfolder', 'Name') },
            { label: 'Delete Subfolder', danger: true, onClick: () => deleteSubfolderById(folder.id, sf.id) }
        ]);

        sfHeader.appendChild(sfLabel);
        sfHeader.appendChild(sfMenu);
        sfHeader.addEventListener('click', () => selectSubfolder(folder.id, sf.id));

        // A subfolder can receive a page dragged from this same folder's
        // direct-pages list, shown just below it in this same view.
        sfHeader.addEventListener('dragover', (e) => {
            if (!draggedItem || draggedItem.type !== 'page') return;
            e.preventDefault();
            sfHeader.classList.add('drag-over');
        });
        sfHeader.addEventListener('dragleave', () => sfHeader.classList.remove('drag-over'));
        sfHeader.addEventListener('drop', async (e) => {
            e.preventDefault();
            sfHeader.classList.remove('drag-over');
            if (draggedItem && draggedItem.type === 'page') {
                await movePage(draggedItem.pageId, folder.id, sf.id);
            }
            draggedItem = null;
        });

        sfItem.appendChild(sfHeader);
        return sfItem;
    }

    // Top level: every folder, with "+ Create new folder" on the right.
    function renderFoldersRootLevel() {
        const listEl = document.getElementById('folderList');
        listEl.innerHTML = '';

        listEl.appendChild(buildDrillHeader({
            title: 'Folders',
            actionLabel: '+ Create new folder',
            onAction: openFolderModal
        }));

        if (!folders.length) {
            const hint = document.createElement('div');
            hint.className = 'empty-hint';
            hint.textContent = 'No folders yet — click "+ Create new folder" to add one.';
            listEl.appendChild(hint);
            return;
        }

        folders.forEach((f) => listEl.appendChild(buildFolderRow(f)));
    }

    // Inside a folder: its subfolders (with "+ Create new subfolder"), plus
    // this folder's own direct pages further down, since folders can still
    // hold pages that aren't inside any subfolder.
    function renderFolderLevel(folder) {
        const listEl = document.getElementById('folderList');
        listEl.innerHTML = '';

        listEl.appendChild(buildDrillHeader({
            title: folderLabel(folder),
            actionLabel: '+ Create new subfolder',
            onAction: () => openSubfolderModal(folder.id),
            onBack: () => selectFolder(null)
        }));

        const subfolders = folder.subfolders || [];
        if (!subfolders.length) {
            const hint = document.createElement('div');
            hint.className = 'empty-hint';
            hint.textContent = 'No subfolders yet.';
            listEl.appendChild(hint);
        } else {
            subfolders.forEach((sf) => listEl.appendChild(buildSubfolderRow(folder, sf)));
        }

        // Pages can only be created inside a subfolder now — this section
        // only shows up for older data that already has pages sitting
        // directly in a folder from before that rule existed, so they're
        // not stranded/inaccessible. No "+ Page" add action here anymore.
        const directPages = folder.pages || [];
        if (directPages.length) {
            const pagesLabel = document.createElement('div');
            pagesLabel.className = 'drill-section-label';
            const pagesLabelText = document.createElement('span');
            pagesLabelText.textContent = 'Pages in this folder';
            pagesLabel.appendChild(pagesLabelText);
            listEl.appendChild(pagesLabel);

            directPages.forEach((p) => listEl.appendChild(buildPageItem(p, folder.id, null)));
        }
    }

    // Inside a subfolder: just its pages, with "+ Create new page".
    function renderSubfolderLevel(folder, subfolder) {
        const listEl = document.getElementById('folderList');
        listEl.innerHTML = '';

        listEl.appendChild(buildDrillHeader({
            title: subfolder.name,
            actionLabel: '+ Create new page',
            onAction: () => createPageInFolder(folder.id, subfolder.id),
            onBack: () => selectFolder(folder.id)
        }));

        const pages = subfolder.pages || [];
        if (!pages.length) {
            const hint = document.createElement('div');
            hint.className = 'empty-hint';
            hint.textContent = 'No pages yet.';
            listEl.appendChild(hint);
        } else {
            pages.forEach((p) => listEl.appendChild(buildPageItem(p, folder.id, subfolder.id)));
        }
    }

    // Renders whichever of the three drill levels selectedFolderId /
    // selectedSubfolderId currently point at — folders list, a folder's
    // contents, or a subfolder's pages.
    async function refreshFolderList() {
        folders = await getAllFolders();
        folders.sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));

        if (!selectedFolderId) {
            renderFoldersRootLevel();
            return;
        }

        const folder = folders.find((f) => f.id === selectedFolderId);
        if (!folder) {
            selectedFolderId = null;
            selectedSubfolderId = null;
            renderFoldersRootLevel();
            return;
        }

        if (!selectedSubfolderId) {
            renderFolderLevel(folder);
            return;
        }

        const subfolder = (folder.subfolders || []).find((sf) => sf.id === selectedSubfolderId);
        if (!subfolder) {
            selectedSubfolderId = null;
            renderFolderLevel(folder);
            return;
        }

        renderSubfolderLevel(folder, subfolder);
    }

    function selectFolder(folderId) {
        selectedFolderId = folderId;
        selectedSubfolderId = null;
        selectedPageId = null;
        const f = folders.find((x) => x.id === folderId);
        document.getElementById('topbarTitle').textContent = f ? folderLabel(f) : 'Dashboard';
        renderWelcome();
        refreshFolderList();
    }

    function selectSubfolder(folderId, subfolderId) {
        selectedFolderId = folderId;
        selectedSubfolderId = subfolderId;
        selectedPageId = null;
        const f = folders.find((x) => x.id === folderId);
        const sf = f && (f.subfolders || []).find((x) => x.id === subfolderId);
        document.getElementById('topbarTitle').textContent = (f && sf) ? `${folderLabel(f)} · ${sf.name}` : 'Dashboard';
        renderWelcome();
        refreshFolderList();
    }

    function renderWelcome() {
        stopActiveDictation();
        stopSpeaking();
        document.getElementById('contentInner').innerHTML = `
            <div class="dashboard-view">
                <h1 class="dashboard-logo">Last<span>Mind</span></h1>
                <p class="dashboard-quote">${currentQuote}</p>
            </div>
        `;
    }

    let saveDebounce = null;

    // Tracks whatever recognition session is currently running, if any, so
    // switching pages/folders can't leave a mic session orphaned in the background.
    let activeRecognition = null;

    function stopActiveDictation() {
        if (activeRecognition) {
            try { activeRecognition.stop(); } catch (err) { /* already stopped */ }
            activeRecognition = null;
        }
    }

    /**
     * On-device text-to-speech via the Web Speech API (SpeechSynthesis) —
     * no external TTS service involved, nothing leaves the browser. This is
     * the web equivalent of AVSpeechSynthesizer (iOS) / TextToSpeech
     * (Android); those are native-platform APIs and don't apply here since
     * this is a web page, not a native app.
     *
     * Note: browsers require a user gesture (like a click) before audio can
     * play at all — that's a platform security rule speechSynthesis can't
     * bypass. Speech only starts from the explicit Play click below.
     */
    function stopSpeaking() {
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }
    }

    // getVoices() often returns an empty list on the very first call, until
    // the browser finishes loading them asynchronously — this waits for
    // that instead of silently falling back to the default voice.
    function loadVoices() {
        return new Promise((resolve) => {
            const existing = window.speechSynthesis.getVoices();
            if (existing.length) {
                resolve(existing);
                return;
            }
            window.speechSynthesis.onvoiceschanged = () => {
                resolve(window.speechSynthesis.getVoices());
            };
        });
    }

    // Chrome ships several "Google ..." voices (e.g. "Google UK English
    // Male", "Google US English") that sound noticeably more natural than
    // the platform's bare default voice. Prefer one of those, matched to
    // the browser's language where possible; fall back to any English
    // voice, then to whatever's available, rather than forcing a voice
    // that doesn't exist on this device.
    function pickBestVoice(voices) {
        if (!voices || !voices.length) return null;

        const langPrefix = (navigator.language || 'en-US').slice(0, 2).toLowerCase();
        const googleVoices = voices.filter((v) => v.name.includes('Google'));

        if (googleVoices.length) {
            const langMatch = googleVoices.find((v) => v.lang.toLowerCase().startsWith(langPrefix));
            return langMatch || googleVoices[0];
        }

        const enVoice = voices.find((v) => v.lang.toLowerCase().startsWith('en'));
        return enVoice || voices[0];
    }

    async function speakText(text) {
        if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
            console.warn('LastMind: on-device text-to-speech is not supported in this browser.');
            return null;
        }

        stopSpeaking(); // cancel anything already playing before starting new speech

        const trimmed = (text || '').trim();
        if (!trimmed) return null;

        const utterance = new SpeechSynthesisUtterance(trimmed);
        utterance.lang = navigator.language || 'en-US';

        const voices = await loadVoices();
        const bestVoice = pickBestVoice(voices);
        if (bestVoice) {
            utterance.voice = bestVoice;
            utterance.lang = bestVoice.lang;
        }

        window.speechSynthesis.speak(utterance);
        return utterance;
    }

    function openPage(folderId, pageId, subfolderId) {
        stopActiveDictation();
        stopSpeaking();

        selectedFolderId = folderId;
        selectedSubfolderId = subfolderId || null;
        selectedPageId = pageId;

        const loc = findPageLocation(pageId);
        if (!loc) return;
        const folder = loc.folder;
        const page = loc.pagesArray.find((p) => p.id === pageId);

        document.getElementById('topbarTitle').textContent = `${folderLabel(folder)} · ${page.title}`;

        const contentInner = document.getElementById('contentInner');

        // No more "have you been taught this before?" gate — every page
        // always starts with its first ENCODING lesson (full width, no
        // notes panel yet — there's nothing to take notes on before the
        // material has actually been taught once). Only once that first
        // lesson is completed (runChainLesson sets page.encodingDone, see
        // below) does the page switch to RETRIEVAL lessons alongside the
        // notes panel. `page.taughtBefore` is read as a fallback purely so
        // pages that already went through the old Yes/No gate don't get
        // sent back through encoding — "Yes" under the old gate counts as
        // encoding already done.
        const encodingDone = page.encodingDone === true || page.taughtBefore === true;
        const showNotes = encodingDone;

        const lessonPanelHtml = encodingDone
            ? `
            <div class="lesson-panel">
                <h3 class="lesson-panel-heading">Take Your Retrieval Lesson</h3>
                <p class="lesson-intro-message">This lesson is designed to allow you to construct the lesson with the right amount of scaffolding for you. Here is the first step:</p>
                <div class="bottom-action-row">
                    <button class="generate-questions-btn" id="generateQuestionsBtn" ${isPaidUser ? '' : 'disabled title="Upgrade to unlock diagnostics"'}>Start Lesson</button>
                </div>
                <div id="diagnoseQuestionFlow"></div>
            </div>
        `
            : `
            <div class="lesson-panel">
                <h3 class="lesson-panel-heading">Your First Encoding Lesson</h3>
                <p class="lesson-intro-message">This lesson is designed to allow you to construct the lesson with the right amount of scaffolding for you. Here is the first step:</p>
                <div class="bottom-action-row">
                    <button class="generate-questions-btn" id="generateQuestionsBtn" ${isPaidUser ? '' : 'disabled title="Upgrade to unlock diagnostics"'}>Start Lesson</button>
                </div>
                <div id="diagnoseQuestionFlow"></div>
            </div>
        `;

        const notesPanelHtml = `
            <div class="notes-panel">
                <input type="text" class="page-title-input" id="pageTitleInput" placeholder="Page title" value="">
                <h3 class="notes-panel-heading">Add / Create Your Notes</h3>
                <div class="notes-mode-toggle">
                    <label class="notes-mode-option"><input type="radio" name="notesMode" id="notesModeOwn" checked> Add your own notes</label>
                    <label class="notes-mode-option"><input type="radio" name="notesMode" id="notesModeCortex"> Create new notes using Cortex</label>
                </div>

                <div id="notesOwnMode">
                    <div class="rich-toolbar">
                        <button type="button" class="toolbar-btn" id="insertMathBtn">∑ Insert Math</button>
                        <button type="button" class="toolbar-btn" id="insertMatrixBtn">⊞ Insert Matrix</button>
                    </div>

                    <div class="textarea-wrap">
                        <div class="note-editable" id="noteBox" contenteditable="true" data-placeholder="Start typing your notes…"></div>
                        <button type="button" class="mic-btn" id="micBtn" title="Start dictation">🎤</button>
                    </div>
                    <div class="dictation-status" id="dictationStatus"></div>
                    <button class="play-btn" id="playBtn" title="Read notes aloud">▶ Play</button>

                    ${isPaidUser ? `
                        <div class="bottom-action-row">
                            <button class="compile-btn" id="compileBtn">Compile</button>
                        </div>
                        <div class="compile-status" id="compileStatus"></div>
                        <div class="compiled-output" id="compiledOutput" style="display:none;"></div>
                    ` : ''}

                    <div class="scratch-notes-widget" id="scratchNotesWidget">
                        <div class="scratch-notes-header" id="scratchNotesHeader">
                            <span>💡 Quick Notes</span>
                            <button type="button" class="scratch-notes-toggle" id="scratchNotesToggle">▾</button>
                        </div>
                        <textarea class="scratch-notes-textarea" id="scratchNotesBox" placeholder="Jot down a point for later, without losing your place…"></textarea>
                    </div>
                </div>

                <div id="notesCortexMode" style="display:none;">
                    <p class="cortex-placeholder">Cortex note generation is coming soon.</p>
                </div>
            </div>

            <div class="modal-overlay" id="matrixModalOverlay">
                <div class="modal">
                    <h3>Insert Matrix</h3>
                    <div class="matrix-size-fields">
                        <div class="field">
                            <label for="matrixRowsInput">Rows</label>
                            <input type="number" id="matrixRowsInput" min="1" max="6" value="2">
                        </div>
                        <div class="field">
                            <label for="matrixColsInput">Columns</label>
                            <input type="number" id="matrixColsInput" min="1" max="6" value="2">
                        </div>
                        <button class="btn" id="matrixResizeBtn" type="button">Update Grid</button>
                    </div>
                    <div class="matrix-grid" id="matrixGrid"></div>
                    <div class="modal-actions">
                        <button class="btn" id="matrixCancelBtn">Cancel</button>
                        <button class="btn primary" id="matrixInsertBtn">Insert</button>
                    </div>
                </div>
            </div>
        `;

        contentInner.innerHTML = showNotes
            ? `<div class="page-split-layout">${notesPanelHtml}${lessonPanelHtml}</div>`
            : lessonPanelHtml;

        mathFieldInstances = new Map(); // fresh map for this page

        if (showNotes) {
            const titleInput = document.getElementById('pageTitleInput');
            titleInput.value = page.title || '';
            titleInput.focus();
            titleInput.select();
            let titleSaveDebounce = null;
            titleInput.addEventListener('input', () => {
                clearTimeout(titleSaveDebounce);
                const newTitle = titleInput.value;
                document.getElementById('topbarTitle').textContent = `${folderLabel(folder)} · ${newTitle || 'Untitled page'}`;
                titleSaveDebounce = setTimeout(async () => {
                    page.title = newTitle || 'Untitled page';
                    await putFolder(folder);
                    await refreshFolderList();
                }, 400);
            });

            document.getElementById('notesModeOwn').addEventListener('change', () => {
                document.getElementById('notesOwnMode').style.display = 'block';
                document.getElementById('notesCortexMode').style.display = 'none';
            });
            document.getElementById('notesModeCortex').addEventListener('change', () => {
                document.getElementById('notesOwnMode').style.display = 'none';
                document.getElementById('notesCortexMode').style.display = 'block';
            });

            const noteBox = document.getElementById('noteBox');

            // Scratch notes: a small "jot this down for later" pad, kept
            // completely separate from the real notes on purpose — it's
            // never read by Compile or Play, both of which only ever look at
            // noteBox. Its own field on the page, its own debounce, its own
            // save call.
            const scratchNotesBox = document.getElementById('scratchNotesBox');
            const scratchNotesWidget = document.getElementById('scratchNotesWidget');
            scratchNotesBox.value = page.scratchNotes || '';

            // Starts collapsed on mobile specifically — out of the way until
            // tapped open, rather than taking up real screen space by default
            // on a narrow viewport. Desktop keeps its existing open-by-default
            // behavior unchanged.
            if (window.innerWidth <= 768) {
                scratchNotesWidget.classList.add('collapsed');
            }

            let scratchSaveDebounce = null;
            scratchNotesBox.addEventListener('input', () => {
                clearTimeout(scratchSaveDebounce);
                scratchSaveDebounce = setTimeout(async () => {
                    page.scratchNotes = scratchNotesBox.value;
                    await putFolder(folder);
                }, 400);
            });

            document.getElementById('scratchNotesHeader').addEventListener('click', () => {
                scratchNotesWidget.classList.toggle('collapsed');
            });

            // Builds a clean, storage-safe copy of the note's HTML: inline math
            // fields are reduced to <span class="math-field-inline"
            // data-latex="..."></span> — MathQuill's own live rendering DOM is
            // NOT saved (it isn't meant to be treated as static markup), only
            // the LaTeX source, which is enough to fully rebuild the field next
            // time the page opens.
            function serializeNoteContent() {
                const container = document.createElement('div');

                function walk(source, target) {
                    source.childNodes.forEach((child) => {
                        if (child.nodeType === Node.TEXT_NODE) {
                            target.appendChild(document.createTextNode(child.textContent));
                            return;
                        }
                        if (child.nodeType !== Node.ELEMENT_NODE) return;

                        if (child.classList.contains('math-field-inline')) {
                            const clean = document.createElement('span');
                            clean.className = 'math-field-inline';
                            const instance = mathFieldInstances.get(child);
                            clean.setAttribute('data-latex', instance ? instance.latex() : (child.dataset.latex || ''));
                            target.appendChild(clean);
                            return;
                        }
                        if (child.classList.contains('matrix-block')) {
                            const clean = document.createElement('span');
                            clean.className = 'matrix-block';
                            clean.setAttribute('data-latex', child.dataset.latex || '');
                            target.appendChild(clean);
                            return;
                        }

                        const clone = document.createElement(child.tagName);
                        walk(child, clone);
                        target.appendChild(clone);
                    });
                }

                walk(noteBox, container);
                return container.innerHTML;
            }

            // The plain-text version sent to Compile and read aloud by Play —
            // math fields/matrices contribute their LaTeX source as text (which
            // Claude reads fine; TTS will read it literally rather than
            // "speaking" the math, a known, honest limitation for now).
            function extractPlainText(node) {
                let result = '';
                node.childNodes.forEach((child) => {
                    if (child.nodeType === Node.TEXT_NODE) {
                        result += child.textContent;
                        return;
                    }
                    if (child.nodeType !== Node.ELEMENT_NODE) return;

                    if (child.classList.contains('math-field-inline')) {
                        const instance = mathFieldInstances.get(child);
                        result += ` ${instance ? instance.latex() : (child.dataset.latex || '')} `;
                    } else if (child.classList.contains('matrix-block')) {
                        result += ` ${child.dataset.latex || ''} `;
                    } else if (child.tagName === 'BR') {
                        result += '\n';
                    } else if (child.tagName === 'DIV' || child.tagName === 'P') {
                        result += extractPlainText(child) + '\n';
                    } else {
                        result += extractPlainText(child);
                    }
                });
                return result;
            }

            function saveNoteContent() {
                clearTimeout(saveDebounce);
                saveDebounce = setTimeout(async () => {
                    page.content = serializeNoteContent();
                    await putFolder(folder);
                }, 400);
            }

            function renderMatrixBlock(el) {
                const latex = el.getAttribute('data-latex') || '';
                try {
                    katex.render(latex, el, { throwOnError: false, displayMode: true });
                } catch (err) {
                    el.textContent = latex; // fallback: show raw LaTeX if rendering fails
                }
            }

            function attachMathField(el, initialLatex) {
                const mq = MQ.MathField(el, {
                    handlers: { edit: saveNoteContent }
                });
                if (initialLatex) mq.latex(initialLatex);
                mathFieldInstances.set(el, mq);
                return mq;
            }

            // Load saved content, then bring any math-field-inline / matrix-block
            // spans in it back to life (they're saved as inert markup with just
            // a data-latex attribute — see serializeNoteContent above).
            noteBox.innerHTML = page.content || '';
            noteBox.querySelectorAll('.math-field-inline').forEach((el) => {
                const savedLatex = el.getAttribute('data-latex') || '';
                el.innerHTML = '';
                attachMathField(el, savedLatex);
            });
            noteBox.querySelectorAll('.matrix-block').forEach(renderMatrixBlock);

            noteBox.addEventListener('input', saveNoteContent);

            // "Insert Math" — drops a live MathQuill field at the current
            // cursor position within the notes.
            document.getElementById('insertMathBtn').addEventListener('click', () => {
                let range;
                const sel = window.getSelection();
                if (sel.rangeCount && noteBox.contains(sel.getRangeAt(0).commonAncestorContainer)) {
                    range = sel.getRangeAt(0);
                } else {
                    noteBox.focus();
                    range = document.createRange();
                    range.selectNodeContents(noteBox);
                    range.collapse(false);
                }

                const span = document.createElement('span');
                span.className = 'math-field-inline';
                range.deleteContents();
                range.insertNode(span);

                const mq = attachMathField(span, '');
                mq.focus();
            });

            // "Insert Matrix" — a custom grid tool, not MathQuill (whose own
            // matrix support is genuinely broken per its GitHub issue tracker).
            // Rendered read-only via KaTeX, which handles matrix LaTeX correctly.
            const matrixModalOverlay = document.getElementById('matrixModalOverlay');
            const matrixGrid = document.getElementById('matrixGrid');
            const matrixRowsInput = document.getElementById('matrixRowsInput');
            const matrixColsInput = document.getElementById('matrixColsInput');
            let matrixInsertRange = null; // where to insert once "Insert" is clicked

            function buildMatrixGrid() {
                const rows = Math.max(1, Math.min(6, parseInt(matrixRowsInput.value, 10) || 1));
                const cols = Math.max(1, Math.min(6, parseInt(matrixColsInput.value, 10) || 1));
                matrixGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
                matrixGrid.innerHTML = '';
                for (let i = 0; i < rows * cols; i++) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.placeholder = '0';
                    matrixGrid.appendChild(input);
                }
            }

            document.getElementById('insertMatrixBtn').addEventListener('click', () => {
                const sel = window.getSelection();
                if (sel.rangeCount && noteBox.contains(sel.getRangeAt(0).commonAncestorContainer)) {
                    matrixInsertRange = sel.getRangeAt(0).cloneRange();
                } else {
                    noteBox.focus();
                    const r = document.createRange();
                    r.selectNodeContents(noteBox);
                    r.collapse(false);
                    matrixInsertRange = r;
                }
                matrixRowsInput.value = 2;
                matrixColsInput.value = 2;
                buildMatrixGrid();
                matrixModalOverlay.classList.add('open');
            });

            document.getElementById('matrixResizeBtn').addEventListener('click', buildMatrixGrid);
            document.getElementById('matrixCancelBtn').addEventListener('click', () => {
                matrixModalOverlay.classList.remove('open');
            });
            matrixModalOverlay.addEventListener('click', (e) => {
                if (e.target.id === 'matrixModalOverlay') matrixModalOverlay.classList.remove('open');
            });

            document.getElementById('matrixInsertBtn').addEventListener('click', () => {
                const cols = Math.max(1, Math.min(6, parseInt(matrixColsInput.value, 10) || 1));
                const cellInputs = Array.from(matrixGrid.querySelectorAll('input'));
                const rows = [];
                for (let i = 0; i < cellInputs.length; i += cols) {
                    rows.push(cellInputs.slice(i, i + cols).map((inp) => inp.value.trim() || '0').join(' & '));
                }
                const latex = `\\begin{pmatrix} ${rows.join(' \\\\ ')} \\end{pmatrix}`;

                const span = document.createElement('span');
                span.className = 'matrix-block';
                span.setAttribute('data-latex', latex);

                if (matrixInsertRange) {
                    matrixInsertRange.deleteContents();
                    matrixInsertRange.insertNode(span);
                } else {
                    noteBox.appendChild(span);
                }
                renderMatrixBlock(span);
                matrixModalOverlay.classList.remove('open');
                saveNoteContent();
            });

            if (isPaidUser) {
                const compileBtn = document.getElementById('compileBtn');
                const compileStatus = document.getElementById('compileStatus');
                const compiledOutput = document.getElementById('compiledOutput');

                compileBtn.addEventListener('click', async () => {
                    const notes = extractPlainText(noteBox).trim();
                    if (!notes) {
                        compileStatus.textContent = 'Write some notes first.';
                        compileStatus.classList.add('error');
                        return;
                    }

                    compileBtn.disabled = true;
                    compileStatus.classList.remove('error');
                    compileStatus.textContent = 'Compiling…';
                    compiledOutput.style.display = 'none';

                    try {
                        const { data: { session: compileSession } } = await supabaseClient.auth.getSession();
                        if (!compileSession) {
                            throw new Error('Not logged in.');
                        }

                        const resp = await fetch(`${COMPILE_BACKEND_URL}/compile`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                Authorization: `Bearer ${compileSession.access_token}`
                            },
                            body: JSON.stringify({ notes })
                        });

                        if (!resp.ok) {
                            const body = await resp.json().catch(() => ({}));
                            throw new Error(body.error || `Server returned ${resp.status}`);
                        }

                        const { result } = await resp.json();
                        compiledOutput.textContent = result;
                        compiledOutput.style.display = 'block';
                        compileStatus.textContent = '';
                    } catch (err) {
                        console.error('LastMind: compile request failed.', err);
                        compileStatus.textContent = 'Could not compile your notes. Please try again.';
                        compileStatus.classList.add('error');
                    } finally {
                        compileBtn.disabled = false;
                    }
                });
            }

            // Text-to-speech only ever starts from this explicit Play click —
            // never automatically. Clicking again while speaking stops it.
            const playBtn = document.getElementById('playBtn');
            playBtn.addEventListener('click', async () => {
                if (window.speechSynthesis && window.speechSynthesis.speaking) {
                    stopSpeaking();
                    playBtn.classList.remove('playing');
                    playBtn.textContent = '▶ Play';
                    return;
                }
                const utterance = await speakText(extractPlainText(noteBox));
                if (!utterance) return;
                playBtn.classList.add('playing');
                playBtn.textContent = '■ Stop';
                utterance.onend = () => {
                    playBtn.classList.remove('playing');
                    playBtn.textContent = '▶ Play';
                };
            });

            setupDictation(noteBox);
        }

        const questionFlowEl = document.getElementById('diagnoseQuestionFlow');

        // Renders one question card — either free-text (default) or
        // multiple-choice (when `options` is provided, used by the
        // recognition/encoding-check stage). `onSubmit` is called with
        // { answer, dontKnow } once the student responds.
        function renderQuestionCard(questionText, options, onSubmit, container) {
            const targetEl = container || questionFlowEl;
            const card = document.createElement('div');
            card.className = 'question-card';

            const qText = document.createElement('div');
            qText.className = 'question-card-text';
            qText.textContent = questionText;
            card.appendChild(qText);

            if (options && options.length) {
                options.forEach((optionText) => {
                    const optBtn = document.createElement('button');
                    optBtn.className = 'question-submit-btn';
                    optBtn.style.display = 'block';
                    optBtn.style.width = '100%';
                    optBtn.style.textAlign = 'left';
                    optBtn.style.marginBottom = '8px';
                    optBtn.style.background = 'none';
                    optBtn.style.color = 'var(--text)';
                    optBtn.style.border = '1px solid rgba(230, 215, 176, 0.2)';
                    optBtn.textContent = optionText;
                    optBtn.addEventListener('click', () => onSubmit({ answer: optionText, dontKnow: false }));
                    card.appendChild(optBtn);
                });
                targetEl.appendChild(card);
                card.scrollIntoView({ behavior: 'smooth', block: 'end' });
                return card;
            }

            const answerInput = document.createElement('textarea');
            answerInput.className = 'question-answer-input';
            answerInput.placeholder = 'Type your answer…';

            const footer = document.createElement('div');
            footer.className = 'question-card-footer';

            const dontKnowLabel = document.createElement('label');
            dontKnowLabel.className = 'dont-know-label';
            const dontKnowCheckbox = document.createElement('input');
            dontKnowCheckbox.type = 'checkbox';
            dontKnowLabel.appendChild(dontKnowCheckbox);
            dontKnowLabel.appendChild(document.createTextNode("I don't know"));

            const submitBtn = document.createElement('button');
            submitBtn.className = 'question-submit-btn';
            submitBtn.textContent = 'Submit';

            dontKnowCheckbox.addEventListener('change', () => {
                answerInput.disabled = dontKnowCheckbox.checked;
                if (dontKnowCheckbox.checked) answerInput.value = '';
            });

            submitBtn.addEventListener('click', () => {
                onSubmit({ answer: answerInput.value, dontKnow: dontKnowCheckbox.checked });
            });

            footer.appendChild(dontKnowLabel);
            footer.appendChild(submitBtn);
            card.appendChild(answerInput);
            card.appendChild(footer);
            targetEl.appendChild(card);
            card.scrollIntoView({ behavior: 'smooth', block: 'end' });

            return card;
        }

        // Freezes an already-answered card in place — the question stays
        // visible with the answer given, a correct/incorrect indicator,
        // and any correction — rather than disappearing, so the whole
        // lesson builds up as a real vertical record as it progresses.
        function lockAnsweredCard(card, answerGiven, correct, correction, statusLabel) {
            const resultLine = document.createElement('div');
            resultLine.style.marginTop = '10px';
            resultLine.style.paddingTop = '10px';
            resultLine.style.borderTop = '1px solid rgba(230, 215, 176, 0.12)';
            resultLine.style.fontSize = '0.85em';
            const label = statusLabel || (correct ? '✓ Correct' : '✗ Corrected');
            resultLine.innerHTML = `
                <div style="opacity:0.7; margin-bottom:4px;">Your answer: ${answerGiven || '(no answer given)'}</div>
                <div style="color:${correct ? 'var(--accent)' : '#e6b0a8'};">${label}</div>
                ${correction ? `<div style="margin-top:6px; opacity:0.9;">${correction}</div>` : ''}
            `;

            // Remove the editable controls, keep the question text, add the result.
            card.querySelectorAll('textarea, .question-card-footer, .question-submit-btn').forEach((el) => el.remove());
            card.appendChild(resultLine);
        }

        // Runs a full chain-lesson session for one concept — the opening
        // prediction question, then the forward scaffold walk, with each
        // answered question locking in place (answer + correct/incorrect +
        // any correction) before the next one appears below it, building
        // the whole lesson as a real vertical record you work downward
        // through, ending in a summary at the bottom.
        async function runChainLesson(accessToken, subject, topic, concept) {
            questionFlowEl.innerHTML = '<div class="correction-card">Generating lesson…</div>';

            let resp;
            try {
                resp = await fetch(`${COMPILE_BACKEND_URL}/chain-lesson/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({ subject, topic, concept })
                });
            } catch (err) {
                questionFlowEl.innerHTML = '<div class="correction-card">Could not reach the server. Please try again.</div>';
                return;
            }

            if (!resp.ok) {
                const body = await resp.json().catch(() => ({}));
                questionFlowEl.innerHTML = `<div class="correction-card">${body.error || 'Could not start the lesson.'}</div>`;
                return;
            }

            const startResult = await resp.json();
            questionFlowEl.innerHTML = ''; // clear the "Generating…" placeholder — the real vertical list starts now

            async function askNext(questionText, state) {
                const card = renderQuestionCard(questionText, null, async (submission) => {
                    let nextResp;
                    try {
                        nextResp = await fetch(`${COMPILE_BACKEND_URL}/chain-lesson/submit`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                Authorization: `Bearer ${accessToken}`
                            },
                            body: JSON.stringify({ state, answer: submission.answer })
                        });
                    } catch (err) {
                        lockAnsweredCard(card, submission.answer, false, 'Could not reach the server. Please try again.');
                        return;
                    }

                    if (!nextResp.ok) {
                        const body = await nextResp.json().catch(() => ({}));
                        lockAnsweredCard(card, submission.answer, false, body.error || 'Something went wrong.');
                        return;
                    }

                    const nextResult = await nextResp.json();

                    if (nextResult.done) {
                        const finalEntries = nextResult.summary || [];
                        const finalEntry = finalEntries[finalEntries.length - 1];
                        lockAnsweredCard(card, submission.answer, finalEntry ? finalEntry.correct : true, finalEntry ? finalEntry.correction : undefined);

                        const summaryCard = document.createElement('div');
                        summaryCard.className = 'correction-card';
                        const rows = finalEntries.map((r) => {
                            const status = r.correct ? '✓ Correct' : 'Corrected';
                            return `<div style="margin-bottom:6px;">${r.chunkLabel}: ${status}</div>`;
                        }).join('');
                        summaryCard.innerHTML = `<div class="correction-label">Lesson complete</div>${rows}`;
                        questionFlowEl.appendChild(summaryCard);
                        summaryCard.scrollIntoView({ behavior: 'smooth', block: 'end' });

                        return;
                    }

                    lockAnsweredCard(card, submission.answer, !nextResult.inlineCorrection, nextResult.inlineCorrection);
                    await askNext(nextResult.nextQuestion, nextResult.state);
                });
            }

            await askNext(startResult.nextQuestion, startResult.state);
        }

        /* ───────── First-time ENCODING lesson (only while !encodingDone) ─────────
           A genuinely different shape from the retrieval chain-lesson above:
           a novelty hook fact, then a Socratic walk FORWARD through the
           concept's dependency chain (leaf prerequisites first, building
           toward the new target concept), asking the student to derive each
           derivable step themselves. Everything presentable was generated in
           ONE call by /encoding-lesson/start — grading each answer is the
           only thing that needs another call, via /encoding-lesson/submit. */

        async function postEncodingSubmit(accessToken, state, answer) {
            const resp = await fetch(`${COMPILE_BACKEND_URL}/encoding-lesson/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
                body: JSON.stringify({ state, answer })
            });
            if (!resp.ok) {
                const body = await resp.json().catch(() => ({}));
                throw new Error(body.error || 'Something went wrong.');
            }
            return resp.json();
        }

        // "explain" steps show the direct explanation text above the
        // question, then ask a checkQuestion testing whether it actually
        // landed — brand-new content can't be verified by FSRS yet, so this
        // is the only check before later "derive" steps build on it. "scene"
        // and "derive" steps have no separate explanation block — the
        // question text itself is the whole prompt. Both shapes always
        // advance regardless of the verdict (first-exposure lesson, not a
        // gate); a weaker answer just leaves a note and contributes to a
        // lower FSRS grade for this concept overall, which is what brings it
        // back around sooner in spaced review, not re-litigating this step now.
        function renderEncodingAnswerCard(accessToken, step, state, explanationText) {
            const card = document.createElement('div');
            card.className = 'question-card';

            if (step.diagram) {
                const diagramWrap = document.createElement('div');
                diagramWrap.className = 'question-diagram';

                const img = document.createElement('img');
                img.src = step.diagram.diagramUrl;
                img.alt = step.diagram.diagramCaption || '';
                img.className = 'question-diagram-img';
                img.onerror = () => diagramWrap.remove();
                diagramWrap.appendChild(img);

                if (step.diagram.diagramCaption) {
                    const caption = document.createElement('div');
                    caption.className = 'question-diagram-caption';
                    caption.textContent = step.diagram.diagramCaption;
                    diagramWrap.appendChild(caption);
                }

                const attribution = document.createElement('div');
                attribution.className = 'question-diagram-attribution';
                attribution.textContent = step.diagram.diagramAttribution || '';
                diagramWrap.appendChild(attribution);

                card.appendChild(diagramWrap);
            }

            if (explanationText) {
                const explanation = document.createElement('div');
                explanation.className = 'question-card-text';
                explanation.textContent = explanationText;
                card.appendChild(explanation);
            }

            const promptText = explanationText ? (step.checkQuestion || step.text) : step.text;
            const text = document.createElement('div');
            text.className = 'question-card-text';
            text.textContent = promptText;
            card.appendChild(text);

            const answerInput = document.createElement('textarea');
            answerInput.className = 'question-answer-input';
            answerInput.placeholder = 'Type your answer…';
            card.appendChild(answerInput);

            const footer = document.createElement('div');
            footer.className = 'question-card-footer';
            const submitBtn = document.createElement('button');
            submitBtn.className = 'question-submit-btn';
            submitBtn.type = 'button';
            submitBtn.textContent = 'Submit';
            footer.appendChild(submitBtn);
            card.appendChild(footer);

            submitBtn.addEventListener('click', async () => {
                const answer = answerInput.value.trim();
                submitBtn.disabled = true;

                try {
                    const result = await postEncodingSubmit(accessToken, state, answer);
                    card.querySelectorAll('textarea, .question-card-footer').forEach((el) => el.remove());
                    lockAnsweredCard(card, answer, result.correct !== false, result.feedback);

                    // implication steps have no real chain node to root-cause
                    // diagnose against (synthetic nodeId) — those, and any
                    // correct answer, just advance as before. A wrong
                    // check/scene/derive/explain answer pauses instead and
                    // drills down through the diagnostic tree before resuming.
                    if (result.correct === false && step.type !== 'implication') {
                        await runDiagnosticDrillDown(accessToken, card, step, answer, result);
                    } else {
                        renderNextEncodingStep(accessToken, result);
                    }
                } catch (err) {
                    console.error('LastMind: encoding lesson submit failed.', err);
                    submitBtn.disabled = false;
                    const errorNote = document.createElement('div');
                    errorNote.className = 'correction-card';
                    errorNote.textContent = 'Could not reach the server. Please try again.';
                    card.insertAdjacentElement('afterend', errorNote);
                    errorNote.scrollIntoView({ behavior: 'smooth', block: 'end' });
                }
            });

            questionFlowEl.appendChild(card);
            card.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        const DIAGNOSIS_LABELS = {
            encoding: 'You hadn’t quite learned this yet',
            wm_overload: 'Too much to hold at once',
            decay: 'Just a bit rusty',
            interference: 'Mixed up with something similar',
            schedule_miscalibrated: 'Reviewed a bit too early',
            transfer: 'Knew the pieces, just needed the nudge',
            integration: 'Trouble putting the pieces together',
            global_chain_failure: 'The whole chain was a lot to hold at once',
            unresolved: 'Still working this one out'
        };

        function friendlyDiagnosisLabel(diagnosis) {
            return DIAGNOSIS_LABELS[diagnosis] || 'Let’s go over this one';
        }

        // Pauses the encoding lesson on a wrong check/scene/derive/explain
        // answer and drills down through the (previously dormant) diagnostic
        // tree, nested inside the answered card, before resuming the lesson.
        // "check" steps (a prerequisite node, not the lesson's own target
        // concept) are forced onto the atomic path — the mechanistic path's
        // dispatch would otherwise try to load/generate a dependency chain
        // for that prerequisite's own key, which isn't cached and would
        // trigger a full chain-generation call for what's meant to be a
        // lightweight check.
        async function runDiagnosticDrillDown(accessToken, card, step, wrongAnswer, encodingResult) {
            const drilldownBlock = document.createElement('div');
            drilldownBlock.className = 'drilldown-block';

            const label = document.createElement('div');
            label.className = 'drilldown-label';
            label.textContent = 'Let’s figure out why';
            drilldownBlock.appendChild(label);

            card.appendChild(drilldownBlock);
            drilldownBlock.scrollIntoView({ behavior: 'smooth', block: 'end' });

            const isCheckStep = step.type === 'check';
            const conceptKey = isCheckStep ? step.nodeId : encodingResult.state.conceptKey;
            const conceptLabel = step.label;
            const subject = encodingResult.state.subject;
            const question = step.type === 'explain' ? (step.checkQuestion || step.text) : step.text;

            function finishDrilldown() {
                if (!isCheckStep) {
                    // Same conceptKey the lesson-completion grade would use —
                    // the diagnostic tree's own terminal branch already
                    // graded it, so tell submitEncodingAnswer to skip its
                    // own grade for this concept at the end.
                    encodingResult.state.targetGradedViaDrillDown = true;
                }
                renderNextEncodingStep(accessToken, encodingResult);
            }

            function handleDiagnosticResult(result) {
                if (result.done) {
                    const correctionCard = document.createElement('div');
                    correctionCard.className = 'correction-card';
                    correctionCard.innerHTML = `<div class="correction-label">${escapeHtml(friendlyDiagnosisLabel(result.diagnosis))}</div>${escapeHtml(result.correction || '')}`;
                    drilldownBlock.appendChild(correctionCard);
                    correctionCard.scrollIntoView({ behavior: 'smooth', block: 'end' });
                    finishDrilldown();
                    return;
                }
                askNextDiagnostic(result.nextQuestion, result.nextOptions, result.state);
            }

            function askNextDiagnostic(questionText, options, diagState) {
                const qCard = renderQuestionCard(questionText, options, async (submission) => {
                    let resp;
                    try {
                        resp = await fetch(`${COMPILE_BACKEND_URL}/diagnostics/submit-answer`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
                            body: JSON.stringify({ state: diagState, answer: submission.answer, dontKnow: submission.dontKnow })
                        });
                    } catch (err) {
                        lockAnsweredCard(qCard, submission.answer, true, 'Could not reach the server. Please try again.', 'Answered');
                        finishDrilldown();
                        return;
                    }
                    if (!resp.ok) {
                        const body = await resp.json().catch(() => ({}));
                        lockAnsweredCard(qCard, submission.answer, true, body.error || 'Something went wrong.', 'Answered');
                        finishDrilldown();
                        return;
                    }
                    const result = await resp.json();
                    lockAnsweredCard(qCard, submission.answer, true, null, 'Answered');
                    handleDiagnosticResult(result);
                }, drilldownBlock);
            }

            let startResp;
            try {
                startResp = await fetch(`${COMPILE_BACKEND_URL}/diagnostics/start-from-answer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
                    body: JSON.stringify({ conceptKey, conceptLabel, subject, topic: '', question, forceAtomic: isCheckStep })
                });
            } catch (err) {
                drilldownBlock.innerHTML = '<div class="correction-card">Could not reach the server. Please try again.</div>';
                finishDrilldown();
                return;
            }
            if (!startResp.ok) {
                const body = await startResp.json().catch(() => ({}));
                drilldownBlock.innerHTML = `<div class="correction-card">${escapeHtml(body.error || 'Could not start diagnosis.')}</div>`;
                finishDrilldown();
                return;
            }
            const startResult = await startResp.json();
            handleDiagnosticResult(startResult);
        }

        function renderEncodingStep(accessToken, step, state) {
            if (step.type === 'explain') {
                renderEncodingAnswerCard(accessToken, step, state, step.text);
            } else {
                renderEncodingAnswerCard(accessToken, step, state, null);
            }
        }

        function renderNextEncodingStep(accessToken, result) {
            if (result.done) {
                const summary = document.createElement('div');
                summary.className = 'correction-card';
                summary.innerHTML = '<div class="correction-label">Lesson complete</div>You\'ve built the whole chain yourself — nice work.';
                questionFlowEl.appendChild(summary);
                summary.scrollIntoView({ behavior: 'smooth', block: 'end' });

                if (!page.encodingDone) {
                    page.encodingDone = true;
                    putFolder(folder);
                }
                return;
            }
            renderEncodingStep(accessToken, result.step, result.state);
        }

        async function runEncodingLesson(accessToken, subject, topic, concept, qualification, examBoard) {
            questionFlowEl.innerHTML = '<div class="correction-card">Preparing your first lesson…</div>';

            let resp;
            try {
                resp = await fetch(`${COMPILE_BACKEND_URL}/encoding-lesson/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
                    body: JSON.stringify({ subject, topic, concept, qualification: qualification || '', examBoard: examBoard || '' })
                });
            } catch (err) {
                questionFlowEl.innerHTML = '<div class="correction-card">Could not reach the server. Please try again.</div>';
                return;
            }

            if (!resp.ok) {
                const body = await resp.json().catch(() => ({}));
                questionFlowEl.innerHTML = `<div class="correction-card">${body.error || 'Could not start the lesson.'}</div>`;
                return;
            }

            const startResult = await resp.json();
            questionFlowEl.innerHTML = '';

            const hookCard = document.createElement('div');
            hookCard.className = 'correction-card';
            hookCard.innerHTML = `<div class="correction-label">💡 Did you know?</div>${escapeHtml(startResult.hookFact || '')}`;
            questionFlowEl.appendChild(hookCard);
            hookCard.scrollIntoView({ behavior: 'smooth', block: 'end' });

            renderEncodingStep(accessToken, startResult.step, startResult.state);
        }

        document.getElementById('generateQuestionsBtn').addEventListener('click', async () => {
            const override = reviewOverride;
            reviewOverride = null;
            const subject = override ? override.subject : (folder.subject || '');
            const topic = override ? override.topic : ((loc.subfolder && loc.subfolder.name) || '');
            const lesson = override ? override.lesson : (page.title || 'Untitled page');

            const generateBtn = document.getElementById('generateQuestionsBtn');
            generateBtn.disabled = true;

            try {
                const { data: { session: diagSession } } = await supabaseClient.auth.getSession();
                if (!diagSession) throw new Error('Not logged in.');
                if (encodingDone) {
                    await runChainLesson(diagSession.access_token, subject, topic, lesson);
                } else {
                    await runEncodingLesson(diagSession.access_token, subject, topic, lesson, folder.qualification, folder.examBoard);
                }
            } catch (err) {
                console.error('LastMind: lesson failed.', err);
                questionFlowEl.innerHTML = '<div class="correction-card">Could not start the lesson. Please try again.</div>';
            } finally {
                generateBtn.disabled = false;
            }
        });

        refreshFolderList();
    }

    /**
     * Wires the mic button next to #noteBox to the browser's built-in Web
     * Speech API (SpeechRecognition). No external dictation service is used —
     * this only works in browsers that ship their own recognizer (Chrome/Edge
     * today; Safari/Firefox support is inconsistent), and only over HTTPS or
     * localhost, since getting microphone access requires a secure context.
     */
    function setupDictation(textarea) {
        const micBtn = document.getElementById('micBtn');
        const statusEl = document.getElementById('dictationStatus');

        const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognitionCtor) {
            micBtn.disabled = true;
            micBtn.title = 'Dictation is not supported in this browser';
            statusEl.textContent = 'Dictation is not supported in this browser.';
            return;
        }

        let isListening = false;

        function setStatus(text) {
            statusEl.textContent = text || '';
        }

        function setListeningUI(listening) {
            isListening = listening;
            micBtn.classList.toggle('listening', listening);
            micBtn.textContent = listening ? '■' : '🎤';
            micBtn.title = listening ? 'Stop dictation' : 'Start dictation';
        }

        function insertTranscript(transcript) {
            const trimmed = transcript.trim();
            if (!trimmed) return;

            textarea.focus();

            const sel = window.getSelection();
            let range;
            if (sel.rangeCount && textarea.contains(sel.getRangeAt(0).commonAncestorContainer)) {
                range = sel.getRangeAt(0);
            } else {
                range = document.createRange();
                range.selectNodeContents(textarea);
                range.collapse(false);
            }

            // Match the textarea's old "add a leading space unless the text
            // already ends in whitespace" behaviour, checked against the
            // text node immediately before the cursor.
            let needsLeadingSpace = true;
            const prevNode = range.startContainer.nodeType === Node.TEXT_NODE
                ? range.startContainer
                : range.startContainer.childNodes[range.startOffset - 1];
            if (prevNode && prevNode.nodeType === Node.TEXT_NODE) {
                needsLeadingSpace = prevNode.textContent.length > 0 && !/\s$/.test(prevNode.textContent);
            } else if (!prevNode) {
                needsLeadingSpace = false; // nothing before the cursor at all
            }

            const textNode = document.createTextNode((needsLeadingSpace ? ' ' : '') + trimmed + ' ');
            range.deleteContents();
            range.insertNode(textNode);

            // Move the cursor to just after the inserted text.
            const newRange = document.createRange();
            newRange.setStartAfter(textNode);
            newRange.collapse(true);
            sel.removeAllRanges();
            sel.addRange(newRange);

            textarea.dispatchEvent(new Event('input')); // reuses the existing autosave listener
            textarea.scrollTop = textarea.scrollHeight;
        }

        function startRecognition() {
            stopSpeaking();
            const recognition = new SpeechRecognitionCtor();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = navigator.language || 'en-US';

            recognition.onstart = () => {
                setListeningUI(true);
                setStatus('Listening…');
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }
                if (finalTranscript) insertTranscript(finalTranscript);
            };

            recognition.onerror = (event) => {
                let message;
                switch (event.error) {
                    case 'not-allowed':
                    case 'service-not-allowed':
                        message = 'Microphone access was blocked — check your browser/site permissions.';
                        break;
                    case 'no-speech':
                        message = 'No speech detected.';
                        break;
                    case 'audio-capture':
                        message = 'No microphone was found.';
                        break;
                    case 'network':
                        message = 'A network error interrupted dictation.';
                        break;
                    default:
                        message = `Dictation error: ${event.error}`;
                }
                setStatus(message);
            };

            recognition.onend = () => {
                setListeningUI(false);
                if (activeRecognition === recognition) activeRecognition = null;
                if (statusEl.textContent === 'Listening…') setStatus('');
            };

            activeRecognition = recognition;
            recognition.start();
        }

        micBtn.addEventListener('click', () => {
            if (isListening) {
                stopActiveDictation(); // triggers onend, which resets the UI
            } else {
                startRecognition();
            }
        });
    }

    // Wires one searchable level-select widget (New Folder or Rename
    // Folder modal) given its id prefix. onChange fires with the newly
    // selected level string so the caller can swap the visible metafields
    // (exam board vs institution/module code) accordingly.
    function setupLevelDropdown(prefix, onChange) {
        const button = document.getElementById(`${prefix}LevelButton`);
        const buttonText = document.getElementById(`${prefix}LevelButtonText`);
        const dropdown = document.getElementById(`${prefix}LevelDropdown`);
        const searchInput = document.getElementById(`${prefix}LevelSearchInput`);
        const optionsEl = document.getElementById(`${prefix}LevelOptions`);

        function renderOptions(filter) {
            const q = (filter || '').trim().toLowerCase();
            optionsEl.innerHTML = '';
            const matches = LEVEL_OPTIONS.filter((lvl) => lvl.toLowerCase().includes(q));
            matches.forEach((lvl) => {
                const item = document.createElement('div');
                item.className = 'level-option';
                item.textContent = lvl;
                item.addEventListener('click', () => selectLevel(lvl));
                optionsEl.appendChild(item);
            });
            if (!matches.length) {
                const empty = document.createElement('div');
                empty.className = 'level-option-empty';
                empty.textContent = 'No matches';
                optionsEl.appendChild(empty);
            }
            return matches;
        }

        function selectLevel(lvl) {
            buttonText.textContent = lvl;
            buttonText.classList.remove('placeholder');
            button.dataset.value = lvl;
            closeDropdown();
            onChange(lvl);
        }

        function openDropdown() {
            searchInput.value = '';
            renderOptions('');
            dropdown.classList.add('open');
            setTimeout(() => searchInput.focus(), 0);
        }

        function closeDropdown() {
            dropdown.classList.remove('open');
        }

        button.addEventListener('click', () => {
            if (dropdown.classList.contains('open')) closeDropdown();
            else openDropdown();
        });

        searchInput.addEventListener('input', () => renderOptions(searchInput.value));
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDropdown();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                const matches = renderOptions(searchInput.value);
                if (matches.length === 1) selectLevel(matches[0]);
            }
        });

        document.addEventListener('click', (e) => {
            if (dropdown.classList.contains('open') && !dropdown.contains(e.target) && e.target !== button && !button.contains(e.target)) {
                closeDropdown();
            }
        });

        return {
            setValue(level) {
                if (level) {
                    buttonText.textContent = level;
                    buttonText.classList.remove('placeholder');
                } else {
                    buttonText.textContent = 'Select level…';
                    buttonText.classList.add('placeholder');
                }
                button.dataset.value = level || '';
            },
            getValue() {
                return button.dataset.value || '';
            }
        };
    }

    function conceptKeyToLabel(conceptKey) {
        // concept_id values are a mix of raw labels (from atomic-path
        // testing) and normalized "subject:topic:concept" keys (from
        // chain-level tracking) — this is a known, honest imperfection in
        // the current data model, not something worth a bigger fix right
        // now. Just make normalized keys minimally more readable.
        return conceptKey.replace(/:/g, ' — ').replace(/_/g, ' ');
    }

    // Only chain-tracked concepts use the "subject:topic:concept" key
    // format (a known, honest gap in the current data model — atomic-path
    // concepts are just tracked as their raw label, with no subject/topic
    // to recover here). Clicking one of those simply does nothing yet,
    // rather than failing confusingly.
    function startReviewFromSchedule(conceptId) {
        const parts = conceptId.split(':');
        if (parts.length !== 3) return;

        if (!generateBtn) {
            alert('Open or create a page first, then click this review again.');
            return;

        setSidebarTab('folders');
        reviewOverride = {
            subject: parts[0].replace(/_/g, ' '),
            topic: parts[1].replace(/_/g, ' '),
            lesson: parts[2].replace(/_/g, ' ')
        };
        generateBtn.click();
    }

    // Renders a real month grid for whichever month calendarViewDate is
    // currently on — each day showing the reviews actually due that
    // calendar day, clickable to jump straight into starting them.
    function renderCalendar() {
        const year = calendarViewDate.getFullYear();
        const month = calendarViewDate.getMonth();

        document.getElementById('calendarMonthLabel').textContent =
            calendarViewDate.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

        // Group due items by calendar day (YYYY-MM-DD, local time).
        const byDay = {};
        cachedScheduleData.forEach((item) => {
            const d = new Date(item.due);
            const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
            (byDay[key] = byDay[key] || []).push(item);
        });

        const firstOfMonth = new Date(year, month, 1);
        // Monday-first grid: JS getDay() is 0=Sunday, convert to 0=Monday.
        const leadingBlanks = (firstOfMonth.getDay() + 6) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const today = new Date();
        const isSameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

        const gridEl = document.getElementById('calendarGrid');
        gridEl.innerHTML = '';

        for (let i = 0; i < leadingBlanks; i++) {
            const blank = document.createElement('div');
            blank.className = 'calendar-day empty';
            gridEl.appendChild(blank);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const cellDate = new Date(year, month, day);
            const cell = document.createElement('div');
            cell.className = 'calendar-day' + (isSameDay(cellDate, today) ? ' today' : '');

            const num = document.createElement('div');
            num.className = 'calendar-day-number';
            num.textContent = day;
            cell.appendChild(num);

            const dayItems = byDay[`${year}-${month}-${day}`] || [];
            dayItems.forEach((item) => {
                const chip = document.createElement('div');
                chip.className = 'calendar-day-review';
                chip.textContent = conceptKeyToLabel(item.concept_id);
                chip.title = conceptKeyToLabel(item.concept_id);
                chip.addEventListener('click', () => startReviewFromSchedule(item.concept_id));
                cell.appendChild(chip);
            });

            gridEl.appendChild(cell);
        }
    }

    (async function gate() {
        // ── TEMPORARY: lets you view /learn before hosting/backend exist. ──
        // Visiting the page with ?preview=1 skips the JWT check entirely.
        // Delete this whole block once your backend is live and you don't
        // want the bypass reachable anymore.
        if (new URLSearchParams(window.location.search).has('preview')) {
            console.warn('LastMind: running in PREVIEW MODE — the subscription gate is bypassed. Remove the ?preview=1 block in learn.html before going live.');
            await enterApp(true); // preview mode shows the full paid experience
            return;
        }

        const publicKey = await importPublicKey(PUBLIC_KEY_PEM);

        let token = await getStoredToken().catch(() => null);
        let payload = token ? await verifyJWT(token, publicKey) : null;

        if (!payload) {
            token = await refreshTokenFromBackend();
            payload = token ? await verifyJWT(token, publicKey) : null;
        }

        if (payload) {
            await enterApp(true);
            return;
        }

        // No usable device-local JWT — try the login-anywhere path instead.
        // This is NOT "a Supabase session exists, so let them in" (that was
        // the security hole we removed) — the backend independently verifies
        // this session's access token against Supabase itself before it will
        // ever look up or return anything.
        let supabaseSession = null;
        try {
            const { data } = await supabaseClient.auth.getSession();
            supabaseSession = data.session;

            if (supabaseSession) {
                const resp = await fetch(`${BACKEND_URL}/api/token-for-user`, {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${supabaseSession.access_token}` }
                });
                if (resp.ok) {
                    const { token: linkedToken, subscriptionId: linkedSubId } = await resp.json();
                    payload = await verifyJWT(linkedToken, publicKey);
                    if (payload) {
                        await saveToken(linkedToken);
                        if (linkedSubId) await putAuthRecord('subscriptionId', linkedSubId);
                    }
                }
            }
        } catch (err) {
            console.error('LastMind: login-anywhere check failed.', err);
        }

        if (payload) {
            await enterApp(true);
            return;
        }

        // No active paid subscription found either way — but if they're at
        // least logged in, let them in as free tier (framework + folders +
        // dictation/TTS, no Compile) rather than bouncing them out entirely.
        // Paying is optional here, not a requirement to use the app at all.
        if (supabaseSession) {
            await enterApp(false);
            return;
        }

        // Not logged in at all — nothing to offer, send them to create an
