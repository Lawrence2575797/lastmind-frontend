        saveBtn.disabled = true;
        statusEl.classList.remove('error');
        statusEl.textContent = 'Saving…';

        const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

        saveBtn.disabled = false;
        if (error) {
            statusEl.textContent = error.message;
            statusEl.classList.add('error');
        } else {
            statusEl.textContent = 'Password updated.';
            document.getElementById('newAccountPasswordInput').value = '';
        }
    });

    // Uses the login-based portal endpoint (verified session, not a
    // locally-stored subscription ID) — works reliably regardless of
    // whether this device was the one that originally checked out.
    document.getElementById('manageSubscriptionBtn').addEventListener('click', async () => {
        const btn = document.getElementById('manageSubscriptionBtn');
        btn.disabled = true;
        btn.textContent = 'Loading…';

        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) throw new Error('not logged in');

            const resp = await fetch(`${BACKEND_URL}/api/portal-for-user`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${session.access_token}` }
            });
            if (!resp.ok) throw new Error(`Portal endpoint returned ${resp.status}`);
            const { url } = await resp.json();
            window.location.href = url;
        } catch (err) {
            console.error('LastMind: could not open the subscription management portal.', err);
            alert('Could not open subscription management right now. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Manage Subscription';
        }
    });

    // Sets the app-unlock UI in one place, and — importantly — configures
    // the topbar button correctly for whichever state the person is in:
    // free users see "Upgrade" (-> checkout), already-paid users see "Buy
    // More Tokens" instead, since "upgrade" doesn't make sense once you're
    // already on Premium. Token purchases aren't built yet — this is a
    // clearly-labelled placeholder for now, same pattern as Compile
    // originally was, not a silent dead end.
    function formatTimeUntilDue(dueIso) {
        const due = new Date(dueIso).getTime();
        const now = Date.now();
        const diffMs = due - now;

        if (diffMs <= 0) return { label: 'Due now', dueNow: true };

        const hours = diffMs / (1000 * 60 * 60);
        if (hours < 1) return { label: `in ${Math.max(1, Math.round(hours * 60))} min`, dueNow: false };
        if (hours < 24) return { label: `in ${Math.round(hours)}h`, dueNow: false };

        const days = hours / 24;
        if (days < 7) return { label: `in ${Math.round(days)}d`, dueNow: false };

        const dateStr = new Date(dueIso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        return { label: dateStr, dueNow: false };
    }

    function conceptKeyToLabel(conceptKey) {
        // concept_id values are a mix of raw labels (from atomic-path
        // testing) and normalized "subject:topic:concept" keys (from
        // chain-level tracking) — this is a known, honest imperfection in
        // the current data model, not something worth a bigger fix right
        // now. Just make normalized keys minimally more readable.
        return conceptKey.replace(/:/g, ' — ').replace(/_/g, ' ');
    }

    async function refreshReviewSchedule() {
        const listEl = document.getElementById('reviewScheduleList');
        if (!isPaidUser) {
            listEl.innerHTML = '<div class="review-schedule-empty">Upgrade to unlock diagnostics and spaced review.</div>';
            return;
        }

        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return;

            const resp = await fetch(`${COMPILE_BACKEND_URL}/schedule`, {
                headers: { Authorization: `Bearer ${session.access_token}` }
            });
            if (!resp.ok) throw new Error(`Server returned ${resp.status}`);

            const { schedule } = await resp.json();
            if (!schedule || !schedule.length) {
                listEl.innerHTML = '<div class="review-schedule-empty">No reviews scheduled yet — use Start Lesson on a lesson to begin.</div>';
                return;
            }

            listEl.innerHTML = '';
            schedule.forEach((item) => {
                const { label, dueNow } = formatTimeUntilDue(item.due);
                const row = document.createElement('div');
                row.className = 'review-schedule-item' + (dueNow ? ' due-now' : '');
                row.style.cursor = 'pointer';
                row.title = 'Click to start this review';
                row.innerHTML = `
                    <span class="review-schedule-item-label">${conceptKeyToLabel(item.concept_id)}</span>
                    <span class="review-schedule-item-time">${label}</span>
                `;
                row.addEventListener('click', () => startReviewFromSchedule(item.concept_id));
                listEl.appendChild(row);
            });
        } catch (err) {
            console.error('LastMind: failed to load review schedule.', err);
            listEl.innerHTML = '<div class="review-schedule-empty">Could not load review schedule.</div>';
        }
    }

    // Only chain-tracked concepts use the "subject:topic:concept" key
    // format (a known, honest gap in the current data model — atomic-path
    // concepts are just tracked as their raw label, with no subject/topic
    // to recover here). Clicking one of those simply does nothing yet,
    // rather than failing confusingly.
    function startReviewFromSchedule(conceptId) {
        const parts = conceptId.split(':');
        if (parts.length !== 3) return;

        const subjectInput = document.getElementById('diagnoseSubjectInput');
        const topicInput = document.getElementById('diagnoseTopicInput');
        const lessonInput = document.getElementById('diagnoseLessonInput');
        const generateBtn = document.getElementById('generateQuestionsBtn');

        if (!subjectInput || !topicInput || !lessonInput || !generateBtn) {
            alert('Open or create a page first, then click this review again.');
            return;
        }

        subjectInput.value = parts[0].replace(/_/g, ' ');
        topicInput.value = parts[1].replace(/_/g, ' ');
        lessonInput.value = parts[2].replace(/_/g, ' ');
        generateBtn.click();
    }

    async function enterApp(paid) {
        isPaidUser = paid;

        const upgradeBtn = document.getElementById('upgradeBtn');
        if (paid) {
            upgradeBtn.textContent = 'Buy More Tokens';
            upgradeBtn.onclick = () => {
                alert('Token top-ups are coming soon!');
            };
        } else {
            upgradeBtn.textContent = 'Upgrade';
            upgradeBtn.onclick = () => {
                window.location.href = '/subscribe?action=upgrade';
            };
        }

        document.getElementById('gate-message').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        await refreshFolderList();
        await refreshReviewSchedule();
    }

    (async function gate() {
        // ── TEMPORARY: lets you view /learn before hosting/backend exist. ──
        // Visiting the page with ?preview=1 skips the JWT check entirely.
        // Delete this whole block once your backend is live and you don't
        // want the bypass reachable anymore.
        if (new URLSearchParams(window.location.search).has('preview')) {
            console.warn('LastMind: running in PREVIEW MODE — the subscription gate is bypassed. Remove the ?preview=1 block in learn.html before going live.');
            await enterApp(true); // preview mode shows the full paid experience
            return;
        }

        const publicKey = await importPublicKey(PUBLIC_KEY_PEM);

        let token = await getStoredToken().catch(() => null);
        let payload = token ? await verifyJWT(token, publicKey) : null;

        if (!payload) {
            token = await refreshTokenFromBackend();
            payload = token ? await verifyJWT(token, publicKey) : null;
        }

        if (payload) {
            await enterApp(true);
            return;
        }

        // No usable device-local JWT — try the login-anywhere path instead.
        // This is NOT "a Supabase session exists, so let them in" (that was
        // the security hole we removed) — the backend independently verifies
        // this session's access token against Supabase itself before it will
        // ever look up or return anything.
        let supabaseSession = null;
        try {
            const { data } = await supabaseClient.auth.getSession();
            supabaseSession = data.session;

            if (supabaseSession) {
                const resp = await fetch(`${BACKEND_URL}/api/token-for-user`, {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${supabaseSession.access_token}` }
                });
                if (resp.ok) {
                    const { token: linkedToken, subscriptionId: linkedSubId } = await resp.json();
                    payload = await verifyJWT(linkedToken, publicKey);
                    if (payload) {
                        await saveToken(linkedToken);
                        if (linkedSubId) await putAuthRecord('subscriptionId', linkedSubId);
                    }
                }
            }
        } catch (err) {
            console.error('LastMind: login-anywhere check failed.', err);
        }

        if (payload) {
            await enterApp(true);
            return;
        }

        // No active paid subscription found either way — but if they're at
        // least logged in, let them in as free tier (framework + folders +
        // dictation/TTS, no Compile) rather than bouncing them out entirely.
        // Paying is optional here, not a requirement to use the app at all.
        if (supabaseSession) {
            await enterApp(false);
            return;
        }

        // Not logged in at all — nothing to offer, send them to create an
        // account (still free at this point; paying is optional there too).
        window.location.href = '/subscribe';
    })();
</script>
