<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LastMind – Learn</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1A1A1C">
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
</script>
<style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
        --bg: #1A1A1C;
        --panel: #201F21;
        --text: #E6D7B0;
        --accent: #E6D7B0;
    }

    button, input, textarea, select {
        font-family: inherit;
        color: var(--text);
        background: transparent;
    }

    html, body {
        height: 100%;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Georgia', serif;
        overflow: hidden;
    }

    #gate-message {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Arial', sans-serif;
        color: var(--text);
        opacity: 0.6;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
    }

    #app {
        display: none;
        height: 100vh;
    }

    .layout {
        display: flex;
        height: 100vh;
    }

    /* ─── SIDEBAR ─── */
    .sidebar {
        width: 280px;
        flex-shrink: 0;
        background: var(--panel);
        border-right: 1px solid rgba(230, 215, 176, 0.12);
        display: flex;
        flex-direction: column;
        transition: width 0.25s ease, opacity 0.2s ease;
        overflow: hidden;
    }

    .sidebar.collapsed {
        width: 0;
        opacity: 0;
    }

    .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 18px;
        border-bottom: 1px solid rgba(230, 215, 176, 0.1);
    }

    .sidebar-logo {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--accent);
        text-transform: uppercase;
        white-space: nowrap;
    }

    .sidebar-tabs {
        display: flex;
        border-bottom: 1px solid rgba(230, 215, 176, 0.1);
        flex-shrink: 0;
    }

    .sidebar-tab-btn {
        flex: 1;
        background: none;
        border: none;
        color: var(--text);
        opacity: 0.5;
        font-family: 'Arial', sans-serif;
        font-size: 0.76rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 13px 8px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
    }

    .sidebar-tab-btn:hover {
        opacity: 0.8;
    }

    .sidebar-tab-btn.active {
        opacity: 1;
        color: var(--accent);
        border-bottom-color: var(--accent);
    }

    .folder-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px 10px 20px;
    }

    .drill-header {
        padding: 4px 4px 12px;
    }

    .drill-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .drill-back-btn {
        flex-shrink: 0;
        background: none;
        border: none;
        color: var(--accent);
        font-size: 1rem;
        line-height: 1;
        padding: 2px 2px 2px 0;
        cursor: pointer;
        opacity: 0.75;
    }

    .drill-back-btn:hover {
        opacity: 1;
    }

    .drill-title {
        flex: 1;
        min-width: 0;
        font-size: 0.85rem;
        font-weight: 700;
        opacity: 0.9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .drill-action-btn {
        flex-shrink: 0;
        font-family: 'Arial', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.02em;
        color: var(--bg);
        background: var(--accent);
        border: none;
        padding: 7px 10px;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
    }

    .drill-action-btn:hover {
        opacity: 0.9;
    }

    .drill-section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 18px 4px 6px;
        font-family: 'Arial', sans-serif;
        font-size: 0.66rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.45;
    }

    .sidebar-footer {
        padding: 12px 10px;
        border-top: 1px solid rgba(230, 215, 176, 0.1);
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    /* ─── REVIEW CALENDAR ─── */
    .sidebar-calendar {
        display: none;
        flex: 1;
        overflow-y: auto;
        padding: 14px 12px 20px;
    }

    .calendar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        gap: 6px;
    }

    .calendar-header h3 {
        margin-bottom: 0;
        font-size: 0.78rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .calendar-header .btn {
        padding: 5px 9px;
        font-size: 0.75rem;
        flex-shrink: 0;
    }

    .calendar-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
        margin-bottom: 6px;
        font-family: 'Arial', sans-serif;
        font-size: 0.58rem;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        opacity: 0.5;
        text-align: center;
    }

    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
    }

    .calendar-day {
        min-height: 38px;
        border: 1px solid rgba(230, 215, 176, 0.12);
        border-radius: 4px;
        padding: 3px;
        font-family: 'Arial', sans-serif;
        font-size: 0.58rem;
    }

    .calendar-day.empty {
        border-color: transparent;
    }

    .calendar-day.today {
        border-color: var(--accent);
    }

    .calendar-day-number {
        opacity: 0.5;
        margin-bottom: 3px;
    }

    .calendar-day-review {
        background: rgba(230, 215, 176, 0.1);
        border-radius: 3px;
        padding: 2px 4px;
        margin-bottom: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
        opacity: 0.85;
    }

    .calendar-day-review:hover {
        opacity: 1;
        background: rgba(230, 215, 176, 0.2);
    }

    .manage-subscription-btn {
        width: 100%;
        background: none;
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 4px;
        padding: 9px;
        color: var(--text);
        opacity: 0.65;
        font-family: 'Arial', sans-serif;
        font-size: 0.75rem;
        cursor: pointer;
    }

    .manage-subscription-btn:hover {
        opacity: 1;
        background: rgba(230, 215, 176, 0.06);
    }

    .folder-item {
        border-radius: 4px;
        margin-bottom: 4px;
    }

    .folder-item-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 11px 12px;
        cursor: pointer;
        font-size: 0.85rem;
        line-height: 1.4;
        opacity: 0.85;
        border-radius: 4px;
    }

    .folder-item-label {
        flex: 1;
        min-width: 0;
    }

    .folder-item-header:hover {
        background: rgba(230, 215, 176, 0.06);
    }

    .folder-meta-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
    }

    .folder-meta {
        font-family: 'Arial', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.04em;
        opacity: 0.55;
    }

    .new-subfolder-link {
        font-family: 'Arial', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.02em;
        color: var(--accent);
        opacity: 0.65;
        cursor: pointer;
        text-decoration: underline;
    }

    .new-subfolder-link:hover {
        opacity: 1;
    }

    .item-menu-wrap {
        position: relative;
        flex-shrink: 0;
    }

    .item-menu-btn {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        border: none;
        background: none;
        color: var(--text);
        opacity: 0.5;
        font-size: 0.9rem;
        line-height: 1;
        cursor: pointer;
    }

    .item-menu-btn:hover {
        opacity: 1;
        background: rgba(230, 215, 176, 0.1);
    }

    .item-dropdown-menu {
        display: none;
        position: fixed;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 4px;
        min-width: 130px;
        z-index: 1000;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .item-dropdown-menu.open {
        display: block;
    }

    .item-dropdown-menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 9px 12px;
        background: none;
        border: none;
        color: var(--text);
        font-family: 'Arial', sans-serif;
        font-size: 0.76rem;
        cursor: pointer;
    }

    .item-dropdown-menu button:hover {
        background: rgba(230, 215, 176, 0.08);
    }

    .item-dropdown-menu button.danger {
        color: #e6b0a8;
    }

    .subfolder-item { margin-bottom: 2px; }

    .subfolder-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 9px 8px;
        cursor: pointer;
        font-size: 0.8rem;
        opacity: 0.8;
        border-radius: 4px;
    }

    .subfolder-header:hover {
        background: rgba(230, 215, 176, 0.06);
        opacity: 1;
        color: var(--accent);
    }

    [draggable="true"] {
        cursor: grab;
    }

    .drag-over {
        outline: 2px dashed var(--accent);
        outline-offset: -2px;
        background: rgba(230, 215, 176, 0.1) !important;
    }

    .page-item {
        padding: 8px 10px;
        font-size: 0.8rem;
        font-family: 'Arial', sans-serif;
        opacity: 0.7;
        cursor: pointer;
        border-radius: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .page-item:hover, .page-item.active {
        background: rgba(230, 215, 176, 0.08);
        opacity: 1;
        color: var(--accent);
    }

    .empty-hint {
        padding: 16px 12px;
        font-family: 'Arial', sans-serif;
        font-size: 0.78rem;
        opacity: 0.4;
        line-height: 1.6;
    }

    /* ─── MAIN ─── */
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 26px;
        border-bottom: 1px solid rgba(230, 215, 176, 0.1);
    }

    .sidebar-toggle {
        background: none;
        border: 1px solid rgba(230, 215, 176, 0.3);
        color: var(--accent);
        width: 34px;
        height: 34px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.95rem;
        line-height: 1;
        flex-shrink: 0;
    }

    .topbar-title {
        font-family: 'Arial', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.03em;
        opacity: 0.7;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
    }

    .cortex-btn-topbar {
        flex-shrink: 0;
        font-family: 'Arial', sans-serif;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        background: rgba(230, 215, 176, 0.08);
        border: 1px solid rgba(230, 215, 176, 0.35);
        color: var(--accent);
        padding: 12px 22px;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.2s, border-color 0.2s;
    }

    .cortex-btn-topbar:hover {
        background: rgba(230, 215, 176, 0.14);
        border-color: rgba(230, 215, 176, 0.55);
    }

    .cortex-mic-btn {
        flex-shrink: 0;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid rgba(230, 215, 176, 0.35);
        background: rgba(230, 215, 176, 0.08);
        color: var(--accent);
        font-size: 1.1rem;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s, border-color 0.2s;
    }

    .cortex-mic-btn:hover {
        background: rgba(230, 215, 176, 0.14);
        border-color: rgba(230, 215, 176, 0.55);
    }

    .content {
        flex: 1;
        overflow-y: auto;
        padding: 40px;
        display: flex;
        justify-content: center;
    }

    .content-inner {
        width: 100%;
        max-width: 780px;
    }

    .dashboard-view {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 22px;
        margin-top: 18vh;
    }

    .dashboard-logo {
        font-size: clamp(2.4rem, 6vw, 3.8rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text);
    }

    .dashboard-logo span {
        color: var(--accent);
    }

    .dashboard-quote {
        font-size: 1.05rem;
        font-style: italic;
        color: var(--text);
        opacity: 0.55;
        max-width: 420px;
        line-height: 1.7;
    }

    .bottom-action-row {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 16px;
    }

    /* ─── NOTES / LESSON SPLIT ─── */
    .page-split-layout {
        display: flex;
        gap: 28px;
        align-items: flex-start;
    }

    .notes-panel, .lesson-panel {
        flex: 1;
        min-width: 0;
    }

    .notes-panel-heading, .lesson-panel-heading {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 12px;
    }

    .lesson-intro-message {
        font-size: 0.92rem;
        line-height: 1.7;
        opacity: 0.8;
        margin-bottom: 6px;
    }

    .notes-mode-toggle {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 18px;
        font-family: 'Arial', sans-serif;
        font-size: 0.85rem;
    }

    .notes-mode-option {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }

    .notes-mode-option input[type="radio"] {
        accent-color: var(--accent);
        cursor: pointer;
    }

    .cortex-placeholder {
        opacity: 0.5;
        font-size: 0.9rem;
        padding: 20px 0;
    }

    .generate-questions-btn {
        flex-shrink: 0;
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: 4px;
        padding: 11px 22px;
        font-family: 'Arial', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.03em;
        cursor: pointer;
        white-space: nowrap;
    }

    .generate-questions-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .generate-questions-btn:hover {
        opacity: 0.9;
    }

    /* ─── DIAGNOSTIC QUESTION FLOW ─── */
    .question-card {
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.15);
        border-radius: 8px;
        padding: 24px;
        margin-top: 20px;
        transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .question-card.fading-out {
        opacity: 0;
        transform: translateY(-6px);
    }

    .question-card-text {
        font-family: 'Georgia', serif;
        font-size: 1.05rem;
        line-height: 1.7;
        margin-bottom: 16px;
    }

    .question-answer-input {
        width: 100%;
        min-height: 100px;
        background: var(--accent);
        border: 1px solid rgba(26, 26, 28, 0.15);
        border-radius: 6px;
        color: var(--bg);
        font-family: 'Georgia', serif;
        font-size: 0.95rem;
        line-height: 1.6;
        padding: 14px 16px;
        resize: vertical;
        margin-bottom: 12px;
    }

    .question-answer-input:focus {
        outline: none;
    }

    /* ─── ENCODING LESSON: verified diagram (rare, only when Claude flags one as needed) ─── */
    .question-diagram {
        margin-bottom: 12px;
    }

    .question-diagram-img {
        max-width: 100%;
        border-radius: 6px;
        display: block;
    }

    .question-diagram-caption {
        font-size: 0.85rem;
        font-style: italic;
        opacity: 0.8;
        margin-top: 6px;
    }

    .question-diagram-attribution {
        font-size: 0.7rem;
        opacity: 0.55;
        margin-top: 2px;
    }

    /* ─── ENCODING LESSON: diagnostic drill-down on a wrong answer ─── */
    .drilldown-block {
        margin-top: 16px;
        margin-left: 20px;
        padding-left: 16px;
        border-left: 2px solid rgba(230, 215, 176, 0.3);
    }

    .drilldown-label {
        font-family: 'Arial', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent);
        opacity: 0.8;
        margin-bottom: 10px;
    }

    .drilldown-block .question-card,
    .drilldown-block .correction-card {
        margin-top: 12px;
    }

    .question-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .dont-know-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Arial', sans-serif;
        font-size: 0.8rem;
        opacity: 0.7;
        cursor: pointer;
    }

    .question-submit-btn {
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: 4px;
        padding: 9px 20px;
        font-family: 'Arial', sans-serif;
        font-size: 0.82rem;
        cursor: pointer;
    }

    .question-submit-btn:hover {
        opacity: 0.9;
    }

    .question-submit-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .correction-card {
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 8px;
        padding: 22px 24px;
        margin-top: 20px;
        font-family: 'Georgia', serif;
        font-size: 0.95rem;
        line-height: 1.7;
    }

    .correction-label {
        font-family: 'Arial', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent);
        opacity: 0.8;
        margin-bottom: 10px;
    }

    /* ─── PAGE EDITOR ─── */
    .page-title-input {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(230, 215, 176, 0.25);
        color: var(--text);
        font-family: 'Georgia', serif;
        font-size: 1.4rem;
        font-weight: 700;
        padding: 4px 2px 12px;
        margin-bottom: 18px;
    }

    .page-title-input:focus {
        outline: none;
        border-bottom-color: var(--accent);
    }

    .compile-btn {
        font-family: 'Arial', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        background: var(--bg);
        border: none;
        padding: 10px 22px;
        border-radius: 3px;
        cursor: pointer;
    }

    .compile-btn:hover {
        opacity: 0.9;
    }

    .compile-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .play-btn {
        margin-bottom: 8px;
        font-family: 'Arial', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--bg);
        background: var(--accent);
        border: none;
        padding: 10px 18px;
        border-radius: 3px;
        cursor: pointer;
    }

    .play-btn:hover {
        opacity: 0.9;
    }

    .play-btn.playing {
        background: var(--bg);
        color: var(--accent);
        border: 1px solid rgba(230, 215, 176, 0.3);
    }

    .compile-status {
        margin-top: 14px;
        font-family: 'Arial', sans-serif;
        font-size: 0.78rem;
        color: var(--text);
        opacity: 0.65;
        min-height: 1em;
    }

    .compile-status.error {
        color: #e6b0a8;
        opacity: 1;
    }

    .compiled-output {
        margin-top: 14px;
        padding: 20px 22px;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.18);
        border-radius: 6px;
        color: var(--text);
        font-family: 'Georgia', serif;
        font-size: 0.95rem;
        line-height: 1.8;
        white-space: pre-wrap;
    }

    /* ─── RICH EDITOR ─── */
    .rich-toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
    }

    .toolbar-btn {
        background: none;
        border: 1px solid rgba(230, 215, 176, 0.25);
        border-radius: 4px;
        color: var(--text);
        opacity: 0.75;
        font-family: 'Arial', sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.02em;
        padding: 7px 14px;
        cursor: pointer;
    }

    .toolbar-btn:hover {
        opacity: 1;
        border-color: var(--accent);
        color: var(--accent);
    }

    .note-editable {
        width: 100%;
        min-height: 60vh;
        background: var(--accent);
        border: 1px solid rgba(26, 26, 28, 0.15);
        border-radius: 6px;
        color: var(--bg);
        font-family: 'Georgia', serif;
        font-size: 1rem;
        line-height: 1.8;
        padding: 22px 24px 64px;

    /* ───────────────────────── JWT verification ───────────────────────── */

    function base64UrlToBytes(b64url) {
        const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
        const pad = b64.length % 4 === 0 ? '' : '='.repeat(4 - (b64.length % 4));
        const binary = atob(b64 + pad);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    async function importPublicKey(pem) {
        const b64 = pem.replace(/-----BEGIN PUBLIC KEY-----/, '')
                        .replace(/-----END PUBLIC KEY-----/, '')
                        .replace(/\s+/g, '');
        const bytes = base64UrlToBytes(b64.replace(/-/g, '+').replace(/_/g, '/')); // pem is standard base64, reuse decode path
        return crypto.subtle.importKey(
            'spki',
            bytes.buffer,
            { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
            false,
            ['verify']
        );
    }

    async function verifyJWT(token, publicKey) {
        try {
            const parts = token.split('.');
            if (parts.length !== 3) return null;
            const [headerB64, payloadB64, sigB64] = parts;

            const data = new TextEncoder().encode(`${headerB64}.${payloadB64}`);
            const signature = base64UrlToBytes(sigB64);

            const valid = await crypto.subtle.verify(
                'RSASSA-PKCS1-v1_5', publicKey, signature, data
            );
            if (!valid) return null;

            const payload = JSON.parse(new TextDecoder().decode(base64UrlToBytes(payloadB64)));

            if (payload.exp && Math.floor(Date.now() / 1000) >= payload.exp) return null;
            if (payload.status !== 'active') return null;

            return payload;
        } catch (err) {
            console.error('LastMind: JWT verification failed.', err);
            return null;
        }
    }

    /* ───────────────────────── Fuzzy matching ───────────────────────── */

    function normalize(str) {
        return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function levenshtein(a, b) {
        const m = a.length, n = b.length;
        const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
        for (let i = 0; i <= m; i++) dp[i][0] = i;
        for (let j = 0; j <= n; j++) dp[0][j] = j;
        for (let i = 1; i <= m; i++) {
            for (let j = 1; j <= n; j++) {
                dp[i][j] = a[i - 1] === b[j - 1]
                    ? dp[i - 1][j - 1]
                    : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
            }
        }
        return dp[m][n];
    }

    function similarity(a, b) {
        const na = normalize(a), nb = normalize(b);
        const maxLen = Math.max(na.length, nb.length, 1);
        if (na === nb) return 1;
        return 1 - levenshtein(na, nb) / maxLen;
    }

    const MATCH_THRESHOLD = 0.72;

    // Undergraduate/postgraduate levels ask for institution + module code
    // instead of an exam board — GCSE/A-Level/AS Level are everything else
    // (and the app's overwhelmingly common case, so they sit at the top of
    // the level dropdown).
    const LEVEL_OPTIONS = [
        'GCSE',
        'A-Level',
        'AS Level',
        'Undergraduate Year 1',
        'Undergraduate Year 2',
        'Undergraduate Year 3',
        'Undergraduate Year 4',
        'Masters',
        'PhD'
    ];
    const UNIVERSITY_LEVELS = new Set([
        'Undergraduate Year 1',
        'Undergraduate Year 2',
        'Undergraduate Year 3',
        'Undergraduate Year 4',
        'Masters',
        'PhD'
    ]);
    function isUniversityLevel(level) {
        return UNIVERSITY_LEVELS.has(level);
    }

    // extraFields identify the folder beyond subject+level — [examBoard]
    // for school levels, [institution, moduleCode] for university ones.
    // Compared positionally against whichever shape the existing folder
    // being checked actually has, so a school folder is never mistaken
    // for a similarly-named university one just because both fields
    // happen to be blank.
    function findSimilarFolder(subject, qualification, extraFields, folders) {
        let best = null;
        let bestScore = 0;
        for (const f of folders) {
            const fExtra = isUniversityLevel(f.qualification) ? [f.institution || '', f.moduleCode || ''] : [f.examBoard || ''];
            const parts = [similarity(subject, f.subject), similarity(qualification, f.qualification)];
            const len = Math.max(extraFields.length, fExtra.length);
            for (let i = 0; i < len; i++) {
                parts.push(similarity(extraFields[i] || '', fExtra[i] || ''));
            }
            const score = parts.reduce((a, b) => a + b, 0) / parts.length;
            if (score > bestScore) {
                bestScore = score;
                best = f;
            }
        }
        return bestScore >= MATCH_THRESHOLD ? best : null;
    }

    // Finds where a page currently lives (direct in a folder, or inside one
    // of that folder's subfolders) — used by move/delete operations so they
    // don't need to know in advance where the page is.
    function findPageLocation(pageId) {
        for (const f of folders) {
            const directIdx = (f.pages || []).findIndex((p) => p.id === pageId);
            if (directIdx !== -1) return { folder: f, subfolder: null, pageIndex: directIdx, pagesArray: f.pages };
            for (const sf of (f.subfolders || [])) {
                const subIdx = (sf.pages || []).findIndex((p) => p.id === pageId);
                if (subIdx !== -1) return { folder: f, subfolder: sf, pageIndex: subIdx, pagesArray: sf.pages };
            }
        }
        return null;
    }

    async function movePage(pageId, targetFolderId, targetSubfolderId) {
        const loc = findPageLocation(pageId);
        if (!loc) return;

        const targetFolder = folders.find((f) => f.id === targetFolderId);
        if (!targetFolder) return;

        // No-op if dropped back where it already is.
        const alreadyThere = loc.folder.id === targetFolderId &&
            ((!loc.subfolder && !targetSubfolderId) || (loc.subfolder && loc.subfolder.id === targetSubfolderId));
        if (alreadyThere) return;

        const [page] = loc.pagesArray.splice(loc.pageIndex, 1);

        let targetArray;
        if (targetSubfolderId) {
            const targetSubfolder = (targetFolder.subfolders || []).find((sf) => sf.id === targetSubfolderId);
            if (!targetSubfolder) return;
            targetSubfolder.pages = targetSubfolder.pages || [];
            targetArray = targetSubfolder.pages;
        } else {
            targetFolder.pages = targetFolder.pages || [];
            targetArray = targetFolder.pages;
        }
        targetArray.push(page);

        await putFolder(loc.folder);
        if (targetFolder.id !== loc.folder.id) await putFolder(targetFolder);
        await refreshFolderList();
    }

    // Drops a page directly onto another page — used for actual reordering
    // within a list (or a precise insert position when moving between
    // lists), rather than movePage's "just append to the end" behaviour.
    // Finding the target AFTER removing the dragged page (rather than
    // computing a numeric index up front) sidesteps all off-by-one issues
    // when both pages happen to be in the same array.
    async function movePageRelativeTo(draggedPageId, targetPageId) {
        if (draggedPageId === targetPageId) return;

        const dragLoc = findPageLocation(draggedPageId);
        if (!dragLoc) return;

        const [page] = dragLoc.pagesArray.splice(dragLoc.pageIndex, 1);

        const targetLoc = findPageLocation(targetPageId);
        if (!targetLoc) {
            // Target vanished mid-drag somehow — put the page back rather
            // than silently losing it.
            dragLoc.pagesArray.splice(dragLoc.pageIndex, 0, page);
            return;
        }

        targetLoc.pagesArray.splice(targetLoc.pageIndex, 0, page);

        await putFolder(dragLoc.folder);
        if (targetLoc.folder.id !== dragLoc.folder.id) await putFolder(targetLoc.folder);
        await refreshFolderList();
    }

    async function reorderFolders(draggedFolderId, targetFolderId) {
        if (draggedFolderId === targetFolderId) return;
        const draggedIdx = folders.findIndex((f) => f.id === draggedFolderId);
        const targetIdx = folders.findIndex((f) => f.id === targetFolderId);
        if (draggedIdx === -1 || targetIdx === -1) return;

        const [draggedFolder] = folders.splice(draggedIdx, 1);
        const newTargetIdx = folders.findIndex((f) => f.id === targetFolderId);
        folders.splice(newTargetIdx, 0, draggedFolder);

        // Persist the new order on every folder so it survives a reload —
        // IndexedDB doesn't preserve array order on its own.
        for (let i = 0; i < folders.length; i++) {
            folders[i].order = i;
            await putFolder(folders[i]);
        }
        await refreshFolderList();
    }

    // Reusable page-row builder — used both for a folder's direct pages and

    function buildPageItem(page, folderId, subfolderId) {
        const pageEl = document.createElement('div');
        pageEl.className = 'page-item' + (page.id === selectedPageId ? ' active' : '');

            { label: 'Delete Page', danger: true, onClick: () => deletePageById(page.id) }

        pageEl.style.display = 'flex';
        pageEl.style.alignItems = 'center';

        pageEl.addEventListener('click', (e) => {
            e.stopPropagation();
            openPage(folderId, page.id, subfolderId || null);
        });

        pageEl.addEventListener('dragstart', (e) => {
            e.stopPropagation();
            draggedItem = { type: 'page', folderId, subfolderId: subfolderId || null, pageId: page.id };
            e.dataTransfer.effectAllowed = 'move';
        });

        // Dropping another page directly onto this one reorders it to sit
        // right before this page — works for a pure within-list reorder,
        // and also gives a precise insert position when moving a page in
        // from a different folder/subfolder, rather than always landing
        // at the end of the target list.
        pageEl.addEventListener('dragover', (e) => {
            if (!draggedItem || draggedItem.type !== 'page' || draggedItem.pageId === page.id) return;
            e.preventDefault();
            e.stopPropagation();
            pageEl.classList.add('drag-over');
        });
        pageEl.addEventListener('dragleave', () => pageEl.classList.remove('drag-over'));
        pageEl.addEventListener('drop', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            pageEl.classList.remove('drag-over');
            if (draggedItem && draggedItem.type === 'page' && draggedItem.pageId !== page.id) {
                await movePageRelativeTo(draggedItem.pageId, page.id);
            }
            draggedItem = null;
        });

        return pageEl;
    }

        btn.type = 'button';
        btn.textContent = '⋯';

        const menu = document.createElement('div');
        menu.className = 'item-dropdown-menu';
        // Deliberately NOT appended into wrap — it only ever lives in the
        // DOM (as a direct child of <body>) while actually open. Any
        // position:absolute dropdown nested inside a scrolling sidebar can
        // get clipped depending on where the item happens to sit in the
        // list — this sidesteps that permanently by positioning against
        // the viewport instead of any ancestor.

        options.forEach((opt) => {
            const optBtn = document.createElement('button');
            optBtn.textContent = opt.label;
            if (opt.danger) optBtn.classList.add('danger');
            optBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closeAllItemMenus();
                opt.onClick();
            });
            menu.appendChild(optBtn);
        });

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const wasOpen = menu.classList.contains('open');
            closeAllItemMenus();
            if (wasOpen) return; // this click just closed it — don't reopen

            document.body.appendChild(menu);
            menu.classList.add('open');

            const btnRect = btn.getBoundingClientRect();
            const menuRect = menu.getBoundingClientRect(); // real size, now that it's visible

            let top = btnRect.top - menuRect.height - 4; // prefer opening upward
            if (top < 8) top = btnRect.bottom + 4;        // not enough room above — open downward instead

            let left = btnRect.right - menuRect.width;
            if (left < 8) left = btnRect.left;

            menu.style.top = `${top}px`;
            menu.style.left = `${left}px`;

            openMenuEl = menu;
            openMenuTriggerBtn = btn;
        });

        wrap.appendChild(btn);
        wrap.appendChild(menu);
        return wrap;
    }
