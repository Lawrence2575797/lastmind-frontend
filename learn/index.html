<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LastMind – Learn</title>
<style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
        --bg: #1A1A1C;
        --panel: #201F21;
        --text: #E6D7B0;
        --accent: #E6D7B0;
    }

    button, input, textarea, select {
        font-family: inherit;
        color: var(--text);
        background: transparent;
    }

    html, body {
        height: 100%;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Georgia', serif;
        overflow: hidden;
    }

    #gate-message {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Arial', sans-serif;
        color: var(--text);
        opacity: 0.6;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
    }

    #app {
        display: none;
        height: 100vh;
    }

    .layout {
        display: flex;
        height: 100vh;
    }

    /* ─── SIDEBAR ─── */
    .sidebar {
        width: 280px;
        flex-shrink: 0;
        background: var(--panel);
        border-right: 1px solid rgba(230, 215, 176, 0.12);
        display: flex;
        flex-direction: column;
        transition: width 0.25s ease, opacity 0.2s ease;
        overflow: hidden;
    }

    .sidebar.collapsed {
        width: 0;
        opacity: 0;
    }

    .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 18px;
        border-bottom: 1px solid rgba(230, 215, 176, 0.1);
    }

    .sidebar-logo {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--accent);
        text-transform: uppercase;
        white-space: nowrap;
    }

    .new-dropdown {
        position: relative;
    }

    .new-btn {
        font-family: 'Arial', sans-serif;
        font-size: 0.78rem;
        letter-spacing: 0.05em;
        color: var(--bg);
        background: var(--accent);
        border: none;
        padding: 8px 14px;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
    }

    .new-menu {
        display: none;
        position: absolute;
        top: 110%;
        right: 0;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 4px;
        min-width: 170px;
        z-index: 20;
        overflow: hidden;
    }

    .new-menu.open { display: block; }

    .new-menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 11px 16px;
        background: none;
        border: none;
        color: var(--text);
        font-family: 'Arial', sans-serif;
        font-size: 0.82rem;
        cursor: pointer;
        opacity: 0.85;
    }

    .new-menu button:hover:not(:disabled) {
        background: rgba(230, 215, 176, 0.08);
        opacity: 1;
    }

    .new-menu button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    .folder-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px 10px 20px;
    }

    .sidebar-footer {
        padding: 12px 10px;
        border-top: 1px solid rgba(230, 215, 176, 0.1);
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .manage-subscription-btn {
        width: 100%;
        background: none;
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 4px;
        padding: 9px;
        color: var(--text);
        opacity: 0.65;
        font-family: 'Arial', sans-serif;
        font-size: 0.75rem;
        cursor: pointer;
    }

    .manage-subscription-btn:hover {
        opacity: 1;
        background: rgba(230, 215, 176, 0.06);
    }

    .folder-item {
        border-radius: 4px;
        margin-bottom: 4px;
    }

    .folder-item-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 11px 12px;
        cursor: pointer;
        font-size: 0.85rem;
        line-height: 1.4;
        opacity: 0.85;
        border-radius: 4px;
    }

    .folder-item-label {
        flex: 1;
        min-width: 0;
    }

    .new-page-item {
        color: var(--accent) !important;
        opacity: 0.75 !important;
        font-weight: 600;
    }

    .new-page-item:hover {
        opacity: 1 !important;
    }

    .folder-item-header:hover {
        background: rgba(230, 215, 176, 0.06);
    }

    .folder-item.active > .folder-item-header {
        background: rgba(230, 215, 176, 0.12);
        opacity: 1;
        color: var(--accent);
    }

    .folder-meta-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
    }

    .folder-meta {
        font-family: 'Arial', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.04em;
        opacity: 0.55;
    }

    .new-subfolder-link {
        font-family: 'Arial', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.02em;
        color: var(--accent);
        opacity: 0.65;
        cursor: pointer;
        text-decoration: underline;
    }

    .new-subfolder-link:hover {
        opacity: 1;
    }

    .item-menu-wrap {
        position: relative;
        flex-shrink: 0;
    }

    .item-menu-btn {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        border: none;
        background: none;
        color: var(--text);
        opacity: 0.5;
        font-size: 0.9rem;
        line-height: 1;
        cursor: pointer;
    }

    .item-menu-btn:hover {
        opacity: 1;
        background: rgba(230, 215, 176, 0.1);
    }

    .item-dropdown-menu {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 4px;
        min-width: 130px;
        z-index: 30;
        overflow: hidden;
    }

    .item-dropdown-menu.open {
        display: block;
    }

    .item-dropdown-menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 9px 12px;
        background: none;
        border: none;
        color: var(--text);
        font-family: 'Arial', sans-serif;
        font-size: 0.76rem;
        cursor: pointer;
    }

    .item-dropdown-menu button:hover {
        background: rgba(230, 215, 176, 0.08);
    }

    .item-dropdown-menu button.danger {
        color: #e6b0a8;
    }

    .page-list {
        display: none;
        padding-left: 14px;
        margin-top: 2px;
    }

    .folder-item.expanded .page-list {
        display: block;
    }

    .subfolder-item { margin-bottom: 2px; }

    .subfolder-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 7px 8px;
        cursor: pointer;
        font-size: 0.78rem;
        opacity: 0.8;
        border-radius: 4px;
    }

    .subfolder-header:hover {
        background: rgba(230, 215, 176, 0.06);
    }

    .subfolder-item.expanded > .subfolder-header {
        opacity: 1;
        color: var(--accent);
    }

    .subfolder-page-list {
        display: none;
        padding-left: 14px;
    }

    .subfolder-item.expanded .subfolder-page-list {
        display: block;
    }

    [draggable="true"] {
        cursor: grab;
    }

    .drag-over {
        outline: 2px dashed var(--accent);
        outline-offset: -2px;
        background: rgba(230, 215, 176, 0.1) !important;
    }

    .page-item {
        padding: 8px 10px;
        font-size: 0.8rem;
        font-family: 'Arial', sans-serif;
        opacity: 0.7;
        cursor: pointer;
        border-radius: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .page-item:hover, .page-item.active {
        background: rgba(230, 215, 176, 0.08);
        opacity: 1;
        color: var(--accent);
    }

    .empty-hint {
        padding: 16px 12px;
        font-family: 'Arial', sans-serif;
        font-size: 0.78rem;
        opacity: 0.4;
        line-height: 1.6;
    }

    /* ─── MAIN ─── */
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 26px;
        border-bottom: 1px solid rgba(230, 215, 176, 0.1);
    }

    .sidebar-toggle {
        background: none;
        border: 1px solid rgba(230, 215, 176, 0.3);
        color: var(--accent);
        width: 34px;
        height: 34px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.95rem;
        line-height: 1;
        flex-shrink: 0;
    }

    .topbar-title {
        font-family: 'Arial', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.03em;
        opacity: 0.7;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
    }

    .upgrade-btn {
        flex-shrink: 0;
        font-family: 'Arial', sans-serif;
        font-size: 0.78rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--bg);
        background: var(--accent);
        border: none;
        padding: 9px 20px;
        border-radius: 4px;
        cursor: pointer;
    }

    .upgrade-btn:hover {
        opacity: 0.9;
    }

    .content {
        flex: 1;
        overflow-y: auto;
        padding: 40px;
        display: flex;
        justify-content: center;
    }

    .content-inner {
        width: 100%;
        max-width: 780px;
    }

    .welcome {
        opacity: 0.5;
        font-size: 0.95rem;
        line-height: 1.8;
        margin-top: 60px;
        text-align: center;
    }

    /* ─── PAGE EDITOR ─── */
    .editor-wrap {
        position: relative;
    }

    .page-title-input {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(230, 215, 176, 0.25);
        color: var(--text);
        font-family: 'Georgia', serif;
        font-size: 1.4rem;
        font-weight: 700;
        padding: 4px 2px 12px;
        margin-bottom: 18px;
    }

    .page-title-input:focus {
        outline: none;
        border-bottom-color: var(--accent);
    }

    .note-textarea {
        width: 100%;
        min-height: 60vh;
        background: var(--accent);
        border: 1px solid rgba(26, 26, 28, 0.15);
        border-radius: 6px;
        color: var(--bg);
        font-family: 'Georgia', serif;
        font-size: 1rem;
        line-height: 1.8;
        padding: 22px 24px 64px;
        resize: vertical;
    }

    .note-textarea::placeholder {
        color: rgba(26, 26, 28, 0.5);
    }

    .note-textarea:focus {
        outline: none;
        border-color: rgba(26, 26, 28, 0.3);
    }

    .compile-btn {
        position: absolute;
        bottom: 16px;
        right: 16px;
        font-family: 'Arial', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        background: var(--bg);
        border: none;
        padding: 10px 22px;
        border-radius: 3px;
        cursor: pointer;
    }

    .compile-btn:hover {
        opacity: 0.9;
    }

    .compile-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .play-btn {
        position: absolute;
        bottom: 16px;
        right: 120px;
        font-family: 'Arial', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--bg);
        background: var(--accent);
        border: none;
        padding: 10px 18px;
        border-radius: 3px;
        cursor: pointer;
    }

    .play-btn:hover {
        opacity: 0.9;
    }

    .play-btn.playing {
        background: var(--bg);
        color: var(--accent);
        border: 1px solid rgba(230, 215, 176, 0.3);
    }

    .compile-status {
        margin-top: 14px;
        font-family: 'Arial', sans-serif;
        font-size: 0.78rem;
        color: var(--text);
        opacity: 0.65;
        min-height: 1em;
    }

    .compile-status.error {
        color: #e6b0a8;
        opacity: 1;
    }

    .compiled-output {
        margin-top: 14px;
        padding: 20px 22px;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.18);
        border-radius: 6px;
        color: var(--text);
        font-family: 'Georgia', serif;
        font-size: 0.95rem;
        line-height: 1.8;
        white-space: pre-wrap;
    }

    /* ─── DICTATION ─── */
    .textarea-wrap {
        position: relative;
    }

    .mic-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid rgba(26, 26, 28, 0.25);
        background: var(--bg);
        color: var(--accent);
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .mic-btn:hover {
        opacity: 0.9;
    }

    .mic-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    .mic-btn.listening {
        background: var(--accent);
        color: var(--bg);
        animation: mic-pulse 1.4s infinite;
    }

    @keyframes mic-pulse {
        0%   { box-shadow: 0 0 0 0 rgba(230, 215, 176, 0.55); }
        70%  { box-shadow: 0 0 0 10px rgba(230, 215, 176, 0); }
        100% { box-shadow: 0 0 0 0 rgba(230, 215, 176, 0); }
    }

    .dictation-status {
        font-family: 'Arial', sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.03em;
        color: var(--text);
        opacity: 0.6;
        margin-top: 8px;
        min-height: 1em;
    }

    .account-status {
        font-family: 'Arial', sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.03em;
        color: var(--text);
        opacity: 0.65;
        margin-top: 10px;
        min-height: 1em;
        text-align: center;
    }

    .account-status.error {
        color: #e6b0a8;
        opacity: 1;
    }

    .my-account-divider {
        height: 1px;
        background: rgba(230, 215, 176, 0.15);
        margin: 20px 0;
    }

    /* ─── MODAL ─── */
    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 11, 0.72);
        z-index: 200;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
        background: var(--bg);
        border: 1px solid rgba(230, 215, 176, 0.25);
        border-radius: 8px;
        padding: 34px 32px;
        max-width: 400px;
        width: 100%;
    }

    .modal h3 {
        font-size: 1.15rem;
        color: var(--accent);
        margin-bottom: 22px;
    }

    .field {
        margin-bottom: 16px;
    }

    .field label {
        display: block;
        font-family: 'Arial', sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        opacity: 0.6;
        margin-bottom: 6px;
    }

    .field input {
        width: 100%;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 4px;
        padding: 10px 12px;
        color: var(--text);
        font-family: 'Arial', sans-serif;
        font-size: 0.9rem;
    }

    .field input:focus {
        outline: none;
        border-color: rgba(230, 215, 176, 0.5);
    }

    .match-suggestion {
        display: none;
        background: rgba(230, 215, 176, 0.08);
        border: 1px solid rgba(230, 215, 176, 0.25);
        border-radius: 4px;
        padding: 14px 16px;
        font-family: 'Arial', sans-serif;
        font-size: 0.8rem;
        line-height: 1.6;
        margin-bottom: 16px;
    }

    .match-suggestion.show { display: block; }

    .match-suggestion .actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }

    .match-suggestion button {
        font-family: 'Arial', sans-serif;
        font-size: 0.76rem;
        padding: 6px 12px;
        border-radius: 3px;
        cursor: pointer;
        border: 1px solid rgba(230, 215, 176, 0.3);
        background: none;
        color: var(--text);
    }

    .match-suggestion .use-existing {
        background: var(--accent);
        color: var(--bg);
        border: none;
    }

    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 8px;
    }

    .btn {
        font-family: 'Arial', sans-serif;
        font-size: 0.82rem;
        padding: 9px 20px;
        border-radius: 3px;
        cursor: pointer;
        border: 1px solid rgba(230, 215, 176, 0.3);
        background: none;
        color: var(--text);
    }

    .btn.primary {
        background: var(--accent);
        color: var(--bg);
        border: none;
    }
</style>
</head>
<body>

<div id="gate-message">Checking your subscription…</div>

<div id="app">
    <div class="layout">

        <!-- ─── SIDEBAR ─── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">LastMind</span>
                <div class="new-dropdown">
                    <button class="new-btn" id="newDropdownBtn">+ New</button>
                    <div class="new-menu" id="newMenu">
                        <button id="newFolderOption">New Folder</button>
                    </div>
                </div>
            </div>

            <div class="folder-list" id="folderList">
                <div class="empty-hint">No folders yet — click "+ New" to create one.</div>
            </div>

            <div class="sidebar-footer">
                <button class="manage-subscription-btn" id="myAccountBtn">My Account</button>
            </div>
        </aside>

        <!-- ─── MAIN ─── -->
        <main class="main">
            <div class="topbar">
                <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">☰</button>
                <span class="topbar-title" id="topbarTitle">Select or create a folder to get started</span>
                <button class="upgrade-btn" id="upgradeBtn">Upgrade</button>
            </div>

            <div class="content">
                <div class="content-inner" id="contentInner">
                    <p class="welcome">Nothing open yet. Create a folder on the left, then a page inside it.</p>
                </div>
            </div>
        </main>

    </div>
</div>

<!-- ─── NEW FOLDER MODAL ─── -->
<div class="modal-overlay" id="folderModalOverlay">
    <div class="modal">
        <h3>New Folder</h3>

        <div class="match-suggestion" id="matchSuggestion">
            <span id="matchSuggestionText"></span>
            <div class="actions">
                <button class="use-existing" id="useExistingBtn">Use this folder</button>
                <button id="createAnywayBtn">Create new anyway</button>
            </div>
        </div>

        <div class="field">
            <label for="subjectInput">Subject</label>
            <input type="text" id="subjectInput" placeholder="e.g. Economics">
        </div>
        <div class="field">
            <label for="qualificationInput">Qualification</label>
            <input type="text" id="qualificationInput" placeholder="e.g. A-Level">
        </div>
        <div class="field">
            <label for="boardInput">Exam Board</label>
            <input type="text" id="boardInput" placeholder="e.g. AQA">
        </div>

        <div class="modal-actions">
            <button class="btn" id="cancelFolderBtn">Cancel</button>
            <button class="btn primary" id="submitFolderBtn">Create</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="myAccountOverlay">
    <div class="modal">
        <h3>My Account</h3>
        <p class="account-status" id="myAccountEmail" style="opacity:0.85; margin-bottom:20px;"></p>

        <div class="field">
            <label for="newAccountPasswordInput">New Password</label>
            <input type="password" id="newAccountPasswordInput" placeholder="At least 6 characters" autocomplete="new-password">
        </div>
        <button class="btn primary" id="saveAccountSettingsBtn" style="width:100%;">Save Password</button>
        <div class="account-status" id="accountSettingsStatus"></div>

        <div class="my-account-divider"></div>

        <button class="btn primary" id="manageSubscriptionBtn" style="width:100%;">Manage Subscription</button>

        <div class="modal-actions">
            <button class="btn" id="cancelAccountSettingsBtn">Close</button>
        </div>
    </div>
</div>

    /* ───────────────────────── IndexedDB ───────────────────────── */

    const DB_NAME = 'LastMindDB';
    const DB_VERSION = 2;
    const AUTH_STORE = 'auth';
    const FOLDER_STORE = 'folders';

    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(AUTH_STORE)) {
                    db.createObjectStore(AUTH_STORE, { keyPath: 'id' });
                }
                if (!db.objectStoreNames.contains(FOLDER_STORE)) {
                    db.createObjectStore(FOLDER_STORE, { keyPath: 'id', autoIncrement: true });
                }
            };
            req.onsuccess = (e) => resolve(e.target.result);
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async function putAuthRecord(id, value) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(AUTH_STORE, 'readwrite');
            tx.objectStore(AUTH_STORE).put({ id, value, savedAt: Date.now() });
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e.target.error);
        });
    }

    async function getAuthRecord(id) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(AUTH_STORE, 'readonly');
            const r = tx.objectStore(AUTH_STORE).get(id);
            r.onsuccess = () => resolve(r.result ? r.result.value : null);
            r.onerror = (e) => reject(e.target.error);
        });
    }

    // Both defined in terms of the generic pair above now, so the shape
    // written here always matches what index.html writes after checkout —
    // previously these used a different field name (.token instead of
    // .value), which meant a token saved by index.html right after payment
    // was never actually seen by this check, silently forcing an extra
    // backend round-trip on every single visit instead of using the cached
    // token directly.
    async function getStoredToken() {
        return getAuthRecord('jwt');
    }

    async function saveToken(token) {
        return putAuthRecord('jwt', token);
    }


    async function getAllFolders() {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FOLDER_STORE, 'readonly');
            const r = tx.objectStore(FOLDER_STORE).getAll();
            r.onsuccess = () => resolve(r.result || []);
            r.onerror = (e) => reject(e.target.error);
        });
    }

    async function putFolder(folder) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FOLDER_STORE, 'readwrite');
            const r = tx.objectStore(FOLDER_STORE).put(folder);
            r.onsuccess = () => resolve(r.result); // returns the key (id)
            r.onerror = (e) => reject(e.target.error);
        });
    }

    async function deleteFolderRecord(folderId) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FOLDER_STORE, 'readwrite');
            const r = tx.objectStore(FOLDER_STORE).delete(folderId);
            r.onsuccess = () => resolve();
            r.onerror = (e) => reject(e.target.error);
        });
    }

    /* ───────────────────────── JWT verification ───────────────────────── */

    function base64UrlToBytes(b64url) {
        const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
        const pad = b64.length % 4 === 0 ? '' : '='.repeat(4 - (b64.length % 4));
        const binary = atob(b64 + pad);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    async function importPublicKey(pem) {
        const b64 = pem.replace(/-----BEGIN PUBLIC KEY-----/, '')
                        .replace(/-----END PUBLIC KEY-----/, '')
                        .replace(/\s+/g, '');
        const bytes = base64UrlToBytes(b64.replace(/-/g, '+').replace(/_/g, '/')); // pem is standard base64, reuse decode path
        return crypto.subtle.importKey(
            'spki',
            bytes.buffer,
            { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
            false,
            ['verify']
        );
    }

    async function verifyJWT(token, publicKey) {
        try {
            const parts = token.split('.');
            if (parts.length !== 3) return null;
            const [headerB64, payloadB64, sigB64] = parts;

            const data = new TextEncoder().encode(`${headerB64}.${payloadB64}`);
            const signature = base64UrlToBytes(sigB64);

            const valid = await crypto.subtle.verify(
                'RSASSA-PKCS1-v1_5', publicKey, signature, data
            );
            if (!valid) return null;

            const payload = JSON.parse(new TextDecoder().decode(base64UrlToBytes(payloadB64)));

            if (payload.exp && Math.floor(Date.now() / 1000) >= payload.exp) return null;
            if (payload.status !== 'active') return null;

            return payload;
        } catch (err) {
            console.error('LastMind: JWT verification failed.', err);
            return null;
        }
    }

    /* ───────────────────────── Fuzzy matching ───────────────────────── */

    function normalize(str) {
        return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function levenshtein(a, b) {
        const m = a.length, n = b.length;
        const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
        for (let i = 0; i <= m; i++) dp[i][0] = i;
        for (let j = 0; j <= n; j++) dp[0][j] = j;
        for (let i = 1; i <= m; i++) {
            for (let j = 1; j <= n; j++) {
                dp[i][j] = a[i - 1] === b[j - 1]
                    ? dp[i - 1][j - 1]
                    : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
            }
        }
        return dp[m][n];
    }

    function similarity(a, b) {
        const na = normalize(a), nb = normalize(b);
        const maxLen = Math.max(na.length, nb.length, 1);
        if (na === nb) return 1;
        return 1 - levenshtein(na, nb) / maxLen;
    }

    const MATCH_THRESHOLD = 0.72;

    function findSimilarFolder(subject, qualification, board, folders) {
        let best = null;
        let bestScore = 0;
        for (const f of folders) {
            const score = (
                similarity(subject, f.subject) +
                similarity(qualification, f.qualification) +
                similarity(board, f.examBoard)
            ) / 3;
            if (score > bestScore) {
                bestScore = score;
                best = f;
            }
        }
        return bestScore >= MATCH_THRESHOLD ? best : null;
    }

    /* ───────────────────────── App state ───────────────────────── */

    let folders = [];
    let isPaidUser = false; // set by gate() — controls whether Compile shows in the editor

    let selectedFolderId = null;
    let selectedSubfolderId = null;
    let selectedPageId = null;
    let pendingMatchFolder = null; // set when the match-suggestion is showing

    let draggedItem = null; // { type: 'folder'|'subfolder'|'page', folderId, subfolderId, pageId }
    let openMenuEl = null;  // currently-open three-dot dropdown, so only one is open at a time

    function folderLabel(f) {
        return `${f.subject} — ${f.qualification} (${f.examBoard})`;
    }

    function closeAllItemMenus() {
        document.querySelectorAll('.item-dropdown-menu.open').forEach((m) => m.classList.remove('open'));
        openMenuEl = null;
    }

    // Finds where a page currently lives (direct in a folder, or inside one
    // of that folder's subfolders) — used by move/delete operations so they
    // don't need to know in advance where the page is.
    function findPageLocation(pageId) {
        for (const f of folders) {
            const directIdx = (f.pages || []).findIndex((p) => p.id === pageId);
            if (directIdx !== -1) return { folder: f, subfolder: null, pageIndex: directIdx, pagesArray: f.pages };
            for (const sf of (f.subfolders || [])) {
                const subIdx = (sf.pages || []).findIndex((p) => p.id === pageId);
                if (subIdx !== -1) return { folder: f, subfolder: sf, pageIndex: subIdx, pagesArray: sf.pages };
            }
        }
        return null;
    }

    async function movePage(pageId, targetFolderId, targetSubfolderId) {
        const loc = findPageLocation(pageId);
        if (!loc) return;

        const targetFolder = folders.find((f) => f.id === targetFolderId);
        if (!targetFolder) return;

        // No-op if dropped back where it already is.
        const alreadyThere = loc.folder.id === targetFolderId &&
            ((!loc.subfolder && !targetSubfolderId) || (loc.subfolder && loc.subfolder.id === targetSubfolderId));
        if (alreadyThere) return;

        const [page] = loc.pagesArray.splice(loc.pageIndex, 1);

        let targetArray;
        if (targetSubfolderId) {
            const targetSubfolder = (targetFolder.subfolders || []).find((sf) => sf.id === targetSubfolderId);
            if (!targetSubfolder) return;
            targetSubfolder.pages = targetSubfolder.pages || [];
            targetArray = targetSubfolder.pages;
        } else {
            targetFolder.pages = targetFolder.pages || [];
            targetArray = targetFolder.pages;
        }
        targetArray.push(page);

        await putFolder(loc.folder);
        if (targetFolder.id !== loc.folder.id) await putFolder(targetFolder);
        await refreshFolderList();
    }

    async function moveSubfolder(subfolderId, sourceFolderId, targetFolderId) {
        if (sourceFolderId === targetFolderId) return;
        const sourceFolder = folders.find((f) => f.id === sourceFolderId);
        const targetFolder = folders.find((f) => f.id === targetFolderId);
        if (!sourceFolder || !targetFolder) return;

        const idx = (sourceFolder.subfolders || []).findIndex((sf) => sf.id === subfolderId);
        if (idx === -1) return;

        const [subfolder] = sourceFolder.subfolders.splice(idx, 1);
        targetFolder.subfolders = targetFolder.subfolders || [];
        targetFolder.subfolders.push(subfolder);

        await putFolder(sourceFolder);
        await putFolder(targetFolder);
        await refreshFolderList();
    }

    async function reorderFolders(draggedFolderId, targetFolderId) {
        if (draggedFolderId === targetFolderId) return;
        const draggedIdx = folders.findIndex((f) => f.id === draggedFolderId);
        const targetIdx = folders.findIndex((f) => f.id === targetFolderId);
        if (draggedIdx === -1 || targetIdx === -1) return;

        const [draggedFolder] = folders.splice(draggedIdx, 1);
        const newTargetIdx = folders.findIndex((f) => f.id === targetFolderId);
        folders.splice(newTargetIdx, 0, draggedFolder);

        // Persist the new order on every folder so it survives a reload —
        // IndexedDB doesn't preserve array order on its own.
        for (let i = 0; i < folders.length; i++) {
            folders[i].order = i;
            await putFolder(folders[i]);
        }
        await refreshFolderList();
    }

    async function createSubfolder(folderId) {
        const name = prompt('Subfolder name:');
        if (!name || !name.trim()) return;
        const folder = folders.find((f) => f.id === folderId);
        if (!folder) return;

        folder.subfolders = folder.subfolders || [];
        folder.subfolders.push({
            id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
            name: name.trim(),
            pages: []
        });
        await putFolder(folder);
        await refreshFolderList();
    }

    async function deleteFolder(folderId) {
        if (!confirm('Delete this folder and everything inside it? This cannot be undone.')) return;
        await deleteFolderRecord(folderId);
        if (selectedFolderId === folderId) {
            selectedFolderId = null;
            selectedSubfolderId = null;
            selectedPageId = null;
            renderWelcome();
        }
        await refreshFolderList();
    }

    async function deleteSubfolderById(folderId, subfolderId) {
        if (!confirm('Delete this subfolder and its pages? This cannot be undone.')) return;
        const folder = folders.find((f) => f.id === folderId);
        if (!folder) return;
        folder.subfolders = (folder.subfolders || []).filter((sf) => sf.id !== subfolderId);
        await putFolder(folder);
        if (selectedSubfolderId === subfolderId) {
            selectedSubfolderId = null;
            selectedPageId = null;
            renderWelcome();
        }
        await refreshFolderList();
    }

    async function deletePageById(pageId) {
        if (!confirm('Delete this page? This cannot be undone.')) return;
        const loc = findPageLocation(pageId);
        if (!loc) return;
        loc.pagesArray.splice(loc.pageIndex, 1);
        await putFolder(loc.folder);
        if (selectedPageId === pageId) {
            selectedPageId = null;
            renderWelcome();
        }
        await refreshFolderList();
    }

    // Reusable page-row builder — used both for a folder's direct pages and
    // for a subfolder's pages, so the drag/menu behaviour stays consistent.
    function buildPageItem(page, folderId, subfolderId) {
        const pageEl = document.createElement('div');
        pageEl.className = 'page-item' + (page.id === selectedPageId ? ' active' : '');
        pageEl.draggable = true;

        const label = document.createElement('span');
        label.textContent = page.title || 'Untitled page';
        label.style.flex = '1';
        label.style.overflow = 'hidden';
        label.style.textOverflow = 'ellipsis';

        const menuWrap = buildItemMenu([
            { label: 'Delete Page', danger: true, onClick: () => deletePageById(page.id) }
        ]);

        pageEl.style.display = 'flex';
        pageEl.style.alignItems = 'center';
        pageEl.style.gap = '4px';
        pageEl.appendChild(label);
        pageEl.appendChild(menuWrap);

        pageEl.addEventListener('click', (e) => {
            e.stopPropagation();
            openPage(folderId, page.id, subfolderId || null);
        });

        pageEl.addEventListener('dragstart', (e) => {
            e.stopPropagation();
            draggedItem = { type: 'page', folderId, subfolderId: subfolderId || null, pageId: page.id };
            e.dataTransfer.effectAllowed = 'move';
        });

        return pageEl;
    }

    // Small reusable three-dot dropdown — options is an array of
    // { label, danger, onClick }.
    function buildItemMenu(options) {
        const wrap = document.createElement('div');
        wrap.className = 'item-menu-wrap';

        const btn = document.createElement('button');
        btn.className = 'item-menu-btn';
        btn.type = 'button';
        btn.textContent = '⋯';
        btn.title = 'Options';

        const menu = document.createElement('div');
        menu.className = 'item-dropdown-menu';

        options.forEach((opt) => {
            const optBtn = document.createElement('button');
            optBtn.textContent = opt.label;
            if (opt.danger) optBtn.classList.add('danger');
            optBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closeAllItemMenus();
                opt.onClick();
            });
            menu.appendChild(optBtn);
        });

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const wasOpen = menu.classList.contains('open');
            closeAllItemMenus();
            if (!wasOpen) {
                menu.classList.add('open');
                openMenuEl = menu;
            }
        });

        wrap.appendChild(btn);
        wrap.appendChild(menu);
        return wrap;
    }

    async function refreshFolderList() {
        folders = await getAllFolders();
        folders.sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));

        const listEl = document.getElementById('folderList');
        listEl.innerHTML = '';

        if (!folders.length) {
            listEl.innerHTML = '<div class="empty-hint">No folders yet — click "+ New" to create one.</div>';
            return;
        }

        folders.forEach((f) => {
            const item = document.createElement('div');
            item.className = 'folder-item' + (f.id === selectedFolderId ? ' active expanded' : '');
            item.draggable = true;

            const header = document.createElement('div');
            header.className = 'folder-item-header';

            const labelWrap = document.createElement('div');
            labelWrap.className = 'folder-item-label';
            labelWrap.style.flex = '1';
            labelWrap.style.minWidth = '0';
            labelWrap.innerHTML = `
                ${folderLabel(f)}
                <div class="folder-meta-row">
                    <span class="folder-meta">${(f.pages || []).length} page(s)</span>
                    <span class="new-subfolder-link">+ Subfolder</span>
                </div>
            `;
            labelWrap.querySelector('.new-subfolder-link').addEventListener('click', (e) => {
                e.stopPropagation();
                createSubfolder(f.id);
            });

            const menuWrap = buildItemMenu([
                { label: 'Delete Folder', danger: true, onClick: () => deleteFolder(f.id) }
            ]);

            header.appendChild(labelWrap);
            header.appendChild(menuWrap);
            header.addEventListener('click', () => selectFolder(f.id));

            // Folder drag (reordering among top-level folders)
            item.addEventListener('dragstart', (e) => {
                if (e.target !== item && e.target.closest('.page-item, .subfolder-item')) return;
                draggedItem = { type: 'folder', folderId: f.id };
                e.dataTransfer.effectAllowed = 'move';
                e.stopPropagation();
            });

            // Drop target: folder header accepts a dragged folder (reorder),
            // a dragged subfolder (reparent), or a dragged page (move to
            // this folder's direct pages).
            header.addEventListener('dragover', (e) => {
                if (!draggedItem) return;
                e.preventDefault();
                header.classList.add('drag-over');
            });
            header.addEventListener('dragleave', () => header.classList.remove('drag-over'));
            header.addEventListener('drop', async (e) => {
                e.preventDefault();
                e.stopPropagation();
                header.classList.remove('drag-over');
                if (!draggedItem) return;

                if (draggedItem.type === 'folder') {
                    await reorderFolders(draggedItem.folderId, f.id);
                } else if (draggedItem.type === 'subfolder') {
                    await moveSubfolder(draggedItem.subfolderId, draggedItem.folderId, f.id);
                } else if (draggedItem.type === 'page') {
                    await movePage(draggedItem.pageId, f.id, null);
                }
                draggedItem = null;
            });

            const pageList = document.createElement('div');
            pageList.className = 'page-list';

            // Subfolders first
            (f.subfolders || []).forEach((sf) => {
                const sfItem = document.createElement('div');
                sfItem.className = 'subfolder-item' + (sf.id === selectedSubfolderId ? ' expanded' : '');
                sfItem.draggable = true;

                const sfHeader = document.createElement('div');
                sfHeader.className = 'subfolder-header';

                const sfLabel = document.createElement('span');
                sfLabel.textContent = `📁 ${sf.name} (${(sf.pages || []).length})`;
                sfLabel.style.flex = '1';
                sfLabel.style.overflow = 'hidden';
                sfLabel.style.textOverflow = 'ellipsis';

                const sfMenu = buildItemMenu([
                    { label: 'Delete Subfolder', danger: true, onClick: () => deleteSubfolderById(f.id, sf.id) }
                ]);

                sfHeader.appendChild(sfLabel);
                sfHeader.appendChild(sfMenu);
                sfHeader.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedFolderId = f.id;
                    selectedSubfolderId = (selectedSubfolderId === sf.id) ? null : sf.id;
                    refreshFolderList();
                });

                sfItem.addEventListener('dragstart', (e) => {
                    e.stopPropagation();
                    draggedItem = { type: 'subfolder', folderId: f.id, subfolderId: sf.id };
                    e.dataTransfer.effectAllowed = 'move';
                });

                // A subfolder can also receive a dragged page directly.
                sfHeader.addEventListener('dragover', (e) => {
                    if (!draggedItem || draggedItem.type !== 'page') return;
                    e.preventDefault();
                    e.stopPropagation();
                    sfHeader.classList.add('drag-over');
                });
                sfHeader.addEventListener('dragleave', () => sfHeader.classList.remove('drag-over'));
                sfHeader.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    sfHeader.classList.remove('drag-over');
                    if (draggedItem && draggedItem.type === 'page') {
                        await movePage(draggedItem.pageId, f.id, sf.id);
                    }
                    draggedItem = null;
                });

                const sfPageList = document.createElement('div');
                sfPageList.className = 'subfolder-page-list';
                (sf.pages || []).forEach((p) => {
                    sfPageList.appendChild(buildPageItem(p, f.id, sf.id));
                });

                const sfNewPageBtn = document.createElement('div');
                sfNewPageBtn.className = 'page-item new-page-item';
                sfNewPageBtn.textContent = '+ New Page';
                sfNewPageBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    createPageInFolder(f.id, sf.id);
                });
                sfPageList.appendChild(sfNewPageBtn);

                sfItem.appendChild(sfHeader);
                sfItem.appendChild(sfPageList);
                pageList.appendChild(sfItem);
            });

            // Then this folder's own direct pages
            (f.pages || []).forEach((p) => {
                pageList.appendChild(buildPageItem(p, f.id, null));
            });

            const newPageBtn = document.createElement('div');
            newPageBtn.className = 'page-item new-page-item';
            newPageBtn.textContent = '+ New Page';
            newPageBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                createPageInFolder(f.id, null);
            });
            pageList.appendChild(newPageBtn);

            item.appendChild(header);
            item.appendChild(pageList);
            listEl.appendChild(item);
        });
    }

    function selectFolder(folderId) {
        selectedFolderId = folderId;
        selectedSubfolderId = null;
        selectedPageId = null;
        const f = folders.find((x) => x.id === folderId);
        document.getElementById('topbarTitle').textContent = f ? folderLabel(f) : 'Select or create a folder to get started';
        renderWelcome();
        refreshFolderList();
    }

    function renderWelcome() {
        stopActiveDictation();
        stopSpeaking();
        document.getElementById('contentInner').innerHTML =
            '<p class="welcome">Click the + next to this folder to add a page.</p>';
    }

    let saveDebounce = null;

    // Tracks whatever recognition session is currently running, if any, so
    // switching pages/folders can't leave a mic session orphaned in the background.
    let activeRecognition = null;

    function stopActiveDictation() {
        if (activeRecognition) {
            try { activeRecognition.stop(); } catch (err) { /* already stopped */ }
            activeRecognition = null;
        }
    }

    /**
     * On-device text-to-speech via the Web Speech API (SpeechSynthesis) —
     * no external TTS service involved, nothing leaves the browser. This is
     * the web equivalent of AVSpeechSynthesizer (iOS) / TextToSpeech
     * (Android); those are native-platform APIs and don't apply here since
     * this is a web page, not a native app.
     *
     * Note: browsers require a user gesture (like a click) before audio can
     * play at all — that's a platform security rule speechSynthesis can't
     * bypass. Speech only starts from the explicit Play click below.
     */
    function stopSpeaking() {
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }
    }

    // getVoices() often returns an empty list on the very first call, until
    // the browser finishes loading them asynchronously — this waits for
    // that instead of silently falling back to the default voice.
    function loadVoices() {
        return new Promise((resolve) => {
            const existing = window.speechSynthesis.getVoices();
            if (existing.length) {
                resolve(existing);
                return;
            }
            window.speechSynthesis.onvoiceschanged = () => {
                resolve(window.speechSynthesis.getVoices());
            };
        });
    }

    // Chrome ships several "Google ..." voices (e.g. "Google UK English
    // Male", "Google US English") that sound noticeably more natural than
    // the platform's bare default voice. Prefer one of those, matched to
    // the browser's language where possible; fall back to any English
    // voice, then to whatever's available, rather than forcing a voice
    // that doesn't exist on this device.
    function pickBestVoice(voices) {
        if (!voices || !voices.length) return null;

        const langPrefix = (navigator.language || 'en-US').slice(0, 2).toLowerCase();
        const googleVoices = voices.filter((v) => v.name.includes('Google'));

        if (googleVoices.length) {
            const langMatch = googleVoices.find((v) => v.lang.toLowerCase().startsWith(langPrefix));
            return langMatch || googleVoices[0];
        }

        const enVoice = voices.find((v) => v.lang.toLowerCase().startsWith('en'));
        return enVoice || voices[0];
    }

    async function speakText(text) {
        if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
            console.warn('LastMind: on-device text-to-speech is not supported in this browser.');
            return null;
        }

        stopSpeaking(); // cancel anything already playing before starting new speech

        const trimmed = (text || '').trim();
        if (!trimmed) return null;

        const utterance = new SpeechSynthesisUtterance(trimmed);
        utterance.lang = navigator.language || 'en-US';

        const voices = await loadVoices();
        const bestVoice = pickBestVoice(voices);
        if (bestVoice) {
            utterance.voice = bestVoice;
            utterance.lang = bestVoice.lang;
        }

        window.speechSynthesis.speak(utterance);
        return utterance;
    }

    function openPage(folderId, pageId, subfolderId) {
        stopActiveDictation();
        stopSpeaking();

        selectedFolderId = folderId;
        selectedSubfolderId = subfolderId || null;
        selectedPageId = pageId;

        const loc = findPageLocation(pageId);
        if (!loc) return;
        const folder = loc.folder;
        const page = loc.pagesArray.find((p) => p.id === pageId);

        document.getElementById('topbarTitle').textContent = `${folderLabel(folder)} · ${page.title}`;

        const contentInner = document.getElementById('contentInner');
        contentInner.innerHTML = `
            <div class="editor-wrap">
                <input type="text" class="page-title-input" id="pageTitleInput" placeholder="Page title" value="">
                <div class="textarea-wrap">
                    <textarea class="note-textarea" id="noteBox" placeholder="Start typing your notes…"></textarea>
                    <button type="button" class="mic-btn" id="micBtn" title="Start dictation">🎤</button>
                </div>
                <div class="dictation-status" id="dictationStatus"></div>
                <button class="play-btn" id="playBtn" title="Read notes aloud">▶ Play</button>
                ${isPaidUser ? '<button class="compile-btn" id="compileBtn">Compile</button>' : ''}
            </div>
            ${isPaidUser ? '<div class="compile-status" id="compileStatus"></div><div class="compiled-output" id="compiledOutput" style="display:none;"></div>' : ''}
        `;

        const titleInput = document.getElementById('pageTitleInput');
        titleInput.value = page.title || '';
        titleInput.focus();
        titleInput.select();
        let titleSaveDebounce = null;
        titleInput.addEventListener('input', () => {
            clearTimeout(titleSaveDebounce);
            const newTitle = titleInput.value;
            document.getElementById('topbarTitle').textContent = `${folderLabel(folder)} · ${newTitle || 'Untitled page'}`;
            titleSaveDebounce = setTimeout(async () => {
                page.title = newTitle || 'Untitled page';
                await putFolder(folder);
                await refreshFolderList();
            }, 400);
        });

        const textarea = document.getElementById('noteBox');
        textarea.value = page.content || '';
        textarea.addEventListener('input', () => {
            clearTimeout(saveDebounce);
            saveDebounce = setTimeout(async () => {
                page.content = textarea.value;
                await putFolder(folder);
            }, 400);
        });

        // Compile logic itself is still coming tomorrow — no-op for now.
        if (isPaidUser) {
            const compileBtn = document.getElementById('compileBtn');
            const compileStatus = document.getElementById('compileStatus');
            const compiledOutput = document.getElementById('compiledOutput');

            compileBtn.addEventListener('click', async () => {
                const notes = textarea.value.trim();
                if (!notes) {
                    compileStatus.textContent = 'Write some notes first.';
                    compileStatus.classList.add('error');
                    return;
                }

                compileBtn.disabled = true;
                compileStatus.classList.remove('error');
                compileStatus.textContent = 'Compiling…';
                compiledOutput.style.display = 'none';

                try {
                    const resp = await fetch(`${COMPILE_BACKEND_URL}/compile`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ notes })
                    });

                    if (!resp.ok) {
                        const body = await resp.json().catch(() => ({}));
                        throw new Error(body.error || `Server returned ${resp.status}`);
                    }

                    const { result } = await resp.json();
                    compiledOutput.textContent = result;
                    compiledOutput.style.display = 'block';
                    compileStatus.textContent = '';
                } catch (err) {
                    console.error('LastMind: compile request failed.', err);
                    compileStatus.textContent = 'Could not compile your notes. Please try again.';
                    compileStatus.classList.add('error');
                } finally {
                    compileBtn.disabled = false;
                }
            });
        }

        // Text-to-speech only ever starts from this explicit Play click —
        // never automatically. Clicking again while speaking stops it.
        const playBtn = document.getElementById('playBtn');
        playBtn.addEventListener('click', async () => {
            if (window.speechSynthesis && window.speechSynthesis.speaking) {
                stopSpeaking();
                playBtn.classList.remove('playing');
                playBtn.textContent = '▶ Play';
                return;
            }
            const utterance = await speakText(textarea.value);
            if (!utterance) return;
            playBtn.classList.add('playing');
            playBtn.textContent = '■ Stop';
            utterance.onend = () => {
                playBtn.classList.remove('playing');
                playBtn.textContent = '▶ Play';
            };
        });

        setupDictation(textarea);

        refreshFolderList();
    }

    /**
     * Wires the mic button next to #noteBox to the browser's built-in Web
     * Speech API (SpeechRecognition). No external dictation service is used —
     * this only works in browsers that ship their own recognizer (Chrome/Edge
     * today; Safari/Firefox support is inconsistent), and only over HTTPS or
     * localhost, since getting microphone access requires a secure context.
     */
    function setupDictation(textarea) {
        const micBtn = document.getElementById('micBtn');
        const statusEl = document.getElementById('dictationStatus');

        const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognitionCtor) {
            micBtn.disabled = true;
            micBtn.title = 'Dictation is not supported in this browser';
            statusEl.textContent = 'Dictation is not supported in this browser.';
            return;
        }

        let isListening = false;

        function setStatus(text) {
            statusEl.textContent = text || '';
        }

        function setListeningUI(listening) {
            isListening = listening;
            micBtn.classList.toggle('listening', listening);
            micBtn.textContent = listening ? '■' : '🎤';
            micBtn.title = listening ? 'Stop dictation' : 'Start dictation';
        }

        function insertTranscript(transcript) {
            const trimmed = transcript.trim();
            if (!trimmed) return;

            const needsLeadingSpace =
                textarea.value.length > 0 &&
                !/\s$/.test(textarea.value);

            textarea.value += (needsLeadingSpace ? ' ' : '') + trimmed + ' ';

            // Reuse the existing autosave listener rather than duplicating it.
            textarea.dispatchEvent(new Event('input'));
            textarea.scrollTop = textarea.scrollHeight;
        }

        function startRecognition() {
            stopSpeaking();
            const recognition = new SpeechRecognitionCtor();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = navigator.language || 'en-US';

            recognition.onstart = () => {
                setListeningUI(true);
                setStatus('Listening…');
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }
                if (finalTranscript) insertTranscript(finalTranscript);
            };

            recognition.onerror = (event) => {
                let message;
                switch (event.error) {
                    case 'not-allowed':
                    case 'service-not-allowed':
                        message = 'Microphone access was blocked — check your browser/site permissions.';
                        break;
                    case 'no-speech':
                        message = 'No speech detected.';
                        break;
                    case 'audio-capture':
                        message = 'No microphone was found.';
                        break;
                    case 'network':
                        message = 'A network error interrupted dictation.';
                        break;
                    default:
                        message = `Dictation error: ${event.error}`;
                }
                setStatus(message);
            };

            recognition.onend = () => {
                setListeningUI(false);
                if (activeRecognition === recognition) activeRecognition = null;
                if (statusEl.textContent === 'Listening…') setStatus('');
            };

            activeRecognition = recognition;
            recognition.start();
        }

        micBtn.addEventListener('click', () => {
            if (isListening) {
                stopActiveDictation(); // triggers onend, which resets the UI
            } else {
                startRecognition();
            }
        });
    }


    /* ───────────────────────── UI wiring ───────────────────────── */

    document.getElementById('sidebarToggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('collapsed');
    });

    document.getElementById('newDropdownBtn').addEventListener('click', () => {
        document.getElementById('newMenu').classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('newDropdown') || document.querySelector('.new-dropdown');
        if (dropdown && !dropdown.contains(e.target)) {
            document.getElementById('newMenu').classList.remove('open');
        }
        if (openMenuEl && !openMenuEl.parentElement.contains(e.target)) {
            closeAllItemMenus();
        }
    });

    // Safety net: if a drag ends without landing on a valid drop target
    // (dropped outside the sidebar, Escape pressed, etc.), make sure stale
    // drag state doesn't linger and affect the next, unrelated drag.
    document.addEventListener('dragend', () => {
        draggedItem = null;
        document.querySelectorAll('.drag-over').forEach((el) => el.classList.remove('drag-over'));
    });

    document.getElementById('newFolderOption').addEventListener('click', () => {
        document.getElementById('newMenu').classList.remove('open');
        openFolderModal();
    });

    async function createPageInFolder(folderId, subfolderId) {
        const folder = folders.find((f) => f.id === folderId);
        if (!folder) return;

        let targetArray;
        if (subfolderId) {
            const subfolder = (folder.subfolders || []).find((sf) => sf.id === subfolderId);
            if (!subfolder) return;
            subfolder.pages = subfolder.pages || [];
            targetArray = subfolder.pages;
        } else {
            folder.pages = folder.pages || [];
            targetArray = folder.pages;
        }

        const newPage = {
            id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
            title: `Untitled page ${targetArray.length + 1}`,
            content: '',
            createdAt: Date.now()
        };
        targetArray.push(newPage);
        await putFolder(folder);
        selectedFolderId = folder.id;
        selectedSubfolderId = subfolderId || null;
        await refreshFolderList();
        openPage(folder.id, newPage.id, subfolderId || null);
    }

    function openFolderModal() {
        document.getElementById('subjectInput').value = '';
        document.getElementById('qualificationInput').value = '';
        document.getElementById('boardInput').value = '';
        document.getElementById('matchSuggestion').classList.remove('show');
        pendingMatchFolder = null;
        document.getElementById('folderModalOverlay').classList.add('open');
    }

    function closeFolderModal() {
        document.getElementById('folderModalOverlay').classList.remove('open');
    }

    document.getElementById('cancelFolderBtn').addEventListener('click', closeFolderModal);
    document.getElementById('folderModalOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'folderModalOverlay') closeFolderModal();
    });

    document.getElementById('submitFolderBtn').addEventListener('click', async () => {
        const subject = document.getElementById('subjectInput').value.trim();
        const qualification = document.getElementById('qualificationInput').value.trim();
        const examBoard = document.getElementById('boardInput').value.trim();

        if (!subject || !qualification || !examBoard) return;

        const match = findSimilarFolder(subject, qualification, examBoard, folders);
        if (match && !pendingMatchFolder) {
            pendingMatchFolder = match;
            document.getElementById('matchSuggestionText').textContent =
                `This looks similar to an existing folder: "${folderLabel(match)}".`;
            document.getElementById('matchSuggestion').classList.add('show');
            return; // wait for the user to choose
        }

        await createFolder(subject, qualification, examBoard);
        closeFolderModal();
    });

    document.getElementById('useExistingBtn').addEventListener('click', () => {
        if (pendingMatchFolder) {
            selectFolder(pendingMatchFolder.id);
        }
        closeFolderModal();
    });

    document.getElementById('createAnywayBtn').addEventListener('click', async () => {
        const subject = document.getElementById('subjectInput').value.trim();
        const qualification = document.getElementById('qualificationInput').value.trim();
        const examBoard = document.getElementById('boardInput').value.trim();
        await createFolder(subject, qualification, examBoard);
        closeFolderModal();
    });

    async function createFolder(subject, qualification, examBoard) {
        const id = await putFolder({ subject, qualification, examBoard, pages: [], createdAt: Date.now() });
        await refreshFolderList();
        selectFolder(id);
    }

    /* ───────────────────────── Gate + boot ───────────────────────── */

    async function getStoredSubscriptionId() {
        return getAuthRecord('subscriptionId');
    }

    async function refreshTokenFromBackend() {
        // Called when there's no usable token yet — re-fetches using whatever
        // subscription ID was stored at signup time, if any.
        try {
            const subId = await getStoredSubscriptionId();
            if (!subId) return null;

            const resp = await fetch(`${BACKEND_URL}/api/token?subscriptionId=${encodeURIComponent(subId)}`);
            if (!resp.ok) return null;
            const { token } = await resp.json();
            await saveToken(token);
            return token;
        } catch (err) {
            console.error('LastMind: could not refresh token from backend.', err);
            return null;
        }
    }

    document.getElementById('myAccountBtn').addEventListener('click', async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        document.getElementById('myAccountEmail').textContent = session?.user ? session.user.email : '';
        document.getElementById('newAccountPasswordInput').value = '';
        document.getElementById('accountSettingsStatus').textContent = '';
        document.getElementById('accountSettingsStatus').classList.remove('error');
        document.getElementById('myAccountOverlay').classList.add('open');
    });

    document.getElementById('cancelAccountSettingsBtn').addEventListener('click', () => {
        document.getElementById('myAccountOverlay').classList.remove('open');
    });

    document.getElementById('myAccountOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'myAccountOverlay') {
            document.getElementById('myAccountOverlay').classList.remove('open');
        }
    });

    document.getElementById('saveAccountSettingsBtn').addEventListener('click', async () => {
        const newPassword = document.getElementById('newAccountPasswordInput').value;
        const statusEl = document.getElementById('accountSettingsStatus');
        const saveBtn = document.getElementById('saveAccountSettingsBtn');

        if (!newPassword || newPassword.length < 6) {
            statusEl.textContent = 'Password must be at least 6 characters.';
            statusEl.classList.add('error');
            return;
        }

        saveBtn.disabled = true;
        statusEl.classList.remove('error');
        statusEl.textContent = 'Saving…';

        const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

        saveBtn.disabled = false;
        if (error) {
            statusEl.textContent = error.message;
            statusEl.classList.add('error');
        } else {
            statusEl.textContent = 'Password updated.';
            document.getElementById('newAccountPasswordInput').value = '';
        }
    });

    // Uses the login-based portal endpoint (verified session, not a
    // locally-stored subscription ID) — works reliably regardless of
    // whether this device was the one that originally checked out.
    document.getElementById('manageSubscriptionBtn').addEventListener('click', async () => {
        const btn = document.getElementById('manageSubscriptionBtn');
        btn.disabled = true;
        btn.textContent = 'Loading…';

        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) throw new Error('not logged in');

            const resp = await fetch(`${BACKEND_URL}/api/portal-for-user`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${session.access_token}` }
            });
            if (!resp.ok) throw new Error(`Portal endpoint returned ${resp.status}`);
            const { url } = await resp.json();
            window.location.href = url;
        } catch (err) {
            console.error('LastMind: could not open the subscription management portal.', err);
            alert('Could not open subscription management right now. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Manage Subscription';
        }
    });

    // Sets the app-unlock UI in one place, and — importantly — configures
    // the topbar button correctly for whichever state the person is in:
    // free users see "Upgrade" (-> checkout), already-paid users see "Buy
    // More Tokens" instead, since "upgrade" doesn't make sense once you're
    // already on Premium. Token purchases aren't built yet — this is a
    // clearly-labelled placeholder for now, same pattern as Compile
    // originally was, not a silent dead end.
    async function enterApp(paid) {
        isPaidUser = paid;

        const upgradeBtn = document.getElementById('upgradeBtn');
        if (paid) {
            upgradeBtn.textContent = 'Buy More Tokens';
            upgradeBtn.onclick = () => {
                alert('Token top-ups are coming soon!');
            };
        } else {
            upgradeBtn.textContent = 'Upgrade';
            upgradeBtn.onclick = () => {
                window.location.href = '/subscribe?action=upgrade';
            };
        }

        document.getElementById('gate-message').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        await refreshFolderList();
    }

    (async function gate() {
        // ── TEMPORARY: lets you view /learn before hosting/backend exist. ──
        // Visiting the page with ?preview=1 skips the JWT check entirely.
        // Delete this whole block once your backend is live and you don't
        // want the bypass reachable anymore.
        if (new URLSearchParams(window.location.search).has('preview')) {
            console.warn('LastMind: running in PREVIEW MODE — the subscription gate is bypassed. Remove the ?preview=1 block in learn.html before going live.');
            await enterApp(true); // preview mode shows the full paid experience
            return;
        }

        const publicKey = await importPublicKey(PUBLIC_KEY_PEM);

        let token = await getStoredToken().catch(() => null);
        let payload = token ? await verifyJWT(token, publicKey) : null;

        if (!payload) {
            token = await refreshTokenFromBackend();
            payload = token ? await verifyJWT(token, publicKey) : null;
        }

        if (payload) {
            await enterApp(true);
            return;
        }

        // No usable device-local JWT — try the login-anywhere path instead.
        // This is NOT "a Supabase session exists, so let them in" (that was
        // the security hole we removed) — the backend independently verifies
        // this session's access token against Supabase itself before it will
        // ever look up or return anything.
        let supabaseSession = null;
        try {
            const { data } = await supabaseClient.auth.getSession();
            supabaseSession = data.session;

            if (supabaseSession) {
                const resp = await fetch(`${BACKEND_URL}/api/token-for-user`, {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${supabaseSession.access_token}` }
                });
                if (resp.ok) {
                    const { token: linkedToken, subscriptionId: linkedSubId } = await resp.json();
                    payload = await verifyJWT(linkedToken, publicKey);
                    if (payload) {
                        await saveToken(linkedToken);
                        if (linkedSubId) await putAuthRecord('subscriptionId', linkedSubId);
                    }
                }
            }
        } catch (err) {
            console.error('LastMind: login-anywhere check failed.', err);
        }

        if (payload) {
            await enterApp(true);
            return;
        }

        // No active paid subscription found either way — but if they're at
        // least logged in, let them in as free tier (framework + folders +
        // dictation/TTS, no Compile) rather than bouncing them out entirely.
        // Paying is optional here, not a requirement to use the app at all.
        if (supabaseSession) {
            await enterApp(false);
            return;
        }

        // Not logged in at all — nothing to offer, send them to create an
        // account (still free at this point; paying is optional there too).
        window.location.href = '/subscribe';
    })();
</script>
