        <path d="M16,32 L80,12"/><path d="M16,32 L80,52"/><path d="M80,12 L144,32"/><path d="M80,52 L144,32"/>
        <circle cx="16" cy="32" r="5"/><circle cx="80" cy="12" r="5"/><circle cx="80" cy="52" r="5"/><circle cx="144" cy="32" r="5"/>
    </svg>`;
    // Rotates the loading line every 1.8s for as long as generation is in
    // flight - returns a stop function the caller runs once the real
    // result (or an error) is ready, so the interval never outlives the
    // card it was updating.
    function startLoadingRotator(textEl, messages) {
        let i = 0;
        textEl.textContent = messages[0];
        // Real, reported confusion this fixes: this used to wrap back to
        // messages[0] (`% messages.length`) once it reached the end, so a
        // generation slower than one lap visibly repeated "figuring out how
        // to teach this" AFTER "writing the question" had already shown -
        // reading as if it had forgotten its own progress and started over,
        // not as if it were simply still working. Now just holds on the
        // final message ("Nearly ready…") instead of looping back to the
        // first one; the 14s failsafe below still kicks in for a genuinely
        // long wait.
        const timer = setInterval(() => {
            if (i < messages.length - 1) i++;
            textEl.textContent = messages[i];
        }, 1800);
        // Real, reported confusion this fixes: a stage covering several map
        // nodes at once (see plan_stages.js's subtopic-merge fix) routinely
        // takes several sequential Claude attempts, comfortably past a
        // single lap of these 5 messages - not an edge case, the norm for
        // this kind of stage. 14s/"than usual" was firing on basically every
        // generation, which is a contradiction in terms - "usual" cannot
        // mean "every time". Raised well past a typical multi-attempt
        // generation's real duration, and reworded to not claim something
        // that isn't true just because it's slow.
        const longWaitTimer = setTimeout(() => {
            clearInterval(timer);
            textEl.textContent = "Still working on this one - it hasn't failed, this can genuinely take a while. Hang tight.";
        }, 45000);
        return () => { clearInterval(timer); clearTimeout(longWaitTimer); };
    }

    // Assigns each node a "level" = 1 + the deepest level among its own
    // prerequisites (0 for a node with none) - a real DAG layering, not
    // just generation order, so nodes that don't depend on each other land
    // in the same row instead of being forced into one artificial
    // sequence. A mechanism with independent branches, or several parents
    // converging on one node, actually looks like that once laid out this
    // way, rather than reading as a single straight line. `nodes` must
    // already be topologically sorted (see topicTopologicalOrder) so every
    // prerequisite's level is already known by the time its dependents are
    // processed.
    function topicComputeLevels(nodes, edges) {
        const depsOf = new Map(nodes.map((n) => [n.id, []]));
        edges.forEach((e) => { if (depsOf.has(e.to)) depsOf.get(e.to).push(e.from); });
        const levelOf = new Map();
        nodes.forEach((n) => {
            const deps = depsOf.get(n.id) || [];
            levelOf.set(n.id, deps.length ? Math.max(...deps.map((d) => levelOf.get(d) ?? 0)) + 1 : 0);
        });
        return levelOf;
    }

    // Draws the map's real prerequisite edges as curved lines between each
    // node's own rendered box - run AFTER the boxes are in the DOM so real,
    // wrapped-text box sizes/positions are used rather than an assumed
    // fixed layout. `wrapEl` is position:relative; `svgEl` sits over it via
    // position:absolute;inset:0 in CSS, sized here to match.
    // A bare icon on its own isn't self-explanatory - renderTopicMap prints
    // a matching text legend under the map (its "key") using these same two
    // characters, so a student only ever has to learn what they mean once.
    const TOPIC_NODE_ICONS = { skip: '✓', target: '★' };

    function drawTopicGraphEdges(wrapEl, svgEl, state) {
        const wrapRect = wrapEl.getBoundingClientRect();
        svgEl.setAttribute('width', wrapRect.width);
        svgEl.setAttribute('height', wrapRect.height);
        svgEl.setAttribute('viewBox', `0 0 ${wrapRect.width} ${wrapRect.height}`);
        // Real, reported request: the edges had no direction indicator at
        // all - just a bare line. markerUnits="userSpaceOnUse" (fixed pixel
        // size, not scaled by the path's own stroke-width or length) keeps
        // every arrowhead the same size regardless of how long or short an
        // edge is. innerHTML replaces the whole SVG on every re-render (a
        // skip/target click), so <defs> is included in that same string
        // rather than added once separately, or it would be wiped out on
        // the next render.
        const defs = `<defs><marker id="topicArrowhead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="topic-graph-arrowhead" d="M0,0 L10,5 L0,10 z" /></marker></defs>`;
        const paths = state.edges.map((e) => {
            const fromEl = wrapEl.querySelector(`[data-node="${e.from}"]`);
            const toEl = wrapEl.querySelector(`[data-node="${e.to}"]`);
            if (!fromEl || !toEl) return '';
            const fr = fromEl.getBoundingClientRect(), tr = toEl.getBoundingClientRect();
            const x1 = fr.left + fr.width / 2 - wrapRect.left, y1 = fr.bottom - wrapRect.top;
            const x2 = tr.left + tr.width / 2 - wrapRect.left, y2 = tr.top - wrapRect.top;
            const midY = (y1 + y2) / 2;
            return `<path class="topic-graph-edge" d="M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}" marker-end="url(#topicArrowhead)" />`;
        }).join('');
        svgEl.innerHTML = defs + paths;
    }

    // `state` is one specific map's own object (subject/qualification/
    // examBoard/nodes/edges/skip/target) - never the shared topicMapState
    // variable directly, so a chat with more than one "teach me" in it
    // keeps each restored map card independently interactive (ticking a
    // box on an OLDER map must not touch a newer one's state). Every click
    // handler below closes over this same `state` object, not a global.
    // Renders (or re-renders, after a skip/target click) the whole map on
    // one screen as a real layered graph - one row per DAG level, nodes at
    // the same level side by side, edges drawn to wherever they actually
    // go - instead of a single top-to-bottom list, since a mechanism's real
    // prerequisite structure isn't always one straight line.
    function renderTopicMap(cardEl, state) {
        const depsOf = new Map(state.nodes.map((n) => [n.id, []]));
        state.edges.forEach((e) => { if (depsOf.has(e.to)) depsOf.get(e.to).push(e.from); });
        const labelOf = new Map(state.nodes.map((n) => [n.id, n.label]));
        const levelOf = topicComputeLevels(state.nodes, state.edges);
        const maxLevel = state.nodes.length ? Math.max(...state.nodes.map((n) => levelOf.get(n.id))) : 0;
        const rows = Array.from({ length: maxLevel + 1 }, () => []);
        state.nodes.forEach((n) => rows[levelOf.get(n.id)].push(n));

        // Title only - no description, no "Builds on:" text - the box just
        // names the concept; what it depends on is what the drawn edges
        // above already show. skip/target used to be two spelled-out
        // buttons per box, which is what was pushing every box tall enough
        // to overlap the row below it; now two small icon circles (see
        // TOPIC_NODE_ICONS/the legend line below the map, which is the
        // "key" for what each one means, since a bare icon alone isn't
        // self-explanatory).
        const nodeBoxHtml = (n) => {
            const skipped = state.skip.has(n.id);
            const isTarget = n.id === state.target;
            // Deliberately plain, no dulled/highlighted/locked treatment
            // here (see .topic-node-box.done/.todo in learn/index.html's
            // "Your Mind" graph for that) - real, reported product
            // decision: this compact in-chat preview stays the same for
            // every node regardless of completion or relevance to the
            // current goal.
            return `<div class="topic-node-box" data-node="${n.id}">
                <div class="topic-node-title" style="${skipped ? 'opacity:.6;text-decoration:line-through;' : ''}">${escapeHtmlTopic(n.label)}</div>
                <div class="topic-node-actions">
                    <button type="button" class="topic-node-icon-btn${skipped ? ' on' : ''}" data-action="skip" data-node="${n.id}" title="I've covered this">${TOPIC_NODE_ICONS.skip}</button>
                    <button type="button" class="topic-node-icon-btn${isTarget ? ' on' : ''}" data-action="target" data-node="${n.id}" title="Make this the goal">${TOPIC_NODE_ICONS.target}</button>
                </div>
            </div>`;
        };

        const teach = topicComputeTeachSet(state);
        const targetLabel = labelOf.get(state.target) || state.target;
        const summary = teach.length
            ? `Teaching <b>${teach.length}</b> node${teach.length === 1 ? '' : 's'} to get you to “${escapeHtmlTopic(targetLabel)}”.`
            : `You already know everything needed for this target - pick a further one, or start anyway.`;

        cardEl.innerHTML = `
            <div class="topic-map-heading">Your mind map for “${escapeHtmlTopic(state.subject)}”</div>
            <div class="topic-graph-wrap">
                <svg class="topic-graph-svg"></svg>
                <div class="topic-graph-rows">
                    ${rows.map((row) => `<div class="topic-graph-row">${row.map(nodeBoxHtml).join('')}</div>`).join('')}
                </div>
            </div>
            <div class="topic-map-summary">${summary}</div>
            <div class="topic-map-legend">${TOPIC_NODE_ICONS.skip} I've already covered this &nbsp;·&nbsp; ${TOPIC_NODE_ICONS.target} Make this the goal</div>
        `;

        drawTopicGraphEdges(cardEl.querySelector('.topic-graph-wrap'), cardEl.querySelector('.topic-graph-svg'), state);

        cardEl.querySelectorAll('[data-action="skip"]').forEach((btn) => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.node;
                if (state.skip.has(id)) state.skip.delete(id); else state.skip.add(id);
                renderTopicMap(cardEl, state);
            });
        });
        cardEl.querySelectorAll('[data-action="target"]').forEach((btn) => {
            btn.addEventListener('click', () => { state.target = btn.dataset.node; renderTopicMap(cardEl, state); });
        });
    }

    // Background refresh of which nodes are actually already taught,
    // against the real concept_reviews progress table (not a client-side
    // guess) - called right after a restored map's first paint, same
    // "paint immediately, then sync" shape as the rest of this app's own
    // server-sync code. A plain cache hit against /knowledge-map-v2/topic
    // (this topic's map already exists), so no real generation cost.
    // cardEl is optional - omit it to just update state.skip without a map
    // card to re-render (see startTopicTeachSequence's own awaited call).
    async function refreshTopicNodeCompletion(cardEl, state) {
        try {
            const accessToken = await getSyncAccessToken();
            if (!accessToken) return;
            const resp = await fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2/topic`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
                body: JSON.stringify({ topic: state.subject }),
            });
            if (!resp.ok) return;
            const data = await resp.json();
            if (!Array.isArray(data.nodes)) return;
            let changed = false;
            data.nodes.forEach((n) => {
                if (n.completed && !state.skip.has(n.id)) { state.skip.add(n.id); changed = true; }
            });
            if (changed && cardEl) renderTopicMap(cardEl, state);
        } catch (err) {
            console.error('LastMind Cortex: could not refresh this map\'s completion status.', err);
        }
    }

    // The topic map's own nodes are keyed by node_key (a short slug, unique
    // only within this one topic's graph - see topicKnowledgeMapService.ts)
    // since that's all the map-building endpoint ever needed to hand back.
    // Actually teaching a node needs its real knowledge_map_nodes.id (uuid)
    // instead - GET /knowledge-map-v2/node/:nodeId/lesson is keyed on that,
    // same as every curated subject. Rather than changing the topic-map
    // endpoint's own response shape, this reuses the EXISTING subject-map
    // read (GET /knowledge-map-v2, already returns real uuids) and joins on
    // conceptId, which is the one id that's stable and identical across
    // both representations (clean(subject):clean(nodeKey), see
    // topicKnowledgeMapService.ts's own clean()).
    async function fetchTopicNodeUuids(subject, qualification, examBoard) {
        const accessToken = await getSyncAccessToken();
        if (!accessToken) throw new Error('not signed in');
        const params = new URLSearchParams({ subject, qualification, examBoard });
        const resp = await fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2?${params.toString()}`, {
            headers: { Authorization: `Bearer ${accessToken}` }
        });
        if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
        const data = await resp.json();
        const byConceptId = new Map();
        (data.nodes || []).forEach((n) => byConceptId.set(n.conceptId, n.id));
        return byConceptId;
    }

    // Same /learn/derive/player.html every other lesson in the app uses
    // (see learn/index.html's sfBuildDerivationSlides) and the same
    // lm-derive-* postMessage handshake, just hosted inside a chat card
    // here instead of the dashboard's fullscreen lesson workspace - there
    // is deliberately no separate page this ever navigates to. Recap/
    // immediate-recall/Day-1-check interruptions the dashboard's spaced-
    // repetition feed layers on top of this same player are NOT
    // reproduced here - this is a first-time, linear walk through a
    // brand-new topic's nodes in order, not a standing review queue.
    const DERIVE_PLAYER_VERSION = '20260923a'; // keep in sync with learn/index.html's own constant
    function mountDerivationInCard(card, derivation, nodeUuid, onDone) {
        activeLessonNodeUuid = nodeUuid;
        card.innerHTML = `
            <div class="lesson-card-label">Lesson</div>
            <div class="lesson-card-frame-wrap"><iframe src="/learn/derive/player.html?v=${DERIVE_PLAYER_VERSION}" title="Lesson"></iframe></div>
        `;
        const frame = card.querySelector('iframe');
        let answered = false;
        let completionPromise = null;
        const cs = getComputedStyle(document.documentElement);
        const look = { text: cs.getPropertyValue('--text').trim() || '#F1EAD6', rgb: cs.getPropertyValue('--panel-rgb').trim() || '18, 24, 31' };
        const onMessage = async (e) => {
            if (e.origin !== window.location.origin || e.source !== frame.contentWindow || !e.data) return;
            if (e.data.type === 'lm-derive-ready') {
                frame.contentWindow.postMessage({ type: 'lm-derive-init', data: derivation.payload, checkpoint: null, look }, window.location.origin);
                try { frame.focus(); frame.contentWindow.focus(); } catch (err) { /* focus is a convenience */ }
            } else if (e.data.type === 'lm-derive-complete' && !answered) {
                answered = true;
                completionPromise = (async () => {
                    try {
                        const accessToken = await getSyncAccessToken();
                        await fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2/derivation/complete`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
                            body: JSON.stringify({ stage: derivation.stage }),
                        });
                    } catch (err) { console.error('LastMind: could not record this lesson.', err); }
                })();
                await completionPromise;
            } else if (e.data.type === 'lm-derive-continue' && answered) {
                if (completionPromise) await completionPromise;
                window.removeEventListener('message', onMessage);
                onDone();
            }
            // lm-derive-open-map / lm-derive-toggle-size: no-ops here - there is
            // no separate map view or fullscreen mode to hand off to from a chat card.
        };
        window.addEventListener('message', onMessage);
    }

    // Attempts exactly ONE node - the current one - and stops there on
    // failure with a retry option, rather than automatically racing ahead
    // through the rest of the queue. That racing-ahead behaviour used to
    // exist (deferring a failed node to the back and immediately trying
    // the next one, and the next, ...) and was a real, reported problem on
    // two fronts: it looked like the app was "trying to prepare every
    // lesson" at once instead of just the one actually needed, and every
    // one of those extra attempts could ALSO trigger a second, real, paid
    // generation server-side (see the route's own DerivationStageNotReadyError
    // handling) - i.e. a real, confirmed cost multiplier, not just a UX
    // annoyance. One attempt, one clear outcome, retried only on request.
    async function teachNextInQueue(state, queue, index, uuidByConceptId) {
        if (index >= queue.length) {
            appendCardMessage(`<div class="lesson-card-done">You've covered everything for “${escapeHtmlTopic(state.subject)}” for now. Nice work.</div>`);
            recordSilentContext(`[The student just finished every lesson in the "${state.subject}" knowledge map.]`, 'allDone', { subject: state.subject });
            return;
        }
        const node = queue[index];
        const card = appendCardMessage(`
            <div class="lesson-card-label">${escapeHtmlTopic(node.label)}</div>
            <div class="lesson-card-status"></div>
        `);
        const stopLessonRotator = startLoadingRotator(card.querySelector('.lesson-card-status'), lessonLoadingMessages(node.label));
        pendingLessonRetry = null;
        const nodeUuid = uuidByConceptId.get(node.conceptId);
        if (!nodeUuid) {
            stopLessonRotator();
            card.querySelector('.lesson-card-status').textContent = "Couldn't find this concept - try again in a moment.";
            return;
        }

        function showRetryable(message) {
            stopLessonRotator();
            const statusEl = card.querySelector('.lesson-card-status');
            statusEl.innerHTML = `${escapeHtmlTopic(message)} <button type="button" class="topic-map-start" id="lessonRetryBtn">Try again</button> <button type="button" class="topic-map-start" id="lessonSkipBtn">Skip this one for now</button>`;
            pendingLessonRetry = () => { card.remove(); teachNextInQueue(state, queue, index, uuidByConceptId); };
            statusEl.querySelector('#lessonRetryBtn').addEventListener('click', () => { const retry = pendingLessonRetry; pendingLessonRetry = null; retry(); });
            // Moving past a lesson that will not build, so one stuck concept never blocks everything after it.
            statusEl.querySelector('#lessonSkipBtn').addEventListener('click', () => {
                pendingLessonRetry = null; skipConcepts(state, [node.conceptId]);
                recordSilentContext(`[The lesson on "${node.label}" could not be built and was skipped for now.]`, 'lessonSkipped', { label: node.label, conceptIds: [node.conceptId] });
                statusEl.textContent = 'Skipped for now. Moving on to the next lesson.';
                let nextIndex = index + 1; while (nextIndex < queue.length && state.skip.has(queue[nextIndex].id)) nextIndex++;
                if (nextIndex >= queue.length) { appendCardMessage(`<div class="lesson-card-done">That was the last lesson in “${escapeHtmlTopic(state.subject)}” for now.</div>`); return; }
                teachNextInQueue(state, queue, nextIndex, uuidByConceptId);
            });
        }

        // The request can now be stopped: Cancel, or running out of time, aborts it, and the server stops generating (and stops spending)
        // as soon as the connection goes. Before this, a lesson that was slow or stuck could only be waited out.
        const lessonAbort = new AbortController();
        let cancelledByStudent = false, timedOut = false;
        const cancelRow = document.createElement('div');
        cancelRow.innerHTML = '<button type="button" class="topic-map-start" style="margin-top:8px">Cancel</button>';
        card.appendChild(cancelRow);
        cancelRow.querySelector('button').addEventListener('click', () => { cancelledByStudent = true; lessonAbort.abort(); });
        const lessonTimer = setTimeout(() => { timedOut = true; lessonAbort.abort(); }, 4 * 60 * 1000);

        let lessonData;
        try {
            const accessToken = await getSyncAccessToken();
            // Retries a plain network/server error (not a 409 - that's a
            // real, meaningful rejection, not a hiccup) up to twice with a
            // growing delay, same convention learn/index.html's own
            // fetchSubjectKnowledgeMapWithRetry already uses - this route
            // triggers a real generation on a cache miss, and the compile
            // backend's free Render tier can hand back an outright 502/503
            // for a request that lands while it's still waking from idle,
            // which otherwise reads as a genuine failure ("Could not load
            // this lesson") even though the exact same request succeeds
            // seconds later. Never retries the 409 case itself.
            // Real, reported bug this fixes: this only meant to retry an
            // actual transient/cold-start-shaped response (502/503/504) -
            // but the condition retried on ANY non-ok, non-409 status,
            // including a genuine 500 (a real checker rejection AFTER real,
            // paid generation attempts - see derivationGenericGenerate).
            // That meant one failed generation triggered this loop 3 times,
            // and each of those 3 calls independently ran the backend's own
            // up-to-3-attempt Claude loop again from scratch (nothing was
            // cached to short-circuit it) - up to 3x3=9 real Claude calls
            // for one failure that was never going to succeed on a plain
            // retry, which is also why the loading messages were cycling
            // through so many times before finally failing.
            let resp;
            for (let attempt = 0; ; attempt++) {
                resp = await fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2/node/${encodeURIComponent(nodeUuid)}/lesson`, {
                    headers: { Authorization: `Bearer ${accessToken}` },
                    signal: lessonAbort.signal
                });
                if (![502, 503, 504].includes(resp.status) || attempt >= 2) break;
                await new Promise((resolve) => setTimeout(resolve, 2500 * (attempt + 1)));
            }
            // 409/DERIVATION_NOT_READY: this node's own stage genuinely
            // isn't generatable yet (an earlier stage it depends on hasn't
            // been produced) - the route rejects this BEFORE spending
            // anything, so retrying costs nothing but is also not
            // guaranteed to help until an earlier node's own lesson has
            // actually been opened. Same visible outcome as any other
            // failure here: one clear message, one retry button, no
            // automatic cascade to other nodes.
            if (resp.status === 409) {
                showRetryable("Couldn't generate an interactive lesson for this yet - try an earlier concept first, or try this again in a moment.");
                recordSilentContext(`[Could not generate an interactive lesson for "${node.label}" yet - a plain "try again" from the student retries it directly, no action from you needed.]`, 'lessonFailed', { label: node.label });
                return;
            }
            if (!resp.ok) {
                // Real, reported problem this fixes: "the server may just be
                // waking up" was shown for EVERY failure here, including a
                // genuine checker rejection after real, paid generation
                // attempts (a 500 from the route's own try/catch - see
                // knowledgeMap.ts) that has nothing to do with the server
                // sleeping - flatly wrong on a paid Render plan that never
                // spins down, and confusing/misleading regardless. A
                // network-level failure (502/503/504, or no response at
                // all) is the only case that's genuinely a transient/
                // infra issue worth blaming on the server itself.
                let bodyDetail = null;
                try { ({ detail: bodyDetail } = await resp.json()); } catch (parseErr) { /* not JSON - status code is all we have */ }
                const err = new Error(bodyDetail || `Server returned ${resp.status}`);
                err.genuineFailure = ![502, 503, 504].includes(resp.status);
                throw err;
            }
            lessonData = await resp.json();
            stopLessonRotator();
            clearTimeout(lessonTimer);
            cancelRow.remove();
        } catch (err) {
            clearTimeout(lessonTimer);
            cancelRow.remove();
            if (cancelledByStudent || timedOut) {
                showRetryable(cancelledByStudent
                    ? "Stopped. Nothing more is being spent on it. Say \"build the lesson again\" whenever you want another go."
                    : "That is taking much longer than it should, so I have stopped it. Nothing more is being spent on it.");
                return;
            }
            console.error('LastMind Cortex: lesson generation failed.', err.message);
            // "detail" (see knowledgeMap.ts) is the actual structural
            // validate() failure (e.g. "not atomic: only 3 new terms") -
            // shown directly rather than a flat generic line, so a repeated
            // failure can actually be diagnosed from what's on screen,
            // without needing server log access.
            showRetryable(err.genuineFailure
                ? `Couldn't generate an interactive lesson for this${err.message ? ` (${err.message})` : ''} - try again, or try a different concept.`
                : 'Could not reach the server just now - this often works on retry.');
            return;
        }
        if (!lessonData.derivation) {
            showRetryable("Couldn't generate an interactive lesson for this.");
            recordSilentContext(`[Could not generate an interactive lesson for "${node.label}" - a plain "try again" from the student retries it directly, no action from you needed.]`, 'lessonFailed', { label: node.label });
            return;
        }
        // Fire-and-forget: the moment THIS lesson is confirmed ready, start
        // generating the next one in the background so it's very likely
        // already cached by the time the student finishes this one, instead
        // of making them wait through a fresh generation every single node.
        // Same route, same cost either way - just moved earlier so it
        // overlaps the student's own time on the current lesson rather than
        // running only after they click through. A rejection here (out-of-
        // order stage) is silently swallowed - teachNextInQueue's own
        // deferral handles that node properly when its actual turn comes.
        const nextNode = queue[index + 1];
        if (nextNode) {
            const nextUuid = uuidByConceptId.get(nextNode.conceptId);
            if (nextUuid) {
                getSyncAccessToken()
                    .then((token) => token && fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2/node/${encodeURIComponent(nextUuid)}/lesson`, { headers: { Authorization: `Bearer ${token}` } }))
                    .catch(() => {});
            }
        }
        // Save the playable lesson before mounting it. If the browser is
        // closed at any point during the lesson, restoreChatHistory can now
        // reconstruct this exact card instead of restoring only the chat
        // bubbles that happened to precede it.
        const activeLessonTurn = recordSilentContext(
            `[The lesson on "${node.label}" is open and ready to take.]`,
            'lessonActive',
            {
                label: node.label,
                conceptId: node.conceptId,
                conceptIds: lessonData.derivation.concepts || [node.conceptId],
                nodeUuid,
                derivation: lessonData.derivation,
            }
        );
        mountDerivationInCard(card, lessonData.derivation, nodeUuid, () => {
            // Real, reported bug this fixes: a stage now commonly covers
            // SEVERAL map nodes at once (see plan_stages.js's subtopic-
            // merge fix), but this queue is a flat list of individual map
            // NODES - just advancing to index+1 could land on a different
            // node that happens to share the exact same stage as the one
            // just finished, which is already cached, so the student saw
            // the identical lesson repeat. derivation.concepts (see
            // knowledgeMap.ts) lists every concept id this one stage
            // actually covers - skip past all of them, not just this one
            // node, to reach the next genuinely new stage.
            const covered = new Set(lessonData.derivation.concepts || [node.conceptId]);
            // Also fed into state.skip immediately (not just the queue
            // above) - real, reported bug this fixes: re-entering via
            // beginQueuedLessons' own fallback (no pendingLessonContinuation
            // waiting - e.g. after a page reload) calls
            // startTopicTeachSequence(state) fresh, which recomputes the
            // teach set from scratch via topicComputeTeachSet - that ONLY
            // ever excluded manually-ticked "I've covered this" nodes, never
            // anything actually completed live, so restarting it repeated
            // the exact same already-finished lesson. conceptIds is also
            // recorded into chatHistory (not just label) so a restore across
            // a real reload can rebuild this same skip set - see
            // renderRestoredSilentTurn's own 'map' branch.
            skipConcepts(state, covered);
            activeLessonTurn.content = `[Completed the lesson on "${node.label}".]`;
            activeLessonTurn.kind = 'lessonDone';
            activeLessonTurn.data = { label: node.label, conceptIds: [...covered] };
            saveChatHistory();
            // The lesson player's own Continue button is the student's
            // explicit pacing decision. Do not ask the same question again
            // in chat; Continue advances directly to the next new stage.
            let nextIndex = index + 1;
            while (nextIndex < queue.length && covered.has(queue[nextIndex].conceptId)) nextIndex++;
            if (nextIndex >= queue.length) {
                appendCardMessage(`<div class="lesson-card-done">You've covered everything for “${escapeHtmlTopic(state.subject)}” for now. Nice work.</div>`);
                recordSilentContext(`[The student just finished every lesson in the "${state.subject}" knowledge map.]`, 'allDone', { subject: state.subject });
                return;
            }
            teachNextInQueue(state, queue, nextIndex, uuidByConceptId);
        });
    }

    async function startTopicTeachSequence(state) {
        // Put the lesson card on screen before the first network request.
        // sendChatMessage hands off to this function by removing its generic
        // thinking bubble, so waiting until after refreshTopicNodeCompletion
        // left a very visible several-second gap on a cold backend.
        const card = appendCardMessage(`<div class="lesson-card-status"></div>`);
        const statusEl = card.querySelector('.lesson-card-status');
        const stopStartingRotator = startLoadingRotator(statusEl, [
            'Starting your lesson…',
            'Checking your progress…',
            'Finding the right lesson stage…',
            'Preparing the lesson…',
            'Still working — your lesson is on its way…',
        ]);
        // Real, reported bug this fixes: a restored map's completion status
        // refreshes in the background (see renderRestoredSilentTurn) and
        // isn't awaited there - fine for painting the map itself, but a
        // genuine race if the student replies fast enough to ask for the
        // next lesson BEFORE that background check finishes: state.skip
        // would still be at its stale/empty starting point, so this
        // recomputed the teach set as if nothing had been done and repeated
        // an already-completed stage. Awaited here specifically, right
        // before the one decision that actually depends on it being
        // current - a plain cache hit either way, so this costs nothing,
        // just a moment's real network round trip instead of a guess.
        try {
            await refreshTopicNodeCompletion(null, state);
        } catch (err) {
            // Completion refresh is helpful for choosing the next untouched
            // stage, but a temporary failure must not strand the visible
            // loader or stop an otherwise available lesson from opening.
            console.error('LastMind: could not refresh lesson progress before starting.', err);
        }
        const teach = topicComputeTeachSet(state);
        if (!teach.length) {
            stopStartingRotator();
            card.innerHTML = `<div class="lesson-card-done">You already know everything needed for this target.</div>`;
            return;
        }
        let uuidByConceptId;
        try {
            uuidByConceptId = await fetchTopicNodeUuids(state.subject, state.qualification, state.examBoard);
        } catch (err) {
            stopStartingRotator();
            statusEl.textContent = 'Could not start the lesson - try again.';
            return;
        }
        stopStartingRotator();
        card.remove();
        teachNextInQueue(state, teach, 0, uuidByConceptId);
    }

    // "teach me X" (or a close variant) typed into the ordinary chat box and
    // sent normally - there is no separate "Build lesson" button any more.
    // sendChatMessage checks every outgoing message against this before
    // treating it as a normal chat turn; a match short-circuits straight
    // into the topic-map flow instead of calling /cortex/message at all.
    // Deliberately tolerant of a stray typo in the "how to" lead-in (real
    // example that prompted this: "teach me hwo to order...").
    function detectTeachMeTopic(text) {
        const m = /^(?:can you |could you |please )?(?:teach me|i want to learn|i'd like to learn|help me learn)\b[,:]?\s*(.*)/i.exec(text.trim());
        if (!m) return null;
        let topic = m[1].trim().replace(/^(?:how to|hwo to|to)\s+/i, '').replace(/[.?!]+$/, '').trim();
        return topic.length >= 3 ? topic : null;
    }

    // A plain "try again"/"retry" is only ever treated as a retry of the
    // specific, already-visible lesson failure this session just had (see
    // pendingLessonRetry) - never sent to the LLM as something to infer an
    // action from. A message this short and generic is deliberately NOT
    // matched as a teach-me/general-chat request either.
    function detectRetryIntent(text) {
        return /^(?:please\s+)?(?:try(?: it| that)? again|retry)\s*(?:now|please)?[.!]?$/i.test(text.trim());
    }

    // Builds the knowledge map for a topic and renders it as a boxed chat
    // card - shared by sendChatMessage's "teach me X" detection and the
    // suggestion chips below, both of which already have the topic text in
    // hand rather than reading it back out of #chatInput.
    async function startTopicLearnFlow(topic) {
        const card = appendCardMessage(`
            <div class="topic-loading-wrap">
                ${TOPIC_LOADING_WIRES_SVG}
                <div class="topic-loading-text"></div>
            </div>
        `);
        const stopRotator = startLoadingRotator(card.querySelector('.topic-loading-text'), topicMapLoadingMessages(topic));
        try {
            const accessToken = await getSyncAccessToken();
            if (!accessToken) { stopRotator(); card.innerHTML = '<div class="topic-map-error">You need to be signed in to build a lesson.</div>'; return; }
            const resp = await fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2/topic`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
                body: JSON.stringify({ topic }),
            });
            stopRotator();
            if (resp.status === 402) { card.innerHTML = "<div class=\"topic-map-error\">You're out of Locks for now - come back once they refresh.</div>"; return; }
            if (resp.status === 429) { card.innerHTML = '<div class="topic-map-error">Too many lessons requested at once - try again shortly.</div>'; return; }
            if (!resp.ok) { card.innerHTML = '<div class="topic-map-error">Could not build a knowledge map for that topic. Try rephrasing it.</div>'; return; }
            const data = await resp.json();
            if (!data.nodes || !data.nodes.length) { card.innerHTML = '<div class="topic-map-error">No usable map came back for that topic. Try rephrasing it.</div>'; return; }
            const taskNode = data.nodes.find((n) => n.isFinalTask) || data.nodes[data.nodes.length - 1];
            // "completed" (see knowledgeMapV2/topic's own route) comes from
            // the real concept_reviews progress table, the same one every
            // lesson completion already writes to - a node that's genuinely
            // already been taught (in this chat, a past session, or even a
            // different device) is correctly excluded from the teach queue
            // and shown as done on the map from the very first render, not
            // just after a manual tick.
            const skip = new Set(data.nodes.filter((n) => n.completed).map((n) => n.id));
            const state = { subject: data.subject, qualification: data.qualification, examBoard: data.examBoard, nodes: topicTopologicalOrder(data.nodes, data.edges), edges: data.edges, skip, target: taskNode.id };
            renderTopicMap(card, state);
            topicMapState = state; // kept as "most recently shown map", for reference only - every card's own interactivity closes over its own `state`, never this
            recordSilentContext(
                `[Built a knowledge map for "${state.subject}": ${state.nodes.length} concepts - ${state.nodes.map((n) => n.label).join(', ')}.]`,
                'map',
                { subject: state.subject, qualification: state.qualification, examBoard: state.examBoard, nodes: state.nodes, edges: state.edges }
            );
            // Replaces the old "Start the lesson" button - the student
            // answers a warm, varying nudge in their own words instead
            // (see pendingLessonContinuation/sendChatMessage). `state` is
            // the same live object skip/target clicks above mutate, so
            // whatever the student's ticked by the time they say yes is
            // what actually gets taught.
            promptLessonContinuation(LESSON_START_PROMPTS, () => startTopicTeachSequence(state));
        } catch (err) {
            stopRotator();
            card.innerHTML = '<div class="topic-map-error">Something went wrong building that lesson. Try again.</div>';
        }
    }
    // Adds new, earlier prerequisite nodes in front of an existing topic
    // map's current root(s), then re-renders the (now extended) map as a
    // fresh boxed card - fired from extendPrerequisitesBackward below when
    // a student says the map's starting point assumes too much. Mirrors
    // startTopicLearnFlow's shape; a fresh card (rather than trying to
    // mutate a possibly long-scrolled-past earlier card in place) is
    // simplest and matches how every other map/lesson update in this chat
    // already appears as its own new card.
    async function extendTopicMapDirectionFlow(priorState, direction) {
        const endpoint = direction === 'forward' ? 'extend-forward' : 'extend-backward';
        const verb = direction === 'forward' ? 'further forward' : 'further back';
        const subject = priorState.subject;
        const card = appendCardMessage(`
            <div class="topic-loading-wrap">
                ${TOPIC_LOADING_WIRES_SVG}
                <div class="topic-loading-text"></div>
            </div>
        `);
        const stopRotator = startLoadingRotator(card.querySelector('.topic-loading-text'), topicMapLoadingMessages(subject));
        try {
            const accessToken = await getSyncAccessToken();
            if (!accessToken) { stopRotator(); card.innerHTML = '<div class="topic-map-error">You need to be signed in to do that.</div>'; return; }
            // examBoard (round-tripped verbatim from this exact map's own
            // earlier response) identifies the one specific, private
            // generation instance to extend - topic maps are no longer
            // shared/looked-up by subject text alone (see
            // topicKnowledgeMapService.ts's own top comment).
            const resp = await fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2/topic/${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
                body: JSON.stringify({ topic: subject, examBoard: priorState.examBoard }),
            });
            stopRotator();
            if (resp.status === 402) { card.innerHTML = "<div class=\"topic-map-error\">You're out of Locks for now - come back once they refresh.</div>"; return; }
            if (resp.status === 429) { card.innerHTML = '<div class="topic-map-error">Too many lessons requested at once - try again shortly.</div>'; return; }
            if (!resp.ok) { card.innerHTML = `<div class="topic-map-error">Could not extend that map ${verb}. Try again shortly.</div>`; return; }
            const data = await resp.json();
            if (!data.nodes || !data.nodes.length) { card.innerHTML = '<div class="topic-map-error">No usable map came back. Try again.</div>'; return; }
            const taskNode = data.nodes.find((n) => n.isFinalTask) || data.nodes[data.nodes.length - 1];
            const skip = new Set(data.nodes.filter((n) => n.completed).map((n) => n.id));
            const state = { subject: data.subject, qualification: data.qualification, examBoard: data.examBoard, nodes: topicTopologicalOrder(data.nodes, data.edges), edges: data.edges, skip, target: taskNode.id };
            renderTopicMap(card, state);
            topicMapState = state; // kept as "most recently shown map", same convention as startTopicLearnFlow
            recordSilentContext(
                `[Extended the knowledge map for "${state.subject}" ${verb}: ${state.nodes.length} concepts now - ${state.nodes.map((n) => n.label).join(', ')}.]`,
                'map',
                { subject: state.subject, qualification: state.qualification, examBoard: state.examBoard, nodes: state.nodes, edges: state.edges }
            );
            promptLessonContinuation(LESSON_START_PROMPTS, () => startTopicTeachSequence(state));
        } catch (err) {
            stopRotator();
            card.innerHTML = '<div class="topic-map-error">Something went wrong extending that map. Try again.</div>';
        }
    }
    function appendUserMessage(text) {
        clearEmptyHint();
        const el = document.createElement('div');
        el.className = 'chat-msg chat-msg-user';
        el.textContent = text;
        chatMessagesEl.appendChild(el);
        if (!suppressAutoScroll) el.scrollIntoView({ behavior: 'smooth', block: 'end' });
        return el;
    }

    // Text-only - nothing here is spoken automatically.
    // Every assistant message still gets its own speak button, so reading
    // any of them aloud — including mid-review questions, not just the
    // main reply — is always one click away.
    // One real <p> per paragraph (split on a blank line, same convention
    // CORTEX_INTENT_PROMPT's own formatting rule asks Cortex to write in
    // for anything longer than a couple of sentences) instead of one dense
    // run of text - the same visual treatment a lesson's own multi-
    // paragraph explanation already gets (see .chat-msg-text p's own CSS
    // comment). Built with createElement/textContent throughout, not an
    // HTML string, so there's no risk of the same stray-whitespace-under-
    // inherited-pre-wrap bug the map/lesson cards had (see .chat-msg.chat-
    // msg-card's own fix) - nothing here is ever raw innerHTML.
    function renderChatText(container, text) {
        container.innerHTML = '';
        const paragraphs = (text || '').split(/\n{2,}/).map((p) => p.trim()).filter(Boolean);
        if (!paragraphs.length) { container.textContent = text || ''; return; }
        paragraphs.forEach((p) => {
            const pEl = document.createElement('p');
            pEl.textContent = p;
            container.appendChild(pEl);
        });
    }

    function appendAssistantMessage(text) {
        clearEmptyHint();
        const el = document.createElement('div');
        el.className = 'chat-msg chat-msg-assistant';

        const textEl = document.createElement('span');
        textEl.className = 'chat-msg-text';
        renderChatText(textEl, text);
        el.appendChild(textEl);

        chatMessagesEl.appendChild(el);
        if (!suppressAutoScroll) el.scrollIntoView({ behavior: 'smooth', block: 'end' });
        return el;
    }

    // Updates just an assistant message's text in place (used by the
    // "…" thinking placeholder and the review-start status line).
    function setAssistantMessageText(el, text) {
        const textEl = el.querySelector('.chat-msg-text');
        if (textEl) renderChatText(textEl, text);
    }

    // Starts before any session/history/network await, so sending a message
    // always gets an immediate, unmistakable response. Lesson-shaped asks
    // receive lesson-specific wording; the normal map/lesson loading card
    // takes over as soon as the intent has been resolved.
    function startAssistantWorking(el, messages) {
        const textEl = el.querySelector('.chat-msg-text');
        const spinner = document.createElement('span');
        spinner.className = 'chat-working-spinner'; spinner.setAttribute('aria-hidden', 'true');
        el.classList.add('chat-msg-working'); el.insertBefore(spinner, textEl);
        let i = 0;
        const show = () => { if (textEl) renderChatText(textEl, messages[i]); };
        show();
        const timer = setInterval(() => { i = Math.min(i + 1, messages.length - 1); show(); }, 1800);
        return () => { clearInterval(timer); spinner.remove(); el.classList.remove('chat-msg-working'); };
    }

    // Real, confirmed cost problem this fixes: sending every subfolder's
    // every page TITLE on every single Cortex message - regardless of
    // whether that message had anything to do with any subject - was the
    // actual dominant cost of a Cortex conversation for an account with a
    // real course (hundreds of lesson pages), dwarfing the map/lesson
    // generation calls that were getting blamed instead. Cortex's own job
    // here is general conversational grounding ("since you're doing AQA
    // Biology..."), which only ever needed what's being studied and
    // roughly how far in - counts, not a full title-by-title page list.
    function countPages(pages) {
        const list = pages || [];
        return { count: list.length, done: list.filter((p) => p.encodingDone === true || p.taughtBefore === true).length };
    }

    async function buildFolderSummary() {
        const all = await getAllFolders();
        return all.map((f) => {
            const own = countPages(f.pages);
            const sub = (f.subfolders || []).reduce((acc, sf) => {
                const c = countPages(sf.pages);
                return { count: acc.count + c.count, done: acc.done + c.done };
            }, { count: 0, done: 0 });
            return {
                name: f.subject,
                qualification: f.qualification,
                // Same split CortexFolderSummary documents server-side — a
                // school folder's identifying detail is its exam board, a
                // university one's is institution+moduleCode instead (never
                // both). Omitting whichever doesn't apply, rather than sending
                // it as undefined/empty, keeps Cortex from treating a blank
                // examBoard as a real (missing) value on a university folder.
                ...(isUniversityLevel(f.qualification)
                    ? { institution: f.institution || '', moduleCode: f.moduleCode || '' }
                    : { examBoard: f.examBoard || '' }),
                subfolderCount: (f.subfolders || []).length,
                pageCount: own.count + sub.count,
                completedPageCount: own.done + sub.done,
            };
        });
    }

    async function fetchDueReviews(accessToken) {
        try {
            // /due, not /schedule - /schedule returns EVERY tracked
            // concept regardless of due date ("soonest-first, regardless
            // of whether it's overdue yet", see review.ts's own comment),
            // which was making Cortex treat a concept scheduled days out
            // as already due and proactively suggest reviewing it early.
            // /due already filters server-side to due-or-overdue only.
            const resp = await fetch(`${COMPILE_BACKEND_URL}/due`, {
                headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (!resp.ok) return [];
            const { due } = await resp.json();
            return (due || []).map((item) => ({
                conceptId: item.concept_id,
                label: conceptKeyToLabel(item.concept_id)
            }));
        } catch (err) {
            return [];
        }
    }

    // The old structural "actions" system (Cortex reorganising/creating/
    // deleting folders, subfolders and pages; "start_review" locating and
    // redirecting to a lesson elsewhere in the app) removed entirely, by
    // explicit request - it was already fully unreachable dead code (the
    // backend has not returned an "actions" field since the general-chat-
    // only rewrite - see cortexPrompts.ts's own top comment), kept around
    // only as a deferred cleanup. Explicitly removed now, not just left
    // dormant, so there is no possible path by which it could ever compete
    // with startTopic/retryFailedLesson or the in-chat lesson-generation
    // flow for the same kind of message. Removed with it: normalizeForMatch,
    // fuzzyFindByName, findFolderByName, findSubfolderAnywhere,
    // findSubfolderByName, findPageByTitleAnywhere, getOrCreateSubfolder,
    // every applyMove*/applyCreate*/applyDelete* function,
    // describeAndBuildApplier, showBatchConfirmCard, cleanConceptPart,
    // findLessonLocationForConcept, presentReviewRedirect, and
    // handleCortexActions itself - none had a caller left outside this
    // same block.

    // The exact string cortexService.ts's CortexResponseTruncatedError
    // carries (see routes/cortex.ts) - matched so sendChatMessage can retry
    // ONCE, silently, before ever showing the student anything. This is
    // usually a one-off JSON-formatting slip (an unescaped quote inside the
    // reply, e.g. quoting a phrase in another language - see
    // CORTEX_INTENT_PROMPT's rule 1), not a standing problem, so a same-
    // message retry very often just works.
    const CORTEX_TRUNCATED_MESSAGE = 'That was a lot to take in at once, so the response got cut off. Try asking again in a shorter or more specific way.';

    // Answers a question WITH the currently active lesson's own context
    // (its explanation, its current on-screen question) via the same
    // GET .../ask route the dashboard's "Ask Cortex" corner panel already
    // uses - see activeLessonNodeUuid. Returns the answer text, or null if
    // this genuinely wasn't about the active lesson (the route's own
    // "redirected" judgment) or the call itself failed - either way,
    // sendChatMessage then falls through to the general chat path instead
    // of dead-ending, since "not about THIS lesson" still isn't "not a
    // learning question at all".
    async function tryAnswerFromActiveLesson(text) {
        if (!activeLessonNodeUuid) return null;
        try {
            const accessToken = await getSyncAccessToken();
            const resp = await fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2/node/${encodeURIComponent(activeLessonNodeUuid)}/ask`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
                body: JSON.stringify({ question: text }),
            });
            if (!resp.ok) return null;
            const result = await resp.json();
            return result.redirected ? null : result.answer;
        } catch (err) {
            console.error('LastMind: lesson-context question failed.', err);
            return null;
        }
    }

    // Keep the active map grounded even after a long lesson/chat sequence.
    // The ordinary recent-history window is intentionally small, but the
    // map is durable conversation state rather than disposable old prose.
    // Losing its bracket note after ten turns made Cortex confidently say
    // there was no structured map while that map was visibly higher up in
    // the same chat.
    function cortexConversationContext() {
        const recent = chatHistory.slice(-10).map((turn) => ({ role: turn.role, content: turn.content }));
        let mapIndex = -1;
        for (let i = chatHistory.length - 1; i >= 0; i -= 1) {
            if (chatHistory[i] && chatHistory[i].silent && chatHistory[i].kind === 'map') { mapIndex = i; break; }
        }
        if (mapIndex < 0) return recent;

        const mapTurn = chatHistory[mapIndex];
        if (!chatHistory.slice(-10).includes(mapTurn)) recent.unshift({ role: 'assistant', content: mapTurn.content });

        const completed = chatHistory.slice(mapIndex + 1)
            .filter((turn) => turn && turn.kind === 'lessonDone' && turn.data && turn.data.label)
            .map((turn) => turn.data.label);
        if (completed.length) {
            recent.unshift({
                role: 'assistant',
                content: `[Current knowledge-map progress: completed lessons are ${completed.join(', ')}. Continue with the next unfinished lesson in this map.]`,
            });
        }
        return recent;
    }

    async function postCortexMessage(text, session, folders, dueReviews) {
        const resp = await fetch(`${COMPILE_BACKEND_URL}/cortex/message`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({ message: text, history: cortexConversationContext(), folders, dueReviews })
        });
        if (!resp.ok) {
            // Same wording as startTopicLearnFlow's own 402 handling -
            // the route now refuses upfront once Locks are at zero
            // (previously the only metered feature that didn't).
            if (resp.status === 402) throw new Error("You're out of Locks for now - come back once they refresh.");
            const body = await resp.json().catch(() => ({}));
            throw new Error(body.error || `Server returned ${resp.status}`);
        }
        return resp.json();
    }

    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        // Show the sent message and a real animated working state straight
        // away, before anything is awaited. The old bare ellipsis was easy
        // to miss during the several seconds before lesson intent resolved.
        input.value = '';
        input.style.height = 'auto';
        appendUserMessage(text);
        const directTeachTopic = detectTeachMeTopic(text);
        const looksLikeLessonRequest = !!directTeachTopic || detectStartLessonsIntent(text) || /\b(?:generate|build|make|create|start|begin)\b[^.!?]{0,45}\blesson\b/i.test(text);
        const thinkingEl = appendAssistantMessage('');
        const stopThinking = startAssistantWorking(thinkingEl, looksLikeLessonRequest ? [
            'LastMind received your lesson request…',
            'Checking what the lesson needs to cover…',
            'Preparing the lesson generator…',
            'Still working — your request is active…',
        ] : [
            'LastMind received your message…',
            'Working out what you need…',
            'Preparing a response…',
            'Still working — your message is active…',
        ]);
        const dropThinking = () => { stopThinking(); if (thinkingEl.parentNode) thinkingEl.parentNode.removeChild(thinkingEl); };

        // Guarantees activeSessionId (and, for a resumed session, its past
        // messages already loaded into chatHistory) is settled BEFORE this
        // turn touches chatHistory itself - sending fast enough to beat
        // ensureSessionReady's own resolution used to push this turn onto
        // chatHistory first, only for restoreChatHistory's later
        // `chatHistory = session.messages` to silently overwrite it. In
        // practice this resolves near-instantly (a local IndexedDB read,
        // already kicked off well before this could ever be called).
        await ensureSessionReady();

        // "teach me X" (or a close variant) short-circuits into the
        // topic-map flow instead of an ordinary chat turn - see
        // detectTeachMeTopic/startTopicLearnFlow above. Everything past
        // this point is the normal Q&A path.
        const teachTopic = directTeachTopic;
        if (teachTopic) {
            dropThinking();
            // Real, confirmed bug this fixes: every short-circuit branch below
            // showed the bubble on screen but never recorded it into
            // chatHistory, so this - the actual FIRST thing asked in the chat -
            // was silently missing from the saved record. saveChatHistory's own
            // title logic picks the first 'user' turn it finds, so whatever
            // plain-text reply happened to be the first one that DID get
            // recorded (often "lets go", if it didn't match the yes/no
            // detector below) became the chat's title instead of this.
            chatHistory.push({ role: 'user', content: text });
            saveChatHistory();
            pendingLessonContinuation = null; // starting a different topic supersedes any earlier "shall I build..." still waiting on an answer
            startTopicLearnFlow(teachTopic);
            return;
        }

        // A plain "try again" retrying a lesson that just visibly failed
        // (see pendingLessonRetry) is the same short-circuit, for the same
        // reason - a known, specific, already-on-screen thing to redo,
        // never sent to the LLM to guess an action from.
        if (pendingLessonRetry && detectRetryIntent(text)) {
            dropThinking();
            chatHistory.push({ role: 'user', content: text });
            saveChatHistory();
            const retry = pendingLessonRetry;
            pendingLessonRetry = null;
            retry();
            return;
        }

        // Waiting on a plain "shall I build the (next) lesson?" nudge (see
        // promptLessonContinuation) - a clearly affirmative reply runs it
        // directly, no LLM call needed, same short-circuit pattern as
        // pendingLessonRetry above but for an ordinary checkpoint instead
        // of a known failure. A clearly negative reply just clears it and
        // lets the student keep talking. Anything else (a real question,
        // an unrelated remark) falls through to the normal chat turn below
        // WITHOUT touching pendingLessonContinuation, so a later "yes" can
        // still pick the same continuation back up.
        if (pendingLessonContinuation) {
            if (detectAffirmativeIntent(text)) {
                dropThinking();
                chatHistory.push({ role: 'user', content: text });
                saveChatHistory();
                const run = pendingLessonContinuation;
                pendingLessonContinuation = null;
                run();
                return;
            }
            if (detectNegativeIntent(text)) {
                dropThinking();
                chatHistory.push({ role: 'user', content: text });
                saveChatHistory();
                pendingLessonContinuation = null;
                appendAssistantMessage("No worries - just say the word whenever you're ready.");
                return;
            }
        }

        // Real, reported bug: detectAffirmativeIntent above only matches the
        // WHOLE message against a short list of one/two-word replies (e.g.
        // "let's go" as the entire text), so a perfectly natural fuller
        // sentence like "can we start with the lessons then please" missed
        // it, fell all the way through to the plain LLM chat call below, and
        // Cortex - which has no ability to actually start anything itself
        // (see cortexPrompts.ts's own top comment) - just replied vaguely
        // instead of either doing it or saying plainly it couldn't. This is
        // checked independently of pendingLessonContinuation's exact state:
        // if a continuation IS waiting, resume that; otherwise, if this chat
        // has already built a map (topicMapState), (re-)start teaching it -
        // topicComputeTeachSet always recomputes fresh, so this is safe to
        // call again even after some lessons are already done or the exact
        // continuation window was already missed/dismissed earlier.
        if (detectStartLessonsIntent(text)) {
            dropThinking();
            chatHistory.push({ role: 'user', content: text });
            saveChatHistory();
            if (pendingLessonContinuation) {
                const run = pendingLessonContinuation;
                pendingLessonContinuation = null;
                run();
            } else if (topicMapState) {
                startTopicTeachSequence(topicMapState);
            } else {
                appendAssistantMessage("I don't have a topic lined up to teach yet - tell me what you'd like to learn and I'll build a map for it first.");
            }
            return;
        }

        chatHistory.push({ role: 'user', content: text });
        saveChatHistory();

        const sendBtn = document.getElementById('chatSendBtn');
        sendBtn.disabled = true;

        try {
            // A lesson currently on screen gets first crack at this,
            // WITH its own real content as context - "instead of using
            // 'would', what is 'could' in this sentence?" means nothing to
            // general chat, which has no idea what "this sentence" is.
            const lessonAnswer = await tryAnswerFromActiveLesson(text);
            if (lessonAnswer) {
                stopThinking();
                setAssistantMessageText(thinkingEl, lessonAnswer);
                chatHistory.push({ role: 'assistant', content: lessonAnswer });
                saveChatHistory();
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) throw new Error('Not logged in.');

            const [folders, dueReviews] = await Promise.all([
                buildFolderSummary(),
                fetchDueReviews(session.access_token)
            ]);

            let result;
            try {
                result = await postCortexMessage(text, session, folders, dueReviews);
            } catch (err) {
                if (err.message !== CORTEX_TRUNCATED_MESSAGE) throw err;
                result = await postCortexMessage(text, session, folders, dueReviews);
            }
            stopThinking();
            setAssistantMessageText(thinkingEl, result.reply);
            chatHistory.push({ role: 'assistant', content: result.reply });
            saveChatHistory();

            // Cortex still never touches the student's account directly
            // (folders/pages/reviews - see cortexPrompts.ts's own top
            // comment) - but it CAN now declare one of two narrow intents,
            // recognized from whatever phrasing the student actually used
            // rather than a fixed set of client-side regexes (real report:
            // "try to generate it again" didn't match detectRetryIntent's
            // pattern and fell through to a plain "I can't do that"
            // reply). Executing either one here is exactly as deterministic
            // and narrow as the regex short-circuits above - Cortex only
            // ever flags the intent, this code decides what that means and
            // does it, same as a button click.
            if (result.startTopic) {
                pendingLessonContinuation = null; // starting a different topic supersedes any earlier "shall I build..." still waiting on an answer
                startTopicLearnFlow(result.startTopic);
            } else if (result.beginQueuedLessons) {
                // Real, reported gap this closes: unlike startTopic/
                // retryFailedLesson above, there was previously no general
                // fallback for "begin/continue the lessons for the map I
                // already built" - only the client's own narrow exact-
                // phrasing fast path (detectStartLessonsIntent) covered it,
                // so anything outside that (e.g. "generate the lesson")
                // fell through to a plain chat reply that couldn't actually
                // start anything.
                //
                // Real, reported bug this ALSO fixes: this branch had no
                // final else - Cortex's own reply already said "On it -
                // starting the first lesson now." (a real, correctly
                // recognized intent), but if topicMapState somehow wasn't
                // populated (e.g. a page reload whose restore didn't pick
                // it back up), NOTHING happened at all: no card, no error,
                // nothing - a confident-sounding reply that silently did
                // not do the thing it just said it was doing.
                if (pendingLessonContinuation) {
                    const run = pendingLessonContinuation;
                    pendingLessonContinuation = null;
                    run();
                } else if (topicMapState) {
                    startTopicTeachSequence(topicMapState);
                } else {
                    appendAssistantMessage("I don't actually have a topic map loaded to teach from right now - try reopening this chat, or tell me what you'd like to learn and I'll build a fresh map for it.");
                }
            } else if (result.retryFailedLesson) {
                // Real, reported bug: this only acted when the failed lesson's own card was still on screen (pendingLessonRetry). After a
                // reload the card is gone, so Cortex said "Retrying now." and then NOTHING happened - no card, no message. It now falls
                // back the way "begin the lessons" does: retry the card if there is one, otherwise (re-)start the map's lessons, otherwise
                // say plainly that it cannot.
                if (pendingLessonRetry) {
                    const retry = pendingLessonRetry;
                    pendingLessonRetry = null;
                    retry();
                } else if (pendingLessonContinuation) {
                    const run = pendingLessonContinuation;
                    pendingLessonContinuation = null;
                    run();
                } else if (topicMapState) {
                    startTopicTeachSequence(topicMapState);
                } else {
                    appendAssistantMessage("I don't actually have a topic map loaded to retry from right now - try reopening this chat, or tell me what you'd like to learn and I'll build a fresh map for it.");
                }
            } else if (result.extendPrerequisitesBackward || result.extendPrerequisitesForward) {
                // Same "declared intent, deterministic frontend code acts
                // on it" pattern as beginQueuedLessons above, with the same
                // guard against a confident-sounding reply doing nothing:
                // topicMapState is the only source of "which map" to
                // extend, since the student's message won't necessarily
                // repeat the topic by name.
                if (topicMapState) {
                    extendTopicMapDirectionFlow(topicMapState, result.extendPrerequisitesForward ? 'forward' : 'backward');
                } else {
                    appendAssistantMessage("I don't actually have a topic map loaded right now to extend - tell me what you'd like to learn and I'll build one.");
                }
            }
        } catch (err) {
            console.error('LastMind Cortex: message failed.', err);
            // Was a fixed generic string regardless of cause — genuinely
            // impossible to tell a network failure from a backend 500 from
            // a malformed response without opening devtools. Surface
            // err.message directly when there is one (a thrown Error from
            // the !resp.ok branch above carries the backend's own
            // actionable sentence — see routes/cortex.ts — not just a
            // status code) — only fall back to the generic wording for a
            // true network-level failure, which has no message of its own.
            // By the time this shows, a same-message retry already happened
            // once and failed again too - so it's a genuinely repeated
            // problem, not the usual one-off blip.
            stopThinking();
            setAssistantMessageText(thinkingEl, (err && err.message) ? err.message : 'Sorry, could not reach the server. Please try again.');
        } finally {
            sendBtn.disabled = false;
        }
    }

    document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
        // Enter sends, same as before the box became multi-line; Shift+Enter
        // inserts an actual newline instead, so a longer message can still
        // be written across several lines before sending.
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChatMessage();
        }
    });
    // Grows the box as the student types past one line (up to the CSS
    // max-height, which then scrolls) instead of scrolling the text
    // sideways inside a fixed single line — the actual ask here: being
    // able to see what you've written.
    document.getElementById('chatInput').addEventListener('input', (e) => {
        e.target.style.height = 'auto';
        e.target.style.height = `${e.target.scrollHeight}px`;
    });

    /* ───────────────────────── Gate + boot ───────────────────────── */

    async function enterApp() {
        document.getElementById('gate-message').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        document.getElementById('chatInput').focus();

        // Iframed into learn/index.html's own dashboard (see
        // renderWelcome()) — hides this page's own back-link/title header,
        // which would be redundant duplicated chrome once the dashboard's
        // own topbar/sidebar are already visible around it.
        if (new URLSearchParams(window.location.search).get('embed') === '1') {
            document.body.classList.add('cortex-embed');
        }
        if (new URLSearchParams(window.location.search).get('notesPanel') === '1') {
            document.body.classList.add('notes-assist-embed');
            document.querySelector('.cortex-header-sub').textContent = 'Ask about a concept, or have it explained';
            document.getElementById('chatInput').placeholder = 'Ask about the highlighted concept…';
            document.getElementById('chatSendBtn').textContent = 'Send';
        }

        // Fire-and-forget rather than awaited — Cortex reads folders fresh
        // via getAllFolders() at the point each action actually needs them
        // (not once at boot into a cached array like learn/index.html),
        // so there's no render step here that depends on this having
        // finished; it just needs to have started before the student's
        // first message is likely to land.
        reconcileFoldersWithServer().catch((err) => console.error('LastMind Cortex: folder reconcile failed.', err));

        await renderEmptyState();
        await restoreChatHistory();

        // Opened from the LastMind browser extension's "Understand with
        // LastMind" context-menu entry (right-click a text selection on any
        // page) — the extension's side panel loads this same page with
        // ?embed=1&topic=<the selected text>, so a brand-new chat here goes
        // straight into building that topic's map instead of waiting for
        // the student to type it in themselves. Only on a genuinely empty
        // chat — a reload of an existing extension-opened panel must not
        // silently restart the same topic on top of whatever's already
        // there.
        const extensionTopic = new URLSearchParams(window.location.search).get('topic');
        if (extensionTopic && !chatHistory.length) {
            appendUserMessage(extensionTopic);
            chatHistory.push({ role: 'user', content: extensionTopic });
            saveChatHistory();
            startTopicLearnFlow(extensionTopic);
        }
    }

    (async function gate() {
        if (new URLSearchParams(window.location.search).has('preview')) {
            console.warn('LastMind Cortex: running in PREVIEW MODE — the subscription gate is bypassed.');
            await enterApp();
            return;
        }

        const publicKey = await importPublicKey(PUBLIC_KEY_PEM);

        // SECURITY: the Supabase session is established FIRST, before any
        // device-local token is looked up — see learn/index.html's own gate()
        // for the full incident (checking IndexedDB, which is shared by the
        // whole device/browser, before knowing which account is asking let a
        // brand-new unpaid account reuse a different, paid account's cached
        // token on the same device).
        let supabaseSession = null;
        try {
            const { data } = await supabaseClient.auth.getSession();
            supabaseSession = data.session;
        } catch (err) {
            console.error('LastMind Cortex: could not read the current session.', err);
        }

        if (!supabaseSession) {
            window.location.href = '/';
            return;
        }

        const userId = supabaseSession.user.id;
        let token = await getStoredToken(userId).catch(() => null);
        let payload = token ? await verifyJWT(token, publicKey) : null;

        if (!payload) {
            token = await refreshTokenFromBackend(userId);
            payload = token ? await verifyJWT(token, publicKey) : null;
        }

        if (payload) { await enterApp(); return; }

        try {
            const resp = await fetch(`${BACKEND_URL}/api/token-for-user`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${supabaseSession.access_token}` }
            });
            if (resp.ok) {
                const { token: linkedToken, subscriptionId: linkedSubId } = await resp.json();
                payload = await verifyJWT(linkedToken, publicKey);
                if (payload) {
                    await saveToken(userId, linkedToken);
                    if (linkedSubId) await putAuthRecord(scopedAuthKey('subscriptionId', userId), linkedSubId);
                }
            }
        } catch (err) {
            console.error('LastMind Cortex: login-anywhere check failed.', err);
        }

        if (payload) { await enterApp(); return; }

        await enterApp();
    })();
</script>
</body>
</html>
