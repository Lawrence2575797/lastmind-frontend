<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LastMind</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#D9C398">
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
</script>
<style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
        --bg: #1A1A1C;
        /* Matches the dashboard sidebar's own hardcoded navy (learn/
           index.html's .sf-mini-cortex-panel) exactly - Cortex no longer
           mirrors the account's dashboard theme at all (removed by explicit
           product decision - see the "Colour palette" comment further
           down), so this is simply the one fixed navy every message box
           uses, not a fallback for some other value to arrive later. */
        --panel: #1A232D;
        --text: #F1EAD6;
        --accent: #F1EAD6;
        /* Only for text sitting directly on the page's own birch
           background below (body, #gate-message, the empty-state logo,
           the back-link) - every chat bubble/input/button keeps using
           --text/--bg/--accent completely unchanged, since none of those
           variables' own values changed. --bg deliberately stays the old
           dark tone: chat-msg-user/.chat-confirm-btn/#chatSendBtn still
           rely on it as a flat colour, unrelated to the page's own canvas. */
        /* Was burgundy (matching learn/index.html's own --ink default) -
           changed to the same navy as --panel by explicit request, so every
           piece of text sitting directly on birch (body, #gate-message, the
           empty-state logo/quote/greeting, the back-link) reads as one
           consistent navy instead of two different dark tones. */
        --ink: #1A232D;
    }

    html, body { height: 100%; }

    body {
        /* Birch-panel background - see learn/index.html's own body rule
           for the identical technique/reasoning (procedural wood-grain
           via layered CSS gradients, not an image). This embeds inside
           the dashboard's own content area, so this IS the visible
           "Cortex page" background the dashboard shows. */
        background:
            repeating-linear-gradient(90deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 2px, transparent 2px, transparent 150px),
            repeating-linear-gradient(0.6deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 1px, transparent 1px, transparent 4px),
            repeating-linear-gradient(-1.2deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 6px),
            linear-gradient(100deg, #F3D9A6, #D9C398 35%, #F3D9A6 55%, #BBA986 85%, #D9C398 100%);
        color: var(--ink);
        font-family: 'Georgia', serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }

    #gate-message {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Arial', sans-serif;
        color: var(--ink);
        opacity: 0.6;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
    }

    #app {
        display: none;
        flex-direction: column;
        height: 100vh;
    }

    .cortex-header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 26px;
        border-bottom: 1px solid rgba(230, 215, 176, 0.1);
        flex-shrink: 0;
    }

    .cortex-back-link {
        font-family: 'Arial', sans-serif;
        font-size: 0.82rem;
        /* Sits transparently on the header, i.e. directly on body's own
           birch background when this page isn't embedded (embedded mode
           hides the whole header - see body.cortex-embed below). */
        color: var(--ink);
        opacity: 0.75;
        text-decoration: none;
        border: 1px solid rgba(43, 33, 24, 0.3);
        border-radius: 4px;
        padding: 8px 14px;
        flex-shrink: 0;
    }

    .cortex-back-link:hover { opacity: 1; }

    .cortex-header-title {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        flex: 1;
    }

    .cortex-header-sub {
        font-family: 'Arial', sans-serif;
        font-size: 0.72rem;
        opacity: 0.45;
        letter-spacing: 0.02em;
    }

    .chat-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 28px 26px;
    }

    .chat-inner {
        max-width: 680px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    /* Shown only while chatHistory is empty — replaced by the ordinary
       scrolling message list the moment the first message (sent or
       restored) lands (see clearEmptyHint). Fills the full height
       .chat-scroll makes available so its two children can be positioned
       independently (greeting near the top, logo centered in the rest of
       the space - see .chat-empty-greeting/.chat-empty-center) rather than
       centering the whole hint as one block. */
    #chatMessages.chat-empty-active {
        min-height: 100%;
        display: flex;
        flex-direction: column;
    }
    #chatMessages.chat-empty-active .chat-empty-hint {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
    }

    /* Same font as the dashboard sidebar's own logo header (learn/
       index.html's .sidebar-logo/.sidebar-logo-icon) - it never sets its
       own font-family, so it actually renders in body's Georgia serif, not
       a sans-serif. Mixed case ("LastMind") and a heavier weight than the
       sidebar's own 700, deliberately NOT an exact match there - Georgia's
       "bold" reads thin at this much larger centerpiece size, and 900 is
       the heaviest weight the browser can render it at without faking a
       synthetic bold (which looks worse, not better). Sits directly on
       birch like everything else here, not boxed - a navy box read as a
       stray chat bubble rather than a page title. Icon stacked above the
       text and sized as a real centerpiece mark, not a small corner logo -
       sized up again here, the largest this page uses it. --ink is navy
       now (see :root), so this and every other ink consumer already match. */
    .chat-empty-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--ink);
        font-family: 'Georgia', serif;
        font-weight: 900;
        letter-spacing: 0.02em;
        font-size: clamp(2rem, 5.5vw, 3rem);
    }

    .chat-empty-logo-icon { flex-shrink: 0; width: clamp(105px, 18vw, 170px); height: auto; }

    /* The empty-state topic suggestion chips (topic-learn-card/
       topic-learn-suggestions/topic-learn-chip, populated by
       loadTopicSuggestions) were removed by explicit request - the chat
       input's own placeholder now carries one concrete example instead.
       "Learn something new" itself - an interactive knowledge map generated
       live for any topic the student types (POST /knowledge-map-v2/topic),
       taught node by node right here in the chat thread (see
       startTopicTeachSequence) - is unaffected; only its empty-state
       shortcut entry point is gone, not detectTeachMeTopic/startTopicLearnFlow
       themselves.

       ─── Everything below keeps the whole "learn something new" flow -
       map, then every lesson stage - INSIDE the ordinary scrolling chat
       thread, styled exactly like the rest of the chat: sits directly on
       the birch background (no separate pale card of its own), each piece
       of content is its own navy box with cream text, same var(--panel)/
       var(--text) pairing .chat-msg-assistant already uses. Nothing here
       ever navigates the parent dashboard away from Cortex. */
    /* .chat-msg.chat-msg-card (two classes), not just .chat-msg-card - this
       must beat .chat-msg's own max-width:82% (defined further down for
       the speech-bubble messages) on specificity, not source order alone,
       or it silently loses whenever the two rules get reordered. Real bug
       this fixes: the card was capped at 82% of an already-narrow column,
       squeezing every node box's text into a handful of characters per
       line - what actually looked like "huge, oversized boxes" was severe
       word-wrapping from a starved width, not oversized padding.

       white-space:normal is the OTHER half of that same fix, and the
       bigger one: .chat-msg sets white-space:pre-wrap (inherited by every
       descendant) so a real newline in a chat bubble's own plain text
       renders as a line break. This card's content is markup built from
       indented, multi-line JS template literals, not plain text - under
       inherited pre-wrap, the whitespace-only text nodes sitting between
       block-level tags (one literal newline + a full line of indentation
       each) don't collapse away the way they normally would, and render
       as real vertical gaps instead - confirmed live: resetting this alone
       dropped one otherwise-ordinary node box from ~360px tall to ~70px,
       with no other change. */
    .chat-msg.chat-msg-card { align-self: stretch; max-width: 100%; display: flex; flex-direction: column; gap: 5px; line-height: 1.3; white-space: normal; }

    .topic-map-heading { align-self: flex-start; background: var(--panel); color: var(--text); border-radius: 8px; padding: 5px 10px; font-size: 0.68rem; letter-spacing: 0.03em; font-weight: 700; }

    /* The whole map on one screen as a real graph, not a single column -
       one row per DAG level (topicComputeLevels), nodes at the same level
       side by side within their row, real prerequisite edges drawn between
       boxes wherever they actually go (drawTopicGraphEdges) rather than an
       arrow just marking reading order. .topic-graph-svg sits absolutely
       over .topic-graph-rows so its line coordinates (computed from the
       boxes' own getBoundingClientRect()) line up with the boxes' normal
       document-flow layout underneath it. */
    .topic-graph-wrap { position: relative; }
    .topic-graph-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .topic-graph-svg path { fill: none; stroke: var(--accent); stroke-width: 1.5px; opacity: 0.4; }
    .topic-graph-rows { position: relative; display: flex; flex-direction: column; gap: 26px; }
    .topic-graph-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

    /* One node = one navy box, sized (border-box, so the width below is
       the real rendered width, padding included) narrow enough that two
       still sit side by side inside the embedded chat sidebar (380px
       panel, ~296px of that left for card content after its own padding -
       see learn/index.html's .sf-mini-cortex-panel) rather than wrapping
       to one column there the way the old full-width boxes always would
       have. */
    .topic-node-box { box-sizing: border-box; width: 135px; flex: 0 0 auto; background: var(--panel); color: var(--text); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
    .topic-node-box.locked { opacity: 0.45; }
    .topic-node-title { font-weight: 700; font-size: 0.78rem; }
    .topic-node-actions { display: flex; gap: 6px; }
    /* Two small circles instead of two spelled-out buttons per box - see
       TOPIC_NODE_ICONS and the map's own text legend (.topic-map-legend)
       for what each one means. */
    .topic-node-icon-btn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(230, 215, 176, 0.35); background: transparent; color: var(--text); font-family: inherit; font-size: 0.7rem; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .topic-node-icon-btn:hover { background: rgba(230, 215, 176, 0.1); }
    .topic-node-icon-btn.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }

    .topic-map-legend { align-self: flex-start; font-size: 0.68rem; opacity: 0.6; }

    .topic-map-summary { align-self: flex-start; background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 0.72rem; }
    .topic-map-start { align-self: flex-start; border: 0; border-radius: 999px; padding: 7px 16px; background: var(--accent); color: var(--panel); font-family: inherit; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .topic-map-error { align-self: flex-start; background: var(--panel); color: #E39B9B; border-radius: 10px; padding: 10px 16px; font-size: 0.85rem; }

    /* Knowledge-map GENERATION loading state: a short rotating status line
       (see TOPIC_MAP_LOADING_MESSAGES/rotateLoadingMessage) plus a small
       animated "wiring" graphic - a few nodes whose connecting lines draw
       themselves in a loop - standing in for the real graph while it's
       still being generated, rather than a generic spinner. */
    .topic-loading-wrap { align-self: flex-start; background: var(--panel); border-radius: 12px; padding: 16px 20px; text-align: center; }
    .topic-loading-text { color: var(--text); font-size: 0.85rem; opacity: 0.8; margin-bottom: 12px; min-height: 1.3em; }
    .topic-loading-wires { display: block; margin: 0 auto; width: 160px; height: 64px; }
    .topic-loading-wires circle { fill: var(--text); opacity: 0.8; }
    .topic-loading-wires path { fill: none; stroke: var(--text); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: topic-wire-draw 1.6s ease-in-out infinite; opacity: 0.55; }
    .topic-loading-wires path:nth-of-type(2) { animation-delay: 0.2s; }
    .topic-loading-wires path:nth-of-type(3) { animation-delay: 0.4s; }
    .topic-loading-wires path:nth-of-type(4) { animation-delay: 0.6s; }
    @keyframes topic-wire-draw {
        0% { stroke-dashoffset: 40; opacity: 0; }
        30% { opacity: 0.7; }
        60% { stroke-dashoffset: 0; opacity: 0.7; }
        100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* One lesson stage, embedded via the same /learn/derive/player.html
       player every other lesson in the app uses (see startTopicLessonCard)
       - just hosted inside a chat card instead of the dashboard's own
       fullscreen lesson workspace. Same navy-box treatment as everything
       else in this flow; the player itself paints its own surface inside
       the frame. */
    .lesson-card-label { align-self: flex-start; background: var(--panel); color: var(--text); border-radius: 10px; padding: 8px 14px; font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 700; }
    .lesson-card-frame-wrap { height: 560px; border-radius: 10px; overflow: hidden; background: var(--panel); }
    .lesson-card-frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
    .lesson-card-status { align-self: flex-start; background: var(--panel); color: var(--text); border-radius: 10px; padding: 10px 16px; font-size: 0.85rem; }
    .lesson-card-done { align-self: flex-start; background: var(--panel); color: var(--text); border-radius: 10px; padding: 10px 16px; font-size: 0.9rem; font-weight: 700; }

    /* The time-of-day greeting and the rotating quote (see
       .chat-empty-quote just below) sit near the TOP of the page, each its
       own line/sentence - a real person says the greeting, then says the
       thing, rather than fusing both into one run-on line with a dash. The
       LastMind mark sits on its own further down, vertically centered in
       whatever room is left below them (see .chat-empty-center) - two
       distinct anchors rather than one block centered as a whole. Same
       italic/subtle treatment as learn/index.html's own dashboard feed
       greeting banner (.sf-greeting-banner). */
    .chat-empty-greeting {
        flex: none;
        text-align: center;
        font-family: 'Georgia', serif;
        font-style: italic;
        opacity: 0.65;
        font-size: 1.05rem;
        max-width: 480px;
        margin: 0 auto 10px;
        padding-top: 6vh;
        line-height: 1.6;
    }

    /* Its own line, own complete sentence, directly under the greeting -
       not fused onto the end of it with a dash (see MOTIVATIONAL_QUOTES'
       own comment). Same italic treatment, slightly more prominent since
       it's the actual thought of the two. */
    .chat-empty-quote {
        flex: none;
        text-align: center;
        font-family: 'Georgia', serif;
        font-style: italic;
        opacity: 0.75;
        font-size: 1.1rem;
        max-width: 480px;
        margin: 0 auto;
        line-height: 1.6;
    }

    .chat-empty-center {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    body.cortex-embed .cortex-header { display: none; }

    .chat-msg {
        max-width: 82%;
        padding: 13px 16px;
        border-radius: 10px;
        font-size: 0.92rem;
        line-height: 1.65;
        white-space: pre-wrap;
    }

    .chat-msg-user {
        align-self: flex-end;
        background: var(--accent);
        color: var(--bg);
        border-bottom-right-radius: 3px;
    }

    .chat-msg-assistant {
        align-self: flex-start;
        background: var(--panel);
        /* Explicit, not left to inherit from body - body's own text
           colour is now --ink (matching its birch background), which
           would be illegible against this bubble's own dark panel
           background if left to inherit instead. */
        color: var(--text);
        border: 1px solid rgba(230, 215, 176, 0.15);
        border-bottom-left-radius: 3px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
    }

    .chat-msg-text {
        flex: 1;
        min-width: 0;
    }
    /* One real <p> per paragraph (see renderChatMessageText) rather than
       relying on .chat-msg's inherited white-space:pre-wrap to turn a
       literal "\n\n" into a blank line - same visual treatment a lesson's
       own multi-paragraph explanation gets (see learn/index.html's
       splitIntoParagraphs), not a dense single block for anything longer
       than a couple of sentences. */
    .chat-msg-text p { margin: 0 0 12px; }
    .chat-msg-text p:last-child { margin-bottom: 0; }

    .chat-confirm-card, .chat-answer-card {
        align-self: stretch;
        background: var(--panel);
        /* Same explicit-not-inherited reasoning as .chat-msg-assistant. */
        color: var(--text);
        border: 1px solid rgba(230, 215, 176, 0.25);
        border-radius: 10px;
        padding: 16px;
    }

    .chat-confirm-text {
        font-size: 0.9rem;
        line-height: 1.6;
        margin-bottom: 12px;
    }

    .chat-confirm-status {
        font-family: 'Arial', sans-serif;
        font-size: 0.82rem;
        opacity: 0.8;
        margin-top: 4px;
    }

    .chat-confirm-actions {
        display: flex;
        gap: 10px;
    }

    .chat-confirm-btn {
        font-family: 'Arial', sans-serif;
        font-size: 0.82rem;
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: 4px;
        padding: 9px 18px;
        cursor: pointer;
    }

    .chat-confirm-btn-no {
        background: none;
        border: 1px solid rgba(230, 215, 176, 0.3);
        color: var(--text);
    }

    .chat-answer-input {
        width: 100%;
        min-height: 80px;
        background: var(--bg);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 6px;
        padding: 10px 12px;
        color: var(--text);
        font-family: 'Georgia', serif;
        font-size: 0.9rem;
        resize: vertical;
        margin-bottom: 10px;
    }

    .chat-answer-input:focus { outline: none; border-color: rgba(230, 215, 176, 0.5); }

    .chat-input-row {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 26px 22px;
        border-top: 1px solid rgba(230, 215, 176, 0.1);
        max-width: 680px;
        margin: 0 auto;
        width: 100%;
    }

    #chatInput {
        flex: 1;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 8px;
        padding: 12px 18px;
        color: var(--text);
        font-family: 'Georgia', serif;
        font-size: 0.92rem;
        resize: none;
        /* rows="1" plus this line-height only fit one line before the
           auto-grow-on-input JS ever runs (it only fires on typing) - the
           placeholder text itself is long enough to wrap on a narrower
           screen, and that second line was being clipped rather than
           shown. min-height fits it comfortably up front. */
        min-height: 52px;
        max-height: 160px;
        overflow-y: auto;
        line-height: 1.4;
    }

    #chatInput:focus { outline: none; border-color: rgba(230, 215, 176, 0.5); }

    /* iOS Safari force-zooms the page on focus for any text input whose
       computed font-size is under 16px, regardless of the viewport meta's
       own maximum-scale/user-scalable - the reported "typing in the chat
       box zooms the page in and it stays zoomed after" behaviour. 16px
       here is the actual fix (nothing to un-zoom afterwards, since it
       never zooms in the first place), not a manual zoom-reset on blur. */
    @media (max-width: 768px) {
        #chatInput { font-size: 16px; }
    }

    #chatSendBtn {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: var(--accent);
        color: var(--bg);
        font-size: 1.05rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #chatSendBtn:hover { opacity: 0.85; }
</style>
</head>
<body>

<div id="gate-message">Checking your subscription…</div>

<div id="app">
    <div class="cortex-header">
        <a class="cortex-back-link" href="/learn">‹ Learn</a>
        <div>
            <div class="cortex-header-title">LastMind</div>
            <div class="cortex-header-sub">Ask about what you're studying, or talk through exam technique</div>
        </div>
    </div>

    <div class="chat-scroll">
        <div class="chat-inner" id="chatMessages">
            <div class="chat-empty-hint" id="chatEmptyHint">
                <p class="chat-empty-greeting" id="chatEmptyGreeting"></p>
                <p class="chat-empty-quote" id="chatEmptyQuote"></p>
                <div class="chat-empty-center">
                    <h1 class="chat-empty-logo">
                        <img class="chat-empty-logo-icon" src="/icons/lastmind-logo.png" alt="LastMind" width="110" height="110" />
                        <span>LastMind</span>
                    </h1>
                </div>
            </div>
        </div>
    </div>

    <div class="chat-input-row">
        <textarea id="chatInput" placeholder="Try 'teach me basic supply and demand'…" autocomplete="off" rows="1"></textarea>
        <button id="chatSendBtn" type="button" title="Send">➤</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    /* ───────────────────────── Colour palette ─────────────────────────

       set on the dashboard (fetchThemeSettings + a 'lm-theme-update'
       postMessage listener) - removed by explicit product decision: Cortex
       always sits on the birch background with cream-on-navy message boxes
       (the plain :root defaults below), regardless of what the dashboard
       itself is set to. This also fixes a real, reported mismatch: an
       account on a non-default dashboard theme saw Cortex's whole page
       replaced with a flat colour close to but not identical to the
       sidebar's own separately-hardcoded navy - two different colours
       standing in for what should have been one consistent birch canvas. */

    /* ───────────────────────── IndexedDB (same DB as /learn) ───────────────────────── */

    if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(() => {});
    }

    const DB_NAME = 'LastMindDB';
    const DB_VERSION = 2;
    const AUTH_STORE = 'auth';
    const FOLDER_STORE = 'folders';

    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(AUTH_STORE)) {
                    db.createObjectStore(AUTH_STORE, { keyPath: 'id' });
                }
                if (!db.objectStoreNames.contains(FOLDER_STORE)) {
                    db.createObjectStore(FOLDER_STORE, { keyPath: 'id', autoIncrement: true });
                }
            };
            req.onsuccess = (e) => resolve(e.target.result);
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async function putAuthRecord(id, value) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(AUTH_STORE, 'readwrite');
            tx.objectStore(AUTH_STORE).put({ id, value, savedAt: Date.now() });
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e.target.error);
        });
    }

    async function getAuthRecord(id) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(AUTH_STORE, 'readonly');
            const r = tx.objectStore(AUTH_STORE).get(id);
            r.onsuccess = () => resolve(r.result ? r.result.value : null);
            r.onerror = (e) => reject(e.target.error);
        });
    }

    // SECURITY: scoped to the currently-authenticated Supabase user id —
    // a bare, unscoped 'jwt'/'subscriptionId' key meant a brand-new, unpaid
    // account signing in on a device that had ever held a DIFFERENT paid
    // account's session would find and reuse that other account's cached
    // token, silently granting full paid access with no payment ever made.
    // MUST stay identical to learn/index.html's own copy.
    function scopedAuthKey(base, userId) {
        return `${base}:${userId}`;
    }
    async function getStoredToken(userId) { return getAuthRecord(scopedAuthKey('jwt', userId)); }
    async function saveToken(userId, token) { return putAuthRecord(scopedAuthKey('jwt', userId), token); }
    async function getStoredSubscriptionId(userId) { return getAuthRecord(scopedAuthKey('subscriptionId', userId)); }

    async function getAllFolders() {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FOLDER_STORE, 'readonly');
            const r = tx.objectStore(FOLDER_STORE).getAll();
            r.onsuccess = () => resolve(r.result || []);
            r.onerror = (e) => reject(e.target.error);
        });
    }

    // Raw IndexedDB write, no server sync side effect — see putFolder below.
    async function putFolderLocalOnly(folder) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FOLDER_STORE, 'readwrite');
            const r = tx.objectStore(FOLDER_STORE).put(folder);
            r.onsuccess = () => resolve(r.result);
            r.onerror = (e) => reject(e.target.error);
        });
    }

    // Mirrors learn/index.html's putFolder exactly — this file has its own
    // separate copy of the whole IndexedDB layer (see the file-level
    // comment above), so the same per-account sync fix has to be applied
    // here independently, or anything Cortex creates/edits stays local to
    // whatever device Cortex happens to be used on. See learn/index.html's
    // own copy of this function for the full reasoning.
    async function putFolder(folder) {
        folder.updatedAt = Date.now();
        const id = await putFolderLocalOnly(folder);
        if (folder.id === undefined) folder.id = id;
        syncFolderToServer(folder).catch((err) => {
            console.error('LastMind Cortex: folder sync to server failed — will retry at next open.', err);
        });
        return id;
    }

    async function deleteFolderRecordLocalOnly(folderId) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FOLDER_STORE, 'readwrite');
            const r = tx.objectStore(FOLDER_STORE).delete(folderId);
            r.onsuccess = () => resolve();
            r.onerror = (e) => reject(e.target.error);
        });
    }

    async function deleteFolderRecord(folderId) {
        await deleteFolderRecordLocalOnly(folderId);
        deleteFolderFromServer(folderId).catch((err) => {
            console.error('LastMind Cortex: folder delete did not reach the server — it may reappear from another device until this is retried.', err);
        });
    }

    // Same sync layer as learn/index.html, duplicated for the same reason
    // as the rest of this file's IndexedDB code — see that file's own
    // "Per-account folder sync" block for the full design reasoning
    // (last-write-wins by updatedAt, tombstones for cross-device deletion,
    // purely additive on top of local storage with no active account
    // session). This copy is called from the same places: putFolder/
    // deleteFolderRecord above, and reconcileFoldersWithServer at boot.
    async function getSyncAccessToken() {
        try {
            const { data } = await supabaseClient.auth.getSession();
            return data.session ? data.session.access_token : null;
        } catch (err) {
            return null;
        }
    }

    // normalizeConceptKeyClient/conceptKeyCandidatesForPage/
    // resetProgressForConcepts (folder/subfolder/page deletion cleanup)
    // removed along with the rest of the old structural "actions" system —
    // nothing here ever called them except that system.

    async function syncFolderToServer(folder) {
        const accessToken = await getSyncAccessToken();
        if (!accessToken) return;
        const resp = await fetch(`${COMPILE_BACKEND_URL}/sync/folders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
            body: JSON.stringify({ folderId: String(folder.id), data: folder, updatedAt: new Date(folder.updatedAt || Date.now()).toISOString() })
        });
        if (!resp.ok) throw new Error(`folder sync failed: ${resp.status}`);
    }

    async function deleteFolderFromServer(folderId) {
        const accessToken = await getSyncAccessToken();
        if (!accessToken) return;
        const resp = await fetch(`${COMPILE_BACKEND_URL}/sync/folders/delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
            body: JSON.stringify({ folderId: String(folderId) })
        });
        if (!resp.ok) throw new Error(`folder delete sync failed: ${resp.status}`);
    }

    async function migrateLegacyFolderIds() {
        const all = await getAllFolders();
        for (const folder of all) {
            if (typeof folder.id === 'number') {
                const oldId = folder.id;
                folder.id = crypto.randomUUID();
                await deleteFolderRecord(oldId);
                await putFolder(folder);
            }
        }
    }

    async function reconcileFoldersWithServer() {
        const accessToken = await getSyncAccessToken();
        if (!accessToken) return;

        await migrateLegacyFolderIds();

        let serverFolders;
        try {
            const resp = await fetch(`${COMPILE_BACKEND_URL}/sync/folders`, {
                headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (!resp.ok) return;
            ({ folders: serverFolders } = await resp.json());
        } catch (err) {
            console.error('LastMind Cortex: could not reach folder sync — continuing with local folders only for this session.', err);
            return;
        }

        const localFolders = await getAllFolders();
        const localById = new Map(localFolders.map((f) => [String(f.id), f]));
        const serverById = new Map(serverFolders.map((f) => [String(f.folderId), f]));

        for (const { folderId, data, updatedAt, deletedAt } of serverFolders) {
            const local = localById.get(String(folderId));
            const serverTime = new Date(deletedAt || updatedAt).getTime();
            if (deletedAt) {
                if (local && (local.updatedAt || 0) < serverTime) {
                    await deleteFolderRecordLocalOnly(local.id);
                }
                continue;
            }
            if (!local || (local.updatedAt || 0) < serverTime) {
                data.id = local ? local.id : folderId;
                data.updatedAt = serverTime;
                await putFolderLocalOnly(data);
            }
        }

        for (const local of localFolders) {
            const server = serverById.get(String(local.id));
            if (!server || (local.updatedAt || 0) > new Date(server.updatedAt).getTime()) {
                await syncFolderToServer(local).catch((err) => console.error('LastMind Cortex: initial folder push failed — will retry at next open.', err));
            }
        }
    }

    // Per-account chat-session sync - same last-write-wins/tombstone design
    // as syncFolderToServer/reconcileFoldersWithServer above, and the same
    // reason: chat sessions used to live ONLY in this browser's IndexedDB
    // (loadSessions/saveSessions below), so a chat started on one device
    // simply didn't exist on another - a real, reported bug, not a design
    // choice. See chatSyncService.ts on the backend for the mirrored table.
    async function syncChatSessionToServer(session) {
        const accessToken = await getSyncAccessToken();
        if (!accessToken) return;
        const resp = await fetch(`${COMPILE_BACKEND_URL}/sync/chats`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
            body: JSON.stringify({ chatId: String(session.id), data: session, updatedAt: new Date(session.updatedAt || Date.now()).toISOString() })
        });
        if (!resp.ok) throw new Error(`chat sync failed: ${resp.status}`);
    }

    async function deleteChatSessionFromServer(chatId) {
        const accessToken = await getSyncAccessToken();
        if (!accessToken) return;
        const resp = await fetch(`${COMPILE_BACKEND_URL}/sync/chats/delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
            body: JSON.stringify({ chatId: String(chatId) })
        });
        if (!resp.ok) throw new Error(`chat delete sync failed: ${resp.status}`);
    }

    // Awaited from resolveActiveSession BEFORE it decides which session to
    // open - pulling in anything created on another device (and pushing up
    // anything local-only) first is the whole point; deciding "most
    // recently active" off a stale/empty local list is exactly what made
    // this look like chat history "doesn't carry over" between devices.
    async function reconcileChatSessionsWithServer() {
        const accessToken = await getSyncAccessToken();
        if (!accessToken) return;

        let serverSessions;
        try {
            const resp = await fetch(`${COMPILE_BACKEND_URL}/sync/chats`, {
                headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (!resp.ok) return;
            ({ chats: serverSessions } = await resp.json());
        } catch (err) {
            console.error('LastMind Cortex: could not reach chat sync — continuing with local chats only for this session.', err);
            return;
        }

        const localSessions = await loadSessions();
        const localById = new Map(localSessions.map((s) => [String(s.id), s]));
        const serverById = new Map(serverSessions.map((s) => [String(s.chatId), s]));
        let changed = false;

        for (const { chatId, data, updatedAt, deletedAt } of serverSessions) {
            const local = localById.get(String(chatId));
            const serverTime = new Date(deletedAt || updatedAt).getTime();
            if (deletedAt) {
                if (local && (local.updatedAt || 0) < serverTime) {
                    localSessions.splice(localSessions.indexOf(local), 1);
                    localById.delete(String(chatId));
                    changed = true;
                }
                continue;
            }
            if (!local || (local.updatedAt || 0) < serverTime) {
                data.id = chatId;
                data.updatedAt = serverTime;
                if (local) localSessions[localSessions.indexOf(local)] = data; else localSessions.push(data);
                localById.set(String(chatId), data);
                changed = true;
            }
        }
        if (changed) await saveSessions(localSessions);

        for (const local of localSessions) {
            const server = serverById.get(String(local.id));
            if (!server || (local.updatedAt || 0) > new Date(server.updatedAt).getTime()) {
                await syncChatSessionToServer(local).catch((err) => console.error('LastMind Cortex: initial chat push failed — will retry at next open.', err));
            }
        }
    }

    // Same split as learn/index.html's own UNIVERSITY_LEVELS/isUniversityLevel
    // — a school-level folder is identified by its exam board, a university
    // one by institution + module code instead (there is no exam board for
    // a university course). Duplicated here rather than shared because
    // these are separate static pages with no shared JS module, but must be
    // kept in sync with learn/index.html's copy — a folder created there
    // needs to be recognized the same way here.
    const UNIVERSITY_LEVELS = new Set([
        'Undergraduate Year 1',
        'Undergraduate Year 2',
        'Undergraduate Year 3',
        'Undergraduate Year 4',
        'Masters',
        'PhD'
    ]);
    function isUniversityLevel(level) {
        return UNIVERSITY_LEVELS.has(level);
    }

    function folderLabel(f) {
        if (isUniversityLevel(f.qualification)) {
            const detail = [f.institution, f.moduleCode].filter(Boolean).join(', ');
            return `${f.subject} — ${f.qualification}${detail ? ` (${detail})` : ''}`;
        }
        return `${f.subject} — ${f.qualification} (${f.examBoard})`;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    /* ───────────────────────── JWT verification (same as /learn) ───────────────────────── */

    function base64UrlToBytes(b64url) {
        const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
        const pad = b64.length % 4 === 0 ? '' : '='.repeat(4 - (b64.length % 4));
        const binary = atob(b64 + pad);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    async function importPublicKey(pem) {
        const b64 = pem.replace(/-----BEGIN PUBLIC KEY-----/, '')
                        .replace(/-----END PUBLIC KEY-----/, '')
                        .replace(/\s+/g, '');
        const bytes = base64UrlToBytes(b64.replace(/-/g, '+').replace(/_/g, '/'));
        return crypto.subtle.importKey(
            'spki',
            bytes.buffer,
            { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
            false,
            ['verify']
        );
    }

    async function verifyJWT(token, publicKey) {
        try {
            const parts = token.split('.');
            if (parts.length !== 3) return null;
            const [headerB64, payloadB64, sigB64] = parts;

            const data = new TextEncoder().encode(`${headerB64}.${payloadB64}`);
            const signature = base64UrlToBytes(sigB64);

            const valid = await crypto.subtle.verify('RSASSA-PKCS1-v1_5', publicKey, signature, data);
            if (!valid) return null;

            const payload = JSON.parse(new TextDecoder().decode(base64UrlToBytes(payloadB64)));
            if (payload.exp && Math.floor(Date.now() / 1000) >= payload.exp) return null;
            if (payload.status !== 'active') return null;

            return payload;
        } catch (err) {
            console.error('LastMind Cortex: JWT verification failed.', err);
            return null;
        }
    }

    async function refreshTokenFromBackend(userId) {
        try {
            const subId = await getStoredSubscriptionId(userId);
            if (!subId) return null;
            // /api/token now requires proof this subscription actually
            // belongs to the caller — see server.js's own comment on the
            // token-replay hole this closes.
            const { data } = await supabaseClient.auth.getSession();
            if (!data.session) return null;
            const resp = await fetch(`${BACKEND_URL}/api/token?subscriptionId=${encodeURIComponent(subId)}`, {
                headers: { Authorization: `Bearer ${data.session.access_token}` }
            });
            if (!resp.ok) return null;
            const { token } = await resp.json();
            await saveToken(userId, token);
            return token;
        } catch (err) {
            console.error('LastMind Cortex: could not refresh token from backend.', err);
            return null;
        }
    }

    function conceptKeyToLabel(conceptKey) {
        return conceptKey.replace(/:/g, ' — ').replace(/_/g, ' ');
    }

    /* ───────────────────────── Chat ───────────────────────── */

    let chatHistory = []; // [{role, content}] — persisted as part of the ACTIVE session, see cortexChatSessions below
    const chatMessagesEl = document.getElementById('chatMessages');
    let emptyHintEl = document.getElementById('chatEmptyHint');

    // Own complete sentence, its own line, right under the greeting - a
    // real person doesn't fuse "good morning" and a piece of advice into
    // one run-on line with a dash; they say the greeting, then say the
    // thing. Rotates the same "keep cycling forward, never restart from
    // the top" persistence pattern learn/index.html's own dashboard quote
    // uses.
    const MOTIVATIONAL_QUOTES = [
        "It doesn't matter how you do it, it matters that you do it.",
        "Remember, starting is the real battle - everything after is just momentum.",
        "Long horizons make short-term setbacks irrelevant.",
        "Raise your standards, and the outcomes will follow.",
        "The hard thing is usually the right thing.",
        "Always remember, action without direction is just noise, and direction without action is just fantasy.",
        "Remember, champions are made when nothing exciting is happening.",
        "Just aim to be 1% better today.",
        "The limit is usually just the story you're telling yourself."
    ];

    async function pickNextQuote() {
        const stored = await getAuthRecord('quoteIndex');
        const prevIndex = typeof stored === 'number' ? stored : -1;
        const nextIndex = (prevIndex + 1) % MOTIVATIONAL_QUOTES.length;
        await putAuthRecord('quoteIndex', nextIndex);
        return MOTIVATIONAL_QUOTES[nextIndex];
    }

    // A plain "Where should we pick up?"-style rotating prompt sitting
    // right above the input box didn't make sense there - replaced with an
    // ordinary time-of-day greeting, same "Good morning/afternoon/evening[,
    // name]" convention learn/index.html's own dashboard feed greeting
    // banner already uses (sfTimeOfDayGreeting/sfGetStudentName) -
    // reproduced here rather than shared, since this is a separate
    // page/iframe with its own supabaseClient. Its own line, own complete
    // sentence - the rotating quote below it (see cortexTimeOfDayGreetingText/
    // MOTIVATIONAL_QUOTES) is a separate thought, not fused onto the end
    // of this one with a dash.
    function cortexTimeOfDayGreetingWord() {
        const hour = new Date().getHours();
        if (hour < 5) return 'Still up';
        if (hour < 12) return 'Good morning';
        if (hour < 18) return 'Good afternoon';
        return 'Good evening';
    }

    function cortexDeriveNameFromEmail(email) {
        const local = (email || '').split('@')[0];
        return local ? local.replace(/[._]+/g, ' ').trim() : '';
    }

    async function cortexGetStudentName() {
        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const realName = (session?.user?.user_metadata?.first_name || '').trim();
            return realName || cortexDeriveNameFromEmail(session?.user?.email || '');
        } catch (err) {
            return '';
        }
    }

    async function cortexTimeOfDayGreetingText() {
        const name = await cortexGetStudentName();
        return name ? `${cortexTimeOfDayGreetingWord()}, ${name}.` : `${cortexTimeOfDayGreetingWord()}.`;
    }

    // Multiple saved chat threads — replaces the old single
    // 'cortexChatHistory' key. Each session: { id, title, createdAt,
    // updatedAt, messages: [{role, content}] }. Shared IndexedDB (same
    // origin, same LastMindDB database) means learn/index.html's own
    // sidebar chat list reads this SAME array directly — no separate
    // sync needed between the two pages.
    let activeSessionId = null;

    function newSessionId() {
        return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    async function loadSessions() {
        try {
            const stored = await getAuthRecord('cortexChatSessions');
            return Array.isArray(stored) ? stored : [];
        } catch (err) {
            return [];
        }
    }

    async function saveSessions(sessions) {
        try {
            await putAuthRecord('cortexChatSessions', sessions);
        } catch (err) {
            console.error('LastMind Cortex: could not save chat sessions.', err);
        }
    }

    // One-time migration from the old single-conversation key, so an
    // existing student's in-progress chat doesn't just vanish under the
    // new multi-session scheme. Safe to leave the old key sitting unused
    // afterward — it's tiny, and next boot's sessions.length check skips
    // this entirely once it's run once.
    async function migrateOldSingleHistory(sessions) {
        if (sessions.length) return sessions;
        let old;
        try {
            old = await getAuthRecord('cortexChatHistory');
        } catch (err) {
            old = null;
        }
        if (!Array.isArray(old) || !old.length) return sessions;
        const firstUserTurn = old.find((t) => t.role === 'user');
        const migrated = [{
            id: newSessionId(),
            title: firstUserTurn ? firstUserTurn.content.slice(0, 48) : 'Chat',
            createdAt: Date.now(),
            updatedAt: Date.now(),
            messages: old,
        }];
        await saveSessions(migrated);
        return migrated;
    }

    // Determines which session this page load should open: an explicit
    // ?chatId=, a fresh one for ?new=1, or — the plain "/cortex" case,
    // same as before this existed — whichever session was most recently
    // active. Starts a brand new session if none exist yet at all.
    // A brand new session is deliberately NOT written to storage here —
    // only saveChatHistory (after the first real message) persists it.
    // Otherwise every stray "+ New chat" click (including ones abandoned
    // without ever sending anything) would leave a permanent empty
    // "New chat" entry cluttering the sidebar list forever.
    async function resolveActiveSession() {
        const params = new URLSearchParams(window.location.search);
        // Pull in anything created on another device (and push up anything
        // local-only) BEFORE deciding which session to open - deciding
        // "most recently active" off a stale/empty local list is exactly
        // what made chat history look like it "doesn't carry over" between
        // devices; it simply was never being read from, or written to, the
        // server at all until this existed. A no-op (resolves immediately)
        // when signed out or offline.
        await reconcileChatSessionsWithServer().catch((err) => console.error('LastMind Cortex: chat reconcile failed — continuing with local chats only.', err));
        let sessions = await migrateOldSingleHistory(await loadSessions());

        if (params.get('new') === '1') {
            return { id: newSessionId(), title: 'New chat', createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
        }

        const requestedId = params.get('chatId');
        if (requestedId) {
            const found = sessions.find((s) => s.id === requestedId);
            if (found) return found;
        }

        if (sessions.length) {
            return sessions.slice().sort((a, b) => b.updatedAt - a.updatedAt)[0];
        }

        return { id: newSessionId(), title: 'New chat', createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
    }

    // Reuses the AUTH_STORE as a generic small key-value store — same
    // pattern already used elsewhere (e.g. the stored subscription ID),
    // rather than adding a whole new object store just for this.
    async function saveChatHistory() {
        await ensureSessionReady();
        if (!activeSessionId) return;
        try {
            const sessions = await loadSessions();
            const idx = sessions.findIndex((s) => s.id === activeSessionId);
            const firstUserTurn = chatHistory.find((t) => t.role === 'user');
            const title = firstUserTurn ? firstUserTurn.content.slice(0, 48) : 'New chat';
            const updated = { id: activeSessionId, title, createdAt: idx >= 0 ? sessions[idx].createdAt : Date.now(), updatedAt: Date.now(), messages: chatHistory };
            if (idx >= 0) sessions[idx] = updated; else sessions.unshift(updated);
            await saveSessions(sessions);
            syncChatSessionToServer(updated).catch((err) => console.error('LastMind Cortex: chat sync to server failed — will retry at next open.', err));
        } catch (err) {
            console.error('LastMind Cortex: could not save chat history.', err);
        }
    }

    // Only the backend call context stays capped at the last 10 turns
    // (see sendChatMessage) — the FULL history is what gets displayed and
    // stored, so returning to this page shows everything, not just a
    // recent tail.
    // Settles activeSessionId as early as possible - independent of the
    // auth/subscription gate below (importPublicKey, getSession, the JWT
    // verification round trip), since IndexedDB needs no server auth at
    // all to read from. Real bug this fixes: the chat input is focused and
    // usable the instant the page paints, well before that gate resolves -
    // a message sent in that window used to find activeSessionId still
    // null (saveChatHistory's own guard silently no-ops then) and never
    // got saved, even though the reply still came back fine, making it
    // look like "nothing saves unless I click + New chat first" (clicking
    // it later reloads the iframe well after the gate has already
    // resolved once, so the same race never has a chance to occur then).
    // Idempotent - only ever does the real resolveActiveSession() work
    // once; called again immediately below, in parallel with gate().
    let sessionReadyPromise = null;
    function ensureSessionReady() {
        if (!sessionReadyPromise) {
            sessionReadyPromise = resolveActiveSession().then((session) => {
                activeSessionId = session.id;
                return session;
            });
        }
        return sessionReadyPromise;
    }
    ensureSessionReady();

    // The DOM half of restoring a session - rendering its past messages -
    // stays sequenced inside enterApp (after renderEmptyState(), which it
    // may need to tear back down via clearEmptyHint()); only the id
    // resolution above needed to move earlier.
    // Rebuilds a turn recordSilentContext logged with a kind/data pair back
    // into the actual boxed card it stood for - a "map" turn becomes the
    // real, still-interactive knowledge-map card (tick/target/Start still
    // work, using the same real node/concept ids the live session used),
    // everything else becomes a small static summary card. Called from
    // restoreChatHistory (page load / opening a past chat) - defined
    // separately so it can also be reused for a turn appended in the
    // current session without a full page reload, if that's ever needed.
    function renderRestoredSilentTurn(turn) {
        if (turn.kind === 'map' && turn.data) {
            const card = appendCardMessage('');
            const d = turn.data;
            const taskNode = d.nodes.find((n) => n.isFinalTask) || d.nodes[d.nodes.length - 1];
            const state = { subject: d.subject, qualification: d.qualification, examBoard: d.examBoard, nodes: d.nodes, edges: d.edges, skip: new Set(), target: taskNode ? taskNode.id : null };
            renderTopicMap(card, state);
            topicMapState = state; // kept as "most recently shown map", for reference only - every card's own interactivity closes over its own `state`, never this
        } else if (turn.kind === 'lessonDone' && turn.data) {
            appendCardMessage(`<div class="lesson-card-done">✓ Completed: ${escapeHtmlTopic(turn.data.label)}</div>`);
        } else if (turn.kind === 'lessonFailed' && turn.data) {
            appendCardMessage(`<div class="lesson-card-status">Couldn't generate an interactive lesson for “${escapeHtmlTopic(turn.data.label)}” at the time.</div>`);
        } else if (turn.kind === 'allDone' && turn.data) {
            appendCardMessage(`<div class="lesson-card-done">Finished every lesson for “${escapeHtmlTopic(turn.data.subject)}”.</div>`);
        }
        // A silent turn with no recognised kind (shouldn't normally happen)
        // renders nothing - it was context-only to begin with.
    }

    async function restoreChatHistory() {
        const session = await ensureSessionReady();
        if (!session.messages || !session.messages.length) return;
        chatHistory = session.messages;
        clearEmptyHint();
        // Real, reported bug: appendUserMessage/appendAssistantMessage/
        // appendCardMessage each call scrollIntoView({behavior:'smooth'})
        // on their own element - fine one at a time for a live chat, but
        // restoring several turns in this one synchronous loop fired that
        // many competing smooth-scroll animations back to back, and the
        // browser could settle wherever the FIRST (often tallest - the map
        // card) one landed instead of the actual bottom, reading as "only
        // the map shows, nothing else did" even though everything after it
        // was really there, just scrolled out of view. Suppressed here and
        // done exactly once at the end instead.
        suppressAutoScroll = true;
        chatHistory.forEach((turn) => {
            if (turn.silent) { renderRestoredSilentTurn(turn); return; }
            if (turn.role === 'user') appendUserMessage(turn.content);
            else appendAssistantMessage(turn.content);
        });
        suppressAutoScroll = false;
        // If the chat was closed/reloaded right after a map was built and
        // never confirmed, re-arm the same "shall I build the first
        // lesson?" checkpoint it would have shown live - restoring a map
        // used to leave a real "Start the lesson" button on screen, so
        // there was always a way to actually begin it; now that this is a
        // plain typed reply instead of a button, without this the student
        // would have no way to start that map short of retyping the exact
        // same "teach me X" and paying for a whole new map generation.
        // Only ever fires for the LAST turn - an earlier, already-acted-on
        // map further back in history must not get a fresh prompt attached
        // to it. topicMapState is reliably still this exact map's state
        // object here, since renderRestoredSilentTurn's 'map' branch just
        // set it moments ago in the loop above, and nothing since has
        // changed it.
        const lastTurn = chatHistory[chatHistory.length - 1];
        if (lastTurn && lastTurn.silent && lastTurn.kind === 'map' && topicMapState) {
            const state = topicMapState;
            promptLessonContinuation(LESSON_START_PROMPTS, () => startTopicTeachSequence(state));
        }
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }

    function clearEmptyHint() {
        if (emptyHintEl) { emptyHintEl.remove(); emptyHintEl = null; }
        chatMessagesEl.classList.remove('chat-empty-active');
    }

    // Populates the empty-state greeting+quote/logo - called once at boot,
    // before restoreChatHistory decides whether to immediately clear it
    // again (a session with existing messages tears this straight back down
    // via clearEmptyHint, which is fine — cheap either way).
    async function renderEmptyState() {
        const greetingEl = document.getElementById('chatEmptyGreeting');
        if (greetingEl) greetingEl.textContent = await cortexTimeOfDayGreetingText();
        const quoteEl = document.getElementById('chatEmptyQuote');
        if (quoteEl) quoteEl.textContent = await pickNextQuote();
        chatMessagesEl.classList.add('chat-empty-active');
    }

    // ─── "Learn something new": a live-generated, interactive knowledge map for
    // any topic, scoped by the student (tick what's already known, pick a
    // target), taught node by node right here in the chat thread - map,
    // then every lesson stage, all as boxed cards in the same scroll, never
    // handed off to a separate dashboard page. See topicKnowledgeMapService.ts
    // (generation/caching) and startTopicTeachSequence below (the teaching
    // loop). learn/index.html's lm-cortex-start-topic listener is the old
    // hand-off this replaced - left in place, just no longer sent from here.
    let topicMapState = null; // { subject, qualification, examBoard, nodes: [{id,conceptId,label,description}], edges: [{from,to}], skip:Set, target:string }

    // Set whenever a lesson card fails in a way its own "Try again" button
    // can retry (see teachNextInQueue), cleared the moment that resolves.
    // Lets sendChatMessage honour a plain "try again" typed into chat as
    // the same click, no LLM involved - this is a known, specific, already-
    // visible failure in THIS session, not free text the model would have
    // to infer a structural action from (that's what CORTEX_INTENT_PROMPT's
    // "no actions" rule exists to avoid - see cortexPrompts.ts's own top
    // comment on why that rule exists in the first place).
    let pendingLessonRetry = null;

    // A pending confirm-to-continue closure - set whenever Cortex is
    // waiting on a plain "shall I go ahead?" about building a lesson: the
    // map's first lesson, or the next one once a lesson just finished.
    // Distinct from pendingLessonRetry above (a known FAILURE to redo);
    // this is an ordinary, non-failure checkpoint that replaces what used
    // to be a "Start the lesson" button - the student answers in their own
    // words instead of clicking anything. A clearly affirmative reply runs
    // it; a clearly negative one just clears it; anything else (a real
    // question, an unrelated remark) falls through to the normal chat turn
    // WITHOUT clearing it, so a later "yes" can still pick the same
    // continuation back up.
    let pendingLessonContinuation = null;

    function detectAffirmativeIntent(text) {
        return /^(?:yes|yeah|yep|yup|sure|ok(?:ay)?|go(?: on| ahead)?|do it|please(?: do)?|sounds good|let'?s (?:go|do it)|start|build it|go for it|why not|absolutely|definitely|of course)[.!]?$/i.test(text.trim());
    }
    function detectNegativeIntent(text) {
        return /^(?:no|nah|nope|not (?:now|yet|really)|hold on|wait|later|maybe later)[.!]?$/i.test(text.trim());
    }

    // Deliberately looser than detectAffirmativeIntent above (which only
    // matches a short reply as the WHOLE message) - this matches "start"/
    // "begin"/"dive in" etc. anywhere in a fuller, more natural sentence
    // ("can we start with the lessons then please", "let's begin the first
    // one"), specifically against the word "lesson(s)" so it doesn't
    // misfire on an unrelated "let's start" about something else entirely.
    function detectStartLessonsIntent(text) {
        const t = text.trim();
        if (/\b(?:start|begin|dive in|get going|get started|carry on|continue)\b/i.test(t) && /\blesson/i.test(t)) return true;
        return /^(?:start|begin)(?: (?:the|this|it|now))?[.!]?$/i.test(t);
    }

    // Never the same wording twice in a row where avoidable - picks
    // uniformly at random, which is good enough for a two-word prompt the
    // student will only see a handful of times per session.
    function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    const LESSON_START_PROMPTS = [
        'Shall I go ahead and build the first lesson?',
        'Want me to build this one now?',
        'Ready when you are - build the first lesson?',
        "Say the word and I'll get the first lesson going.",
        "I can build the first lesson whenever you're ready.",
    ];
    const LESSON_NEXT_PROMPTS = [
        'Shall I build the next one?',
        'Ready for the next lesson?',
        'Want me to carry on to the next concept?',
        'Nice work - build the next lesson?',
        "Onwards? I can get the next one ready.",
    ];

    // Posts a warm, varying nudge as an ordinary chat message and arms
    // pendingLessonContinuation with `run` - see sendChatMessage's own
    // handling of it for how a plain yes/no (or anything else) resolves.
    function promptLessonContinuation(promptPool, run) {
        appendAssistantMessage(randomFrom(promptPool));
        pendingLessonContinuation = run;
    }

    // The knowledge_map_nodes.id (uuid) of whichever lesson card most
    // recently mounted a derivation player (see mountDerivationInCard) -
    // lets a plain question typed into chat ("instead of using 'would',
    // what is 'could' in this sentence?") be answered WITH that lesson's
    // own context (its explanation, its current on-screen question) via
    // the existing GET /knowledge-map-v2/node/:nodeId/ask route, the same
    // one the dashboard's own "Ask Cortex" corner panel already uses for
    // exactly this - rather than a general chat call with no idea what
    // "this sentence" even refers to. Never cleared once set - it's still
    // reasonable to ask about the last thing you were taught even after
    // moving on, and the next lesson's own mount overwrites it anyway.
    let activeLessonNodeUuid = null;

    // Reorders nodes into a real dependency-respecting order (Kahn's
    // algorithm - a node only appears once every edge into it has already
    // been placed), original array order used as the tie-break wherever the
    // DAG itself leaves the order free. Matters for more than just display:
    // the backend generates each node's derivation lesson in STAGES that
    // must be produced in order (a later stage's generation is REJECTED if
    // an earlier one it depends on doesn't exist yet - see
    // derivationGenericService.ts's own "prerequisite stage(s) ... have not
    // been generated first" check) - the raw generation-order array from
    // the topic-map endpoint is a reasonable reading order but isn't
    // guaranteed to respect every real edge, and teaching out of dependency
    // order is exactly what previously surfaced as "this concept doesn't
    // have an interactive lesson ready yet" for a node reached too early.
    function topicTopologicalOrder(nodes, edges) {
        const indegree = new Map(nodes.map((n) => [n.id, 0]));
        const adj = new Map(nodes.map((n) => [n.id, []]));
        edges.forEach((e) => {
            if (!adj.has(e.from) || !indegree.has(e.to)) return;
            adj.get(e.from).push(e.to);
            indegree.set(e.to, (indegree.get(e.to) || 0) + 1);
        });
        const byId = new Map(nodes.map((n) => [n.id, n]));
        const ready = nodes.filter((n) => indegree.get(n.id) === 0).map((n) => n.id);
        const seen = new Set();
        const order = [];
        while (ready.length) {
            const id = ready.shift();
            if (seen.has(id)) continue;
            seen.add(id);
            order.push(id);
            (adj.get(id) || []).forEach((to) => {
                indegree.set(to, indegree.get(to) - 1);
                if (indegree.get(to) === 0) ready.push(to);
            });
        }
        // A node never reached (only possible if the graph has a cycle -
        // the server validates DAGs at generation time, so this is a
        // fail-safe, not an expected path) is appended in original order.
        nodes.forEach((n) => { if (!seen.has(n.id)) order.push(n.id); });
        return order.map((id) => byId.get(id));
    }

    function topicAncestorsOf(nodes, edges, targetId) {
        const depsOf = new Map(nodes.map((n) => [n.id, []]));
        edges.forEach((e) => { if (depsOf.has(e.to)) depsOf.get(e.to).push(e.from); });
        const seen = new Set();
        (function walk(id) { if (seen.has(id)) return; seen.add(id); (depsOf.get(id) || []).forEach(walk); })(targetId);
        return seen;
    }

    function topicComputeTeachSet(state) {
        const closure = topicAncestorsOf(state.nodes, state.edges, state.target);
        return state.nodes.filter((n) => closure.has(n.id) && !state.skip.has(n.id));
    }

    function escapeHtmlTopic(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Every card below - the loading state, the map, and every lesson stage
    // - is appended straight into the ordinary chat thread (#chatMessages),
    // never into a separate page, so it's part of the same scroll as every
    // other message. clearEmptyHint() first: the empty-state logo/quote and
    // its own suggestion chips only make sense before anything's happened
    // yet, same as it already gets torn down for a plain chat message.
    // Set by restoreChatHistory while it bulk-appends every past turn at
    // once - see its own comment on why firing scrollIntoView once per
    // turn there could leave the page settled somewhere other than the
    // bottom (looking like everything after that point had gone missing).
    let suppressAutoScroll = false;

    function appendCardMessage(innerHtml) {
        clearEmptyHint();
        const el = document.createElement('div');
        el.className = 'chat-msg chat-msg-card';
        el.innerHTML = innerHtml;
        chatMessagesEl.appendChild(el);
        if (!suppressAutoScroll) el.scrollIntoView({ behavior: 'smooth', block: 'end' });
        return el;
    }

    // The map/lesson cards are all visual - none of it touched chatHistory
    // at first, so (a) a plain chat message sent right after ("try again
    // now") had nothing to go on, since sendChatMessage only ever sees
    // chatHistory, not the DOM, and (b) reopening a past chat later could
    // only ever replay plain text turns, never the actual map/lesson cards
    // - real reported bug, "you shouldn't just be able to see the most
    // previous lesson". This records a note into chatHistory (and saves
    // it): `content` is the plain-text context Cortex reads (see
    // CORTEX_INTENT_PROMPT's own note on the bracket-note convention);
    // `kind`/`data`, when given, are what restoreChatHistory needs to
    // rebuild the actual boxed card when this chat is reopened later,
    // instead of just the bracket text. `silent: true` marks the turn so
    // restoreChatHistory renders ONLY that reconstructed card, never a
    // second, literal "[...]" chat bubble alongside it.
    function recordSilentContext(content, kind, data) {
        chatHistory.push({ role: 'assistant', content, silent: true, kind, data });
        saveChatHistory();
    }

    const TOPIC_MAP_LOADING_MESSAGES = [
        'Reading the topic…',
        'Working out what it depends on…',
        'Mapping the prerequisites…',
        'Checking what connects to what…',
        'Putting it in a sensible order…',
        'Nearly there…',
    ];
    // A cache HIT (the common case once any student has reached this
    // concept before) resolves near-instantly - these only matter for a
    // genuine live generation, so they describe that specifically rather
    // than a generic "loading" that would be a little misleading the rest
    // of the time.
    const LESSON_LOADING_MESSAGES = [
        'Working out how to teach this…',
        'Building the derivation…',
        'Writing the practice question…',
        'Checking it holds together…',
        'Nearly ready…',
    ];
    const TOPIC_LOADING_WIRES_SVG = `<svg class="topic-loading-wires" viewBox="0 0 160 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M16,32 L80,12"/><path d="M16,32 L80,52"/><path d="M80,12 L144,32"/><path d="M80,52 L144,32"/>
        <circle cx="16" cy="32" r="5"/><circle cx="80" cy="12" r="5"/><circle cx="80" cy="52" r="5"/><circle cx="144" cy="32" r="5"/>
    </svg>`;
    // Rotates the loading line every 1.8s for as long as generation is in
    // flight - returns a stop function the caller runs once the real
    // result (or an error) is ready, so the interval never outlives the
    // card it was updating.
    function startLoadingRotator(textEl, messages) {
        let i = 0;
        textEl.textContent = messages[0];
        const timer = setInterval(() => {
            i = (i + 1) % messages.length;
            textEl.textContent = messages[i];
        }, 1800);
        return () => clearInterval(timer);
    }

    // Assigns each node a "level" = 1 + the deepest level among its own
    // prerequisites (0 for a node with none) - a real DAG layering, not
    // just generation order, so nodes that don't depend on each other land
    // in the same row instead of being forced into one artificial
    // sequence. A mechanism with independent branches, or several parents
    // converging on one node, actually looks like that once laid out this
    // way, rather than reading as a single straight line. `nodes` must
    // already be topologically sorted (see topicTopologicalOrder) so every
    // prerequisite's level is already known by the time its dependents are
    // processed.
    function topicComputeLevels(nodes, edges) {
        const depsOf = new Map(nodes.map((n) => [n.id, []]));
        edges.forEach((e) => { if (depsOf.has(e.to)) depsOf.get(e.to).push(e.from); });
        const levelOf = new Map();
        nodes.forEach((n) => {
            const deps = depsOf.get(n.id) || [];
            levelOf.set(n.id, deps.length ? Math.max(...deps.map((d) => levelOf.get(d) ?? 0)) + 1 : 0);
        });
        return levelOf;
    }

    // Draws the map's real prerequisite edges as curved lines between each
    // node's own rendered box - run AFTER the boxes are in the DOM so real,
    // wrapped-text box sizes/positions are used rather than an assumed
    // fixed layout. `wrapEl` is position:relative; `svgEl` sits over it via
    // position:absolute;inset:0 in CSS, sized here to match.
    // A bare icon on its own isn't self-explanatory - renderTopicMap prints
    // a matching text legend under the map (its "key") using these same two
    // characters, so a student only ever has to learn what they mean once.
    const TOPIC_NODE_ICONS = { skip: '✓', target: '★' };

    function drawTopicGraphEdges(wrapEl, svgEl, state) {
        const wrapRect = wrapEl.getBoundingClientRect();
        svgEl.setAttribute('width', wrapRect.width);
        svgEl.setAttribute('height', wrapRect.height);
        svgEl.setAttribute('viewBox', `0 0 ${wrapRect.width} ${wrapRect.height}`);
        svgEl.innerHTML = state.edges.map((e) => {
            const fromEl = wrapEl.querySelector(`[data-node="${e.from}"]`);
            const toEl = wrapEl.querySelector(`[data-node="${e.to}"]`);
            if (!fromEl || !toEl) return '';
            const fr = fromEl.getBoundingClientRect(), tr = toEl.getBoundingClientRect();
            const x1 = fr.left + fr.width / 2 - wrapRect.left, y1 = fr.bottom - wrapRect.top;
            const x2 = tr.left + tr.width / 2 - wrapRect.left, y2 = tr.top - wrapRect.top;
            const midY = (y1 + y2) / 2;
            return `<path d="M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}" />`;
        }).join('');
    }

    // `state` is one specific map's own object (subject/qualification/
    // examBoard/nodes/edges/skip/target) - never the shared topicMapState
    // variable directly, so a chat with more than one "teach me" in it
    // keeps each restored map card independently interactive (ticking a
    // box on an OLDER map must not touch a newer one's state). Every click
    // handler below closes over this same `state` object, not a global.
    // Renders (or re-renders, after a skip/target click) the whole map on
    // one screen as a real layered graph - one row per DAG level, nodes at
    // the same level side by side, edges drawn to wherever they actually
    // go - instead of a single top-to-bottom list, since a mechanism's real
    // prerequisite structure isn't always one straight line.
    function renderTopicMap(cardEl, state) {
        const closure = topicAncestorsOf(state.nodes, state.edges, state.target);
        const depsOf = new Map(state.nodes.map((n) => [n.id, []]));
        state.edges.forEach((e) => { if (depsOf.has(e.to)) depsOf.get(e.to).push(e.from); });
        const labelOf = new Map(state.nodes.map((n) => [n.id, n.label]));
        const levelOf = topicComputeLevels(state.nodes, state.edges);
        const maxLevel = state.nodes.length ? Math.max(...state.nodes.map((n) => levelOf.get(n.id))) : 0;
        const rows = Array.from({ length: maxLevel + 1 }, () => []);
        state.nodes.forEach((n) => rows[levelOf.get(n.id)].push(n));

        // Title only - no description, no "Builds on:" text - the box just
        // names the concept; what it depends on is what the drawn edges
        // above already show. skip/target used to be two spelled-out
        // buttons per box, which is what was pushing every box tall enough
        // to overlap the row below it; now two small icon circles (see
        // TOPIC_NODE_ICONS/the legend line below the map, which is the
        // "key" for what each one means, since a bare icon alone isn't
        // self-explanatory).
        const nodeBoxHtml = (n) => {
            const inClosure = closure.has(n.id);
            const skipped = state.skip.has(n.id);
            const isTarget = n.id === state.target;
            return `<div class="topic-node-box${!inClosure ? ' locked' : ''}" data-node="${n.id}">
                <div class="topic-node-title" style="${skipped ? 'opacity:.6;text-decoration:line-through;' : ''}">${escapeHtmlTopic(n.label)}</div>
                <div class="topic-node-actions">
                    <button type="button" class="topic-node-icon-btn${skipped ? ' on' : ''}" data-action="skip" data-node="${n.id}" title="I've covered this">${TOPIC_NODE_ICONS.skip}</button>
                    <button type="button" class="topic-node-icon-btn${isTarget ? ' on' : ''}" data-action="target" data-node="${n.id}" title="Make this the goal">${TOPIC_NODE_ICONS.target}</button>
                </div>
            </div>`;
        };

        const teach = topicComputeTeachSet(state);
        const targetLabel = labelOf.get(state.target) || state.target;
        const summary = teach.length
            ? `Teaching <b>${teach.length}</b> node${teach.length === 1 ? '' : 's'} to get you to “${escapeHtmlTopic(targetLabel)}”.`
            : `You already know everything needed for this target - pick a further one, or start anyway.`;

        cardEl.innerHTML = `
            <div class="topic-map-heading">Your knowledge map for “${escapeHtmlTopic(state.subject)}”</div>
            <div class="topic-graph-wrap">
                <svg class="topic-graph-svg"></svg>
                <div class="topic-graph-rows">
                    ${rows.map((row) => `<div class="topic-graph-row">${row.map(nodeBoxHtml).join('')}</div>`).join('')}
                </div>
            </div>
            <div class="topic-map-summary">${summary}</div>
            <div class="topic-map-legend">${TOPIC_NODE_ICONS.skip} I've already covered this &nbsp;·&nbsp; ${TOPIC_NODE_ICONS.target} Make this the goal</div>
        `;

        drawTopicGraphEdges(cardEl.querySelector('.topic-graph-wrap'), cardEl.querySelector('.topic-graph-svg'), state);

        cardEl.querySelectorAll('[data-action="skip"]').forEach((btn) => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.node;
                if (state.skip.has(id)) state.skip.delete(id); else state.skip.add(id);
                renderTopicMap(cardEl, state);
            });
        });
        cardEl.querySelectorAll('[data-action="target"]').forEach((btn) => {
            btn.addEventListener('click', () => { state.target = btn.dataset.node; renderTopicMap(cardEl, state); });
        });
    }

    // The topic map's own nodes are keyed by node_key (a short slug, unique
    // only within this one topic's graph - see topicKnowledgeMapService.ts)
    // since that's all the map-building endpoint ever needed to hand back.
    // Actually teaching a node needs its real knowledge_map_nodes.id (uuid)
    // instead - GET /knowledge-map-v2/node/:nodeId/lesson is keyed on that,
    // same as every curated subject. Rather than changing the topic-map
    // endpoint's own response shape, this reuses the EXISTING subject-map
    // read (GET /knowledge-map-v2, already returns real uuids) and joins on
    // conceptId, which is the one id that's stable and identical across
    // both representations (clean(subject):clean(nodeKey), see
    // topicKnowledgeMapService.ts's own clean()).
    async function fetchTopicNodeUuids(subject, qualification, examBoard) {
        const accessToken = await getSyncAccessToken();
        if (!accessToken) throw new Error('not signed in');
        const params = new URLSearchParams({ subject, qualification, examBoard });
        const resp = await fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2?${params.toString()}`, {
            headers: { Authorization: `Bearer ${accessToken}` }
        });
