<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LastMind – Cortex</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1A1A1C">
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));

<style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
        --bg: #1A1A1C;
        --panel: #201F21;
        --text: #E6D7B0;
        --accent: #E6D7B0;
    }

    html, body { height: 100%; }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Georgia', serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }

    #gate-message {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Arial', sans-serif;
        color: var(--text);
        opacity: 0.6;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
    }

    #app {
        display: none;
        flex-direction: column;
        height: 100vh;
    }

    .cortex-header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 26px;
        border-bottom: 1px solid rgba(230, 215, 176, 0.1);
        flex-shrink: 0;
    }

    .cortex-back-link {
        font-family: 'Arial', sans-serif;
        font-size: 0.82rem;
        color: var(--accent);
        opacity: 0.75;
        text-decoration: none;
        border: 1px solid rgba(230, 215, 176, 0.3);
        border-radius: 4px;
        padding: 8px 14px;
        flex-shrink: 0;
    }

    .cortex-back-link:hover { opacity: 1; }

    .cortex-header-title {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        flex: 1;
    }

    .cortex-header-sub {
        font-family: 'Arial', sans-serif;
        font-size: 0.72rem;
        opacity: 0.45;
        letter-spacing: 0.02em;
    }

    .chat-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 28px 26px;
    }

    .chat-inner {
        max-width: 680px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    /* Shown only while chatHistory is empty — replaced by the ordinary
       scrolling message list the moment the first message (sent or
       restored) lands (see clearEmptyHint). min-height/justify-content
       center it within whatever room .chat-scroll actually has, with
       padding-bottom biasing it slightly ABOVE true center rather than
       dead-center. */
    #chatMessages.chat-empty-active {
        min-height: 100%;
        justify-content: center;
        padding-bottom: 9vh;
    }

    .chat-empty-logo {
        text-align: center;
        font-size: clamp(1.9rem, 5vw, 2.8rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text);
    }

    .chat-empty-logo span { color: var(--accent); }

    .chat-empty-quote {
        font-family: 'Georgia', serif;
        font-style: italic;
        text-align: center;
        opacity: 0.55;
        max-width: 420px;
        margin: 10px auto 0;
        line-height: 1.7;
        font-size: 0.95rem;
    }

    /* Sits just above the input row, only while chatHistory is empty —
       a rotating original prompt, never the same wording twice in a row. */
    .chat-greeting {
        display: none;
        text-align: center;
        font-family: 'Arial', sans-serif;
        font-size: 0.85rem;
        opacity: 0.6;
        padding: 0 26px 14px;
        max-width: 680px;
        margin: 0 auto;
    }

    .chat-greeting.active { display: block; }

    body.cortex-embed .cortex-header { display: none; }

    .chat-msg {
        max-width: 82%;
        padding: 13px 16px;
        border-radius: 10px;
        font-size: 0.92rem;
        line-height: 1.65;
        white-space: pre-wrap;
    }

    .chat-msg-user {
        align-self: flex-end;
        background: var(--accent);
        color: var(--bg);
        border-bottom-right-radius: 3px;
    }

    .chat-msg-assistant {
        align-self: flex-start;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.15);
        border-bottom-left-radius: 3px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
    }

    .chat-msg-text {
        flex: 1;
        min-width: 0;
    }

    .chat-msg-speak-btn {
        flex-shrink: 0;
        background: none;
        border: none;
        color: var(--text);
        opacity: 0.5;
        font-size: 0.95rem;
        cursor: pointer;
        padding: 0;
        line-height: 1;
    }

    .chat-msg-speak-btn:hover {
        opacity: 1;
    }

    .chat-confirm-card, .chat-answer-card {
        align-self: stretch;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.25);
        border-radius: 10px;
        padding: 16px;
    }

    .chat-confirm-text {
        font-size: 0.9rem;
        line-height: 1.6;
        margin-bottom: 12px;
    }

    .chat-confirm-status {
        font-family: 'Arial', sans-serif;
        font-size: 0.82rem;
        opacity: 0.8;
        margin-top: 4px;
    }

    .chat-confirm-actions {
        display: flex;
        gap: 10px;
    }

    .chat-confirm-btn {
        font-family: 'Arial', sans-serif;
        font-size: 0.82rem;
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: 4px;
        padding: 9px 18px;
        cursor: pointer;
    }

    .chat-confirm-btn-no {
        background: none;
        border: 1px solid rgba(230, 215, 176, 0.3);
        color: var(--text);
    }

    .chat-answer-input {
        width: 100%;
        min-height: 80px;
        background: var(--bg);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 6px;
        padding: 10px 12px;
        color: var(--text);
        font-family: 'Georgia', serif;
        font-size: 0.9rem;
        resize: vertical;
        margin-bottom: 10px;
    }

    .chat-answer-input:focus { outline: none; border-color: rgba(230, 215, 176, 0.5); }

    .chat-input-row {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 26px 22px;
        border-top: 1px solid rgba(230, 215, 176, 0.1);
        max-width: 680px;
        margin: 0 auto;
        width: 100%;
    }

    #chatInput {
        flex: 1;
        background: var(--panel);
        border: 1px solid rgba(230, 215, 176, 0.2);
        border-radius: 18px;
        padding: 12px 18px;
        color: var(--text);
        font-family: 'Georgia', serif;
        font-size: 0.92rem;
        resize: none;
        max-height: 160px;
        overflow-y: auto;
        line-height: 1.4;
    }

    #chatInput:focus { outline: none; border-color: rgba(230, 215, 176, 0.5); }

    #chatMicBtn, #chatSendBtn {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(230, 215, 176, 0.3);
        background: var(--panel);
        color: var(--accent);
        font-size: 1.05rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #chatMicBtn:hover, #chatSendBtn:hover { background: rgba(230, 215, 176, 0.1); }

    #chatMicBtn:disabled { opacity: 0.3; cursor: not-allowed; }

    #chatMicBtn.listening {
        background: var(--accent);
        color: var(--bg);
        animation: cortex-mic-pulse 1.4s infinite;
    }

    @keyframes cortex-mic-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(230, 215, 176, 0.4); }
        50% { box-shadow: 0 0 0 8px rgba(230, 215, 176, 0); }
    }

    #chatSendBtn { background: var(--accent); color: var(--bg); border: none; }
</style>

<body>

<div id="gate-message">Checking your subscription…</div>

<div id="app">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const BACKEND_URL = 'https://lastmind-stripe-backend.onrender.com';
    const COMPILE_BACKEND_URL = 'https://lastmind-compile-backend.onrender.com';

    const SUPABASE_URL = 'https://evgdecewwmkupiadgfop.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Bb-f61P1zqy_xW63D26nUw_VTOVXaub';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const PUBLIC_KEY_PEM = `-----BEGIN PUBLIC KEY-----

SQIDAQAB
-----END PUBLIC KEY-----`;

    /* ───────────────────────── IndexedDB (same DB as /learn) ───────────────────────── */

    if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(() => {});
    }

    const DB_NAME = 'LastMindDB';
    const DB_VERSION = 2;
    const AUTH_STORE = 'auth';
    const FOLDER_STORE = 'folders';

    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(AUTH_STORE)) {
                    db.createObjectStore(AUTH_STORE, { keyPath: 'id' });
                }
                if (!db.objectStoreNames.contains(FOLDER_STORE)) {
                    db.createObjectStore(FOLDER_STORE, { keyPath: 'id', autoIncrement: true });
                }
            };
            req.onsuccess = (e) => resolve(e.target.result);
            req.onerror = (e) => reject(e.target.error);
        });
    }

    async function putAuthRecord(id, value) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(AUTH_STORE, 'readwrite');
            tx.objectStore(AUTH_STORE).put({ id, value, savedAt: Date.now() });
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e.target.error);
        });
    }

    async function getAuthRecord(id) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(AUTH_STORE, 'readonly');
            const r = tx.objectStore(AUTH_STORE).get(id);
            r.onsuccess = () => resolve(r.result ? r.result.value : null);
            r.onerror = (e) => reject(e.target.error);
        });
    }

    async function getStoredToken() { return getAuthRecord('jwt'); }
    async function saveToken(token) { return putAuthRecord('jwt', token); }
    async function getStoredSubscriptionId() { return getAuthRecord('subscriptionId'); }

    async function getAllFolders() {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FOLDER_STORE, 'readonly');
            const r = tx.objectStore(FOLDER_STORE).getAll();
            r.onsuccess = () => resolve(r.result || []);
            r.onerror = (e) => reject(e.target.error);
        });
    }

    // Raw IndexedDB write, no server sync side effect — see putFolder below.
    async function putFolderLocalOnly(folder) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FOLDER_STORE, 'readwrite');
            const r = tx.objectStore(FOLDER_STORE).put(folder);
            r.onsuccess = () => resolve(r.result);
            r.onerror = (e) => reject(e.target.error);
        });
    }

    // Mirrors learn/index.html's putFolder exactly — this file has its own
    // separate copy of the whole IndexedDB layer (see the file-level
    // comment above), so the same per-account sync fix has to be applied
    // here independently, or anything Cortex creates/edits stays local to
    // whatever device Cortex happens to be used on. See learn/index.html's
    // own copy of this function for the full reasoning.
    async function putFolder(folder) {
        folder.updatedAt = Date.now();
        const id = await putFolderLocalOnly(folder);
        if (folder.id === undefined) folder.id = id;
        syncFolderToServer(folder).catch((err) => {
            console.error('LastMind Cortex: folder sync to server failed — will retry at next open.', err);
        });
        return id;
    }

    async function deleteFolderRecordLocalOnly(folderId) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(FOLDER_STORE, 'readwrite');
            const r = tx.objectStore(FOLDER_STORE).delete(folderId);
            r.onsuccess = () => resolve();
            r.onerror = (e) => reject(e.target.error);
        });
    }

    async function deleteFolderRecord(folderId) {
        await deleteFolderRecordLocalOnly(folderId);
        deleteFolderFromServer(folderId).catch((err) => {
            console.error('LastMind Cortex: folder delete did not reach the server — it may reappear from another device until this is retried.', err);
        });
    }

    // Same sync layer as learn/index.html, duplicated for the same reason
    // as the rest of this file's IndexedDB code — see that file's own
    // "Per-account folder sync" block for the full design reasoning
    // (last-write-wins by updatedAt, tombstones for cross-device deletion,
    // purely additive on top of local storage with no active account
    // session). This copy is called from the same places: putFolder/
    // deleteFolderRecord above, and reconcileFoldersWithServer at boot.
    async function getSyncAccessToken() {
        try {
            const { data } = await supabaseClient.auth.getSession();
            return data.session ? data.session.access_token : null;
        } catch (err) {
            return null;
        }
    }

    // Same normalization chainService.ts's normalizeConceptKey uses
    // server-side, and the same one learn/index.html's own copy uses —
    // reproduced here so a deletion applier can derive the exact key(s) a
    // concept's spaced-repetition state would be stored under.
    function normalizeConceptKeyClient(subject, topic, concept) {
        const clean = (s) => (s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_');
        return `${clean(subject)}:${clean(topic)}:${clean(concept)}`;
    }

    // Every candidate spaced-repetition key a single page's concept(s)
    // could be stored under server-side — both the normalized form (chain-
    // level tracking) and the raw lowercased label form (atomic-path
    // testing), since concept_id's format is a known mix of both. A multi-
    // lesson page contributes one pair of candidates per sub-concept.
    function conceptKeyCandidatesForPage(subject, topic, page) {
        const labels = Array.isArray(page.lessons) && page.lessons.length
            ? page.lessons.map((l) => l.concept)
            : [page.title];
        return labels.flatMap((label) => [
            normalizeConceptKeyClient(subject, topic, label),
            (label || '').trim().toLowerCase()
        ]);
    }

    // Best-effort: wipes the matching concept_reviews/chain_lesson_progress
    // rows server-side when Cortex deletes a folder/subfolder/page, so a
    // deleted-then-recreated page for the same concept starts from a
    // genuinely blank FSRS schedule rather than silently keeping the old
    // review state. Never blocks or throws into the caller — the local
    // deletion has already happened by the time this runs.
    async function resetProgressForConcepts(conceptKeys) {
        if (!conceptKeys || !conceptKeys.length) return;
        try {
            const accessToken = await getSyncAccessToken();
            if (!accessToken) return;
            await fetch(`${COMPILE_BACKEND_URL}/sync/reset-progress`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
                body: JSON.stringify({ conceptKeys })
            });
        } catch (err) {
            console.error('LastMind Cortex: could not reset spaced-repetition progress for deleted concept(s).', err);
        }
    }

    async function syncFolderToServer(folder) {
        const accessToken = await getSyncAccessToken();
        if (!accessToken) return;
        const resp = await fetch(`${COMPILE_BACKEND_URL}/sync/folders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
            body: JSON.stringify({ folderId: String(folder.id), data: folder, updatedAt: new Date(folder.updatedAt || Date.now()).toISOString() })
        });
        if (!resp.ok) throw new Error(`folder sync failed: ${resp.status}`);
    }

    async function deleteFolderFromServer(folderId) {
        const accessToken = await getSyncAccessToken();
        if (!accessToken) return;
        const resp = await fetch(`${COMPILE_BACKEND_URL}/sync/folders/delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
            body: JSON.stringify({ folderId: String(folderId) })
        });
        if (!resp.ok) throw new Error(`folder delete sync failed: ${resp.status}`);
    }

    async function migrateLegacyFolderIds() {
        const all = await getAllFolders();
        for (const folder of all) {
            if (typeof folder.id === 'number') {
                const oldId = folder.id;
                folder.id = crypto.randomUUID();
                await deleteFolderRecord(oldId);
                await putFolder(folder);
            }
        }
    }

    async function reconcileFoldersWithServer() {
        const accessToken = await getSyncAccessToken();
        if (!accessToken) return;

        await migrateLegacyFolderIds();

        let serverFolders;
        try {
            const resp = await fetch(`${COMPILE_BACKEND_URL}/sync/folders`, {
                headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (!resp.ok) return;
            ({ folders: serverFolders } = await resp.json());
        } catch (err) {
            console.error('LastMind Cortex: could not reach folder sync — continuing with local folders only for this session.', err);
            return;
        }

        const localFolders = await getAllFolders();
        const localById = new Map(localFolders.map((f) => [String(f.id), f]));
        const serverById = new Map(serverFolders.map((f) => [String(f.folderId), f]));

        for (const { folderId, data, updatedAt, deletedAt } of serverFolders) {
            const local = localById.get(String(folderId));
            const serverTime = new Date(deletedAt || updatedAt).getTime();
            if (deletedAt) {
                if (local && (local.updatedAt || 0) < serverTime) {
                    await deleteFolderRecordLocalOnly(local.id);
                }
                continue;
            }
            if (!local || (local.updatedAt || 0) < serverTime) {
                data.id = local ? local.id : folderId;
                data.updatedAt = serverTime;
                await putFolderLocalOnly(data);
            }
        }

        for (const local of localFolders) {
            const server = serverById.get(String(local.id));
            if (!server || (local.updatedAt || 0) > new Date(server.updatedAt).getTime()) {
                await syncFolderToServer(local).catch((err) => console.error('LastMind Cortex: initial folder push failed — will retry at next open.', err));
            }
        }
    }

    // Same split as learn/index.html's own UNIVERSITY_LEVELS/isUniversityLevel
    // — a school-level folder is identified by its exam board, a university
    // one by institution + module code instead (there is no exam board for
    // a university course). Duplicated here rather than shared because
    // these are separate static pages with no shared JS module, but must be
    // kept in sync with learn/index.html's copy — a folder created there
    // needs to be recognized the same way here.
    const UNIVERSITY_LEVELS = new Set([
        'Undergraduate Year 1',
        'Undergraduate Year 2',
        'Undergraduate Year 3',
        'Undergraduate Year 4',
        'Masters',
        'PhD'
    ]);
    function isUniversityLevel(level) {
        return UNIVERSITY_LEVELS.has(level);
    }

    function folderLabel(f) {
        if (isUniversityLevel(f.qualification)) {
            const detail = [f.institution, f.moduleCode].filter(Boolean).join(', ');
            return `${f.subject} — ${f.qualification}${detail ? ` (${detail})` : ''}`;
        }
        return `${f.subject} — ${f.qualification} (${f.examBoard})`;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    /* ───────────────────────── JWT verification (same as /learn) ───────────────────────── */

    function base64UrlToBytes(b64url) {
        const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
        const pad = b64.length % 4 === 0 ? '' : '='.repeat(4 - (b64.length % 4));
        const binary = atob(b64 + pad);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    async function importPublicKey(pem) {
        const b64 = pem.replace(/-----BEGIN PUBLIC KEY-----/, '')
                        .replace(/-----END PUBLIC KEY-----/, '')
                        .replace(/\s+/g, '');
        const bytes = base64UrlToBytes(b64.replace(/-/g, '+').replace(/_/g, '/'));
        return crypto.subtle.importKey(
            'spki',
            bytes.buffer,
            { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
            false,
            ['verify']
        );
    }

    async function verifyJWT(token, publicKey) {
        try {
            const parts = token.split('.');
            if (parts.length !== 3) return null;
            const [headerB64, payloadB64, sigB64] = parts;

            const data = new TextEncoder().encode(`${headerB64}.${payloadB64}`);
            const signature = base64UrlToBytes(sigB64);

            const valid = await crypto.subtle.verify('RSASSA-PKCS1-v1_5', publicKey, signature, data);
            if (!valid) return null;

            const payload = JSON.parse(new TextDecoder().decode(base64UrlToBytes(payloadB64)));
            if (payload.exp && Math.floor(Date.now() / 1000) >= payload.exp) return null;
            if (payload.status !== 'active') return null;

            return payload;
        } catch (err) {
            console.error('LastMind Cortex: JWT verification failed.', err);
            return null;
        }
    }

    async function refreshTokenFromBackend() {
        try {
            const subId = await getStoredSubscriptionId();
            if (!subId) return null;
            const resp = await fetch(`${BACKEND_URL}/api/token?subscriptionId=${encodeURIComponent(subId)}`);
            if (!resp.ok) return null;
            const { token } = await resp.json();
            await saveToken(token);
            return token;
        } catch (err) {
            console.error('LastMind Cortex: could not refresh token from backend.', err);
            return null;
        }
    }

    /* ───────────────────────── Voice (same primitives as /learn) ───────────────────────── */

    let activeRecognition = null;

    function stopActiveDictation() {
        if (activeRecognition) {
            try { activeRecognition.stop(); } catch (err) { /* already stopped */ }
            activeRecognition = null;
        }
    }

    function stopSpeaking() {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function loadVoices() {
        return new Promise((resolve) => {
            const existing = window.speechSynthesis.getVoices();
            if (existing.length) { resolve(existing); return; }
            window.speechSynthesis.onvoiceschanged = () => resolve(window.speechSynthesis.getVoices());
        });
    }

    function pickBestVoice(voices) {
        if (!voices || !voices.length) return null;
        const langPrefix = (navigator.language || 'en-US').slice(0, 2).toLowerCase();
        const googleVoices = voices.filter((v) => v.name.includes('Google'));
        if (googleVoices.length) {
            const langMatch = googleVoices.find((v) => v.lang.toLowerCase().startsWith(langPrefix));
            return langMatch || googleVoices[0];
        }
        const enVoice = voices.find((v) => v.lang.toLowerCase().startsWith('en'));
        return enVoice || voices[0];
    }

    async function speakText(text) {
        if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') return null;
        stopSpeaking();
        const trimmed = (text || '').trim();
        if (!trimmed) return null;
        const utterance = new SpeechSynthesisUtterance(trimmed);
        utterance.lang = navigator.language || 'en-US';
        const voices = await loadVoices();
        const bestVoice = pickBestVoice(voices);
        if (bestVoice) {
            utterance.voice = bestVoice;
            utterance.lang = bestVoice.lang;
        }
        window.speechSynthesis.speak(utterance);
        return utterance;
    }

    function conceptKeyToLabel(conceptKey) {
        return conceptKey.replace(/:/g, ' — ').replace(/_/g, ' ');
    }

    /* ───────────────────────── Chat ───────────────────────── */

    let chatHistory = []; // [{role, content}] — persisted as part of the ACTIVE session, see cortexChatSessions below
    const chatMessagesEl = document.getElementById('chatMessages');
    let emptyHintEl = document.getElementById('chatEmptyHint');

    // Rotates on every dashboard/page load, same purpose and same
    // "keep cycling forward, never restart from the top" persistence
    // pattern learn/index.html's own dashboard quote uses (moved here
    // since this page now owns the whole dashboard-facing empty state
    // when embedded — see learn/index.html's renderWelcome()).
    const MOTIVATIONAL_QUOTES = [
        "It doesn't matter how you do it, it matters that you do it.",
        "Starting is the real battle; everything after is momentum.",
        "Long horizons make short-term setbacks irrelevant.",
        "Standards shape outcomes; raise them and outcomes follow.",
        "The hard thing is usually the right thing.",
        "Action without direction is noise; direction without action is fantasy.",
        "Champions are made when nothing exciting is happening.",
        "1% better every day.",
        "The limit is usually the story you are telling yourself."
    ];

    async function pickNextQuote() {
        const stored = await getAuthRecord('quoteIndex');
        const prevIndex = typeof stored === 'number' ? stored : -1;
        const nextIndex = (prevIndex + 1) % MOTIVATIONAL_QUOTES.length;
        await putAuthRecord('quoteIndex', nextIndex);
        return MOTIVATIONAL_QUOTES[nextIndex];
    }

    // Original wording only — deliberately NOT the familiar "How can I
    // help you today?" line every other assistant opens with. Rotated the
    // same way as the quote above, own persisted index.
    const CORTEX_GREETINGS = [
        "What are we working on today?",
        "Where should we pick up?",
        "Ask me to organize a folder, generate notes, or just talk through what's due.",
        "What's on your mind for this session?",
        "Ready when you are — what's first?",
        "Tell me what you're studying and I'll help you get into it."
    ];

    async function pickNextGreeting() {
        const stored = await getAuthRecord('cortexGreetingIndex');
        const prevIndex = typeof stored === 'number' ? stored : -1;
        const nextIndex = (prevIndex + 1) % CORTEX_GREETINGS.length;
        await putAuthRecord('cortexGreetingIndex', nextIndex);
        return CORTEX_GREETINGS[nextIndex];
    }

    // Multiple saved chat threads — replaces the old single
    // 'cortexChatHistory' key. Each session: { id, title, createdAt,
    // updatedAt, messages: [{role, content}] }. Shared IndexedDB (same
    // origin, same LastMindDB database) means learn/index.html's own
    // sidebar chat list reads this SAME array directly — no separate
    // sync needed between the two pages.
    let activeSessionId = null;

    function newSessionId() {
        return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    async function loadSessions() {
        try {
            const stored = await getAuthRecord('cortexChatSessions');
            return Array.isArray(stored) ? stored : [];
        } catch (err) {
            return [];
        }
    }

    async function saveSessions(sessions) {
        try {
            await putAuthRecord('cortexChatSessions', sessions);
        } catch (err) {
            console.error('LastMind Cortex: could not save chat sessions.', err);
        }
    }

    // One-time migration from the old single-conversation key, so an
    // existing student's in-progress chat doesn't just vanish under the
    // new multi-session scheme. Safe to leave the old key sitting unused
    // afterward — it's tiny, and next boot's sessions.length check skips
    // this entirely once it's run once.
    async function migrateOldSingleHistory(sessions) {
        if (sessions.length) return sessions;
        let old;
        try {
            old = await getAuthRecord('cortexChatHistory');
        } catch (err) {
            old = null;
        }
        if (!Array.isArray(old) || !old.length) return sessions;
        const firstUserTurn = old.find((t) => t.role === 'user');
        const migrated = [{
            id: newSessionId(),
            title: firstUserTurn ? firstUserTurn.content.slice(0, 48) : 'Chat',
            createdAt: Date.now(),
            updatedAt: Date.now(),
            messages: old,
        }];
        await saveSessions(migrated);
        return migrated;
    }

    // Determines which session this page load should open: an explicit
    // ?chatId=, a fresh one for ?new=1, or — the plain "/cortex" case,
    // same as before this existed — whichever session was most recently
    // active. Starts a brand new session if none exist yet at all.
    // A brand new session is deliberately NOT written to storage here —
    // only saveChatHistory (after the first real message) persists it.
    // Otherwise every stray "+ New chat" click (including ones abandoned
    // without ever sending anything) would leave a permanent empty
    // "New chat" entry cluttering the sidebar list forever.
    async function resolveActiveSession() {
        const params = new URLSearchParams(window.location.search);
        let sessions = await migrateOldSingleHistory(await loadSessions());

        if (params.get('new') === '1') {
            return { id: newSessionId(), title: 'New chat', createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
        }

        const requestedId = params.get('chatId');
        if (requestedId) {
            const found = sessions.find((s) => s.id === requestedId);
            if (found) return found;
        }

        if (sessions.length) {
            return sessions.slice().sort((a, b) => b.updatedAt - a.updatedAt)[0];
        }

        return { id: newSessionId(), title: 'New chat', createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
    }

    // Reuses the AUTH_STORE as a generic small key-value store — same
    // pattern already used elsewhere (e.g. the stored subscription ID),
    // rather than adding a whole new object store just for this.
    async function saveChatHistory() {
        if (!activeSessionId) return;
        try {
            const sessions = await loadSessions();
            const idx = sessions.findIndex((s) => s.id === activeSessionId);
            const firstUserTurn = chatHistory.find((t) => t.role === 'user');
            const title = firstUserTurn ? firstUserTurn.content.slice(0, 48) : 'New chat';
            const updated = { id: activeSessionId, title, createdAt: idx >= 0 ? sessions[idx].createdAt : Date.now(), updatedAt: Date.now(), messages: chatHistory };
            if (idx >= 0) sessions[idx] = updated; else sessions.unshift(updated);
            await saveSessions(sessions);
        } catch (err) {
            console.error('LastMind Cortex: could not save chat history.', err);
        }
    }

    // Only the backend call context stays capped at the last 10 turns
    // (see sendChatMessage) — the FULL history is what gets displayed and
    // stored, so returning to this page shows everything, not just a
    // recent tail.
    async function restoreChatHistory() {
        const session = await resolveActiveSession();
        activeSessionId = session.id;
        if (!session.messages || !session.messages.length) return;
        chatHistory = session.messages;
        clearEmptyHint();
        chatHistory.forEach((turn) => {
            if (turn.role === 'user') appendUserMessage(turn.content);
            else appendAssistantMessage(turn.content);
        });
    }

    function clearEmptyHint() {
        if (emptyHintEl) { emptyHintEl.remove(); emptyHintEl = null; }
        chatMessagesEl.classList.remove('chat-empty-active');
        const greetingEl = document.getElementById('chatGreeting');
        if (greetingEl) greetingEl.classList.remove('active');
    }

    // Populates the empty-state logo/quote and the rotating greeting —
    // called once at boot, before restoreChatHistory decides whether to
    // immediately clear it again (a session with existing messages tears
    // this straight back down via clearEmptyHint, which is fine — cheap
    // either way).
    async function renderEmptyState() {
        const quoteEl = document.getElementById('chatEmptyQuote');
        if (quoteEl) quoteEl.textContent = await pickNextQuote();
        const greetingEl = document.getElementById('chatGreeting');
        if (greetingEl) {
            greetingEl.textContent = await pickNextGreeting();
            greetingEl.classList.add('active');
        }
        chatMessagesEl.classList.add('chat-empty-active');
    }

    function appendUserMessage(text) {
        clearEmptyHint();
        const el = document.createElement('div');
        el.className = 'chat-msg chat-msg-user';
        el.textContent = text;
        chatMessagesEl.appendChild(el);
        el.scrollIntoView({ behavior: 'smooth', block: 'end' });
        return el;
    }

    // Default is text-only now — nothing here is spoken automatically
    // (see sendChatMessage, which only auto-speaks when the student's own
    // message explicitly asked for that turn's reply to be read aloud).
    // Every assistant message still gets its own speak button, so reading
    // any of them aloud — including mid-review questions, not just the
    // main reply — is always one click away.
    function appendAssistantMessage(text) {
        clearEmptyHint();
        const el = document.createElement('div');
        el.className = 'chat-msg chat-msg-assistant';

        const textEl = document.createElement('span');
        textEl.className = 'chat-msg-text';
        textEl.textContent = text;
        el.appendChild(textEl);

        const speakBtn = document.createElement('button');
        speakBtn.type = 'button';
        speakBtn.className = 'chat-msg-speak-btn';
        speakBtn.title = 'Read aloud';
        speakBtn.textContent = '🔊';
        speakBtn.addEventListener('click', () => speakText(textEl.textContent));
        el.appendChild(speakBtn);

        chatMessagesEl.appendChild(el);
        el.scrollIntoView({ behavior: 'smooth', block: 'end' });
        return el;
    }

    // Updates just an assistant message's text in place (used by the
    // "…" thinking placeholder and the review-start status line) without
    // clobbering the speak button appendAssistantMessage attached to it —
    // a plain `el.textContent = ...` would wipe the whole element's
    // children, button included.
    function setAssistantMessageText(el, text) {
        const textEl = el.querySelector('.chat-msg-text');
        if (textEl) textEl.textContent = text;
    }

    // "done" lets Cortex reason about lesson order (what's already been
    // covered vs. what's next) without the student needing to say so —
    // see CORTEX_INTENT_PROMPT's ordering capability.
    function pageSummary(p) {
        return { title: p.title, done: p.encodingDone === true || p.taughtBefore === true };
    }

    async function buildFolderSummary() {
        const all = await getAllFolders();
        return all.map((f) => ({
            name: f.subject,
            qualification: f.qualification,
            // Same split CortexFolderSummary documents server-side — a
            // school folder's identifying detail is its exam board, a
            // university one's is institution+moduleCode instead (never
            // both). Omitting whichever doesn't apply, rather than sending
            // it as undefined/empty, keeps Cortex from treating a blank
            // examBoard as a real (missing) value on a university folder.
            ...(isUniversityLevel(f.qualification)
                ? { institution: f.institution || '', moduleCode: f.moduleCode || '' }
                : { examBoard: f.examBoard || '' }),
            subfolders: (f.subfolders || []).map((sf) => ({
                name: sf.name,
                pages: (sf.pages || []).map(pageSummary),
                ...(sf.plannedConcepts && sf.plannedConcepts.length ? { plannedConcepts: sf.plannedConcepts } : {})
            })),
            pages: (f.pages || []).map(pageSummary),
            ...(f.plannedConcepts && f.plannedConcepts.length ? { plannedConcepts: f.plannedConcepts } : {})
        }));
    }

    async function fetchDueReviews(accessToken) {
        try {
            const resp = await fetch(`${COMPILE_BACKEND_URL}/schedule`, {
                headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (!resp.ok) return [];
            const { schedule } = await resp.json();
            return (schedule || []).map((item) => ({
                conceptId: item.concept_id,
                label: conceptKeyToLabel(item.concept_id)
            }));
        } catch (err) {
            return [];
        }
    }

    // Same loose-match heuristic used server-side (matchesUnfinishedSibling
    // in encodingLessonService.ts) and in learn/index.html's plan progress
    // bar — an order's concept names and actual page titles are
    // independently typed free text, so exact equality would miss most
    // real matches. Also used by fuzzyFindByName below for folder/
    // subfolder/page name matching, for the same reason.
    function normalizeForMatch(s) {
        return (s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    }

    // Cortex is given the real folder/subfolder/page names and told to use
    // them exactly (see CORTEX_INTENT_PROMPT rule 3), but it's still an AI
    // reading back names from a JSON blob, not doing a string lookup — a
    // punctuation/whitespace difference, or a name it paraphrases slightly
    // (e.g. "Consumer Theory" for a subfolder actually called "Theory of
    // the Consumer"), used to hard-fail here even though a person would
    // immediately see it's the same thing. Falls back to token overlap
    // (Jaccard-style) when there's no exact match after normalizing —
    // but ONLY when exactly one candidate is a clear best match; a genuine
    // tie or no overlap at all still returns null rather than guessing.
    // Safe to be lenient here specifically because every caller of this
    // shows the resolved target in a confirm card before actually applying
    // anything — a wrong guess gets caught there, not silently applied.
    //
    // getNames(item) may return either a single string or an array of
    // strings — an item can be identified by more than one thing (e.g. a
    // folder by its subject name OR its module code), any of which counts
    // as a match; the item's score is whichever of its candidates scores
    // best against the target.
    function fuzzyFindByName(items, name, getNames) {
        const target = normalizeForMatch(name);
        if (!target || !items.length) return null;

        function candidates(it) {
            const raw = getNames(it);
            return (Array.isArray(raw) ? raw : [raw]).map(normalizeForMatch).filter(Boolean);
        }

        // .filter, not .find — an exact match still isn't safe to use
        // blindly when MORE THAN ONE item shares it (e.g. an A-Level
        // "Economics" folder and a same-subject university one both
        // exact-match a bare "Economics"); only resolve automatically when
        // it's unique, otherwise fall through to scored matching, which
        // can use a candidate name none of the OTHER exact matches share
        // (a module code, an institution) to break the tie.
        const exactMatches = items.filter((it) => candidates(it).includes(target));
        if (exactMatches.length === 1) return exactMatches[0];

        const targetWords = target.split(' ').filter(Boolean);
        if (!targetWords.length) return null;

        const scored = items
            .map((it) => {
                const best = candidates(it).reduce((bestScore, cand) => {
                    const candWords = cand.split(' ').filter(Boolean);
                    const shared = candWords.filter((w) => targetWords.includes(w)).length;
                    const union = new Set([...candWords, ...targetWords]).size;
                    return Math.max(bestScore, union ? shared / union : 0);
                }, 0);
                return { it, score: best };
            })
            .filter((s) => s.score > 0)
            .sort((a, b) => b.score - a.score);

        if (!scored.length) return null;
        if (scored.length > 1 && scored[0].score === scored[1].score) return null;
        return scored[0].it;
    }

    function findFolderByName(folders, name) {
        return fuzzyFindByName(folders, name, (f) =>
            isUniversityLevel(f.qualification)
                ? [f.subject, f.moduleCode, f.institution, folderLabel(f)]
                : [f.subject, folderLabel(f)]
        );
    }

    // Same idea as findPageByTitleAnywhere — a subfolder is identified by
    // name alone, without needing to already know which folder it's
    // currently in (needed for move_subfolder, and for auto-creating one
    // via getOrCreateSubfolder inside the right folder rather than a wrong
    // one just because two folders happen to have similarly-named
    // subfolders). Returns { folder, subfolder } or null.
    function findSubfolderAnywhere(folders, name) {
        for (const f of folders) {
            const sf = fuzzyFindByName(f.subfolders || [], name, (sf) => sf.name || '');
            if (sf) return { folder: f, subfolder: sf };
        }
        return null;
    }

    function findSubfolderByName(folder, name) {
        return fuzzyFindByName(folder.subfolders || [], name, (sf) => sf.name || '');
    }

    function findPageByTitleAnywhere(folders, title) {
        for (const f of folders) {
            const direct = fuzzyFindByName(f.pages || [], title, (p) => p.title || '');
            if (direct) return { folder: f, subfolder: null, page: direct };
            for (const sf of (f.subfolders || [])) {
                const p = fuzzyFindByName(sf.pages || [], title, (p) => p.title || '');
                if (p) return { folder: f, subfolder: sf, page: p };
            }
        }
        return null;
    }

    // Auto-creates a same-named subfolder rather than erroring when the
    // name Cortex chose doesn't resolve to an existing one, even with
    // fuzzyFindByName's leniency — a subfolder is cheap to rename or merge
    // by hand afterward, but a dead-end "I couldn't find..." mid-conversation
    // isn't recoverable without starting the request over. Only ever used
    // for subfolders (never folders): a folder needs a qualification/exam
    // board neither the caller nor Cortex's action payload carries here, so
    // there's nothing sensible to auto-create it with.
    function getOrCreateSubfolder(folder, name) {
        let subfolder = findSubfolderByName(folder, name);
        if (!subfolder) {
            subfolder = { id: crypto.randomUUID(), name, pages: [] };
            folder.subfolders = folder.subfolders || [];
            folder.subfolders.push(subfolder);
        }
        return subfolder;
    }

    async function applyMovePage(action) {
        const folders = await getAllFolders();
        const loc = findPageByTitleAnywhere(folders, action.pageTitle);
        if (!loc) return `I couldn't find a page called "${action.pageTitle}".`;

        const targetFolder = findFolderByName(folders, action.targetFolderName);
        if (!targetFolder) return `I couldn't find a folder called "${action.targetFolderName}".`;

        const targetSubfolder = action.targetSubfolderName ? getOrCreateSubfolder(targetFolder, action.targetSubfolderName) : null;

        const sourceArray = loc.subfolder ? loc.subfolder.pages : loc.folder.pages;
        const idx = sourceArray.findIndex((p) => p.id === loc.page.id);
        if (idx === -1) return `Something went wrong finding "${action.pageTitle}".`;
        const [page] = sourceArray.splice(idx, 1);

        const targetArray = targetSubfolder
            ? (targetSubfolder.pages = targetSubfolder.pages || [])
            : (targetFolder.pages = targetFolder.pages || []);
        targetArray.push(page);

        await putFolder(loc.folder);
        if (targetFolder.id !== loc.folder.id) await putFolder(targetFolder);
        return `Moved "${action.pageTitle}" into ${folderLabel(targetFolder)}${targetSubfolder ? ' > ' + targetSubfolder.name : ''}.`;
    }

    // Moves a WHOLE subfolder — its pages, lessons, and any saved plan —
    // into a different folder, rather than one page at a time. The
    // subfolder is located across every folder by name (findSubfolderAnywhere),
    // same reasoning as applyMovePage not needing to be told where a page
    // currently lives.
    async function applyMoveSubfolder(action) {
        const folders = await getAllFolders();
        const loc = findSubfolderAnywhere(folders, action.subfolderName);
        if (!loc) return `I couldn't find a subfolder called "${action.subfolderName}".`;

        const targetFolder = findFolderByName(folders, action.targetFolderName);
        if (!targetFolder) return `I couldn't find a folder called "${action.targetFolderName}".`;

        if (targetFolder.id === loc.folder.id) {
            return `"${loc.subfolder.name}" is already inside ${folderLabel(targetFolder)}.`;
        }

        const idx = (loc.folder.subfolders || []).findIndex((sf) => sf.id === loc.subfolder.id);
        if (idx === -1) return `Something went wrong finding "${action.subfolderName}".`;
        const [subfolder] = loc.folder.subfolders.splice(idx, 1);

        targetFolder.subfolders = targetFolder.subfolders || [];
        targetFolder.subfolders.push(subfolder);

        await putFolder(loc.folder);
        await putFolder(targetFolder);
        return `Moved "${subfolder.name}" (and everything in it) into ${folderLabel(targetFolder)}.`;
    }

    async function applyCreateFolder(action) {
        // Generated up front (matching learn/index.html's own fix) rather
        // than left to IndexedDB's autoIncrement — sync needs an id that's
        // actually unique across devices, and a later action in the same
        // batch (e.g. create_subfolder targeting this folder) needs to be
        // able to find it again right after this one lands.
        await putFolder({
            id: crypto.randomUUID(),
            subject: action.subject,
            qualification: action.qualification,
            examBoard: action.examBoard || '',
            institution: action.institution || '',
            moduleCode: action.moduleCode || '',
            pages: [],
            createdAt: Date.now()
        });
        return `Created the folder "${folderLabel(action)}".`;
    }

    async function applyCreateSubfolder(action) {
        const folders = await getAllFolders();
        const folder = findFolderByName(folders, action.folderName);
        if (!folder) return `I couldn't find a folder called "${action.folderName}".`;
        if (findSubfolderByName(folder, action.subfolderName)) {
            return `"${action.subfolderName}" already exists inside ${folder.subject}.`;
        }
        folder.subfolders = folder.subfolders || [];
        folder.subfolders.push({ id: crypto.randomUUID(), name: action.subfolderName, pages: [] });
        await putFolder(folder);
        return `Created the subfolder "${action.subfolderName}" inside ${folder.subject}.`;
    }

    async function applyGenerateNotes(action) {
        const folders = await getAllFolders();
        const folder = findFolderByName(folders, action.subject);
        if (!folder) return `I couldn't find a folder for "${action.subject}" yet — create that folder first and I can add the notes.`;

        const subfolder = action.topic ? getOrCreateSubfolder(folder, action.topic) : null;

        const targetArray = subfolder ? (subfolder.pages = subfolder.pages || []) : (folder.pages = folder.pages || []);
        let page = targetArray.find((p) => (p.title || '').trim().toLowerCase() === (action.lesson || '').trim().toLowerCase());
        if (!page) {
            page = { id: crypto.randomUUID(), title: action.lesson, content: '', createdAt: Date.now() };
            targetArray.push(page);
        }
        page.content = (action.noteContent || '')
            .split('\n')
            .filter((line) => line.trim())
            .map((line) => `<div>${escapeHtml(line)}</div>`)
            .join('');

        await putFolder(folder);
        return `Added notes for "${action.lesson}" to ${folderLabel(folder)}${subfolder ? ' > ' + subfolder.name : ''}.`;
    }

    // Creates ONE page tracking several concepts in sequence, instead of
    // one page per concept — see learn/index.html's pageIsMultiLesson and
    // the "lessons" field it reads. Each entry starts un-taught; the page
    // walks them in order the same way a single-concept page walks its own
    // steps, just at the concept level instead of the step level.
    async function applyCreateMultiLessonPage(action) {
        const folders = await getAllFolders();
        const folder = findFolderByName(folders, action.folderName);
        if (!folder) return `I couldn't find a folder called "${action.folderName}".`;

        const subfolder = action.subfolderName ? getOrCreateSubfolder(folder, action.subfolderName) : null;

        const targetArray = subfolder ? (subfolder.pages = subfolder.pages || []) : (folder.pages = folder.pages || []);
        const newPage = {
            id: crypto.randomUUID(),
            title: action.pageTitle || action.concepts.join(', '),
            content: '',
            lessons: action.concepts.map((concept) => ({ concept, encodingDone: false })),
            currentLessonIndex: 0,
            createdAt: Date.now()
        };
        targetArray.push(newPage);
        await putFolder(folder);
        return `Created "${newPage.title}" in ${folderLabel(folder)}${subfolder ? ' > ' + subfolder.name : ''}, covering: ${action.concepts.join(' → ')}.`;
    }

    // Saves the FULL concept order as plannedConcepts on the folder or
    // subfolder — read by learn/index.html's progress bar (see
    // subfolderPlanProgress) to show completion against the whole topic,
    // not just whatever pages happen to exist. Never creates any pages
    // itself — purely a remembered scope.
    async function applySetSubfolderPlan(action) {
        const folders = await getAllFolders();
        const folder = findFolderByName(folders, action.folderName);
        if (!folder) return `I couldn't find a folder called "${action.folderName}".`;

        if (action.subfolderName) {
            const subfolder = getOrCreateSubfolder(folder, action.subfolderName);
            subfolder.plannedConcepts = action.concepts;
            await putFolder(folder);
            return `Saved a ${action.concepts.length}-concept plan for ${folderLabel(folder)} > ${subfolder.name}. You'll see progress against the whole topic there now.`;
        }

        folder.plannedConcepts = action.concepts;
        await putFolder(folder);
        return `Saved a ${action.concepts.length}-concept plan for ${folderLabel(folder)}. You'll see progress against the whole topic there now.`;
    }

    // One ordinary, separate page per concept — unlike
    // applyCreateMultiLessonPage, which bundles everything onto one page.
    // Concepts that already match an existing page (by title, single- or
    // multi-lesson) are skipped rather than duplicated — Cortex is told to
    // always pass the FULL order and let this function do the filtering,
    // since it has the actual page list to check against reliably.
    async function applyCreatePagesFromOrder(action) {
        const folders = await getAllFolders();
        const folder = findFolderByName(folders, action.folderName);
        if (!folder) return `I couldn't find a folder called "${action.folderName}".`;

        const subfolder = action.subfolderName ? getOrCreateSubfolder(folder, action.subfolderName) : null;

        const targetArray = subfolder ? (subfolder.pages = subfolder.pages || []) : (folder.pages = folder.pages || []);
        const existingTitles = new Set();
        targetArray.forEach((p) => {
            existingTitles.add(normalizeForMatch(p.title));
            (p.lessons || []).forEach((l) => existingTitles.add(normalizeForMatch(l.concept)));
        });

        const toCreate = action.concepts.filter((concept) => !existingTitles.has(normalizeForMatch(concept)));
        toCreate.forEach((concept) => {
            targetArray.push({
                id: crypto.randomUUID(),
                title: concept,
                content: '',
                createdAt: Date.now()
            });
        });

        if (!toCreate.length) {
            return `Every concept in that order already has a page in ${folderLabel(folder)}${subfolder ? ' > ' + subfolder.name : ''} — nothing new to create.`;
        }

        await putFolder(folder);
        const skipped = action.concepts.length - toCreate.length;
        return `Created ${toCreate.length} new page(s) in ${folderLabel(folder)}${subfolder ? ' > ' + subfolder.name : ''}: ${toCreate.join(', ')}.${skipped ? ` (${skipped} already existed, skipped.)` : ''}`;
    }

    // Deletes the whole folder record — everything inside it (every
    // subfolder and page) goes with it. Only ever reached after the
    // student has explicitly confirmed (see the batch confirm card) —
    // CORTEX_INTENT_PROMPT rule 12 restricts this action to explicit,
    // unambiguous deletion requests, but the confirmation is the real
    // safety gate, same as every other action.
    async function applyDeleteFolder(action) {
        const folders = await getAllFolders();
        const folder = findFolderByName(folders, action.folderName);
        if (!folder) return `I couldn't find a folder called "${action.folderName}".`;
        const label = folderLabel(folder);
        const subject = folder.subject || '';
        const conceptKeys = [
            ...(folder.pages || []).flatMap((p) => conceptKeyCandidatesForPage(subject, '', p)),
            ...(folder.subfolders || []).flatMap((sf) => (sf.pages || []).flatMap((p) => conceptKeyCandidatesForPage(subject, sf.name || '', p)))
        ];
        await deleteFolderRecord(folder.id);
        await resetProgressForConcepts(conceptKeys);
        return `Deleted the folder "${label}" and everything in it.`;
    }

    async function applyDeleteSubfolder(action) {
        const folders = await getAllFolders();
        const loc = findSubfolderAnywhere(folders, action.subfolderName);
        if (!loc) return `I couldn't find a subfolder called "${action.subfolderName}".`;
        const idx = (loc.folder.subfolders || []).findIndex((sf) => sf.id === loc.subfolder.id);
        if (idx === -1) return `Something went wrong finding "${action.subfolderName}".`;
        const conceptKeys = (loc.subfolder.pages || []).flatMap((p) => conceptKeyCandidatesForPage(loc.folder.subject || '', loc.subfolder.name || '', p));
        loc.folder.subfolders.splice(idx, 1);
        await putFolder(loc.folder);
        await resetProgressForConcepts(conceptKeys);
        return `Deleted the subfolder "${loc.subfolder.name}" and everything in it.`;
    }

    async function applyDeletePage(action) {
        const folders = await getAllFolders();
        const loc = findPageByTitleAnywhere(folders, action.pageTitle);
        if (!loc) return `I couldn't find a page called "${action.pageTitle}".`;
        const sourceArray = loc.subfolder ? loc.subfolder.pages : loc.folder.pages;
        const idx = sourceArray.findIndex((p) => p.id === loc.page.id);
        if (idx === -1) return `Something went wrong finding "${action.pageTitle}".`;
        const conceptKeys = conceptKeyCandidatesForPage(loc.folder.subject || '', (loc.subfolder && loc.subfolder.name) || '', loc.page);
        sourceArray.splice(idx, 1);
        await putFolder(loc.folder);
        await resetProgressForConcepts(conceptKeys);
        return `Deleted the page "${loc.page.title}".`;
    }

    function describeAndBuildApplier(action) {
        if (action.type === 'move_page') {
            return {
                text: `Move "${action.pageTitle}" into ${action.targetFolderName}${action.targetSubfolderName ? ' > ' + action.targetSubfolderName : ''}?`,
                apply: () => applyMovePage(action)
            };
        }
        if (action.type === 'move_subfolder') {
            return {
                text: `Move "${action.subfolderName}" (and everything in it) into ${action.targetFolderName}?`,
                apply: () => applyMoveSubfolder(action)
            };
        }
        if (action.type === 'create_folder') {
            return {
                text: `Create a new folder "${folderLabel(action)}"?`,
                apply: () => applyCreateFolder(action)
            };
        }
        if (action.type === 'create_subfolder') {
            return {
                text: `Create a new subfolder "${action.subfolderName}" inside "${action.folderName}"?`,
                apply: () => applyCreateSubfolder(action)
            };
        }
        if (action.type === 'generate_notes') {
            return {
                text: `Add generated notes for "${action.lesson}" (${action.subject}${action.topic ? ' > ' + action.topic : ''})?`,
                apply: () => applyGenerateNotes(action)
            };
        }
        if (action.type === 'create_multi_lesson_page' && Array.isArray(action.concepts) && action.concepts.length >= 2) {
            return {
                text: `Create "${action.pageTitle || action.concepts.join(', ')}" in ${action.folderName}${action.subfolderName ? ' > ' + action.subfolderName : ''}, covering ${action.concepts.length} lessons: ${action.concepts.join(' → ')}?`,
                apply: () => applyCreateMultiLessonPage(action)
            };
        }
        if (action.type === 'set_subfolder_plan' && Array.isArray(action.concepts) && action.concepts.length >= 2) {
            return {
                text: `Save this as your tracked plan for ${action.folderName}${action.subfolderName ? ' > ' + action.subfolderName : ''} (${action.concepts.length} concepts)? You'll see a progress bar there.`,
                apply: () => applySetSubfolderPlan(action)
            };
        }
        if (action.type === 'create_pages_from_order' && Array.isArray(action.concepts) && action.concepts.length >= 1) {
            return {
                text: `Create pages for this order in ${action.folderName}${action.subfolderName ? ' > ' + action.subfolderName : ''} (skipping any that already exist)? ${action.concepts.join(' → ')}`,
                apply: () => applyCreatePagesFromOrder(action)
            };
        }
        if (action.type === 'delete_folder') {
            return {
                text: `⚠️ Delete the folder "${action.folderName}" — this removes everything inside it and can't be undone. Are you sure?`,
                apply: () => applyDeleteFolder(action)
            };
        }
        if (action.type === 'delete_subfolder') {
            return {
                text: `⚠️ Delete the subfolder "${action.subfolderName}" — this removes everything inside it and can't be undone. Are you sure?`,
                apply: () => applyDeleteSubfolder(action)
            };
        }
        if (action.type === 'delete_page') {
            return {
                text: `⚠️ Delete the page "${action.pageTitle}" — this can't be undone. Are you sure?`,
                apply: () => applyDeletePage(action)
            };
        }
        return { text: null, apply: null };
    }

    // `items` is a list of { text, apply } — one card, one Yes/No, covering
    // the WHOLE batch a single message asked for (see CORTEX_INTENT_PROMPT
    // rule 2b: "make me a folder with a subfolder in it" is two actions,
    // not two separate turns). On confirm, every apply() runs strictly in
    // order, awaited one at a time — not in parallel — because a later
    // action's applier does its own fresh getAllFolders() lookup, so it
    // can only find what an earlier action in the same batch just created
    // once that earlier write has actually landed. Each item gets its own
    // status line, so a partial failure partway through the batch is
    // still visible per-step rather than a single pass/fail for the whole
    // thing.
    function showBatchConfirmCard(items) {
        const card = document.createElement('div');
        card.className = 'chat-confirm-card';

        const desc = document.createElement('div');
        desc.className = 'chat-confirm-text';
        if (items.length === 1) {
            desc.textContent = items[0].text;
        } else {
            desc.innerHTML = items.map((item, i) => `${i + 1}. ${escapeHtml(item.text)}`).join('<br>');
        }

        const actions = document.createElement('div');
        actions.className = 'chat-confirm-actions';

        const yesBtn = document.createElement('button');
        yesBtn.className = 'chat-confirm-btn';
        yesBtn.type = 'button';
        yesBtn.textContent = items.length > 1 ? `Yes, do all ${items.length}` : 'Yes, do it';

        const noBtn = document.createElement('button');
        noBtn.className = 'chat-confirm-btn chat-confirm-btn-no';
        noBtn.type = 'button';
        noBtn.textContent = 'No';

        yesBtn.addEventListener('click', async () => {
            actions.remove();
            const statusEl = document.createElement('div');
            statusEl.className = 'chat-confirm-status';
            statusEl.textContent = 'Working…';
            card.appendChild(statusEl);

            const results = [];
            for (const item of items) {
                try {
                    results.push((await item.apply()) || 'Done.');
                } catch (err) {
                    console.error('LastMind Cortex: action failed.', err);
                    results.push('Something went wrong — please try again.');
                }
            }
            statusEl.innerHTML = results.length === 1
                ? escapeHtml(results[0])
                : results.map((r, i) => `${i + 1}. ${escapeHtml(r)}`).join('<br>');
        });

        noBtn.addEventListener('click', () => card.remove());

        actions.appendChild(yesBtn);
        actions.appendChild(noBtn);
        card.appendChild(desc);
        card.appendChild(actions);
        chatMessagesEl.appendChild(card);
        card.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    // Runs a due review turn-by-turn right here in chat, reusing the exact
    // same chain-lesson endpoints /learn's "Start Lesson" button drives —
    // no backend changes needed for this action, just a chat-shaped runner.
    async function askReviewQuestion(accessToken, questionText, state) {
        appendAssistantMessage(questionText);
        speakText(questionText);

        const card = document.createElement('div');
        card.className = 'chat-answer-card';
        const input = document.createElement('textarea');
        input.className = 'chat-answer-input';
        input.placeholder = 'Type or speak your answer…';
        const submitBtn = document.createElement('button');
        submitBtn.className = 'chat-confirm-btn';
        submitBtn.type = 'button';
        submitBtn.textContent = 'Submit';

        submitBtn.addEventListener('click', async () => {
            const answer = input.value.trim();
            card.remove();
            appendUserMessage(answer || '(no answer given)');

            let nextResp;
            try {
                nextResp = await fetch(`${COMPILE_BACKEND_URL}/chain-lesson/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
                    body: JSON.stringify({ state, answer })
                });
            } catch (err) {
                appendAssistantMessage('Could not reach the server. Please try again.');
                return;
            }

            if (!nextResp.ok) {
                const body = await nextResp.json().catch(() => ({}));
                appendAssistantMessage(body.error || 'Something went wrong.');
                return;
            }

            const nextResult = await nextResp.json();

            if (nextResult.done) {
                const finalEntries = nextResult.summary || [];
                const finalEntry = finalEntries[finalEntries.length - 1];
                if (finalEntry && finalEntry.correction) {
                    appendAssistantMessage(finalEntry.correction);
                    speakText(finalEntry.correction);
                }
                const doneMsg = 'Review complete — nice work.';
                appendAssistantMessage(doneMsg);
                speakText(doneMsg);
                return;
            }

            if (nextResult.inlineCorrection) {
                appendAssistantMessage(nextResult.inlineCorrection);
                speakText(nextResult.inlineCorrection);
            }
            await askReviewQuestion(accessToken, nextResult.nextQuestion, nextResult.state);
        });

        card.appendChild(input);
        card.appendChild(submitBtn);
        chatMessagesEl.appendChild(card);
        card.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    async function runReviewInChat(conceptId) {
        const parts = conceptId.split(':');
        if (parts.length !== 3) {
            appendAssistantMessage("I couldn't identify that review — let's try again.");
            return;
        }
        const subject = parts[0].replace(/_/g, ' ');
        const topic = parts[1].replace(/_/g, ' ');
        const concept = parts[2].replace(/_/g, ' ');

        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            appendAssistantMessage('Please log in again to start this review.');
            return;
        }

        const startingEl = appendAssistantMessage('Starting your review…');
        let resp;
        try {
            resp = await fetch(`${COMPILE_BACKEND_URL}/chain-lesson/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
                body: JSON.stringify({ subject, topic, concept })
            });
        } catch (err) {
            setAssistantMessageText(startingEl, 'Could not reach the server. Please try again.');
            return;
        }

        if (!resp.ok) {
            const body = await resp.json().catch(() => ({}));
            setAssistantMessageText(startingEl, body.error || 'Could not start this review.');
            return;
        }

        const startResult = await resp.json();
        startingEl.remove();
        await askReviewQuestion(session.access_token, startResult.nextQuestion, startResult.state);
    }

    // `actions` is the full list from one Cortex response (see
    // CortexResult.actions — always an array, possibly empty). Read-only/
    // already-interactive actions (list_due_reviews, start_review) run
    // immediately, same as before; everything else is a mutation and gets
    // collected into ONE combined confirm card covering the whole batch —
    // see showBatchConfirmCard. list_due_reviews and start_review are kept
    // out of that batch since they don't mutate anything and have their
    // own flow (a review runs interactively right here in chat).
    async function handleCortexActions(actions) {
        const toConfirm = [];
        for (const action of actions) {
            if (action.type === 'list_due_reviews') continue;
            if (action.type === 'start_review') {
                await runReviewInChat(action.conceptId);
                continue;
            }
            const item = describeAndBuildApplier(action);
            if (item.text) toConfirm.push(item);
        }
        if (toConfirm.length) showBatchConfirmCard(toConfirm);
    }

    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        input.style.height = 'auto';
        appendUserMessage(text);
        chatHistory.push({ role: 'user', content: text });
        saveChatHistory();

        const sendBtn = document.getElementById('chatSendBtn');
        sendBtn.disabled = true;
        const thinkingEl = appendAssistantMessage('…');

        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) throw new Error('Not logged in.');

            const [folders, dueReviews] = await Promise.all([
                buildFolderSummary(),
                fetchDueReviews(session.access_token)
            ]);

            const resp = await fetch(`${COMPILE_BACKEND_URL}/cortex/message`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
                body: JSON.stringify({
                    message: text,
                    history: chatHistory.slice(-10),
                    folders,
                    dueReviews
                })
            });

            if (!resp.ok) {
                const body = await resp.json().catch(() => ({}));
                throw new Error(body.error || `Server returned ${resp.status}`);
            }

            const result = await resp.json();
            setAssistantMessageText(thinkingEl, result.reply);
            chatHistory.push({ role: 'assistant', content: result.reply });
            saveChatHistory();
            // Text-only by default — only speaks automatically when the
            // student's own message explicitly asked for that (Cortex
            // decides this itself, from what was actually said; see
            // CORTEX_INTENT_PROMPT's speakAloud rule). Every message still
            // has its own manual speak button regardless.
            if (result.speakAloud) speakText(result.reply);

            if (Array.isArray(result.actions) && result.actions.length) await handleCortexActions(result.actions);
        } catch (err) {
            console.error('LastMind Cortex: message failed.', err);
            // Was a fixed generic string regardless of cause — genuinely
            // impossible to tell a network failure from a backend 500 from
            // a malformed response without opening devtools. Surface
            // err.message directly when there is one (a thrown Error from
            // the !resp.ok branch above carries the backend's own
            // actionable sentence — see routes/cortex.ts — not just a
            // status code) — only fall back to the generic wording for a
            // true network-level failure, which has no message of its own.
            setAssistantMessageText(thinkingEl, (err && err.message) ? err.message : 'Sorry, could not reach the server. Please try again.');
        } finally {
            sendBtn.disabled = false;
        }
    }

    document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
        // Enter sends, same as before the box became multi-line; Shift+Enter
        // inserts an actual newline instead, so a longer message can still
        // be written across several lines before sending.
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChatMessage();
        }
    });
    // Grows the box as the student types past one line (up to the CSS
    // max-height, which then scrolls) instead of scrolling the text
    // sideways inside a fixed single line — the actual ask here: being
    // able to see what you've written.
    document.getElementById('chatInput').addEventListener('input', (e) => {
        e.target.style.height = 'auto';
        e.target.style.height = `${e.target.scrollHeight}px`;
    });

    // One persistent mic button drives voice for whichever text field is
    // currently focused (the main chat box, or a review's answer box) —
    // rather than a separate mic per field.
    function setupChatMic() {
        const micBtn = document.getElementById('chatMicBtn');
        const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognitionCtor) {
            micBtn.disabled = true;
            micBtn.title = 'Dictation is not supported in this browser';
            return { start: () => {} };
        }

        let isListening = false;

        function setListeningUI(listening) {
            isListening = listening;
            micBtn.classList.toggle('listening', listening);
            micBtn.textContent = listening ? '■' : '🎤';
        }

        function start() {
            stopSpeaking();
            const active = document.activeElement;
            const target = (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA'))
                ? active
                : document.getElementById('chatInput');

            const recognition = new SpeechRecognitionCtor();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = navigator.language || 'en-GB';

            recognition.onresult = (e) => {
                const transcript = Array.from(e.results).map((r) => r[0].transcript).join(' ').trim();
                if (!transcript) return;
                target.value = transcript;
                if (target.id === 'chatInput') {
                    sendChatMessage();
                } else {
                    const submitBtn = target.nextElementSibling;
                    if (submitBtn && submitBtn.tagName === 'BUTTON') submitBtn.click();
                }
            };
            recognition.onerror = () => setListeningUI(false);
            recognition.onend = () => { setListeningUI(false); activeRecognition = null; };

            activeRecognition = recognition;
            setListeningUI(true);
            recognition.start();
        }

        micBtn.addEventListener('click', () => {
            if (isListening) {
                stopActiveDictation();
                setListeningUI(false);
            } else {
                start();
            }
        });

        return { start };
    }

    const chatMic = setupChatMic();

    /* ───────────────────────── Gate + boot ───────────────────────── */

    async function enterApp() {
        document.getElementById('gate-message').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        document.getElementById('chatInput').focus();

        // Iframed into learn/index.html's own dashboard (see
        // renderWelcome()) — hides this page's own back-link/title header,
        // which would be redundant duplicated chrome once the dashboard's
        // own topbar/sidebar are already visible around it.
        if (new URLSearchParams(window.location.search).get('embed') === '1') {
            document.body.classList.add('cortex-embed');
        }

        // Fire-and-forget rather than awaited — Cortex reads folders fresh
        // via getAllFolders() at the point each action actually needs them
        // (not once at boot into a cached array like learn/index.html),
        // so there's no render step here that depends on this having
        // finished; it just needs to have started before the student's
        // first message is likely to land.
        reconcileFoldersWithServer().catch((err) => console.error('LastMind Cortex: folder reconcile failed.', err));

        await renderEmptyState();
        await restoreChatHistory();

        if (new URLSearchParams(window.location.search).get('voice') === '1') {
            chatMic.start();
        }
    }

    (async function gate() {
        if (new URLSearchParams(window.location.search).has('preview')) {
            console.warn('LastMind Cortex: running in PREVIEW MODE — the subscription gate is bypassed.');
            await enterApp();
            return;
        }

        const publicKey = await importPublicKey(PUBLIC_KEY_PEM);

        let token = await getStoredToken().catch(() => null);
        let payload = token ? await verifyJWT(token, publicKey) : null;

        if (!payload) {
            token = await refreshTokenFromBackend();
            payload = token ? await verifyJWT(token, publicKey) : null;
        }

        if (payload) { await enterApp(); return; }

        let supabaseSession = null;
        try {
            const { data } = await supabaseClient.auth.getSession();
            supabaseSession = data.session;

            if (supabaseSession) {
                const resp = await fetch(`${BACKEND_URL}/api/token-for-user`, {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${supabaseSession.access_token}` }
                });
                if (resp.ok) {
                    const { token: linkedToken, subscriptionId: linkedSubId } = await resp.json();
                    payload = await verifyJWT(linkedToken, publicKey);
                    if (payload) {
                        await saveToken(linkedToken);
                        if (linkedSubId) await putAuthRecord('subscriptionId', linkedSubId);
                    }
                }
            }
        } catch (err) {
            console.error('LastMind Cortex: login-anywhere check failed.', err);
        }

        if (payload) { await enterApp(); return; }

        if (supabaseSession) { await enterApp(); return; }

        window.location.href = '/subscribe';
    })();
</script>
</body>
</html>
