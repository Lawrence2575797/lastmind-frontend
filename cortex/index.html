            // for a request that lands while it's still waking from idle,
            // which otherwise reads as a genuine failure ("Could not load
            // this lesson") even though the exact same request succeeds
            // seconds later. Never retries the 409 case itself.
            let resp;
            for (let attempt = 0; ; attempt++) {
                resp = await fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2/node/${encodeURIComponent(nodeUuid)}/lesson`, {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });
                if (resp.ok || resp.status === 409 || attempt >= 2) break;
                await new Promise((resolve) => setTimeout(resolve, 2500 * (attempt + 1)));
            }
            // 409/DERIVATION_NOT_READY: this node's own stage genuinely
            // isn't generatable yet (an earlier stage it depends on hasn't
            // been produced) - the route rejects this BEFORE spending
            // anything, so retrying costs nothing but is also not
            // guaranteed to help until an earlier node's own lesson has
            // actually been opened. Same visible outcome as any other
            // failure here: one clear message, one retry button, no
            // automatic cascade to other nodes.
            if (resp.status === 409) {
                showRetryable("Couldn't generate an interactive lesson for this yet — try an earlier concept first, or try this again in a moment.");
                recordSilentContext(`[Could not generate an interactive lesson for "${node.label}" yet - a plain "try again" from the student retries it directly, no action from you needed.]`, 'lessonFailed', { label: node.label });
                return;
            }
            if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
            lessonData = await resp.json();
            stopLessonRotator();
        } catch (err) {
            showRetryable('Could not load this lesson — the server may just be waking up, this often works on retry.');
            return;
        }
        if (!lessonData.derivation) {
            showRetryable("Couldn't generate an interactive lesson for this.");
            recordSilentContext(`[Could not generate an interactive lesson for "${node.label}" - a plain "try again" from the student retries it directly, no action from you needed.]`, 'lessonFailed', { label: node.label });
            return;
        }
        // Fire-and-forget: the moment THIS lesson is confirmed ready, start
        // generating the next one in the background so it's very likely
        // already cached by the time the student finishes this one, instead
        // of making them wait through a fresh generation every single node.
        // Same route, same cost either way - just moved earlier so it
        // overlaps the student's own time on the current lesson rather than
        // running only after they click through. A rejection here (out-of-
        // order stage) is silently swallowed - teachNextInQueue's own
        // deferral handles that node properly when its actual turn comes.
        const nextNode = queue[index + 1];
        if (nextNode) {
            const nextUuid = uuidByConceptId.get(nextNode.conceptId);
            if (nextUuid) {
                getSyncAccessToken()
                    .then((token) => token && fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2/node/${encodeURIComponent(nextUuid)}/lesson`, { headers: { Authorization: `Bearer ${token}` } }))
                    .catch(() => {});
            }
        }
        mountDerivationInCard(card, lessonData.derivation, nodeUuid, () => {
            recordSilentContext(`[Completed the lesson on "${node.label}".]`, 'lessonDone', { label: node.label });
            teachNextInQueue(state, queue, index + 1, uuidByConceptId);
        });
    }

    async function startTopicTeachSequence(state) {
        const teach = topicComputeTeachSet(state);
        if (!teach.length) {
            appendCardMessage(`<div class="lesson-card-done">You already know everything needed for this target.</div>`);
            return;
        }
        const card = appendCardMessage(`<div class="lesson-card-status">Getting your first lesson ready…</div>`);
        let uuidByConceptId;
        try {
            uuidByConceptId = await fetchTopicNodeUuids(state.subject, state.qualification, state.examBoard);
        } catch (err) {
            card.querySelector('.lesson-card-status').textContent = 'Could not start the lesson — try again.';
            return;
        }
        card.remove();
        teachNextInQueue(state, teach, 0, uuidByConceptId);
    }

    // "teach me X" (or a close variant) typed into the ordinary chat box and
    // sent normally - there is no separate "Build lesson" button any more.
    // sendChatMessage checks every outgoing message against this before
    // treating it as a normal chat turn; a match short-circuits straight
    // into the topic-map flow instead of calling /cortex/message at all.
    // Deliberately tolerant of a stray typo in the "how to" lead-in (real
    // example that prompted this: "teach me hwo to order...").
    function detectTeachMeTopic(text) {
        const m = /^(?:can you |could you |please )?(?:teach me|i want to learn|i'd like to learn|help me learn)\b[,:]?\s*(.*)/i.exec(text.trim());
        if (!m) return null;
        let topic = m[1].trim().replace(/^(?:how to|hwo to|to)\s+/i, '').replace(/[.?!]+$/, '').trim();
        return topic.length >= 3 ? topic : null;
    }

    // A plain "try again"/"retry" is only ever treated as a retry of the
    // specific, already-visible lesson failure this session just had (see
    // pendingLessonRetry) - never sent to the LLM as something to infer an
    // action from. A message this short and generic is deliberately NOT
    // matched as a teach-me/general-chat request either.
    function detectRetryIntent(text) {
        return /^(?:please\s+)?(?:try(?: it| that)? again|retry)\s*(?:now|please)?[.!]?$/i.test(text.trim());
    }

    // Builds the knowledge map for a topic and renders it as a boxed chat
    // card - shared by sendChatMessage's "teach me X" detection and the
    // suggestion chips below, both of which already have the topic text in
    // hand rather than reading it back out of #chatInput.
    async function startTopicLearnFlow(topic) {
        const card = appendCardMessage(`
            <div class="topic-loading-wrap">
                ${TOPIC_LOADING_WIRES_SVG}
                <div class="topic-loading-text"></div>
            </div>
        `);
        const stopRotator = startLoadingRotator(card.querySelector('.topic-loading-text'), TOPIC_MAP_LOADING_MESSAGES);
        try {
            const accessToken = await getSyncAccessToken();
            if (!accessToken) { stopRotator(); card.innerHTML = '<div class="topic-map-error">You need to be signed in to build a lesson.</div>'; return; }
            const resp = await fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2/topic`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
                body: JSON.stringify({ topic }),
            });
            stopRotator();
            if (resp.status === 402) { card.innerHTML = "<div class=\"topic-map-error\">You're out of Locks for now — come back once they refresh.</div>"; return; }
            if (resp.status === 429) { card.innerHTML = '<div class="topic-map-error">Too many lessons requested at once — try again shortly.</div>'; return; }
            if (!resp.ok) { card.innerHTML = '<div class="topic-map-error">Could not build a knowledge map for that topic. Try rephrasing it.</div>'; return; }
            const data = await resp.json();
            if (!data.nodes || !data.nodes.length) { card.innerHTML = '<div class="topic-map-error">No usable map came back for that topic. Try rephrasing it.</div>'; return; }
            const taskNode = data.nodes.find((n) => n.isFinalTask) || data.nodes[data.nodes.length - 1];
            const state = { subject: data.subject, qualification: data.qualification, examBoard: data.examBoard, nodes: topicTopologicalOrder(data.nodes, data.edges), edges: data.edges, skip: new Set(), target: taskNode.id };
            renderTopicMap(card, state);
            topicMapState = state; // kept as "most recently shown map", for reference only - every card's own interactivity closes over its own `state`, never this
            recordSilentContext(
                `[Built a knowledge map for "${state.subject}": ${state.nodes.length} concepts - ${state.nodes.map((n) => n.label).join(', ')}.]`,
                'map',
                { subject: state.subject, qualification: state.qualification, examBoard: state.examBoard, nodes: state.nodes, edges: state.edges }
            );
        } catch (err) {
            stopRotator();
            card.innerHTML = '<div class="topic-map-error">Something went wrong building that lesson. Try again.</div>';
        }
    }
    // Personalized against this student's own recent activity (see
    // suggestNextTopicsService.ts's own "natural next step" prompt)
    // instead of three fixed examples every account saw forever. Cached in
    // localStorage per account for a day, so opening Cortex repeatedly in
    // the same day doesn't re-trigger a generation call each time - the
    // route already falls back to sensible defaults on any failure, so a
    // stale or missing cache entry is never worse than what used to be
    // shown unconditionally.
    const SUGGEST_NEXT_CACHE_TTL_MS = 24 * 60 * 60 * 1000;
    async function loadTopicSuggestions() {
        const container = document.getElementById('topicLearnSuggestions');
        if (!container) return;
        let userId = null, accessToken = null;
        try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) { userId = session.user.id; accessToken = session.access_token; }
        } catch (err) { /* fall through to the request below, or the defaults past that */ }

        let suggestions = null;
        const cacheKey = userId ? `lm-topic-suggestions:${userId}` : null;
        if (cacheKey) {
            try {
                const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
                if (cached && Array.isArray(cached.suggestions) && Date.now() - cached.ts < SUGGEST_NEXT_CACHE_TTL_MS) {
                    suggestions = cached.suggestions;
                }
            } catch (err) { /* no usable cache - fetch fresh below */ }
        }

        if (!suggestions && accessToken) {
            try {
                const resp = await fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2/suggest-next`, { headers: { Authorization: `Bearer ${accessToken}` } });
                if (resp.ok) {
                    const data = await resp.json();
                    if (Array.isArray(data.suggestions) && data.suggestions.length) {
                        suggestions = data.suggestions;
                        if (cacheKey) { try { localStorage.setItem(cacheKey, JSON.stringify({ suggestions, ts: Date.now() })); } catch (err) { /* storage unavailable - just skip caching */ } }
                    }
                }
            } catch (err) { console.error('LastMind: could not load topic suggestions.', err); }
        }

        if (!suggestions || !suggestions.length) suggestions = ['the envelope theorem', 'ordering in Italian', 'supply and demand'];

        container.innerHTML = suggestions.map((s) => `<button type="button" class="topic-learn-chip" data-topic="${escapeHtmlTopic(s)}">${escapeHtmlTopic(s)}</button>`).join('');
        container.querySelectorAll('.topic-learn-chip').forEach((chip) => {
            chip.addEventListener('click', () => {
                clearEmptyHint();
                appendUserMessage(`Teach me ${chip.dataset.topic}`);
                startTopicLearnFlow(chip.dataset.topic);
            });
        });
    }
    loadTopicSuggestions();

    function appendUserMessage(text) {
        clearEmptyHint();
        const el = document.createElement('div');
        el.className = 'chat-msg chat-msg-user';
        el.textContent = text;
        chatMessagesEl.appendChild(el);
        el.scrollIntoView({ behavior: 'smooth', block: 'end' });
        return el;
    }

    // Default is text-only now — nothing here is spoken automatically
    // (see sendChatMessage, which only auto-speaks when the student's own
    // message explicitly asked for that turn's reply to be read aloud).
    // Every assistant message still gets its own speak button, so reading
    // any of them aloud — including mid-review questions, not just the
    // main reply — is always one click away.
    // One real <p> per paragraph (split on a blank line, same convention
    // CORTEX_INTENT_PROMPT's own formatting rule asks Cortex to write in
    // for anything longer than a couple of sentences) instead of one dense
    // run of text - the same visual treatment a lesson's own multi-
    // paragraph explanation already gets (see .chat-msg-text p's own CSS
    // comment). Built with createElement/textContent throughout, not an
    // HTML string, so there's no risk of the same stray-whitespace-under-
    // inherited-pre-wrap bug the map/lesson cards had (see .chat-msg.chat-
    // msg-card's own fix) - nothing here is ever raw innerHTML.
    function renderChatText(container, text) {
        container.innerHTML = '';
        const paragraphs = (text || '').split(/\n{2,}/).map((p) => p.trim()).filter(Boolean);
        if (!paragraphs.length) { container.textContent = text || ''; return; }
        paragraphs.forEach((p) => {
            const pEl = document.createElement('p');
            pEl.textContent = p;
            container.appendChild(pEl);
        });
    }

    function appendAssistantMessage(text) {
        clearEmptyHint();
        const el = document.createElement('div');
        el.className = 'chat-msg chat-msg-assistant';

        const textEl = document.createElement('span');
        textEl.className = 'chat-msg-text';
        renderChatText(textEl, text);
        el.appendChild(textEl);

        const speakBtn = document.createElement('button');
        speakBtn.type = 'button';
        speakBtn.className = 'chat-msg-speak-btn';
        speakBtn.title = 'Read aloud';
        speakBtn.textContent = '🔊';
        // Reads the ORIGINAL text, not textEl.textContent - concatenating
        // separate <p> elements' textContent has no space between them,
        // which would run paragraph endings and starts together. Set via
        // .onclick (not addEventListener) so setAssistantMessageText's own
        // later reassignment below cleanly replaces this rather than
        // stacking a second handler that would still read the stale
        // placeholder text alongside it.
        speakBtn.onclick = () => speakText(text);
        el.appendChild(speakBtn);

        chatMessagesEl.appendChild(el);
        el.scrollIntoView({ behavior: 'smooth', block: 'end' });
        return el;
    }

    // Updates just an assistant message's text in place (used by the
    // "…" thinking placeholder and the review-start status line) without
    // clobbering the speak button appendAssistantMessage attached to it —
    // a plain `el.textContent = ...` would wipe the whole element's
    // children, button included.
    function setAssistantMessageText(el, text) {
        const textEl = el.querySelector('.chat-msg-text');
        if (textEl) renderChatText(textEl, text);
        const speakBtn = el.querySelector('.chat-msg-speak-btn');
        if (speakBtn) speakBtn.onclick = () => speakText(text);
    }

    // "done" lets Cortex reason about lesson order (what's already been
    // covered vs. what's next) without the student needing to say so —
    // see CORTEX_INTENT_PROMPT's ordering capability.
    function pageSummary(p) {
        return { title: p.title, done: p.encodingDone === true || p.taughtBefore === true };
    }

    async function buildFolderSummary() {
        const all = await getAllFolders();
        return all.map((f) => ({
            name: f.subject,
            qualification: f.qualification,
            // Same split CortexFolderSummary documents server-side — a
            // school folder's identifying detail is its exam board, a
            // university one's is institution+moduleCode instead (never
            // both). Omitting whichever doesn't apply, rather than sending
            // it as undefined/empty, keeps Cortex from treating a blank
            // examBoard as a real (missing) value on a university folder.
            ...(isUniversityLevel(f.qualification)
                ? { institution: f.institution || '', moduleCode: f.moduleCode || '' }
                : { examBoard: f.examBoard || '' }),
            subfolders: (f.subfolders || []).map((sf) => ({
                name: sf.name,
                pages: (sf.pages || []).map(pageSummary),
                ...(sf.plannedConcepts && sf.plannedConcepts.length ? { plannedConcepts: sf.plannedConcepts } : {})
            })),
            pages: (f.pages || []).map(pageSummary),
            ...(f.plannedConcepts && f.plannedConcepts.length ? { plannedConcepts: f.plannedConcepts } : {})
        }));
    }

    async function fetchDueReviews(accessToken) {
        try {
            // /due, not /schedule - /schedule returns EVERY tracked
            // concept regardless of due date ("soonest-first, regardless
            // of whether it's overdue yet", see review.ts's own comment),
            // which was making Cortex treat a concept scheduled days out
            // as already due and proactively suggest reviewing it early.
            // /due already filters server-side to due-or-overdue only.
            const resp = await fetch(`${COMPILE_BACKEND_URL}/due`, {
                headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (!resp.ok) return [];
            const { due } = await resp.json();
            return (due || []).map((item) => ({
                conceptId: item.concept_id,
                label: conceptKeyToLabel(item.concept_id)
            }));
        } catch (err) {
            return [];
        }
    }

    // Same loose-match heuristic used server-side (matchesUnfinishedSibling
    // in encodingLessonService.ts) and in learn/index.html's plan progress
    // bar — an order's concept names and actual page titles are
    // independently typed free text, so exact equality would miss most
    // real matches. Also used by fuzzyFindByName below for folder/
    // subfolder/page name matching, for the same reason.
    function normalizeForMatch(s) {
        return (s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    }

    // Cortex is given the real folder/subfolder/page names and told to use
    // them exactly (see CORTEX_INTENT_PROMPT rule 3), but it's still an AI
    // reading back names from a JSON blob, not doing a string lookup — a
    // punctuation/whitespace difference, or a name it paraphrases slightly
    // (e.g. "Consumer Theory" for a subfolder actually called "Theory of
    // the Consumer"), used to hard-fail here even though a person would
    // immediately see it's the same thing. Falls back to token overlap
    // (Jaccard-style) when there's no exact match after normalizing —
    // but ONLY when exactly one candidate is a clear best match; a genuine
    // tie or no overlap at all still returns null rather than guessing.
    // Safe to be lenient here specifically because every caller of this
    // shows the resolved target in a confirm card before actually applying
    // anything — a wrong guess gets caught there, not silently applied.
    //
    // getNames(item) may return either a single string or an array of
    // strings — an item can be identified by more than one thing (e.g. a
    // folder by its subject name OR its module code), any of which counts
    // as a match; the item's score is whichever of its candidates scores
    // best against the target.
    function fuzzyFindByName(items, name, getNames) {
        const target = normalizeForMatch(name);
        if (!target || !items.length) return null;

        function candidates(it) {
            const raw = getNames(it);
            return (Array.isArray(raw) ? raw : [raw]).map(normalizeForMatch).filter(Boolean);
        }

        // .filter, not .find — an exact match still isn't safe to use
        // blindly when MORE THAN ONE item shares it (e.g. an A-Level
        // "Economics" folder and a same-subject university one both
        // exact-match a bare "Economics"); only resolve automatically when
        // it's unique, otherwise fall through to scored matching, which
        // can use a candidate name none of the OTHER exact matches share
        // (a module code, an institution) to break the tie.
        const exactMatches = items.filter((it) => candidates(it).includes(target));
        if (exactMatches.length === 1) return exactMatches[0];

        const targetWords = target.split(' ').filter(Boolean);
        if (!targetWords.length) return null;

        const scored = items
            .map((it) => {
                const best = candidates(it).reduce((bestScore, cand) => {
                    const candWords = cand.split(' ').filter(Boolean);
                    const shared = candWords.filter((w) => targetWords.includes(w)).length;
                    const union = new Set([...candWords, ...targetWords]).size;
                    return Math.max(bestScore, union ? shared / union : 0);
                }, 0);
                return { it, score: best };
            })
            .filter((s) => s.score > 0)
            .sort((a, b) => b.score - a.score);

        if (!scored.length) return null;
        if (scored.length > 1 && scored[0].score === scored[1].score) return null;
        return scored[0].it;
    }

    function findFolderByName(folders, name) {
        return fuzzyFindByName(folders, name, (f) =>
            isUniversityLevel(f.qualification)
                ? [f.subject, f.moduleCode, f.institution, folderLabel(f)]
                : [f.subject, folderLabel(f)]
        );
    }

    // Same idea as findPageByTitleAnywhere — a subfolder is identified by
    // name alone, without needing to already know which folder it's
    // currently in (needed for move_subfolder, and for auto-creating one
    // via getOrCreateSubfolder inside the right folder rather than a wrong
    // one just because two folders happen to have similarly-named
    // subfolders). Returns { folder, subfolder } or null.
    function findSubfolderAnywhere(folders, name) {
        for (const f of folders) {
            const sf = fuzzyFindByName(f.subfolders || [], name, (sf) => sf.name || '');
            if (sf) return { folder: f, subfolder: sf };
        }
        return null;
    }

    function findSubfolderByName(folder, name) {
        return fuzzyFindByName(folder.subfolders || [], name, (sf) => sf.name || '');
    }

    function findPageByTitleAnywhere(folders, title) {
        for (const f of folders) {
            const direct = fuzzyFindByName(f.pages || [], title, (p) => p.title || '');
            if (direct) return { folder: f, subfolder: null, page: direct };
            for (const sf of (f.subfolders || [])) {
                const p = fuzzyFindByName(sf.pages || [], title, (p) => p.title || '');
                if (p) return { folder: f, subfolder: sf, page: p };
            }
        }
        return null;
    }

    // Auto-creates a same-named subfolder rather than erroring when the
    // name Cortex chose doesn't resolve to an existing one, even with
    // fuzzyFindByName's leniency — a subfolder is cheap to rename or merge
    // by hand afterward, but a dead-end "I couldn't find..." mid-conversation
    // isn't recoverable without starting the request over. Only ever used
    // for subfolders (never folders): a folder needs a qualification/exam
    // board neither the caller nor Cortex's action payload carries here, so
    // there's nothing sensible to auto-create it with.
    function getOrCreateSubfolder(folder, name) {
        let subfolder = findSubfolderByName(folder, name);
        if (!subfolder) {
            subfolder = { id: crypto.randomUUID(), name, pages: [] };
            folder.subfolders = folder.subfolders || [];
            folder.subfolders.push(subfolder);
        }
        return subfolder;
    }

    async function applyMovePage(action) {
        const folders = await getAllFolders();
        const loc = findPageByTitleAnywhere(folders, action.pageTitle);
        if (!loc) return `I couldn't find a page called "${action.pageTitle}".`;

        const targetFolder = findFolderByName(folders, action.targetFolderName);
        if (!targetFolder) return `I couldn't find a folder called "${action.targetFolderName}".`;

        const targetSubfolder = action.targetSubfolderName ? getOrCreateSubfolder(targetFolder, action.targetSubfolderName) : null;

        const sourceArray = loc.subfolder ? loc.subfolder.pages : loc.folder.pages;
        const idx = sourceArray.findIndex((p) => p.id === loc.page.id);
        if (idx === -1) return `Something went wrong finding "${action.pageTitle}".`;
        const [page] = sourceArray.splice(idx, 1);

        const targetArray = targetSubfolder
            ? (targetSubfolder.pages = targetSubfolder.pages || [])
            : (targetFolder.pages = targetFolder.pages || []);
        targetArray.push(page);

        await putFolder(loc.folder);
        if (targetFolder.id !== loc.folder.id) await putFolder(targetFolder);
        return `Moved "${action.pageTitle}" into ${folderLabel(targetFolder)}${targetSubfolder ? ' > ' + targetSubfolder.name : ''}.`;
    }

    // Moves a WHOLE subfolder — its pages, lessons, and any saved plan —
    // into a different folder, rather than one page at a time. The
    // subfolder is located across every folder by name (findSubfolderAnywhere),
    // same reasoning as applyMovePage not needing to be told where a page
    // currently lives.
    async function applyMoveSubfolder(action) {
        const folders = await getAllFolders();
        const loc = findSubfolderAnywhere(folders, action.subfolderName);
        if (!loc) return `I couldn't find a subfolder called "${action.subfolderName}".`;

        const targetFolder = findFolderByName(folders, action.targetFolderName);
        if (!targetFolder) return `I couldn't find a folder called "${action.targetFolderName}".`;

        if (targetFolder.id === loc.folder.id) {
            return `"${loc.subfolder.name}" is already inside ${folderLabel(targetFolder)}.`;
        }

        const idx = (loc.folder.subfolders || []).findIndex((sf) => sf.id === loc.subfolder.id);
        if (idx === -1) return `Something went wrong finding "${action.subfolderName}".`;
        const [subfolder] = loc.folder.subfolders.splice(idx, 1);

        targetFolder.subfolders = targetFolder.subfolders || [];
        targetFolder.subfolders.push(subfolder);

        await putFolder(loc.folder);
        await putFolder(targetFolder);
        return `Moved "${subfolder.name}" (and everything in it) into ${folderLabel(targetFolder)}.`;
    }

    async function applyCreateFolder(action) {
        // Generated up front (matching learn/index.html's own fix) rather
        // than left to IndexedDB's autoIncrement — sync needs an id that's
        // actually unique across devices, and a later action in the same
        // batch (e.g. create_subfolder targeting this folder) needs to be
        // able to find it again right after this one lands.
        await putFolder({
            id: crypto.randomUUID(),
            subject: action.subject,
            qualification: action.qualification,
            examBoard: action.examBoard || '',
            institution: action.institution || '',
            moduleCode: action.moduleCode || '',
            pages: [],
            createdAt: Date.now()
        });
        return `Created the folder "${folderLabel(action)}".`;
    }

    async function applyCreateSubfolder(action) {
        const folders = await getAllFolders();
        const folder = findFolderByName(folders, action.folderName);
        if (!folder) return `I couldn't find a folder called "${action.folderName}".`;
        if (findSubfolderByName(folder, action.subfolderName)) {
            return `"${action.subfolderName}" already exists inside ${folder.subject}.`;
        }
        folder.subfolders = folder.subfolders || [];
        folder.subfolders.push({ id: crypto.randomUUID(), name: action.subfolderName, pages: [] });
        await putFolder(folder);
        return `Created the subfolder "${action.subfolderName}" inside ${folder.subject}.`;
    }

    async function applyGenerateNotes(action) {
        const folders = await getAllFolders();
        const folder = findFolderByName(folders, action.subject);
        if (!folder) return `I couldn't find a folder for "${action.subject}" yet — create that folder first and I can add the notes.`;

        const subfolder = action.topic ? getOrCreateSubfolder(folder, action.topic) : null;

        const targetArray = subfolder ? (subfolder.pages = subfolder.pages || []) : (folder.pages = folder.pages || []);
        let page = targetArray.find((p) => (p.title || '').trim().toLowerCase() === (action.lesson || '').trim().toLowerCase());
        if (!page) {
            page = { id: crypto.randomUUID(), title: action.lesson, content: '', createdAt: Date.now() };
            targetArray.push(page);
        }
        page.content = (action.noteContent || '')
            .split('\n')
            .filter((line) => line.trim())
            .map((line) => `<div>${escapeHtml(line)}</div>`)
            .join('');

        await putFolder(folder);
        return `Added notes for "${action.lesson}" to ${folderLabel(folder)}${subfolder ? ' > ' + subfolder.name : ''}.`;
    }

    // Creates ONE page tracking several concepts in sequence, instead of
    // one page per concept — see learn/index.html's pageIsMultiLesson and
    // the "lessons" field it reads. Each entry starts un-taught; the page
    // walks them in order the same way a single-concept page walks its own
    // steps, just at the concept level instead of the step level.
    async function applyCreateMultiLessonPage(action) {
        const folders = await getAllFolders();
        const folder = findFolderByName(folders, action.folderName);
        if (!folder) return `I couldn't find a folder called "${action.folderName}".`;

        const subfolder = action.subfolderName ? getOrCreateSubfolder(folder, action.subfolderName) : null;

        const targetArray = subfolder ? (subfolder.pages = subfolder.pages || []) : (folder.pages = folder.pages || []);
        const newPage = {
            id: crypto.randomUUID(),
            title: action.pageTitle || action.concepts.join(', '),
            content: '',
            lessons: action.concepts.map((concept) => ({ concept, encodingDone: false })),
            currentLessonIndex: 0,
            createdAt: Date.now()
        };
        targetArray.push(newPage);
        await putFolder(folder);
        return `Created "${newPage.title}" in ${folderLabel(folder)}${subfolder ? ' > ' + subfolder.name : ''}, covering: ${action.concepts.join(' → ')}.`;
    }

    // Saves the FULL concept order as plannedConcepts on the folder or
    // subfolder — read by learn/index.html's progress bar (see
    // subfolderPlanProgress) to show completion against the whole topic,
    // not just whatever pages happen to exist. Never creates any pages
    // itself — purely a remembered scope.
    async function applySetSubfolderPlan(action) {
        const folders = await getAllFolders();
        const folder = findFolderByName(folders, action.folderName);
        if (!folder) return `I couldn't find a folder called "${action.folderName}".`;

        if (action.subfolderName) {
            const subfolder = getOrCreateSubfolder(folder, action.subfolderName);
            subfolder.plannedConcepts = action.concepts;
            await putFolder(folder);
            return `Saved a ${action.concepts.length}-concept plan for ${folderLabel(folder)} > ${subfolder.name}. You'll see progress against the whole topic there now.`;
        }

        folder.plannedConcepts = action.concepts;
        await putFolder(folder);
        return `Saved a ${action.concepts.length}-concept plan for ${folderLabel(folder)}. You'll see progress against the whole topic there now.`;
    }

    // One ordinary, separate page per concept — unlike
    // applyCreateMultiLessonPage, which bundles everything onto one page.
    // Concepts that already match an existing page (by title, single- or
    // multi-lesson) are skipped rather than duplicated — Cortex is told to
    // always pass the FULL order and let this function do the filtering,
    // since it has the actual page list to check against reliably.
    async function applyCreatePagesFromOrder(action) {
        const folders = await getAllFolders();
        const folder = findFolderByName(folders, action.folderName);
        if (!folder) return `I couldn't find a folder called "${action.folderName}".`;

        const subfolder = action.subfolderName ? getOrCreateSubfolder(folder, action.subfolderName) : null;

        const targetArray = subfolder ? (subfolder.pages = subfolder.pages || []) : (folder.pages = folder.pages || []);
        const existingTitles = new Set();
        targetArray.forEach((p) => {
            existingTitles.add(normalizeForMatch(p.title));
            (p.lessons || []).forEach((l) => existingTitles.add(normalizeForMatch(l.concept)));
        });

        const toCreate = action.concepts.filter((concept) => !existingTitles.has(normalizeForMatch(concept)));
        toCreate.forEach((concept) => {
            targetArray.push({
                id: crypto.randomUUID(),
                title: concept,
                content: '',
                createdAt: Date.now()
            });
        });

        if (!toCreate.length) {
            return `Every concept in that order already has a page in ${folderLabel(folder)}${subfolder ? ' > ' + subfolder.name : ''} — nothing new to create.`;
        }

        await putFolder(folder);
        const skipped = action.concepts.length - toCreate.length;
        return `Created ${toCreate.length} new page(s) in ${folderLabel(folder)}${subfolder ? ' > ' + subfolder.name : ''}: ${toCreate.join(', ')}.${skipped ? ` (${skipped} already existed, skipped.)` : ''}`;
    }

    // Deletes the whole folder record — everything inside it (every
    // subfolder and page) goes with it. Only ever reached after the
    // student has explicitly confirmed (see the batch confirm card) —
    // CORTEX_INTENT_PROMPT rule 12 restricts this action to explicit,
    // unambiguous deletion requests, but the confirmation is the real
    // safety gate, same as every other action.
    async function applyDeleteFolder(action) {
        const folders = await getAllFolders();
        const folder = findFolderByName(folders, action.folderName);
        if (!folder) return `I couldn't find a folder called "${action.folderName}".`;
        const label = folderLabel(folder);
        const subject = folder.subject || '';
        const conceptKeys = [
            ...(folder.pages || []).flatMap((p) => conceptKeyCandidatesForPage(subject, '', p)),
            ...(folder.subfolders || []).flatMap((sf) => (sf.pages || []).flatMap((p) => conceptKeyCandidatesForPage(subject, sf.name || '', p)))
        ];
        await deleteFolderRecord(folder.id);
        await resetProgressForConcepts(conceptKeys);
        return `Deleted the folder "${label}" and everything in it.`;
    }

    async function applyDeleteSubfolder(action) {
        const folders = await getAllFolders();
        const loc = findSubfolderAnywhere(folders, action.subfolderName);
        if (!loc) return `I couldn't find a subfolder called "${action.subfolderName}".`;
        const idx = (loc.folder.subfolders || []).findIndex((sf) => sf.id === loc.subfolder.id);
        if (idx === -1) return `Something went wrong finding "${action.subfolderName}".`;
        const conceptKeys = (loc.subfolder.pages || []).flatMap((p) => conceptKeyCandidatesForPage(loc.folder.subject || '', loc.subfolder.name || '', p));
        loc.folder.subfolders.splice(idx, 1);
        await putFolder(loc.folder);
        await resetProgressForConcepts(conceptKeys);
        return `Deleted the subfolder "${loc.subfolder.name}" and everything in it.`;
    }

    async function applyDeletePage(action) {
        const folders = await getAllFolders();
        const loc = findPageByTitleAnywhere(folders, action.pageTitle);
        if (!loc) return `I couldn't find a page called "${action.pageTitle}".`;
        const sourceArray = loc.subfolder ? loc.subfolder.pages : loc.folder.pages;
        const idx = sourceArray.findIndex((p) => p.id === loc.page.id);
        if (idx === -1) return `Something went wrong finding "${action.pageTitle}".`;
        const conceptKeys = conceptKeyCandidatesForPage(loc.folder.subject || '', (loc.subfolder && loc.subfolder.name) || '', loc.page);
        sourceArray.splice(idx, 1);
        await putFolder(loc.folder);
        await resetProgressForConcepts(conceptKeys);
        return `Deleted the page "${loc.page.title}".`;
    }

    function describeAndBuildApplier(action) {
        if (action.type === 'move_page') {
            return {
                text: `Move "${action.pageTitle}" into ${action.targetFolderName}${action.targetSubfolderName ? ' > ' + action.targetSubfolderName : ''}?`,
                apply: () => applyMovePage(action)
            };
        }
        if (action.type === 'move_subfolder') {
            return {
                text: `Move "${action.subfolderName}" (and everything in it) into ${action.targetFolderName}?`,
                apply: () => applyMoveSubfolder(action)
            };
        }
        if (action.type === 'create_folder') {
            return {
                text: `Create a new folder "${folderLabel(action)}"?`,
                apply: () => applyCreateFolder(action)
            };
        }
        if (action.type === 'create_subfolder') {
            return {
                text: `Create a new subfolder "${action.subfolderName}" inside "${action.folderName}"?`,
                apply: () => applyCreateSubfolder(action)
            };
        }
        if (action.type === 'generate_notes') {
            return {
                text: `Add generated notes for "${action.lesson}" (${action.subject}${action.topic ? ' > ' + action.topic : ''})?`,
                apply: () => applyGenerateNotes(action)
            };
        }
        if (action.type === 'create_multi_lesson_page' && Array.isArray(action.concepts) && action.concepts.length >= 2) {
            return {
                text: `Create "${action.pageTitle || action.concepts.join(', ')}" in ${action.folderName}${action.subfolderName ? ' > ' + action.subfolderName : ''}, covering ${action.concepts.length} lessons: ${action.concepts.join(' → ')}?`,
                apply: () => applyCreateMultiLessonPage(action)
            };
        }
        if (action.type === 'set_subfolder_plan' && Array.isArray(action.concepts) && action.concepts.length >= 2) {
            return {
                text: `Save this as your tracked plan for ${action.folderName}${action.subfolderName ? ' > ' + action.subfolderName : ''} (${action.concepts.length} concepts)? You'll see a progress bar there.`,
                apply: () => applySetSubfolderPlan(action)
            };
        }
        if (action.type === 'create_pages_from_order' && Array.isArray(action.concepts) && action.concepts.length >= 1) {
            return {
                text: `Create pages for this order in ${action.folderName}${action.subfolderName ? ' > ' + action.subfolderName : ''} (skipping any that already exist)? ${action.concepts.join(' → ')}`,
                apply: () => applyCreatePagesFromOrder(action)
            };
        }
        if (action.type === 'delete_folder') {
            return {
                text: `⚠️ Delete the folder "${action.folderName}" — this removes everything inside it and can't be undone. Are you sure?`,
                apply: () => applyDeleteFolder(action)
            };
        }
        if (action.type === 'delete_subfolder') {
            return {
                text: `⚠️ Delete the subfolder "${action.subfolderName}" — this removes everything inside it and can't be undone. Are you sure?`,
                apply: () => applyDeleteSubfolder(action)
            };
        }
        if (action.type === 'delete_page') {
            return {
                text: `⚠️ Delete the page "${action.pageTitle}" — this can't be undone. Are you sure?`,
                apply: () => applyDeletePage(action)
            };
        }
        return { text: null, apply: null };
    }

    // `items` is a list of { text, apply } — one card, one Yes/No, covering
    // the WHOLE batch a single message asked for (see CORTEX_INTENT_PROMPT
    // rule 2b: "make me a folder with a subfolder in it" is two actions,
    // not two separate turns). On confirm, every apply() runs strictly in
    // order, awaited one at a time — not in parallel — because a later
    // action's applier does its own fresh getAllFolders() lookup, so it
    // can only find what an earlier action in the same batch just created
    // once that earlier write has actually landed. Each item gets its own
    // status line, so a partial failure partway through the batch is
    // still visible per-step rather than a single pass/fail for the whole
    // thing.
    function showBatchConfirmCard(items) {
        const card = document.createElement('div');
        card.className = 'chat-confirm-card';

        const desc = document.createElement('div');
        desc.className = 'chat-confirm-text';
        if (items.length === 1) {
            desc.textContent = items[0].text;
        } else {
            desc.innerHTML = items.map((item, i) => `${i + 1}. ${escapeHtml(item.text)}`).join('<br>');
        }

        const actions = document.createElement('div');
        actions.className = 'chat-confirm-actions';

        const yesBtn = document.createElement('button');
        yesBtn.className = 'chat-confirm-btn';
        yesBtn.type = 'button';
        yesBtn.textContent = items.length > 1 ? `Yes, do all ${items.length}` : 'Yes, do it';

        const noBtn = document.createElement('button');
        noBtn.className = 'chat-confirm-btn chat-confirm-btn-no';
        noBtn.type = 'button';
        noBtn.textContent = 'No';

        yesBtn.addEventListener('click', async () => {
            actions.remove();
            const statusEl = document.createElement('div');
            statusEl.className = 'chat-confirm-status';
            statusEl.textContent = 'Working…';
            card.appendChild(statusEl);

            const results = [];
            for (const item of items) {
                try {
                    results.push((await item.apply()) || 'Done.');
                } catch (err) {
                    console.error('LastMind Cortex: action failed.', err);
                    results.push('Something went wrong — please try again.');
                }
            }
            statusEl.innerHTML = results.length === 1
                ? escapeHtml(results[0])
                : results.map((r, i) => `${i + 1}. ${escapeHtml(r)}`).join('<br>');
        });

        noBtn.addEventListener('click', () => card.remove());

        actions.appendChild(yesBtn);
        actions.appendChild(noBtn);
        card.appendChild(desc);
        card.appendChild(actions);
        chatMessagesEl.appendChild(card);
        card.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    // conceptId (subject:topic:concept, each lowercased/underscored — see
    // normalizeConceptKey server-side) can't be decoded back to the real
    // page it came from, since that cleaning is lossy. Instead, re-derive
    // the same key for every page already in this device's IndexedDB and
    // compare — a multi-lesson page contributes one candidate per
    // sub-concept (see pageIsMultiLesson/p.lessons in learn/index.html),
    // not just its own title, since that's what actually feeds the key
    // for an individual concept on a bundled page.
    function cleanConceptPart(s) {
        return (s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_');
    }

    async function findLessonLocationForConcept(conceptId) {
        const all = await getAllFolders();
        const matchPages = (pages, topicRaw, subject, folderId, subfolderId) => {
            const topic = cleanConceptPart(topicRaw);
            for (const p of (pages || [])) {
                const isMulti = Array.isArray(p.lessons) && p.lessons.length > 0;
                const concepts = isMulti ? p.lessons.map((l) => l.concept) : [p.title];
                for (const c of concepts) {
                    if (`${subject}:${topic}:${cleanConceptPart(c)}` === conceptId) {
                        return { folderId, subfolderId, pageId: p.id };
                    }
                }
            }
            return null;
        };
        for (const f of all) {
            const subject = cleanConceptPart(f.subject);
            const direct = matchPages(f.pages, '', subject, f.id, null);
            if (direct) return direct;
            for (const sf of (f.subfolders || [])) {
                const found = matchPages(sf.pages, sf.name, subject, f.id, sf.id);
                if (found) return found;
            }
        }
        return null;
    }

    // Instead of running the review right here in chat, hand off to the
    // real lesson page — it already has the notes panel, diagrams, and
    // everything else a review needs, so there's no reason to rebuild a
    // second, thinner version of it inline.
    function presentReviewRedirect(loc) {
        const card = document.createElement('div');
        card.className = 'chat-confirm-card';

        const desc = document.createElement('div');
        desc.className = 'chat-confirm-text';
        desc.textContent = "Found it — ready to pick this back up?";
        card.appendChild(desc);

        const actions = document.createElement('div');
        actions.className = 'chat-confirm-actions';
        const goBtn = document.createElement('button');
        goBtn.className = 'chat-confirm-btn';
        goBtn.type = 'button';
        goBtn.textContent = 'Continue this review';
        goBtn.addEventListener('click', () => {
            const params = new URLSearchParams({ openFolder: loc.folderId, openPage: loc.pageId });
            if (loc.subfolderId) params.set('openSubfolder', loc.subfolderId);
            window.location.href = `/learn/?${params.toString()}`;
        });
        actions.appendChild(goBtn);
        card.appendChild(actions);

        chatMessagesEl.appendChild(card);
        card.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    // `actions` is the full list from one Cortex response (see
    // CortexResult.actions — always an array, possibly empty). Read-only/
    // already-interactive actions (list_due_reviews, start_review) run
    // immediately, same as before; everything else is a mutation and gets
    // collected into ONE combined confirm card covering the whole batch —
    // see showBatchConfirmCard. list_due_reviews and start_review are kept
    // out of that batch since they don't mutate anything and have their
    // own flow (start_review hands off to the real lesson page instead of
    // running the review inline — see presentReviewRedirect).
    async function handleCortexActions(actions) {
        const toConfirm = [];
        for (const action of actions) {
            if (action.type === 'list_due_reviews') continue;
            if (action.type === 'start_review') {
                const loc = await findLessonLocationForConcept(action.conceptId);
                if (loc) {
                    presentReviewRedirect(loc);
                } else {
                    appendAssistantMessage("I couldn't find exactly where that lives anymore — check your Progress page or Calendar for it.");
                }
                continue;
            }
            const item = describeAndBuildApplier(action);
            if (item.text) toConfirm.push(item);
        }
        if (toConfirm.length) showBatchConfirmCard(toConfirm);
    }

    // The exact string cortexService.ts's CortexResponseTruncatedError
    // carries (see routes/cortex.ts) - matched so sendChatMessage can retry
    // ONCE, silently, before ever showing the student anything. This is
    // usually a one-off JSON-formatting slip (an unescaped quote inside the
    // reply, e.g. quoting a phrase in another language - see
    // CORTEX_INTENT_PROMPT's rule 1), not a standing problem, so a same-
    // message retry very often just works.
    const CORTEX_TRUNCATED_MESSAGE = 'That was a lot to take in at once, so the response got cut off. Try asking again in a shorter or more specific way.';

    // Answers a question WITH the currently active lesson's own context
    // (its explanation, its current on-screen question) via the same
    // GET .../ask route the dashboard's "Ask Cortex" corner panel already
    // uses - see activeLessonNodeUuid. Returns the answer text, or null if
    // this genuinely wasn't about the active lesson (the route's own
    // "redirected" judgment) or the call itself failed - either way,
    // sendChatMessage then falls through to the general chat path instead
    // of dead-ending, since "not about THIS lesson" still isn't "not a
    // learning question at all".
    async function tryAnswerFromActiveLesson(text) {
        if (!activeLessonNodeUuid) return null;
        try {
            const accessToken = await getSyncAccessToken();
            const resp = await fetch(`${COMPILE_BACKEND_URL}/knowledge-map-v2/node/${encodeURIComponent(activeLessonNodeUuid)}/ask`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
                body: JSON.stringify({ question: text }),
            });
            if (!resp.ok) return null;
            const result = await resp.json();
            return result.redirected ? null : result.answer;
        } catch (err) {
            console.error('LastMind: lesson-context question failed.', err);
            return null;
        }
    }

    async function postCortexMessage(text, session, folders, dueReviews) {
        const resp = await fetch(`${COMPILE_BACKEND_URL}/cortex/message`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({ message: text, history: chatHistory.slice(-10), folders, dueReviews })
        });
        if (!resp.ok) {
            const body = await resp.json().catch(() => ({}));
            throw new Error(body.error || `Server returned ${resp.status}`);
        }
        return resp.json();
    }

    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        // Guarantees activeSessionId (and, for a resumed session, its past
        // messages already loaded into chatHistory) is settled BEFORE this
        // turn touches chatHistory itself - sending fast enough to beat
        // ensureSessionReady's own resolution used to push this turn onto
        // chatHistory first, only for restoreChatHistory's later
        // `chatHistory = session.messages` to silently overwrite it. In
        // practice this resolves near-instantly (a local IndexedDB read,
        // already kicked off well before this could ever be called).
        await ensureSessionReady();

        // "teach me X" (or a close variant) short-circuits into the
        // topic-map flow instead of an ordinary chat turn - see
        // detectTeachMeTopic/startTopicLearnFlow above. Everything past
        // this point is the normal Q&A path.
        const teachTopic = detectTeachMeTopic(text);
        if (teachTopic) {
            input.value = '';
            input.style.height = 'auto';
            appendUserMessage(text);
            startTopicLearnFlow(teachTopic);
            return;
        }

        // A plain "try again" retrying a lesson that just visibly failed
        // (see pendingLessonRetry) is the same short-circuit, for the same
        // reason - a known, specific, already-on-screen thing to redo,
        // never sent to the LLM to guess an action from.
        if (pendingLessonRetry && detectRetryIntent(text)) {
            input.value = '';
            input.style.height = 'auto';
            appendUserMessage(text);
            const retry = pendingLessonRetry;
            pendingLessonRetry = null;
            retry();
            return;
        }

        input.value = '';
        input.style.height = 'auto';
        appendUserMessage(text);
        chatHistory.push({ role: 'user', content: text });
        saveChatHistory();

        const sendBtn = document.getElementById('chatSendBtn');
        sendBtn.disabled = true;
        const thinkingEl = appendAssistantMessage('…');

        try {
            // A lesson currently on screen gets first crack at this,
            // WITH its own real content as context - "instead of using
            // 'would', what is 'could' in this sentence?" means nothing to
            // general chat, which has no idea what "this sentence" is.
            const lessonAnswer = await tryAnswerFromActiveLesson(text);
            if (lessonAnswer) {
                setAssistantMessageText(thinkingEl, lessonAnswer);
                chatHistory.push({ role: 'assistant', content: lessonAnswer });
                saveChatHistory();
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) throw new Error('Not logged in.');

            const [folders, dueReviews] = await Promise.all([
                buildFolderSummary(),
                fetchDueReviews(session.access_token)
            ]);

            let result;
            try {
                result = await postCortexMessage(text, session, folders, dueReviews);
            } catch (err) {
                if (err.message !== CORTEX_TRUNCATED_MESSAGE) throw err;
                result = await postCortexMessage(text, session, folders, dueReviews);
            }
            setAssistantMessageText(thinkingEl, result.reply);
            chatHistory.push({ role: 'assistant', content: result.reply });
            saveChatHistory();
            // Text-only by default — only speaks automatically when the
            // student's own message explicitly asked for that (Cortex
            // decides this itself, from what was actually said; see
            // CORTEX_INTENT_PROMPT's speakAloud rule). Every message still
            // has its own manual speak button regardless.
            if (result.speakAloud) speakText(result.reply);

            // Cortex still never touches the student's account directly
            // (folders/pages/reviews - see cortexPrompts.ts's own top
            // comment) - but it CAN now declare one of two narrow intents,
            // recognized from whatever phrasing the student actually used
            // rather than a fixed set of client-side regexes (real report:
            // "try to generate it again" didn't match detectRetryIntent's
            // pattern and fell through to a plain "I can't do that"
            // reply). Executing either one here is exactly as deterministic
            // and narrow as the regex short-circuits above - Cortex only
            // ever flags the intent, this code decides what that means and
            // does it, same as a button click.
            if (result.startTopic) {
                startTopicLearnFlow(result.startTopic);
            } else if (result.retryFailedLesson && pendingLessonRetry) {
                const retry = pendingLessonRetry;
                pendingLessonRetry = null;
                retry();
            }
        } catch (err) {
            console.error('LastMind Cortex: message failed.', err);
            // Was a fixed generic string regardless of cause — genuinely
            // impossible to tell a network failure from a backend 500 from
            // a malformed response without opening devtools. Surface
            // err.message directly when there is one (a thrown Error from
            // the !resp.ok branch above carries the backend's own
            // actionable sentence — see routes/cortex.ts — not just a
            // status code) — only fall back to the generic wording for a
            // true network-level failure, which has no message of its own.
            // By the time this shows, a same-message retry already happened
            // once and failed again too - so it's a genuinely repeated
            // problem, not the usual one-off blip.
            setAssistantMessageText(thinkingEl, (err && err.message) ? err.message : 'Sorry, could not reach the server. Please try again.');
        } finally {
            sendBtn.disabled = false;
        }
    }

    document.getElementById('chatSendBtn').addEventListener('click', sendChatMessage);
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
        // Enter sends, same as before the box became multi-line; Shift+Enter
        // inserts an actual newline instead, so a longer message can still
        // be written across several lines before sending.
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChatMessage();
        }
    });
    // Grows the box as the student types past one line (up to the CSS
    // max-height, which then scrolls) instead of scrolling the text
    // sideways inside a fixed single line — the actual ask here: being
    // able to see what you've written.
    document.getElementById('chatInput').addEventListener('input', (e) => {
        e.target.style.height = 'auto';
        e.target.style.height = `${e.target.scrollHeight}px`;
    });

    // One persistent mic button drives voice for whichever text field is
    // currently focused (the main chat box, or a review's answer box) —
    // rather than a separate mic per field.
    function setupChatMic() {
        const micBtn = document.getElementById('chatMicBtn');
        const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognitionCtor) {
            micBtn.disabled = true;
            micBtn.title = 'Dictation is not supported in this browser';
            return { start: () => {} };
        }

        let isListening = false;

        function setListeningUI(listening) {
            isListening = listening;
            micBtn.classList.toggle('listening', listening);
            micBtn.textContent = listening ? '■' : '🎤';
        }

        function start() {
            stopSpeaking();
            const active = document.activeElement;
            const target = (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA'))
                ? active
                : document.getElementById('chatInput');

            const recognition = new SpeechRecognitionCtor();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = navigator.language || 'en-GB';

            recognition.onresult = (e) => {
                const transcript = Array.from(e.results).map((r) => r[0].transcript).join(' ').trim();
                if (!transcript) return;
                target.value = transcript;
                if (target.id === 'chatInput') {
                    sendChatMessage();
                } else {
                    const submitBtn = target.nextElementSibling;
                    if (submitBtn && submitBtn.tagName === 'BUTTON') submitBtn.click();
                }
            };
            recognition.onerror = () => setListeningUI(false);
            recognition.onend = () => { setListeningUI(false); activeRecognition = null; };

            activeRecognition = recognition;
            setListeningUI(true);
            recognition.start();
        }

        micBtn.addEventListener('click', () => {
            if (isListening) {
                stopActiveDictation();
                setListeningUI(false);
            } else {
                start();
            }
        });

        return { start };
    }

    const chatMic = setupChatMic();

    /* ───────────────────────── Gate + boot ───────────────────────── */

    async function enterApp() {
        document.getElementById('gate-message').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        document.getElementById('chatInput').focus();

        // Applies this account's real saved theme colours - fetchThemeSettings
        // existed but was never actually called anywhere in this file, so
        // this page always sat on its own static :root defaults (a visibly
        // different navy from learn/index.html's own THEME_DEFAULTS.panelColor)
        // regardless of what the account's real theme was. The 'lm-theme-update'
        // postMessage listener above only ever fires for an image-backed
        // theme (see learn/index.html's own cortexEmbedFrame 'load' handler),
        // so it alone was never enough for the plain/default case every
        // account starts on. Fire-and-forget: nothing else here depends on
        // this finishing before the chat itself is usable.
        fetchThemeSettings().then((theme) => { if (theme) applyTheme(theme); });

        // Iframed into learn/index.html's own dashboard (see
        // renderWelcome()) — hides this page's own back-link/title header,
        // which would be redundant duplicated chrome once the dashboard's
        // own topbar/sidebar are already visible around it.
        if (new URLSearchParams(window.location.search).get('embed') === '1') {
            document.body.classList.add('cortex-embed');
        }

        // Fire-and-forget rather than awaited — Cortex reads folders fresh
        // via getAllFolders() at the point each action actually needs them
        // (not once at boot into a cached array like learn/index.html),
        // so there's no render step here that depends on this having
        // finished; it just needs to have started before the student's
        // first message is likely to land.
        reconcileFoldersWithServer().catch((err) => console.error('LastMind Cortex: folder reconcile failed.', err));

        await renderEmptyState();
        await restoreChatHistory();

        if (new URLSearchParams(window.location.search).get('voice') === '1') {
            chatMic.start();
        }
    }

    (async function gate() {
        if (new URLSearchParams(window.location.search).has('preview')) {
            console.warn('LastMind Cortex: running in PREVIEW MODE — the subscription gate is bypassed.');
            await enterApp();
            return;
        }

        const publicKey = await importPublicKey(PUBLIC_KEY_PEM);

        // SECURITY: the Supabase session is established FIRST, before any
        // device-local token is looked up — see learn/index.html's own gate()
        // for the full incident (checking IndexedDB, which is shared by the
        // whole device/browser, before knowing which account is asking let a
        // brand-new unpaid account reuse a different, paid account's cached
        // token on the same device).
        let supabaseSession = null;
        try {
            const { data } = await supabaseClient.auth.getSession();
            supabaseSession = data.session;
        } catch (err) {
            console.error('LastMind Cortex: could not read the current session.', err);
        }

        if (!supabaseSession) {
            window.location.href = '/';
            return;
        }

        const userId = supabaseSession.user.id;
        let token = await getStoredToken(userId).catch(() => null);
        let payload = token ? await verifyJWT(token, publicKey) : null;

        if (!payload) {
            token = await refreshTokenFromBackend(userId);
            payload = token ? await verifyJWT(token, publicKey) : null;
        }

        if (payload) { await enterApp(); return; }

        try {
            const resp = await fetch(`${BACKEND_URL}/api/token-for-user`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${supabaseSession.access_token}` }
            });
            if (resp.ok) {
                const { token: linkedToken, subscriptionId: linkedSubId } = await resp.json();
                payload = await verifyJWT(linkedToken, publicKey);
                if (payload) {
                    await saveToken(userId, linkedToken);
                    if (linkedSubId) await putAuthRecord(scopedAuthKey('subscriptionId', userId), linkedSubId);
                }
            }
        } catch (err) {
            console.error('LastMind Cortex: login-anywhere check failed.', err);
        }

        if (payload) { await enterApp(); return; }

        await enterApp();
    })();
</script>
</body>
