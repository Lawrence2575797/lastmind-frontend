<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .logo-l { fill: var(--logo-l-color, #2B2120); }
      .logo-m { fill: var(--logo-m-color, #C9A876); }
    </style>
  </defs>

  <!-- L: Bold rounded L shape -->
  <g class="logo-l">
    <!-- Vertical bar -->
    <rect x="160" y="160" width="160" height="680" rx="60" />
    <!-- Horizontal bar -->
    <rect x="160" y="740" width="400" height="160" rx="60" />
  </g>

  <!-- M: 3D checkmark with vertical backing -->
  <g class="logo-m">
    <!-- Right vertical bar (backing) -->
    <rect x="680" y="160" width="140" height="640" rx="60" />
    <!-- Diagonal checkmark - lower left to middle -->
    <line x1="520" y1="600" x2="680" y2="460" stroke="var(--logo-m-color, #C9A876)" stroke-width="100" stroke-linecap="round" />
    <!-- Diagonal checkmark - middle to upper right -->
    <line x1="680" y1="460" x2="840" y2="280" stroke="var(--logo-m-color, #C9A876)" stroke-width="100" stroke-linecap="round" />
  </g>
</svg>
