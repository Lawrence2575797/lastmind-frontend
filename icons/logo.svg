<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- L: Bold rounded L shape (left) -->
  <g id="logo-l">
    <!-- Vertical bar -->
    <rect x="140" y="140" width="180" height="720" rx="70" fill="var(--logo-l-color, #2B2120)" />
    <!-- Horizontal bar -->
    <rect x="140" y="740" width="420" height="180" rx="70" fill="var(--logo-l-color, #2B2120)" />
  </g>

  <!-- M: Vertical bar with bold checkmark (right) -->
  <g id="logo-m">
    <!-- Vertical backing bar -->
    <rect x="680" y="140" width="160" height="720" rx="70" fill="var(--logo-m-color, #C9A876)" />
    <!-- Checkmark: Lower diagonal stroke -->
    <line x1="480" y1="620" x2="700" y2="420" stroke="var(--logo-m-color, #C9A876)" stroke-width="120" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Checkmark: Upper diagonal stroke -->
    <line x1="700" y1="420" x2="880" y2="200" stroke="var(--logo-m-color, #C9A876)" stroke-width="120" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
