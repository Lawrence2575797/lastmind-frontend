<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Be the Chancellor · LastMind Create</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light; --bg: #cfe4f6; --panel: #e6f2fc; --text: #000000; --ink: #000000; --accent: #0a5f8f; --line: rgba(0, 0, 0, 0.22); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; line-height: 1.5; }
  .top { position: sticky; top: 0; z-index: 30; background: #0f1b2d; color: #f6efdc; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
  .top a { color: #f6efdc; text-decoration: none; font-weight: 700; font-size: 0.86rem; letter-spacing: 0.02em; }
  .top .brand { font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.78rem; opacity: 0.85; }
  #app { max-width: 1320px; margin: 0 auto; padding: 8px 18px 60px; }
  #app .chn { --chn-line: var(--line); }
  .gate { max-width: 560px; margin: 12vh auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  .gate h1 { margin: 0 0 8px; font-size: 1.5rem; } .gate p { margin: 0 0 14px; }
  .gate a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; }
  .lm-screen-hint { margin: 6px 0 0; padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; background: rgba(180,35,24,0.12); color: #b42318; }
  [aria-invalid="true"] { outline: 2px solid #b42318; }
</style>
</head>
<body>
<header class="top"><a href="/learn/" id="backLink">← Back to LastMind</a><span class="brand">LastMind Create · Be the Chancellor</span></header>
<main id="app"><div class="gate"><h1>Opening the Treasury…</h1><p>One moment.</p></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const COMPILE_BACKEND_URL = 'https://lastmind-compile-backend.onrender.com';
  const SUPABASE_URL = 'https://evgdecewwmkupiadgfop.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Bb-f61P1zqy_xW63D26nUw_VTOVXaub';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);   // same origin as the app, so the same sign-in
  const CREATE_SPEND_KEY = 'lastmind-create-spent';
  const CHN_CONFIG_KEY = 'lastmind-chancellor-config', CHN_GAME_KEY = 'lastmind-chancellor-game';

  function escapeHtml(str) { return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // The shared "testing budget" counter, same as LastMind Create's Law simulation.
  let createSpend = { usedUsd: 0, capUsd: 2 };
  try { createSpend.usedUsd = Number(localStorage.getItem(CREATE_SPEND_KEY)) || 0; } catch (err) { /* fresh */ }
  const createBudgetLeft = () => createSpend.capUsd - createSpend.usedUsd;
  function createNoteSpend(s) {
    if (!s || typeof s.usedUsd !== 'number') return;
    createSpend.usedUsd = Math.max(createSpend.usedUsd, s.usedUsd);
    if (typeof s.capUsd === 'number') createSpend.capUsd = s.capUsd;
    try { localStorage.setItem(CREATE_SPEND_KEY, String(createSpend.usedUsd)); } catch (err) { /* fine */ }
    if (window.chnPaintBudget) window.chnPaintBudget();
  }
  async function createAuthedFetch(path, options = {}) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) throw new Error('Please sign in again.');
    const resp = await fetch(`${COMPILE_BACKEND_URL}${path}`, { ...options, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}`, ...(options.headers || {}) } });
    const body = await resp.json().catch(() => ({}));
    return { resp, body };
  }
  function ptShrink(dataUrl, maxW) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width), c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let out = dataUrl; try { out = c.toDataURL('image/webp', 0.86); if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/png'); } catch (err) { /* keep the original */ }
        resolve(out);
      };
      img.onerror = () => resolve(dataUrl); img.src = dataUrl;
    });
  }

  // Text screening: the server is the authority; this tells students before they send (mirrors services/contentFilter.ts).
  const LEET = { a: '[a4@*]', b: '[b8]', c: '[c(]', e: '[e3*]', g: '[g9]', i: '[i1!|*]', l: '[l1|]', o: '[o0*]', s: '[s5$]', t: '[t7+]', u: '[uv*]' };
  const loose = (w) => w.split('').map((ch) => (LEET[ch] || ch) + '[\\W_]{0,2}').join('').replace(/\[\\W_\]\{0,2\}$/, '');
  const BAD = ['fuck', 'fucking', 'fucker', 'motherfucker', 'shit', 'shitty', 'bullshit', 'bitch', 'bastard', 'cunt', 'dick', 'dickhead', 'prick', 'twat', 'wanker', 'bollocks', 'piss', 'arsehole', 'asshole', 'slut', 'whore', 'cock', 'tosser', 'bellend', 'douchebag', 'jackass', 'dipshit', 'shithead', 'crap', 'nigger', 'nigga', 'faggot', 'fag', 'retard', 'retarded', 'spastic', 'paki', 'chink', 'kike', 'tranny', 'coon', 'gook', 'wetback', 'raghead'].map((w) => new RegExp('(?<![A-Za-z])' + loose(w) + '(?![A-Za-z])', 'i'));
  function lmScreenText(text) { return { vulgar: BAD.some((re) => re.test(String(text || ''))) }; }
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el || el.id !== 'chnAnswer') return;
    let hint = el.parentElement.querySelector('.lm-screen-hint');
    if (lmScreenText(el.value).vulgar) { if (!hint) { hint = document.createElement('div'); hint.className = 'lm-screen-hint'; el.insertAdjacentElement('afterend', hint); } hint.textContent = 'Please keep it civil: offensive language cannot be sent.'; el.setAttribute('aria-invalid', 'true'); }
    else if (hint) { hint.remove(); el.removeAttribute('aria-invalid'); }
  }, true);

  function load(src) { return new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src + '?v=' + Date.now();   // always the latest simulation files, never a cached older copy s.onload = resolve; s.onerror = () => reject(new Error('Could not load ' + src)); document.head.appendChild(s); }); }
  function gate(title, text, link) {
    document.getElementById('app').innerHTML = `<div class="gate"><h1>${escapeHtml(title)}</h1><p>${escapeHtml(text)}</p>${link ? `<a class="btn" href="${link[0]}">${escapeHtml(link[1])}</a>` : ''}</div>`;
  }

  (async function boot() {
    let session = null;
    try { ({ data: { session } } = await supabaseClient.auth.getSession()); } catch (err) { /* handled below */ }
    if (!session) { gate('Sign in to continue', 'Be the Chancellor is part of LastMind Create. Sign in to LastMind first, then come back to this page.', ['/learn/', 'Go to LastMind']); return; }
    try { const r = await createAuthedFetch('/create/spend'); if (r.resp.ok) createNoteSpend(r.body); } catch (err) { /* the counter just starts from what this browser remembers */ }
    const params = new URLSearchParams(location.search);
    let cfg = null, saved = null;
    try { cfg = JSON.parse(localStorage.getItem(CHN_CONFIG_KEY) || 'null'); } catch (err) { /* none */ }
    try { saved = localStorage.getItem(CHN_GAME_KEY); } catch (err) { /* none */ }
    const fresh = params.get('new') === '1';
    if (fresh && !cfg) { gate('No scenario yet', 'Create your scenario in LastMind Create, then start the simulation from there.', ['/learn/', 'Back to LastMind']); return; }
    if (!fresh && !saved && !cfg) { gate('No scenario yet', 'Create your scenario in LastMind Create (Create, Economics, Be the Chancellor), then start the simulation from there.', ['/learn/', 'Back to LastMind']); return; }
    try { for (const f of ['/assets/econ/econModel.js', '/assets/econ/econPolicy.js', '/assets/econ/econSim.js', '/assets/chancellor/chancellor-ui.js']) await load(f); }
    catch (err) { gate('The simulation could not load', 'Check your connection and reload the page.'); return; }
    document.getElementById('app').innerHTML = '';
    window.LMChancellorUI.launch(document.getElementById('app'), cfg || {}, { resume: !fresh && !!saved, exitLabel: 'Back to LastMind', onExit: () => { window.location.href = '/learn/'; } });
    if (fresh) history.replaceState(null, '', '/chancellor/');
  })();
</script>
</body>
</html>
