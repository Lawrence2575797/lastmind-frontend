<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Babylon racing feasibility spike</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; top: 10px; left: 10px; color: #fff; font: 14px/1.4 monospace; background: rgba(0,0,0,.5); padding: 8px 12px; border-radius: 6px; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="hud">speed: <span id="speed">0</span> km/h<br>WASD / arrows to drive, R to reset, C to change camera<br><span id="buildSummary"></span> &middot; <a href="garage.html" style="color:#9cf">rebuild car</a></div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@6.49.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@6.49.0/babylonjs.loaders.min.js"></script>
<script>
const canvas = document.getElementById('renderCanvas');
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
const scene = new BABYLON.Scene(engine);

// Car spec built in garage.html from real GCSE Physics answers (density/mass, efficiency, drag, Hooke's law grip,
// braking-heat, generator-effect regen, etc.) - falls back to a neutral default so this page also works standalone.
let carSpec = { mass: 1, accel: 1, topSpeed: 1, grip: 1, braking: 1, efficiency: 1, rollover: 1, electric: false };
try {
  const stored = JSON.parse(localStorage.getItem('lastmind_car_spec') || 'null');
  if (stored) carSpec = { ...carSpec, ...stored };
} catch (e) { /* private-mode/blocked storage - keep the neutral default */ }

// Real modelled/textured assets (CC0, Kenney "Racing Kit" - see models/License.txt) instead of hand-built primitives:
// this is the actual "existing Babylon tooling" path to a game-quality look - SceneLoader importing authored geometry,
// not procedurally drawn boxes. Scale factor brings the kit's compact native units up to this scene's track scale.
const KIT_SCALE = 4.5;

const env = scene.createDefaultEnvironment({ createGround: false, skyboxSize: 1000, skyboxColor: new BABYLON.Color3(0.55, 0.72, 0.9) });
const light = new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0.3), scene);
light.intensity = 0.85;
light.groundColor = new BABYLON.Color3(0.35, 0.4, 0.35);
const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.4, -1, -0.5), scene);
sun.intensity = 1.4;
sun.position = new BABYLON.Vector3(80, 120, 80);
const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
shadowGen.useBlurExponentialShadowMap = true;
shadowGen.blurKernel = 32;

const grassMat = new BABYLON.PBRMaterial('grassMat', scene);
grassMat.albedoColor = new BABYLON.Color3(0.16, 0.42, 0.18);
grassMat.roughness = 1;
grassMat.metallic = 0;
const ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 400, height: 400 }, scene);
ground.position.y = -0.08; // sits just below the road tiles (both otherwise at y=0) to avoid z-fighting
ground.material = grassMat;
ground.receiveShadows = true;

// --- Track: built entirely from the kit's own modular road tiles (not a hand-drawn ribbon), so the drivable surface,
// kerbs, barriers, grandstands and car are all the same real asset kit and are guaranteed to actually fit together.
// Tile sockets (entry at local origin heading -Z, corner exit/turn) were measured directly off the .glb geometry -
// see the exit-face vertex probe used to derive CORNER_EXIT/CORNER_TURN below - not guessed from the bounding box.
const STRAIGHT_LEN = 2.65;         // roadStraightLong.glb footprint depth (native kit units, pre-KIT_SCALE)
const CORNER_EXIT = new BABYLON.Vector3(-1.65, 0, -2.15); // roadCornerLarge.glb: measured exit-face centre
const CORNER_TURN = Math.PI / 2;
const LONG_SIDE_TILES = 6, SHORT_SIDE_TILES = 2;

function makeCursor() { return { pos: BABYLON.Vector3.Zero(), rot: 0 }; }
function placeTile(file, cursor, opts = {}) {
  const proto = tileProtos[file];
  const inst = proto.clone(file + tileIndex++, null);
  inst.setEnabled(true);
  inst.scaling.setAll(KIT_SCALE);
  inst.position = cursor.pos.scale(KIT_SCALE);
  inst.rotation.y = cursor.rot;
  inst.getChildMeshes().forEach(m => { shadowGen.addShadowCaster(m); m.receiveShadows = true; });
  return inst;
}
function advanceStraight(cursor, len = STRAIGHT_LEN) {
  const dir = new BABYLON.Vector3(Math.sin(cursor.rot), 0, Math.cos(cursor.rot));
  cursor.pos.addInPlace(dir.scale(-len));
}
function advanceCorner(cursor) {
  const world = BABYLON.Vector3.TransformCoordinates(CORNER_EXIT, BABYLON.Matrix.RotationY(cursor.rot));
  cursor.pos.addInPlace(world);
  cursor.rot += CORNER_TURN;
}
// Barrier/grandstand offsets are perpendicular to the tile's own heading, so they track the tile exactly - no
// separate "track radius" guess that can drift out of sync with the actual paved surface.
function sideOffset(cursor, distance) {
  const side = new BABYLON.Vector3(Math.cos(cursor.rot), 0, -Math.sin(cursor.rot));
  return cursor.pos.add(side.scale(distance)).scale(KIT_SCALE);
}
function placeDressing(file, worldPos, headingRot) {
  const proto = tileProtos[file];
  const inst = proto.clone(file + tileIndex++, null);
  inst.setEnabled(true);
  inst.scaling.setAll(KIT_SCALE);
  inst.position = worldPos;
  inst.rotation.y = headingRot;
  inst.getChildMeshes().forEach(m => shadowGen.addShadowCaster(m));
}

let tileIndex = 0;
const tileProtos = {};
async function loadProto(file) {
  const result = await BABYLON.SceneLoader.ImportMeshAsync('', 'models/', file, scene);
  result.meshes[0].setEnabled(false);
  tileProtos[file] = result.meshes[0];
}

const trackReady = Promise.all(['roadStraightLong.glb', 'roadCornerLarge.glb', 'barrierWhite.glb', 'grandStand.glb'].map(loadProto))
  .then(() => {
    const cursor = makeCursor();
    const startCursor = { pos: cursor.pos.clone(), rot: cursor.rot };
    for (let side = 0; side < 2; side++) {
      for (let i = 0; i < LONG_SIDE_TILES; i++) {
        placeTile('roadStraightLong.glb', cursor);
        if (i % 2 === 0) { placeDressing('barrierWhite.glb', sideOffset(cursor, -1.9), cursor.rot); placeDressing('barrierWhite.glb', sideOffset(cursor, 1.9), cursor.rot); }
        if (i % 3 === 0) placeDressing('grandStand.glb', sideOffset(cursor, 6), cursor.rot + Math.PI);
        advanceStraight(cursor);
      }
      placeTile('roadCornerLarge.glb', cursor);
      advanceCorner(cursor);
      for (let i = 0; i < SHORT_SIDE_TILES; i++) {
        placeTile('roadStraightLong.glb', cursor);
        placeDressing('barrierWhite.glb', sideOffset(cursor, -1.9), cursor.rot);
        placeDressing('barrierWhite.glb', sideOffset(cursor, 1.9), cursor.rot);
        advanceStraight(cursor);
      }
      placeTile('roadCornerLarge.glb', cursor);
      advanceCorner(cursor);
    }

    const checkerDt = new BABYLON.DynamicTexture('checker', { width: 128, height: 512 }, scene, false);
    const cctx = checkerDt.getContext();
    for (let r = 0; r < 8; r++) for (let c = 0; c < 2; c++) { cctx.fillStyle = (r + c) % 2 === 0 ? '#fff' : '#111'; cctx.fillRect(c * 64, r * 64, 64, 64); }
    checkerDt.update();
    const checkerMat = new BABYLON.StandardMaterial('checkerMat', scene);
    checkerMat.diffuseTexture = checkerDt;
    checkerMat.specularColor = new BABYLON.Color3(0, 0, 0);
    const startLine = BABYLON.MeshBuilder.CreatePlane('startLine', { width: 4, height: 2 }, scene);
    startLine.rotation.x = Math.PI / 2;
    startLine.position = startCursor.pos.scale(KIT_SCALE).add(new BABYLON.Vector3(0, 0.03, -STRAIGHT_LEN * KIT_SCALE * 0.5));
    startLine.material = checkerMat;

    return startCursor;
  });

// --- Car: the real modelled/textured raceCar asset, not a hand-built shape. Wheel nodes come in already named and
// correctly offset (wheelFrontLeft/Right, wheelBackLeft/Right), so steering and rolling reuse them directly. ---
const car = new BABYLON.TransformNode('car', scene);
let wheelNodes = { fl: null, fr: null, bl: null, br: null };
const carFile = carSpec.electric ? 'raceCarGreen.glb' : 'raceCarRed.glb';
const carReady = BABYLON.SceneLoader.ImportMeshAsync('', 'models/', carFile, scene).then(result => {
  result.meshes[0].parent = car;
  result.meshes[0].scaling.setAll(KIT_SCALE);
  result.meshes.forEach(m => shadowGen.addShadowCaster(m));
  const byName = name => result.transformNodes.find(n => n.name === name);
  wheelNodes = { fl: byName('wheelFrontLeft'), fr: byName('wheelFrontRight'), bl: byName('wheelBackLeft'), br: byName('wheelBackRight') };
});

// Tiles pave toward local -Z from the start cursor (rot 0), so the car - whose own forward is local +Z - must start
// facing rot = PI to actually drive onto the paved surface instead of immediately reversing off it.
let START = BABYLON.Vector3.Zero();
let START_ROT = Math.PI;
car.position.copyFrom(START);
car.rotation.y = START_ROT;
trackReady.then(startCursor => {
  START_ROT = startCursor.rot + Math.PI;
  const forward0 = new BABYLON.Vector3(Math.sin(START_ROT), 0, Math.cos(START_ROT));
  // The car model's own origin sits at its nose, not its centre, so spawning exactly on the tile edge leaves most
  // of the car hanging back over the grass before the track starts - push the spawn point forward onto the tile.
  START = startCursor.pos.scale(KIT_SCALE).add(forward0.scale(4));
  car.position.copyFrom(START);
  car.rotation.y = START_ROT;
});

// --- Camera: low chase cam sitting just behind and above the car, matching a typical racing-game framing. ---
let camMode = 0;
const chaseCam = new BABYLON.FreeCamera('chaseCam', new BABYLON.Vector3(0, 0, 0), scene);
chaseCam.minZ = 0.05;
chaseCam.fov = 0.95;
chaseCam.fovMode = BABYLON.Camera.FOVMODE_HORIZONTAL_FIXED;
const orbitCam = new BABYLON.ArcRotateCamera('orbitCam', -Math.PI / 2, 1.1, 26, car.position, scene);
orbitCam.lowerRadiusLimit = 26;
orbitCam.upperRadiusLimit = 26;
orbitCam.inputs.clear();
scene.activeCamera = chaseCam;
window.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'c') { camMode = 1 - camMode; scene.activeCamera = camMode ? orbitCam : chaseCam; } });

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let speed = 0;
// F = ma: a fixed engine force divided by the build's relative mass sets acceleration, mirroring Newton's Second Law
// rather than just scaling ACCEL by a flavour multiplier. Everything else scales directly off the garage stats.
const ENGINE_FORCE = 20 * Math.max(carSpec.mass, 0.5);
const MAX_SPEED = 55 * Math.max(carSpec.topSpeed, 0.3);
const ACCEL = ENGINE_FORCE / Math.max(carSpec.mass, 0.5);
const BRAKE = 34 * Math.max(carSpec.braking, 0.3);
const DRAG = 4 / Math.max(carSpec.topSpeed, 0.3);
const MAX_STEER = 0.5 * Math.max(Math.min(carSpec.grip, 1.6), 0.4);
const STEER_SPEED = 3.4, WHEELBASE = 3.6;
let steerAngle = 0;
document.getElementById('buildSummary').textContent =
  `${carSpec.electric ? 'electric' : 'combustion'} build - top speed ${Math.round(MAX_SPEED * 3.6)}km/h, grip x${carSpec.grip.toFixed(2)}`;

engine.runRenderLoop(() => {
  const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);

  const throttle = (keys['w'] || keys['arrowup']) ? 1 : (keys['s'] || keys['arrowdown']) ? -1 : 0;
  const steerInput = (keys['a'] || keys['arrowleft']) ? -1 : (keys['d'] || keys['arrowright']) ? 1 : 0;

  if (throttle > 0) speed += ACCEL * dt;
  else if (throttle < 0) speed -= (speed > 0 ? BRAKE : ACCEL) * dt;
  speed -= Math.sign(speed) * DRAG * dt * Math.abs(speed) / MAX_SPEED;
  if (Math.abs(speed) < 0.05 && throttle === 0) speed = 0;
  speed = Math.max(-MAX_SPEED * 0.4, Math.min(MAX_SPEED, speed));

  const targetSteer = steerInput * MAX_STEER * (1 - Math.min(Math.abs(speed) / MAX_SPEED, 0.6));
  steerAngle += (targetSteer - steerAngle) * Math.min(STEER_SPEED * dt, 1);

  if (Math.abs(speed) > 0.01) {
    const turnRate = (speed / WHEELBASE) * Math.tan(steerAngle);
    car.rotation.y += turnRate * dt;
  }
  const forward = new BABYLON.Vector3(Math.sin(car.rotation.y), 0, Math.cos(car.rotation.y));
  car.position.addInPlace(forward.scale(speed * dt));

  if (wheelNodes.fl) {
    const spin = speed * dt * 4;
    [wheelNodes.fl, wheelNodes.fr, wheelNodes.bl, wheelNodes.br].forEach(w => w.rotation.x += spin);
    wheelNodes.fl.rotation.y = wheelNodes.fr.rotation.y = steerAngle;
  }

  const behindOffset = forward.scale(-9.5).add(new BABYLON.Vector3(0, 2.4, 0));
  chaseCam.position = BABYLON.Vector3.Lerp(chaseCam.position, car.position.add(behindOffset), Math.min(dt * 8, 1));
  chaseCam.setTarget(car.position.add(new BABYLON.Vector3(0, 0.6, 0)).add(forward.scale(4)));
  orbitCam.target = BABYLON.Vector3.Lerp(orbitCam.target, car.position, Math.min(dt * 6, 1));
  orbitCam.alpha = -car.rotation.y - Math.PI / 2 + Math.PI;

  document.getElementById('speed').textContent = Math.round(Math.abs(speed) * 3.6);

  if (keys['r']) { car.position.copyFrom(START); car.rotation.y = START_ROT; speed = 0; steerAngle = 0; }

  scene.render();
});

window.addEventListener('resize', () => engine.resize());
</script>
</body>
</html>
