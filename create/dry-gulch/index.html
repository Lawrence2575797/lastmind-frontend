<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Dry Gulch Showdown: GCSE Surds Wild West Game | LastMind</title>
<meta name="description" content="A free GCSE Maths surds game. Simplify, multiply and rationalise surds to open ammunition crates, then win a Wild West shootout. No log in needed.">
<meta name="theme-color" content="#2a180b">
<link rel="icon" href="/icons/lastmind-logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* wanted-poster paper, tobacco ink and brass, over a hot afternoon street */
:root{color-scheme:light;--paper:#f0e0bc;--paper2:#e3cd9f;--ink:#2a180b;--dim:#6d5235;--brass:#e3a72f;--red:#a8321f;--ok:#3c6b22;--disp:'Rye','Georgia',serif;--body:'Atkinson Hyperlegible',Verdana,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#c9925f;color:var(--ink);font-family:var(--body)}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
[hidden]{display:none!important}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid #1b5fb4;outline-offset:2px}
.hud{position:absolute;pointer-events:none}
.tag{background:rgba(32,18,8,.78);color:#fbeecb;border:2px solid rgba(227,167,47,.75);border-radius:6px;padding:7px 11px;font:400 15px/1 var(--disp);letter-spacing:.04em;white-space:nowrap}
#hpBox{left:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:9px}
#hpBar{width:150px;height:11px;border-radius:6px;background:#4b2a16;overflow:hidden}
#hpBar i{display:block;height:100%;background:linear-gradient(90deg,#e08a2a,#f4c84a);width:100%;transition:width .25s}
#foes{left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%)}
#map{right:12px;top:calc(10px + env(safe-area-inset-top,0px));width:128px;height:176px;border-radius:8px;border:2px solid rgba(227,167,47,.75);background:rgba(32,18,8,.6)}
#ammoBox{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:10px}
#rounds{display:flex;gap:4px;align-items:flex-end;min-height:34px}
#rounds i{width:11px;height:32px;border-radius:6px 6px 2px 2px;background:linear-gradient(#b9b2a6 0 32%,#e9b640 32% 90%,#9a6b14 90%);box-shadow:0 0 0 1px rgba(20,10,4,.7)}
#cross{left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px}
#cross::before,#cross::after{content:'';position:absolute;background:#fff6dc;box-shadow:0 0 3px #000}
#cross::before{left:10px;top:2px;width:2px;height:18px;-webkit-mask:linear-gradient(#000 0 6px,transparent 6px 12px,#000 12px);mask:linear-gradient(#000 0 6px,transparent 6px 12px,#000 12px)}
#cross::after{top:10px;left:2px;height:2px;width:18px;-webkit-mask:linear-gradient(90deg,#000 0 6px,transparent 6px 12px,#000 12px);mask:linear-gradient(90deg,#000 0 6px,transparent 6px 12px,#000 12px)}
#mark{left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;opacity:0;background:linear-gradient(45deg,transparent 46%,#fff 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#fff 46% 54%,transparent 54%);-webkit-mask:radial-gradient(circle,transparent 7px,#000 8px);mask:radial-gradient(circle,transparent 7px,#000 8px)}
#prompt{left:50%;top:calc(50% + 34px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px}
#prompt kbd{display:inline-block;font:700 15px var(--body);background:#fbeecb;color:var(--ink);border-radius:4px;padding:2px 8px;margin:0 3px}
#hold{width:120px;height:7px;border-radius:4px;background:rgba(32,18,8,.7);overflow:hidden}
#hold i{display:block;height:100%;width:0;background:var(--brass)}
#toast{left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);text-align:center}
#toast span{display:inline-block;white-space:normal;line-height:1.35}
#hurt{inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(120,52,10,.78) 100%)}
#from{left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;opacity:0;border-radius:50%;border:7px solid transparent;border-top-color:#ffb23a;filter:drop-shadow(0 0 4px #000)}
#pauseBtn{position:absolute;left:12px;top:calc(48px + env(safe-area-inset-top,0px));width:38px;height:34px;pointer-events:auto;padding:0}
#stance{left:58px;top:calc(48px + env(safe-area-inset-top,0px));font-size:13px}
#stance.safe{background:rgba(52,92,28,.9)}
/* touch controls */
#duckBtn{position:absolute;right:20px;bottom:calc(170px + env(safe-area-inset-bottom,0px));width:84px;height:44px;border-radius:22px;border:3px solid #fbeecb;background:rgba(32,18,8,.8);color:#fbeecb;font:400 15px var(--disp)}
#stick{position:absolute;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(32,18,8,.38);border:2px solid rgba(251,238,203,.55)}
#stick i{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(251,238,203,.85)}
#fire{position:absolute;right:18px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:88px;height:88px;border-radius:50%;border:3px solid #fbeecb;background:rgba(168,50,31,.85);color:#fff;font:400 18px var(--disp)}
#openBtn{position:absolute;right:122px;bottom:calc(92px + env(safe-area-inset-bottom,0px));height:52px;padding:0 18px;border-radius:26px;border:3px solid #fbeecb;background:rgba(227,167,47,.94);font:400 17px var(--disp)}
/* cards */
.screen{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(28,14,4,.5)}
#start{background:linear-gradient(rgba(28,14,4,0),rgba(28,14,4,.55));align-items:flex-end}
.poster{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--paper);border-radius:6px;box-shadow:0 18px 50px rgba(20,8,0,.55),inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--ink),inset 0 0 60px rgba(150,100,40,.35);padding:22px 24px;text-align:center;display:flex;flex-direction:column;gap:12px}
.poster>*{flex:none}
.poster h1{font:400 clamp(28px,7vw,46px)/1.1 var(--disp);text-wrap:balance}
.poster p{line-height:1.5;max-width:44ch;margin:0 auto}
.keys{display:grid;grid-template-columns:auto auto;justify-content:center;gap:4px 14px;text-align:left;font-size:14px;line-height:1.4}
.keys b{text-align:right;white-space:nowrap}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.go{height:46px;padding:0 26px;border-radius:5px;border:2px solid var(--ink);background:var(--ink);color:#fbeecb;font:400 18px var(--disp);letter-spacing:.04em}
.go:disabled{opacity:.4;cursor:default}
.alt{height:46px;padding:0 20px;border-radius:5px;border:2px solid var(--ink);background:transparent;font:400 16px var(--disp)}
/* the crate question */
#ask{z-index:6}
#ask .poster{width:min(540px,100%);gap:10px;padding:18px 20px}
#askHead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:400 15px var(--disp);color:var(--dim);text-align:left}
#askWhat{font-size:16px;font-weight:700}
#sum{font:700 clamp(28px,7vw,38px)/1.3 var(--body);display:flex;align-items:center;justify-content:center;min-height:56px;white-space:nowrap}
.rad{border-top:.075em solid currentColor;padding:0 .06em;margin-left:-.04em;line-height:1.05;display:inline-block}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
.frac>span:first-child{border-bottom:.08em solid currentColor;padding:0 .35em}
.frac>span:last-child{padding:.08em .35em 0}
#ansRow{display:flex;gap:8px}
#ans{flex:1;min-width:0;height:48px;border:2px solid var(--ink);border-radius:5px;background:#fffaf0;text-align:center;font:700 24px var(--body)}
#pad{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
#pad button{height:36px;border:1px solid rgba(42,24,11,.45);border-radius:4px;background:var(--paper2);font:700 18px var(--body)}
#pad button.root{background:var(--brass)}
#tipKey{font-size:13px;color:var(--dim)}
#tipKey b{background:#fffaf0;border:1px solid rgba(42,24,11,.4);border-radius:3px;padding:0 6px}
#say{font-weight:700;line-height:1.45;min-height:0}
#say.bad{color:var(--red)}#say.good{color:var(--ok)}#say.warn{color:#8a5a00}
#how{text-align:left;font-size:14px;line-height:1.45;background:#fbf0d5;border-radius:5px;padding:10px 12px}
#how ol{padding-left:20px}
#how .eg{margin-top:7px;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
#how .eg b{font:400 13px var(--disp);color:var(--dim)}
.link{background:none;border:0;text-decoration:underline;color:var(--dim);font-size:14px;padding:3px}
#nogl{padding:40px 24px;text-align:center;line-height:1.6}
#ask .poster.done{display:flex;overflow:auto}
.poster.done #ansRow,.poster.done #pad,.poster.done #tipKey,.poster.done #askLinks{display:none}
@media (max-width:600px){#map{width:84px;height:116px;top:calc(50px + env(safe-area-inset-top,0px));right:8px}#hpBox{left:8px;gap:6px}#hpBox .tag,#foes{font-size:12px;padding:6px 7px}#hpBar{width:74px}#foes{left:auto;right:8px;transform:none}#ammoBox{right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}#rounds i{width:8px;height:26px}#toast{bottom:calc(224px + env(safe-area-inset-bottom,0px))}#toast .tag{font-size:13px}
#ask{padding:8px}#ask .poster{padding:12px;gap:7px}#pad button{height:34px;font-size:16px}.poster{padding:16px}}
@media (max-height:640px){#ask .poster{gap:6px;padding:10px 14px}#sum{min-height:44px;font-size:28px}#ans{height:40px;font-size:20px}#pad button{height:30px}.go,.alt{height:38px}.poster{gap:8px;padding:14px 18px}.keys{font-size:12.5px;gap:2px 12px}}
@media (max-height:480px){#map{width:70px;height:96px}#ask .poster{width:min(760px,100%);display:grid;grid-template-columns:1fr 1fr;column-gap:16px;align-content:start}#askHead{grid-column:1/-1}#askWhat,#sum,#say,#how,#ask .btns,#askLinks{grid-column:1}#ansRow,#pad,#tipKey{grid-column:2}#ansRow{grid-row:2/span 1}#pad{grid-row:3/span 2;align-content:start}#tipKey{grid-row:5}#how{max-height:34vh;overflow:auto}.poster h1{font-size:26px}#stick{width:104px;height:104px}#stick i{left:28px;top:28px;width:44px;height:44px}#fire{width:76px;height:76px;bottom:calc(52px + env(safe-area-inset-bottom,0px))}#duckBtn{bottom:calc(136px + env(safe-area-inset-bottom,0px));height:38px;width:78px}}
.back{font-size:14px;color:var(--dim);text-decoration:underline;padding:3px;align-self:center}
.back:focus-visible,#nogl a:focus-visible{outline:3px solid #1b5fb4;outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="A wild west town seen through your own eyes"></canvas>
  <div id="huds" hidden>
    <div class="hud" id="hurt"></div><div class="hud" id="from"></div>
    <div class="hud" id="hpBox"><span class="tag">Health</span><div id="hpBar"><i></i></div></div>
    <div class="hud tag" id="foes"></div>
    <canvas class="hud" id="map" width="256" height="352" aria-hidden="true"></canvas>
    <div class="hud" id="cross"></div><div class="hud" id="mark"></div>
    <div class="hud" id="prompt" hidden><span class="tag" id="promptText"></span><div id="hold"><i></i></div></div>
    <div class="hud" id="toast" aria-live="polite"></div>
    <div class="hud" id="ammoBox"><div id="rounds"></div><span class="tag" id="ammoText"></span></div>
    <button type="button" class="tag" id="pauseBtn" aria-label="Pause">II</button>
    <div class="hud tag" id="stance" hidden></div>
    <div id="touch" hidden><div id="stick"><i></i></div><button type="button" id="openBtn" hidden>Hold to open</button><button type="button" id="duckBtn">Crouch</button><button type="button" id="fire">Fire</button></div>
  </div>
  <div class="screen" id="start"><div class="poster">
    <h1>Dry Gulch Showdown</h1>
    <p>Five outlaws hold the town, one of them on horseback, and your revolver is empty. Crack the surds on the ammunition crates, then win the shootout.</p>
    <div class="keys" id="keys"></div>
    <div class="btns"><button type="button" class="go" id="ride" disabled>Saddling up…</button></div><a class="back" href="/learn/">Back to LastMind</a>
  </div></div>
  <div class="screen" id="ask" hidden><form class="poster" id="askForm" autocomplete="off" novalidate>
    <div id="askHead"><span id="askName"></span><span id="askLevel"></span></div>
    <div id="askWhat"></div>
    <div id="sum"></div>
    <div id="ansRow"><input id="ans" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="24" aria-label="Your answer"></div>
    <div id="pad"></div>
    <div id="tipKey">Press <b>R</b> to type √</div>
    <div id="say" aria-live="polite"></div>
    <div class="btns"><button type="submit" class="go" id="submit">Open crate</button></div>
    <div id="how" hidden></div>
    <div id="askLinks"><button type="button" class="link" id="howBtn">Show method</button><button type="button" class="link" id="leave">Leave it shut</button></div>
  </form></div>
  <div class="screen" id="pause" hidden><div class="poster"><h1>Paused</h1><p id="pauseText"></p><div class="btns"><button type="button" class="go" id="resume">Carry on</button><button type="button" class="alt" id="sound">Sound on</button></div><a class="back" href="/learn/">Back to LastMind</a></div></div>
  <div class="screen" id="end" hidden><div class="poster"><h1 id="endTitle"></h1><p id="endText"></p><div class="keys" id="endStats"></div><div class="btns"><button type="button" class="go" id="again">Ride again</button></div><a class="back" href="/learn/">Back to LastMind</a></div></div>
</div>
<script src="/create/dry-gulch/vendor/three.min.js?v=r128"></script>
<script src="/create/dry-gulch/game.js?v=1"></script>
</body>
</html>
